sargasses dans les Antilles et contribuer à élaborer un plan d’action international pour lutter contre le problème à la source","depth":0,"id":"P4C5-M009"},{"kind":"mesure","text":"Défendre un moratoire sur les forages en Méditerranée et sur l’extraction minière en eaux profondes","depth":0,"id":"P4C5-M010"},{"kind":"mesure","text":"Interdire les prélèvements massifs de sable marin pour le secteur de la construction et lutter contre son extraction illicite à l’échelle nationale et internationale","depth":0,"id":"P4C5-M011"},{"kind":"mesure","text":"Lutter contre l’acidification des océans et la multiplication des « zones mortes » dépourvues d’oxygène en commençant par une alliance pour la sauvegarde de la mer Méditerranée","depth":0,"id":"P4C5-M012"}]},{"title":"Être à la hauteur de la responsabilité maritime française","depth":1,"path":["Être à la hauteur de la responsabilité maritime française"],"blocks":[{"kind":"texte","text":"Avec le deuxième territoire marin du monde, la France est une puissance maritime qui s’ignore. La mer est pourtant une source formidable d’activité et d’emploi dans la bifurcation écologique qu’exige notre époque. Mais les technologies marines sont délaissées par les pouvoirs publics. Pour la France pourtant, le futur a le goût de la mer."},{"kind":"mesure_cle","text":"Déployer l’éolien en mer, posé et flottant, pour atteindre au moins 45 gigawatts de puissance installée en 2050, ainsi que les énergies marines renouvelables (EMR), comme l’hydrolien ou l’énergie de la houle, dans le cadre du plan de bifurcation énergétique","id":"P4C5-K02"},{"kind":"mesure","text":"Tenir le cap de la planification maritime intégrée pour concilier production d’énergie, exigences des usagers de la mer et protection de la biodiversité","depth":0,"id":"P4C5-M013"},{"kind":"mesure","text":"Renforcer la maîtrise publique des acteurs stratégiques de l’éolien maritime, si nécessaire par des nationalisations, par exemple des activités de GE Vernova (ex-Alstom)","depth":0,"id":"P4C5-M014"},{"kind":"mesure","text":"Investir plus fortement l’Organisation maritime internationale (OMI) pour soutenir l’objectif de neutralité carbone du transport maritime en 2050 et l’amélioration des conditions sociales des marins à l’échelle internationale","depth":0,"id":"P4C5-M015"},{"kind":"mesure","text":"Mettre en place un plan de décarbonation de la marine marchande, faire de la France le leader du développement de la propulsion vélique et des propulsions moins polluantes","depth":0,"id":"P4C5-M016"},{"kind":"mesure","text":"Défendre les emplois de marins contre la concurrence déloyale, le dumping social et la Commission européenne (remorquage portuaire, construction et entretien des parcs éoliens maritimes, transports de passagers dans la Manche, la Méditerranée ou entre la Corse et le continent, etc.)","depth":0,"id":"P4C5-M017"},{"kind":"mesure","text":"Réformer le système de taxation des armateurs, y compris la taxe au tonnage, pour mettre fin aux abus ; privilégier le pavillon français et l’investissement écologique","depth":0,"id":"P4C5-M018"},{"kind":"mesure","text":"Relancer les ports français et moderniser les infrastructures portuaires dans une logique multimodale mer-rail-fluvial d’électrification, de décarbonation et de soutien aux énergies renouvelables ; favoriser le débarquement des marchandises de transit européen dans les ports français de Marseille et du Havre","depth":0,"id":"P4C5-M019"},{"kind":"mesure","text":"Refuser le grand projet « canal Seine-Nord » tourné vers les ports du nord de l’Europe, et lui préférer le développement du port du Havre","depth":0,"id":"P4C5-M020"},{"kind":"mesure","text":"Soutenir la construction de navires publics et d’intérêt public (scientifique, services publics, militaire et d’approvisionnement stratégique) dans les chantiers navals français","depth":0,"id":"P4C5-M021"},{"kind":"mesure","text":"Poursuivre la cartographie détaillée de l’espace maritime français, en collaboration avec le service hydrographique et océanographique de la marine (SHOM), ainsi que le travail de reconnaissance internationale à travers le programme français d’extension du plateau continental","depth":0,"id":"P4C5-M022"},{"kind":"mesure","text":"Mettre les moyens français comme la Marine nationale au service de l’application du droit international de la mer et du nouveau traité sur la haute mer","depth":0,"id":"P4C5-M023"},{"kind":"mesure","text":"Augmenter en conséquence les moyens de surveillance, de protection et de sécurisation effective de notre domaine maritime, de son écosystème et de ses axes stratégiques","depth":0,"id":"P4C5-M024"},{"kind":"mesure","text":"Redevenir une puissance polaire : augmenter les moyens de la recherche française dans les régions polaires, faire aboutir la reconstruction des stations de recherche en Antarctique et la construction d’un brise-glace en soutien à la recherche océanographique","depth":0,"id":"P4C5-M025"}]},{"title":"Forger une culture maritime humaniste","depth":1,"path":["Forger une culture maritime humaniste"],"blocks":[{"kind":"texte","text":"L’Océan mondial relève de l’intérêt général humain. Il ne sépare pas les êtres humains, mais il les lie au contraire plus fortement ensemble, comme l’atteste le droit de la mer s’agissant du droit au secours. Il est donc l’affaire de toutes et tous."},{"kind":"mesure_cle","text":"Créer en France un institut Océan de l’université des Nations unies et le doter d’un navire-université pour l’enseignement et la recherche","id":"P4C5-K03"},{"kind":"mesure","text":"Faire de la France le leader mondial de la recherche et de l’éducation dans le secteur maritime","depth":0,"id":"P4C5-M026"},{"kind":"mesure","text":"Lancer un « Erasmus de la mer » avec des échanges entre enseignants et étudiants français, européens et francophones pour un partage des savoirs et savoir-faire","depth":0,"id":"P4C5-M027"},{"kind":"mesure","text":"Créer un lycée de la mer dans chaque département maritime (y compris dans les Outre-mer)","depth":0,"id":"P4C5-M028"},{"kind":"mesure","text":"Développer une culture de la mer dans toute la société en s’assurant, notamment, que chaque enfant participe à une « classe de mer » au moins une fois au cours de sa scolarité","depth":0,"id":"P4C5-M029"},{"kind":"mesure","text":"Développer la formation professionnelle dans le domaine des nouvelles techniques de pêche, d’aquaculture et d’algoculture durables au service de la bifurcation écologique et renforcer la formation de marins français","depth":0,"id":"P4C5-M030"},{"kind":"mesure","text":"Proposer la construction de la première station sous-­marine permanente dérivante sur le modèle de la station spatiale internationale","depth":0,"id":"P4C5-M031"}]}]},{"code":"P4C6","part":"Partie 4 – Le goût du futur : aux nouvelles frontières de l’humanité","title":"Chapitre 6 : Mettre le spatial au service de l’intérêt général humain","url":"https://melenchon2027.fr/programme/livre/le-gout-du-futur-aux-nouvelles-frontieres-de-l-humanite/chapitre6","sections":[{"title":"Assurer la souveraineté spatiale française","depth":1,"path":["Assurer la souveraineté spatiale française"],"blocks":[{"kind":"texte","text":"La France est une nation spatiale majeure. Elle est, en Europe, la première puissance dans le domaine. Toutefois, le sujet intéresse peu les partis politiques, qui semblent ne comprendre aucun des enjeux en cause. Le plus souvent, les Insoumis sont les seuls qui expriment des avis, des encouragements ou qui participent et organisent des actions sur le thème. Pourtant, c’est dorénavant par l’espace que passent les activités scientifiques de pointe de l’humanité. Les communications et le fonctionnement de milliers d’applications numériques du quotidien en dépendent entièrement. La paix ou la guerre dans le monde de même. Pour un gouvernement de L’Avenir en commun, l’espace sera un outil essentiel de coopération, à la fois pour protéger ce bien commun et pour partager des savoirs et des enseignements.","md":"La France est une nation spatiale majeure. Elle est, en Europe, la première puissance dans le domaine. Toutefois, le sujet intéresse peu les partis politiques, qui semblent ne comprendre aucun des enjeux en cause. Le plus souvent, les Insoumis sont les seuls qui expriment des avis, des encouragements ou qui participent et organisent des actions sur le thème. Pourtant, c’est dorénavant par l’espace que passent les activités scientifiques de pointe de l’humanité. Les communications et le fonctionnement de milliers d’applications numériques du quotidien en dépendent entièrement. La paix ou la guerre dans le monde de même. Pour un gouvernement de *L’Avenir en commun*, l’espace sera un outil essentiel de coopération, à la fois pour protéger ce bien commun et pour partager des savoirs et des enseignements."},{"kind":"mesure_cle","text":"Lutter contre la course à l’armement spatial tout en garantissant la souveraineté de la France face aux nouvelles menaces","id":"P4C6-K01"},{"kind":"mesure","text":"Doter la France d’un avion spatial souverain","depth":0,"id":"P4C6-M001"},{"kind":"mesure","text":"Fermer le Centre spatial de l’Organisation du traité de l’Atlantique nord (OTAN) à Toulouse","depth":0,"id":"P4C6-M002"},{"kind":"mesure","text":"Nationaliser ArianeGroup et instituer un pôle public du satellite","depth":0,"id":"P4C6-M003"},{"kind":"mesure","text":"Doter la France des moyens de neutralisation des actions hostiles menées contre elle","depth":0,"id":"P4C6-M004"},{"kind":"mesure","text":"Garantir l’utilisation de Galileo par le grand public et nos forces armées","depth":0,"id":"P4C6-M005"},{"kind":"mesure","text":"Concentrer les financements publics sur un seul projet de lanceur : MaiaSpace, filiale d’ArianeGroup, en complément d’Ariane 6","depth":0,"id":"P4C6-M006"}]},{"title":"Relancer la découverte de l’espace","depth":1,"path":["Relancer la découverte de l’espace"],"blocks":[{"kind":"texte","text":"L’espace représente une nouvelle frontière pour l’humanité. Il est temps de relancer son exploration pour mieux le comprendre. Depuis l’espace, il est possible d’observer précisément les effets du réchauffement climatique sur la Terre et d’étudier les origines de l’Univers. S’y aventurer, c’est s’ouvrir à de nouvelles connaissances."},{"kind":"mesure_cle","text":"Renforcer les moyens du Centre national d’études spatiales (CNES), qui redeviendra le maître d’œuvre de la politique spatiale française","id":"P4C6-K02"},{"kind":"mesure","text":"Intensifier la recherche dans le domaine de la météorologie de l’espace (prévision des tempêtes solaires)","depth":0,"id":"P4C6-M007"},{"kind":"mesure","text":"Maintenir un accès libre et ouvert aux données météorologiques et d’observation de la Terre fournies par les services satellitaires européens","depth":0,"id":"P4C6-M008"},{"kind":"mesure","text":"Initier la création d’une université francophone des métiers de l’espace en Guyane","depth":0,"id":"P4C6-M009"},{"kind":"mesure","text":"Renforcer le Centre spatial guyanais et en faire un avant-poste souverain de la nouvelle frontière de l’espace","depth":0,"id":"P4C6-M010"},{"kind":"mesure","text":"Contribuer à organiser les différentes missions dans le système solaire et assurer la participation française à ces missions","depth":0,"id":"P4C6-M011"}]},{"title":"Défendre l’espace comme bien commun de l’humanité","depth":1,"path":["Défendre l’espace comme bien commun de l’humanité"],"blocks":[{"kind":"texte","text":"Alors que l’espace, par ses grands traités, a été pensé comme une nouvelle frontière à préserver et à protéger des logiques de domination et de confrontations, des acteurs privés et des nations spatiales offensives, comme SpaceX et les États-Unis, cherchent à l’accaparer. Elles le saturent, le polluent, accélèrent sa militarisation et sa reconversion en marché lucratif. Il y a urgence à faire bifurquer la politique spatiale en la mettant au service de la science, de la planification écologique et de la protection de ce bien commun."},{"kind":"mesure_cle","text":"Proposer un nouveau traité international pour la non-appropriation des ressources spatiales et la démilitarisation de l’espace, basé sur le traité de la Lune que la France ratifiera","id":"P4C6-K03"},{"kind":"mesure","text":"Se retirer des accords Artemis et inviter d’autres signataires à en faire de même","depth":0,"id":"P4C6-M012"},{"kind":"mesure","text":"Planifier la bifurcation écologique de l’industrie spatiale","depth":0,"id":"P4C6-M013"},{"kind":"mesure","text":"Promouvoir un programme international de dépollution de l’orbite basse, porté par les Nations unies","depth":0,"id":"P4C6-M014"}]}]},{"code":"P4C7","part":"Partie 4 – Le goût du futur : aux nouvelles frontières de l’humanité","title":"Chapitre 7 : Démocratiser la révolution numérique","url":"https://melenchon2027.fr/programme/livre/le-gout-du-futur-aux-nouvelles-frontieres-de-l-humanite/chapitre7","sections":[{"title":"Affirmer le caractère d’intérêt général de la révolution numérique","depth":1,"path":["Affirmer le caractère d’intérêt général de la révolution numérique"],"blocks":[{"kind":"texte","text":"La révolution numérique est une chance immense pour l’humanité. Elle peut ouvrir la voie à un développement humain, scientifique et démocratique inédit, à condition de ne pas laisser les multinationales l’accaparer pour leurs seuls profits. Faire du numérique un bien commun mondial est un enjeu démocratique, économique, écologique et social de premier plan : la technologie doit servir le progrès humain, non créer de nouvelles inégalités, restreindre les libertés ou privatiser les biens communs culturels."},{"kind":"mesure_cle","text":"Garantir le droit à un accès minimal gratuit à Internet","id":"P4C7-K01"},{"kind":"mesure","text":"Achever la couverture numérique en fibre de tout le pays","depth":0,"id":"P4C7-M001"},{"kind":"mesure","text":"Constitutionnaliser le droit au chiffrement et à la sécurité des données et des communications, afin de se prémunir contre les moyens d’interception et de surveillance","depth":0,"id":"P4C7-M002"},{"kind":"mesure","text":"Systématiser la publication en données ouvertes des informations publiques détenues par les collectivités","depth":0,"id":"P4C7-M003"},{"kind":"mesure","text":"Garantir le maintien de l’accès à des guichets physiques et à des formulaires papier malgré la dématérialisation des services publics","depth":0,"id":"P4C7-M004"},{"kind":"mesure","text":"Garantir le droit à un interlocuteur humain dans les interactions avec toute organisation, publique ou privée","depth":0,"id":"P4C7-M005"},{"kind":"mesure","text":"Mettre en place une autorité de contrôle dédiée à l’accessibilité numérique, dotée de moyens pour sanctionner les organismes ne respectant pas les obligations légales","depth":0,"id":"P4C7-M006"},{"kind":"mesure","text":"Faire de la lutte contre les fuites de données une priorité nationale :","depth":0,"id":"P4C7-M007"},{"kind":"sous_mesure","text":"Former les personnes amenées à traiter des données sensibles et à caractère personnel et encadrer strictement la transmission de ces données à des tiers","depth":1,"id":"P4C7-S001","parent":"P4C7-M007"},{"kind":"sous_mesure","text":"Ne pas faire du seul consentement des utilisateurs un fondement suffisant pour le traitement de leurs données, afin de mettre fin aux pratiques abusives de collecte massive","depth":1,"id":"P4C7-S002","parent":"P4C7-M007"},{"kind":"sous_mesure","text":"Réduire le recours excessif à la sous-traitance","depth":1,"id":"P4C7-S003","parent":"P4C7-M007"},{"kind":"sous_mesure","text":"Renforcer les moyens de la Commission nationale de l’informatique et des libertés (CNIL) pour qu’elle garantisse l’application effective des exigences de sécurité prévues par le règlement général sur la protection des données (RGPD)","depth":1,"id":"P4C7-S004","parent":"P4C7-M007"},{"kind":"mesure","text":"Faire de la France une puissance quantique mondiale :","depth":0,"id":"P4C7-M008"},{"kind":"sous_mesure","text":"Investir dans la recherche fondamentale quantique en augmentant le financement des bourses doctorales dédiées et les laboratoires publics de recherches dédiés","depth":1,"id":"P4C7-S005","parent":"P4C7-M008"},{"kind":"sous_mesure","text":"Investir dans le développement industriel et la formation, en conditionnant toute aide publique aux entreprises start-ups quantiques à des garanties de souveraineté, afin de produire notre propre équipement quantique","depth":1,"id":"P4C7-S006","parent":"P4C7-M008"},{"kind":"sous_mesure","text":"Lancer un programme national d’urgence de cryptographie post-quantique","depth":1,"id":"P4C7-S007","parent":"P4C7-M008"}]},{"title":"Garantir la souveraineté numérique de la France","depth":1,"path":["Garantir la souveraineté numérique de la France"],"blocks":[{"kind":"texte","text":"La mise en réseau mondiale permet de nouvelles coopérations grâce à la circulation des idées, des paroles, des images et des écrits. Elle doit se faire dans un cadre international garantissant la maîtrise publique et démocratique d’Internet. La France ne doit pas dépendre d’autres pays et des multinationales comme les GAFAM (Google devenu Alphabet, Amazon, Facebook devenu Meta, Apple et Microsoft). Elle doit pouvoir prendre librement ses propres décisions."},{"kind":"mesure_cle","text":"Garantir la neutralité du Net, c’est-à-dire le droit d’accéder aux contenus et de les diffuser sans discrimination","id":"P4C7-K02"},{"kind":"mesure","text":"Passer sous contrôle public et relocaliser les infrastructures du numérique et des télécommunications","depth":0,"id":"P4C7-M009"},{"kind":"mesure","text":"Nationaliser toute entreprise du numérique détenant un savoir-faire essentiel qui risque la faillite, la délocalisation ou le rachat par des fonds prédateurs","depth":0,"id":"P4C7-M010"},{"kind":"mesure","text":"Construire un cloud véritablement public, composé de data centers publics interconnectés","depth":0,"id":"P4C7-M011"},{"kind":"mesure","text":"Créer une agence publique des logiciels libres chargée de planifier leur développement stratégique, domaine par domaine, en identifiant les manques et en finançant les projets-clés","depth":0,"id":"P4C7-M012"},{"kind":"mesure","text":"Généraliser l’usage des logiciels libres dans les administrations publiques et l’Éducation nationale ; garantir l’interopérabilité chez tous les acteurs du numérique, publics comme privés","depth":0,"id":"P4C7-M013"},{"kind":"mesure","text":"Permettre à tous les citoyens et à toutes les entreprises l’accès à des services et logiciels en ligne hébergés sur des serveurs français de droit français","depth":0,"id":"P4C7-M014"},{"kind":"mesure","text":"Développer progressivement une offre publique pour les services numériques essentiels : moteur de recherche, paiements en ligne, etc.","depth":0,"id":"P4C7-M015"},{"kind":"mesure","text":"Structurer une filière industrielle nationale des technologies numériques couvrant l’ensemble des composants matériels critiques (semi-conducteurs, stockage, connectivité) et incluant notamment la création d’une fonderie de microprocesseurs sur le territoire français","depth":0,"id":"P4C7-M016"},{"kind":"mesure","text":"Refuser le contrôle privé et discrétionnaire des contenus exercés par les grandes plateformes (GAFAM) sur les réseaux sociaux","depth":0,"id":"P4C7-M017"},{"kind":"mesure","text":"Garantir l’hébergement des données des services publics français et des entreprises essentielles sur des serveurs publics situés en France","depth":0,"id":"P4C7-M018"},{"kind":"mesure","text":"Favoriser la coopération entre les États pour développer des solutions numériques émancipées des GAFAM","depth":0,"id":"P4C7-M019"},{"kind":"mesure","text":"Réduire l’impact écologique du numérique (réglementations sur l’obsolescence programmée, politiques incitatives sur l’écoconception, indice carbone sur le Web, etc.)","depth":0,"id":"P4C7-M020"},{"kind":"mesure","text":"Décréter un moratoire sur l’installation de centres de données non souverains (sans aucune participation publique)","depth":0,"id":"P4C7-M021"},{"kind":"mesure","text":"Augmenter l’efficacité énergétique des centres de données, réduire leur consommation d’eau, réduire et récupérer leur production de chaleur, soumettre ces centres à une autorisation de construction","depth":0,"id":"P4C7-M022"}]},{"title":"Mettre l’intelligence artificielle au service de l’émancipation collective","depth":1,"path":["Mettre l’intelligence artificielle au service de l’émancipation collective"],"blocks":[{"kind":"texte","text":"Si l’intelligence artificielle (IA) pose problème aujourd’hui, c’est avant tout parce qu’elle est entièrement contrôlée par des géants nord-américains, très liés au gouvernement des États-Unis. Les systèmes d’IA, dont ils inondent la planète, sont irresponsables écologiquement et sont basés sur le mythe de la création d’un « génie universel ». Nous voulons promouvoir une démarche rationnelle vis-à-vis de ces techniques : ni techno-béate ni technophobe. Il nous faut reprendre la main : développer nous-mêmes l’IA quand elle sert des objectifs de progrès humains et la limiter dans le cas contraire."},{"kind":"mesure_cle","text":"Créer la mission nationale de maîtrise de l’intelligence artificielle composée de chercheurs de disciplines scientifiques diverses, d’ingénieurs et de parlementaires ayant pour tâche d’impulser le développement des applications de l’IA utiles aux besoins sociaux et écologiques","id":"P4C7-K03"},{"kind":"mesure","text":"Développer des petits modèles spécialisés, plus sobres écologiquement, notamment dans des domaines comme la planification écologique, la santé, le droit ou la culture","depth":0,"id":"P4C7-M023"},{"kind":"mesure","text":"Ouvrir des concertations entre la mission nationale de maîtrise de l’IA, les entreprises françaises du secteur, les syndicats de branche et les représentants des métiers pour développer des modèles d’IA visant à assister les travailleurs dans leurs tâches plutôt qu’à les surveiller ou les remplacer","depth":0,"id":"P4C7-M024"},{"kind":"mesure","text":"Étendre au numérique et à l’IA le champ des domaines sensibles dans lesquels l’État a le droit de siéger au conseil d’administration des entreprises et de disposer d’un droit de veto sur la vente d’actifs à des fonds étrangers (actions spécifiques)","depth":0,"id":"P4C7-M025"},{"kind":"mesure","text":"Créer un domaine public des données auquel appartiennent par défaut toutes les données numériques des services publics, administrations publiques et entreprises publiques françaises :","depth":0,"id":"P4C7-M026"},{"kind":"sous_mesure","text":"stockées par des solutions 100 % publiques","depth":1,"id":"P4C7-S008","parent":"P4C7-M026"},{"kind":"sous_mesure","text":"avec des garanties de protection de la vie privée et contre les fuites","depth":1,"id":"P4C7-S009","parent":"P4C7-M026"},{"kind":"sous_mesure","text":"mises à disposition en priorité pour développer des solutions d’intérêt général","depth":1,"id":"P4C7-S010","parent":"P4C7-M026"},{"kind":"mesure","text":"Créer une autorité nationale de l’intelligence artificielle qui délivre aux systèmes d’IA définis comme à haut risque une autorisation de mise sur le marché afin de s’assurer qu’ils respectent la législation en vigueur et qu’ils ne risquent pas de mettre en danger la société","depth":0,"id":"P4C7-M027"},{"kind":"mesure","text":"Interdire les systèmes d’IA ayant pour objectif de simuler une relation affective avec l’utilisateur","depth":0,"id":"P4C7-M028"},{"kind":"mesure","text":"Obliger les fournisseurs de systèmes d’IA à détecter et corriger les éventuels biais discriminatoires de leurs systèmes","depth":0,"id":"P4C7-M029"},{"kind":"mesure","text":"Obliger à signaler toute intervention d’une IA sur ses productions (textes, images)","depth":0,"id":"P4C7-M030"},{"kind":"mesure","text":"Interdire certains usages de l’IA et du « big data » qui vont à l’encontre des droits individuels et sociaux : identification biométrique, surveillance pour l’évaluation des droits sociaux, gestion des flux migratoires, notation des individus pour l’attribution de crédits et la tarification des assurances, police prédictive, etc.","depth":0,"id":"P4C7-M031"}]}]},{"code":"P5-PRESENTATION","part":"Partie 5 – Fonder la 6e République","title":"Présentation de la partie","url":"https://melenchon2027.fr/programme/livre/fonder-la-6e-republique","sections":[{"title":"","depth":0,"path":[],"blocks":[{"kind":"texte","text":"La Nouvelle France est déjà là. Avec elle doit s’ouvrir une nouvelle saison institutionnelle. Moins de 1 % des Français qui ont voté en 1958 pour adopter notre Constitution sont encore vivants. La Ve République portait les défis d’une époque qui n’est plus : décolonisation, exode rural, industrialisation. Tant de choses ont changé depuis. Il y a soixante-dix ans, une femme ne pouvait ni ouvrir un compte bancaire, ni travailler sans l’autorisation de son mari. Le passage dans la jeunesse n’a plus rien à voir avec ce qu’il était alors. L’immigration est un héritage partagé par un tiers des Français. La classe travailleuse s’est profondément métamorphosée. Ce peuple est plus éduqué, plus informé et plus connecté que jamais. Il faut répondre à ses nouveaux besoins et ses nouvelles aspirations. Cela doit passer par la refonte de nos institutions et l’adoption d’une nouvelle Constitution. Celle de la Ve République a dégénéré en monarchie présidentielle ; celle de la 6e devra mettre en son cœur la souveraineté populaire permanente. Celle de la Ve a produit un millefeuille territorial technocratique ; celle de la 6e réorganisera les collectivités pour qu’elles puissent œuvrer à la planification écologique. Celle de la Ve a fait ruisseler l’autoritarisme à tous les niveaux ; celle de la 6e rétablira la liberté."}]}]},{"code":"P5C1","part":"Partie 5 – Fonder la 6e République","title":"Chapitre 1 : Le pouvoir au peuple","url":"https://melenchon2027.fr/programme/livre/fonder-la-6e-republique/chapitre1","sections":[{"title":"Une République de la souveraineté populaire permanente","depth":1,"path":["Une République de la souveraineté populaire permanente"],"blocks":[{"kind":"texte","text":"Le peuple de France exige plus de pouvoir de contrôle. Ces dernières années ont été marquées par des taux d’abstention records aux élections. Il est urgent de forger une nouvelle culture démocratique et d’arrêter de tenir les citoyens à l’écart des décisions en dehors des élections. L’intervention citoyenne est le cœur de notre programme et de notre projet politiques pour la France. Des outils permettent de concilier la stabilité institutionnelle et la possibilité de l’intervention populaire permanente."},{"kind":"mesure_cle","text":"Instaurer le référendum d’initiative citoyenne (RIC), par lequel les citoyens qui réunissent suffisamment de signatures peuvent révoquer des élus, proposer ou abroger une loi et modifier la Constitution","id":"P5C1-K01"},{"kind":"mesure","text":"Donner le droit de vote à 16 ans","depth":0,"id":"P5C1-M001"},{"kind":"mesure","text":"Reconnaître le vote blanc, mettre en place le vote obligatoire et instaurer un seuil de votes exprimés pour valider une élection","depth":0,"id":"P5C1-M002"},{"kind":"mesure","text":"Instaurer une procédure de parrainages citoyens pour l’élection présidentielle à la place des 500 parrainages d’élus","depth":0,"id":"P5C1-M003"},{"kind":"mesure","text":"Interdire la sous-traitance des opérations de propagande électorale à des entreprises privées","depth":0,"id":"P5C1-M004"},{"kind":"mesure","text":"Présenter systématiquement au bureau de l’Assemblée nationale les propositions émises par les citoyens dans le cadre de conventions citoyennes ou d’assemblées créées à cet effet","depth":0,"id":"P5C1-M005"},{"kind":"mesure","text":"Obliger l’Assemblée nationale à débattre des pétitions qui ont recueilli plus de 500 000 signatures","depth":0,"id":"P5C1-M006"},{"kind":"mesure","text":"Rendre obligatoire le recours au référendum en cas de modification de la Constitution ou d’adoption d’un nouveau traité européen","depth":0,"id":"P5C1-M007"},{"kind":"mesure","text":"Affirmer les trois échelons de l’organisation décentralisée de l’État (communes, départements, éco-régions) pour mettre fin à la superposition d’échelons technocratiques (métropoles, intercommunalités géantes), qui éloignent les citoyens des prises de décision","depth":0,"id":"P5C1-M008"},{"kind":"mesure","text":"Organiser une conférence sur l’avenir institutionnel des territoires insulaires et éloignés","depth":0,"id":"P5C1-M009"},{"kind":"mesure","text":"Donner à la Corse le statut garanti par un nouvel article de la Constitution, assorti d’un principe de non-régression sociale et environnementale","depth":0,"id":"P5C1-M010"},{"kind":"mesure","text":"Organiser l’accession de la Kanaky-Nouvelle-Calédonie à l’indépendance au 1er janvier 2028 par la convocation d’un référendum national ouvrant la voie à une consultation locale","depth":0,"id":"P5C1-M011"},{"kind":"mesure","text":"Rendre effectif le principe du non-cumul des mandats et des indemnités, y compris dans le temps","depth":0,"id":"P5C1-M012"},{"kind":"mesure","text":"Organiser la sortie du mandat : garantir un droit à la formation professionnelle pour les élus","depth":0,"id":"P5C1-M013"},{"kind":"mesure","text":"Faire voter une loi d’amnistie pour les syndicalistes, les Gilets jaunes, les militants pour la paix, les écologistes, les associatifs et les militants des différents mouvements sociaux dans les Outre-mer, condamnés pour leur participation à la vie publique","depth":0,"id":"P5C1-M014"},{"kind":"mesure","text":"Instaurer un moratoire sur les radiations des listes électorales et mettre en place un système d’inscription automatique sur les listes électorales pour éviter les radiations abusives","depth":0,"id":"P5C1-M015"}]},{"title":"Réunir une Assemblée constituante pour passer à la 6e République","depth":1,"path":["Réunir une Assemblée constituante pour passer à la 6e République"],"blocks":[{"kind":"texte","text":"La Ve République a fait son temps. Elle a permis l’exercice solitaire du pouvoir et tous les coups de force contre la souveraineté populaire. En témoigne l’acharnement autoritaire du bloc libéral à poursuivre la même politique malgré trois défaites successives. Nous avons le pouvoir de refonder nos institutions communes. Nous proposons que les Français se dotent d’une nouvelle Constitution via une Assemblée constituante."},{"kind":"mesure_cle","text":"Convoquer une Constituante pour passer à la 6e République","id":"P5C1-K02"},{"kind":"mesure","text":"Convoquer un référendum (article 11) pour engager le processus constituant et décider des modalités de composition de l’Assemblée constituante","depth":0,"id":"P5C1-M016"},{"kind":"mesure","text":"Le projet de Constitution proposé par la Constituante sera soumis à référendum après ses travaux","depth":0,"id":"P5C1-M017"}]},{"title":"Abolir la monarchie présidentielle","depth":1,"path":["Abolir la monarchie présidentielle"],"blocks":[{"kind":"texte","text":"Le président de la République concentre beaucoup trop de pouvoirs : tout le pays est entraîné par sa seule volonté. La France est la seule démocratie où un seul homme peut décider de s’asseoir sur le résultat des élections législatives pendant près de trois ans sans être renversé. Autoritaire, cette dérive a culminé dans l’effacement du Parlement, y compris lorsque les opposants au monarque présidentiel y étaient plus nombreux. Depuis 2017, le « 49.3 » a été utilisé à 32 reprises, au mépris de la volonté populaire. Des budgets entiers, pourtant majoritaires à l’Assemblée, ont été effacés par la seule volonté du président. Il faut mettre fin à cette aberration. On ne compte plus les secteurs de la société qu’il a brutalisés."},{"kind":"mesure_cle","text":"Passer à une 6e République, qui soit un régime parlementaire stable et d’intervention citoyenne","id":"P5C1-K03"},{"kind":"texte","text":"Par la loi :"},{"kind":"mesure","text":"Élire l’Assemblée nationale au scrutin proportionnel","depth":0,"id":"P5C1-M018"},{"kind":"texte","text":"Dans le cadre de l’Assemblée constituante :"},{"kind":"mesure","text":"Obliger le gouvernement à rendre réellement des comptes devant le Parlement","depth":0,"id":"P5C1-M019"},{"kind":"mesure","text":"Abolir les procédures de « votes forcés » du Parlement comme l’article 49.3 de la Constitution de la Ve République","depth":0,"id":"P5C1-M020"}]},{"title":"Balayer l’oligarchie, abolir les privilèges de la caste","depth":1,"path":["Balayer l’oligarchie, abolir les privilèges de la caste"],"blocks":[{"kind":"texte","text":"En Macronie, au plus haut sommet de l’État, la défense des intérêts privés a remplacé la poursuite de l’intérêt général. Une caste de privilégiés dicte la politique du gouvernement. Il est temps d’en finir avec ce système injuste, de rappeler le principe fondamental de l’égalité entre tous, et d’acter la séparation de l’argent et de l’État."},{"kind":"mesure_cle","text":"Mettre en place un plan de séparation de l’argent et de l’État","id":"P5C1-K04"},{"kind":"mesure","text":"Combattre l’influence des lobbys dans le débat parlementaire, notamment en imposant la transparence des agendas des membres des bureaux des chambres et du gouvernement, interdire l’entrée du Parlement aux lobbyistes et leurs cadeaux aux parlementaires, aux membres du gouvernement et à leurs cabinets","depth":0,"id":"P5C1-M021"},{"kind":"mesure","text":"Faire appliquer la loi rendant inéligible toute personne condamnée pour corruption et mettre en place un plan national de lutte contre la corruption et les délits de probité","depth":0,"id":"P5C1-M022"},{"kind":"mesure","text":"Durcir les règles contre les conflits d’intérêts et interdire le pantouflage : tout haut fonctionnaire souhaitant travailler dans le privé devra démissionner de la fonction publique et rembourser le prix de sa formation s’il n’a pas servi au moins dix ans","depth":0,"id":"P5C1-M023"},{"kind":"mesure","text":"Allonger à dix ans la période d’interdiction d’exercice d’une fonction privée après avoir exercé une activité dans la fonction publique relative au même secteur","depth":0,"id":"P5C1-M024"},{"kind":"mesure","text":"Garantir des recrutements qui reflètent la diversité sociale dans les concours de la fonction publique","depth":0,"id":"P5C1-M025"},{"kind":"mesure","text":"Supprimer le monopole de l’administration fiscale sur le déclenchement de poursuites judiciaires pour toutes les affaires de fraude, quelle qu’elles soient : la justice doit pouvoir enquêter librement, même contre l’avis du ministre","depth":0,"id":"P5C1-M026"},{"kind":"mesure","text":"Réformer le financement de la vie politique et abaisser le plafond des dons individuels aux partis politiques","depth":0,"id":"P5C1-M027"},{"kind":"mesure","text":"Interdire la sous-traitance de la mise en œuvre et de l’évaluation des politiques publiques à des cabinets de conseils privés ainsi que la surfacturation de leurs prestations","depth":0,"id":"P5C1-M028"},{"kind":"mesure","text":"Abolir la réforme Macron du corps préfectoral et diplomatique","depth":0,"id":"P5C1-M029"}]},{"title":"Une République laïque","depth":1,"path":["Une République laïque"],"blocks":[{"kind":"texte","text":"La laïcité sera un pilier de la 6e République à laquelle nous aspirons. En garantissant la liberté de conscience, le libre exercice des cultes et l’égalité entre tous les citoyens, elle rend possible notre vie commune. Indissociable de la souveraineté populaire, nous devons la faire respecter et nous en tenir aux principes très clairs énoncés par la loi de 1905 de séparation des Églises et de l’État. La laïcité interdit ainsi l’ingérence des religions dans les affaires publiques. Mais elle ne saurait être confondue avec un athéisme d’État ou prétendre organiser les religions. Surtout : elle ne doit jamais servir à montrer du doigt les croyants d’une religion, comme cela est actuellement fait contre les musulmans."},{"kind":"mesure_cle","text":"Garantir la liberté de conscience et l’application stricte de la laïcité","id":"P5C1-K05"},{"kind":"mesure","text":"Abroger le concordat d’Alsace-Moselle et les divers statuts spécifiques en vigueur dans les Outre-mer","depth":0,"id":"P5C1-M030"},{"kind":"mesure","text":"Rétablir l’Observatoire de la laïcité","depth":0,"id":"P5C1-M031"},{"kind":"mesure","text":"Interdire aux élus locaux, parlementaires, ministres et préfets d’assister à des cérémonies religieuses au titre de leur fonction ou de recevoir des titres religieux, refuser l’attribution du titre de chanoine de Latran au président de la République","depth":0,"id":"P5C1-M032"},{"kind":"mesure","text":"Combattre tous les communautarismes et l’usage politique des religions","depth":0,"id":"P5C1-M033"},{"kind":"mesure","text":"Refuser les financements publics pour la construction d’édifices religieux et d’établissements confessionnels, ainsi que pour l’organisation et l’animation d’événements cultuels","depth":0,"id":"P5C1-M034"},{"kind":"mesure","text":"Garantir l’accès à une école publique laïque de proximité à toutes les familles","depth":0,"id":"P5C1-M035"},{"kind":"mesure","text":"Rétablir et augmenter les moyens et l’autonomie de la Mission interministérielle de vigilance et de lutte contre les dérives sectaires (Miviludes)","depth":0,"id":"P5C1-M036"}]},{"title":"La Révolution citoyenne dans les médias","depth":1,"path":["La Révolution citoyenne dans les médias"],"blocks":[{"kind":"texte","text":"L’essentiel du paysage médiatique est aujourd’hui concentré dans les mains d’une poignée de milliardaires. Ces empires médiatiques nuisent au pluralisme et à la liberté d’expression. La méfiance des Français envers les médias ne cesse de grandir. Ils sont près de deux sur trois à ne pas avoir confiance dans le traitement des informations. La Révolution citoyenne passe aussi par le droit à être informé honnêtement. L’information doit être libre et pluraliste. C’est une question démocratique. Nous le garantirons."},{"kind":"mesure_cle","text":"Démanteler les empires médiatiques des milliardaires","id":"P5C1-K06"},{"kind":"mesure","text":"Adopter une loi anti-concentration dans les médias et engager leur démocratisation :","depth":0,"id":"P5C1-M037"},{"kind":"sous_mesure","text":"Élargir les règles anti-concentration, sans tenir compte du support (quotidiens, hebdomadaires, presse locale ou nationale, plateformes ou contenus en ligne)","depth":1,"id":"P5C1-S001","parent":"P5C1-M037"},{"kind":"sous_mesure","text":"Établir des règles anti-concentration horizontale (détenir en même temps des entreprises de presse, de télévision, de radio, etc.) et lutter contre les regroupements entre filières de médias et autres industries culturelles, comme le cinéma, l’édition, les agences de publicité et d’influence","depth":1,"id":"P5C1-S002","parent":"P5C1-M037"},{"kind":"sous_mesure","text":"Empêcher le même groupe de posséder à la fois les infrastructures (réseaux, box, boutiques de vente) et la production des contenus (chaînes, programmes, droits sportifs), ce qui crée, de fait, des situations de monopole","depth":1,"id":"P5C1-S003","parent":"P5C1-M037"},{"kind":"mesure","text":"Garantir l’indépendance, le pluralisme et le financement de l’audiovisuel public en instaurant une contribution audiovisuelle dédiée, universelle et progressive","depth":0,"id":"P5C1-M038"},{"kind":"mesure","text":"Transformer le Conseil de déontologie des médias créé en 2019 en véritable contre-pouvoir citoyen","depth":0,"id":"P5C1-M039"},{"kind":"mesure","text":"Protéger le secteur des intérêts financiers et politiques en adossant la convention collective aux chartes éthiques de la profession et en dotant les rédactions publiques et privées d’un statut juridique leur permettant d’exercer des droits collectifs tels que le droit d’agrément, le droit d’opposition, le droit de préemption en cas de cession ou encore la motion de défiance","depth":0,"id":"P5C1-M040"},{"kind":"mesure","text":"Réguler les plateformes en ligne pour garantir une information de qualité et lutter contre la désinformation, les ingérences étrangères et économiques","depth":0,"id":"P5C1-M041"},{"kind":"mesure","text":"Donner aux abonnés des journaux et aux usagers de l’audiovisuel public des droits sur la gouvernance de ces médias","depth":0,"id":"P5C1-M042"},{"kind":"mesure","text":"Refonder le système des aides publiques à la presse pour mieux tenir compte de sa diversité (nouveaux médias, radios associatives, presse locale indépendante)","depth":0,"id":"P5C1-M043"},{"kind":"mesure","text":"Élire au Parlement les présidents de France Télévisions et de Radio France","depth":0,"id":"P5C1-M044"},{"kind":"mesure","text":"Revoir les missions et pouvoirs de l’Autorité de régulation de la communication audiovisuelle et numérique (Arcom), garantir l’attribution des fréquences aux médias locaux, associatifs et publics","depth":0,"id":"P5C1-M045"},{"kind":"mesure","text":"Garantir aux médias locaux, en particulier d’Outre-mer, les moyens d’assurer leur mission d’information afin d’éviter les déserts informationnels","depth":0,"id":"P5C1-M046"},{"kind":"mesure","text":"Renforcer la liberté des journalistes en luttant contre les « procédures bâillons », empêcher les procédures relatives à la liberté de la presse d’être jugées devant des tribunaux de commerce","depth":0,"id":"P5C1-M047"},{"kind":"mesure","text":"Protéger les journalistes couvrant les manifestations contre les violences pour leur permettre d’exercer leur droit à informer","depth":0,"id":"P5C1-M048"},{"kind":"mesure","text":"Interdire les sondages politiques avant que les candidats à une élection soient connus, les interdire également dans les jours précédant les élections et renforcer leur transparence en rendant obligatoire la publication des colonnes de redressement et des intervalles","depth":0,"id":"P5C1-M049"}]}]},{"code":"P5C2","part":"Partie 5 – Fonder la 6e République","title":"Chapitre 2 : Libertés publiques et sûreté","url":"https://melenchon2027.fr/programme/livre/fonder-la-6e-republique/chapitre2","sections":[{"title":"Sortir de l’état d’urgence permanent","depth":1,"path":["Sortir de l’état d’urgence permanent"],"blocks":[{"kind":"texte","text":"Depuis trente ans, les lois antiterroristes se cumulent et renforcent progressivement la surveillance généralisée de la population, les restrictions de libertés et les dispositifs d’exception. L’état d’urgence a été intégré dans le droit commun, installant une logique de suspicion et de contrôle. Cette fuite en avant sécuritaire est aggravée par l’adoption de mesures inspirées de l’extrême droite. Cela n’a pas renforcé la sécurité, mais a fragilisé, au contraire, les garanties démocratiques. Nous proposons de rétablir un État de droit plein et entier en recentrant la lutte contre le terrorisme sur le renseignement humain, la prévention, les moyens des services spécialisés et le discernement professionnel."},{"kind":"mesure_cle","text":"Élaborer une nouvelle stratégie antiterroriste","id":"P5C2-K01"},{"kind":"mesure","text":"Réaffirmer la place centrale du renseignement humain face aux limites et aux dérives du tout-technologique ; réduire la dépendance aux solutions techniques privées et étrangères","depth":0,"id":"P5C2-M001"},{"kind":"mesure","text":"Assécher les réseaux de financement du terrorisme en renforçant les moyens d’enquête et de poursuite contre les entreprises, associations et structures qui participent à des activités illicites, au blanchiment ou à la fraude fiscale","depth":0,"id":"P5C2-M002"},{"kind":"mesure","text":"Procéder à l’évaluation des résultats des lois déjà adoptées et abroger les dispositions liberticides qui ont instauré un état d’urgence permanent","depth":0,"id":"P5C2-M003"},{"kind":"mesure","text":"Garantir le contrôle du juge judiciaire dans la lutte contre le terrorisme","depth":0,"id":"P5C2-M004"},{"kind":"mesure","text":"Placer la lutte contre le terrorisme sous l’autorité du Premier ministre","depth":0,"id":"P5C2-M005"},{"kind":"mesure","text":"Lutter contre tous les processus d’embrigadement en renforçant les dispositifs de prévention, d’accompagnement et de prise en charge des personnes concernées ; étendre les dispositifs de prévention et de coordination existants aux groupuscules d’extrême droite","depth":0,"id":"P5C2-M006"},{"kind":"mesure","text":"Renforcer les moyens humains de la plateforme PHAROS, afin de lutter plus efficacement contre les appels en ligne à la violence, au racisme et aux discriminations","depth":0,"id":"P5C2-M007"}]},{"title":"Refonder une police républicaine","depth":1,"path":["Refonder une police républicaine"],"blocks":[{"kind":"texte","text":"Garantir le droit à la sûreté, c’est avoir une police loyale et attachée aux principes de l’État de droit. Dans notre République, la police doit avoir pour missions prioritaires de protéger les personnes, de garantir les libertés publiques et d’agir au service de l’intérêt général. C’est pourquoi nous la refondrons de la cave au grenier."},{"kind":"mesure_cle","text":"Refonder le service public de la police pour garantir le droit à la sûreté","id":"P5C2-K02"},{"kind":"mesure","text":"Rétablir une référence déontologique forte pour les agents de police et la gendarmerie en réintroduisant les principes du Code de déontologie de 1986, notamment l’indépendance, l’impartialité, le respect des libertés publiques et la protection des citoyens","depth":0,"id":"P5C2-M008"},{"kind":"mesure","text":"Supprimer l’Inspection générale de la police nationale (IGPN) et l’Inspection générale de la gendarmerie nationale (IGGN) et les remplacer par une autorité indépendante incluant des magistrats, des universitaires, des citoyens, rattachée au Défenseur des droits, en lui octroyant une capacité de sanctions disciplinaires propre sur les agents fautifs","depth":0,"id":"P5C2-M009"},{"kind":"mesure","text":"Interdire les pistolets à impulsion électrique (tasers), les grenades de désencerclement, les lanceurs de balles de défense (LBD) pour la police du quotidien ou la gestion des rassemblements, de sorte à favoriser une stratégie de maintien de l’ordre basée sur la désescalade","depth":0,"id":"P5C2-M010"},{"kind":"mesure","text":"Porter à deux ans la formation des élèves gardiens de la paix, réviser son contenu (déontologie, maîtrise du droit, pratiques de désescalade et relation avec la population) et réouvrir des écoles nationales pour les activités de police","depth":0,"id":"P5C2-M011"},{"kind":"mesure","text":"Interdire en manifestation la technique de la « nasse » (ou « encerclement »), rendre obligatoire et effectif le port du référentiel des identités et de l’organisation (RIO) par tous les agents intervenant lors des manifestations","depth":0,"id":"P5C2-M012"},{"kind":"mesure","text":"Abroger la loi dite « Cazeneuve » sur le refus d’obtempérer et refuser la loi dite « permis de tuer XXL » instaurant une présomption de légitime défense pour les policiers","depth":0,"id":"P5C2-M013"},{"kind":"mesure","text":"Abroger les lois sécuritaires inefficaces et renforcer les logiques de prévention, notamment grâce à davantage de moyens humains (éducateurs spécialisés, éducateurs de rue, médiateurs)","depth":0,"id":"P5C2-M014"},{"kind":"mesure","text":"Créer une commission dite « Vérité et Justice », chargée d’établir les responsabilités dans les cas de violences policières mortelles ou mutilantes afin de garantir la reconnaissance des faits et de prévenir leur répétition","depth":0,"id":"P5C2-M015"},{"kind":"mesure","text":"Réformer le dialogue social au sein de la police et de la gendarmerie pour garantir la transparence, renforcer la déontologie et professionnaliser les instances de concertation","depth":0,"id":"P5C2-M016"},{"kind":"mesure","text":"Intégrer au service public certaines fonctions de sécurité aujourd’hui privées, comme le gardiennage des services publics","depth":0,"id":"P5C2-M017"},{"kind":"mesure","text":"Interdire les techniques d’immobilisation létales : plaquage ventral, pliage ventral, clé d’étranglement","depth":0,"id":"P5C2-M018"}]},{"title":"Une police de proximité au service de la sûreté des citoyens","depth":1,"path":["Une police de proximité au service de la sûreté des citoyens"],"blocks":[{"kind":"texte","text":"La sûreté est un droit fondamental inscrit à l’article 2 de la Déclaration des droits de l’homme et du citoyen. Ce principe doit guider l’action de la police. Pour le garantir, nous rétablirons enfin la police de proximité."},{"kind":"mesure_cle","text":"Rétablir la police de proximité comme pilier du service public et démanteler les brigades anticriminalité (BAC) ainsi que les brigades de répression des actions violentes motorisées (BRAV-M)","id":"P5C2-K03"},{"kind":"mesure","text":"Intégrer progressivement les polices municipales dans une police de proximité républicaine, formée aux exigences du service public, sous l’autorité fonctionnelle des maires et l’autorité hiérarchique de l’État, sans armes létales ; répartir ses effectifs selon les besoins réels des communes","depth":0,"id":"P5C2-M019"},{"kind":"mesure","text":"En finir avec la politique du chiffre et les primes aux résultats pour réorienter l’évaluation des agents de police et la gendarmerie vers la qualité du service rendu, la résolution des problèmes et la confiance avec les citoyens","depth":0,"id":"P5C2-M020"},{"kind":"mesure","text":"Renforcer les moyens dédiés au recueil des plaintes et à l’accompagnement des victimes","depth":0,"id":"P5C2-M021"},{"kind":"mesure","text":"Faire de la lutte contre la criminalité organisée, les trafics, la corruption et la délinquance financière une priorité en renforçant les effectifs spécialisés","depth":0,"id":"P5C2-M022"},{"kind":"mesure","text":"Doubler les moyens de la police scientifique, revenir sur la réforme de la police judiciaire et recréer un corps spécifique de police judiciaire, indépendant et placé sous l’autorité des magistrats enquêteurs","depth":0,"id":"P5C2-M023"},{"kind":"mesure","text":"Interdire la reconnaissance faciale et les dispositifs de « techno­police » reposant sur une surveillance biométrique généralisée dans les espaces publics, incompatibles avec les libertés publiques et le respect de la vie privée","depth":0,"id":"P5C2-M024"}]},{"title":"Une politique de justice efficace","depth":1,"path":["Une politique de justice efficace"],"blocks":[{"kind":"texte","text":"La justice inspire de plus en plus la défiance à nos concitoyens. Elle est perçue comme trop lente, trop déconnectée de la réalité et du vécu des victimes ou des accusés au pénal, ou des parties au civil. Son indépendance est mise en cause dans les affaires politico-financières. La réformer ne pourra se faire qu’à l’occasion d’un grand rendez-vous entre le peuple et ses institutions, avec la convocation d’une Assemblée constituante. En attendant, nous proposons d’ores et déjà de nombreuses réformes."},{"kind":"mesure_cle","text":"Confier au Parlement l’orientation de la politique pénale du pays par un débat annuel sur un texte soumis au vote","id":"P5C2-K04"},{"kind":"mesure","text":"Renforcer l’indépendance de la justice vis-à-vis de l’exécutif : interdire les remontées d’information individuelles, sauf lorsqu’elles appellent à une intervention directe de l’exécutif en matière d’ordre public (le terrorisme, par exemple)","depth":0,"id":"P5C2-M025"},{"kind":"mesure","text":"Sécuriser le secret de l’instruction et de l’enquête en renforçant les mécanismes de poursuite des auteurs et de leurs complices","depth":0,"id":"P5C2-M026"},{"kind":"mesure","text":"Sortir de la logique du tout carcéral, respecter la dignité et les droits des personnes privées de liberté : en finir avec la surpopulation carcérale par la mise en place d’un mécanisme contraignant de régulation carcérale et assurer aux personnes détenues les moyens de se réinsérer dans notre société","depth":0,"id":"P5C2-M027"},{"kind":"mesure","text":"Lutter contre la délinquance financière : doubler les effectifs des services qui luttent contre les infractions financières, supprimer réellement le « verrou de Bercy », donner plus de moyens humains aux brigades en charge de la délinquance financière, augmenter le nombre de juges d’instruction et supprimer la convention judiciaire d’intérêt public","depth":0,"id":"P5C2-M028"},{"kind":"mesure","text":"Lutter contre l’impunité des agresseurs sexuels, la correctionnalisation des viols et la victimisation secondaire lors des procédures judiciaires","depth":0,"id":"P5C2-M029"},{"kind":"mesure","text":"Créer un service public d’accueil, d’accompagnement et de prise en charge des victimes :","depth":0,"id":"P5C2-M030"},{"kind":"sous_mesure","text":"Reconnaître le statut de victime indépendamment de l’issue ou de l’engagement d’une procédure pénale","depth":1,"id":"P5C2-S001","parent":"P5C2-M030"},{"kind":"sous_mesure","text":"Garantir un accompagnement individualisé, tant sur le plan social que juridique, ainsi que la prise en charge d’un parcours de soins spécialisé pour les victimes de violences sexistes et sexuelles à 100 % par la Sécurité sociale","depth":1,"id":"P5C2-S002","parent":"P5C2-M030"},{"kind":"mesure","text":"Donner les moyens d’une justice pénale environnementale efficace, punir les pollutions industrielles et appliquer strictement le principe pollueur-payeur","depth":0,"id":"P5C2-M031"},{"kind":"mesure","text":"Rattacher la police judiciaire à l’autorité judiciaire pour assurer un contrôle direct et exclusif, lui donner les moyens de son action","depth":0,"id":"P5C2-M032"},{"kind":"mesure","text":"Garantir l’égalité de traitement des personnes étrangères devant la justice, notamment en abolissant les procédures d’exception","depth":0,"id":"P5C2-M033"}]},{"title":"La justice au nom du peuple","depth":1,"path":["La justice au nom du peuple"],"blocks":[{"kind":"texte","text":"En république, la justice est rendue au nom du peuple. Mais la justice n’a plus les moyens de ses missions : elle a été laissée à l’abandon par les gouvernements successifs. Elle fait l’objet de pressions multiples. Il faut des moyens humains et financiers pour qu’elle soit bien rendue, et dans des délais raisonnables."},{"kind":"mesure_cle","text":"Assurer un meilleur accès de toutes et tous à la justice en augmentant notamment l’aide juridictionnelle et en veillant au retour des tribunaux de proximité","id":"P5C2-K05"},{"kind":"mesure","text":"Planifier des moyens pour la justice et recruter davantage de fonctionnaires : magistrats, greffiers, agents de la protection judiciaire de la jeunesse","depth":0,"id":"P5C2-M034"},{"kind":"mesure","text":"Rétablir pleinement les jurés populaires, désormais quasiment disparus, supprimer les cours criminelles sans jurés et expérimenter les jurés dans les tribunaux correctionnels","depth":0,"id":"P5C2-M035"},{"kind":"mesure","text":"Renforcer les droits de la défense, inscrire le droit à une défense dans la Constitution, renforcer la place de l’avocat et limiter le recours à la visioconférence, qui déshumanise la justice","depth":0,"id":"P5C2-M036"},{"kind":"mesure","text":"Garantir la gratuité des procédures les plus courantes (le divorce, par exemple) et supprimer la taxe de 50 euros pour les citoyens qui veulent saisir la justice","depth":0,"id":"P5C2-M037"},{"kind":"mesure","text":"Garantir des sessions de formation (histoire, géographie et enjeux locaux) pour les magistrats en poste dans les Outre-mer et qui n’en sont pas originaires","depth":0,"id":"P5C2-M038"}]}]},{"code":"P5C3","part":"Partie 5 – Fonder la 6e République","title":"Chapitre 3 : Une France sans déserts de droits","url":"https://melenchon2027.fr/programme/livre/fonder-la-6e-republique/chapitre3","sections":[{"title":"Une République affirmant le rôle central des communes","depth":1,"path":["Une République affirmant le rôle central des communes"],"blocks":[{"kind":"texte","text":"Nombre d’avancées démocratiques et sociales ont été inventées dans les communes depuis que la Révolution française les a instituées comme le lieu premier de la souveraineté populaire. Mais, sous l’ère néolibérale, les communes ont souvent été réduites à devoir gérer les coupes permanentes de budgets et affronter la mise en concurrence des collectivités. Nous avons besoin d’une République communaliste. Dans la 6e République, les communes seront centrales pour l’exercice de la souveraineté populaire, l’organisation d’une société de l’entraide et la planification écologique. Pour cela, il est nécessaire de restaurer la souveraineté municipale et leur droit à la libre association."},{"kind":"mesure_cle","text":"Redonner aux communes le rôle de cellule de base de la démocratie locale, permettre leur libre association","id":"P5C3-K01"},{"kind":"mesure","text":"Supprimer les métropoles technocratiques en abrogeant les lois ayant organisé la concentration des pouvoirs locaux et restituer aux communes leur libre choix d’association","depth":0,"id":"P5C3-M001"},{"kind":"mesure","text":"Rééquilibrer la dotation globale de fonctionnement versée aux communes pour lutter contre les inégalités territoriales et l’indexer sur l’inflation","depth":0,"id":"P5C3-M002"},{"kind":"mesure","text":"Refuser les fusions forcées de communes","depth":0,"id":"P5C3-M003"},{"kind":"mesure","text":"Augmenter l’enveloppe budgétaire des communes rurales par la création d’un fonds de soutien communal, notamment pour recruter et revaloriser les agents","depth":0,"id":"P5C3-M004"},{"kind":"mesure","text":"Revaloriser et rééquilibrer les indemnités des élus en tenant compte de leur temps de travail réel et des responsabilités exercées, plutôt que du seul nombre d’habitants","depth":0,"id":"P5C3-M005"},{"kind":"mesure","text":"Valoriser les métiers de secrétaires de mairies en favorisant le recrutement à temps complet et en développant des formations adaptées","depth":0,"id":"P5C3-M006"},{"kind":"mesure","text":"Imposer la parité dans les exécutifs municipaux et communautaires : binôme maire-premier adjoint, présidences et vice-­présidences, sans exception","depth":0,"id":"P5C3-M007"},{"kind":"mesure","text":"Réformer le mode de désignation des conseils communautaires, afin de renforcer la parité au sein de leur exécutif","depth":0,"id":"P5C3-M008"},{"kind":"mesure","text":"Redonner des moyens aux communes en rétablissant une taxe d’habitation calculée selon un barème progressif en fonction des revenus des occupants et de la valeur du logement, dont 80 % des ménages seraient exonérés","depth":0,"id":"P5C3-M009"}]},{"title":"L’organisation de l’État au service de la planification écologique","depth":1,"path":["L’organisation de l’État au service de la planification écologique"],"blocks":[{"kind":"texte","text":"Au fil des années, les collectivités locales sont devenues un millefeuille administratif illisible. Nous devons réorganiser l’État républicain d’après des objectifs écologiques et démocratiques. L’objectif de maîtrise du cycle de l’eau doit guider cette nouvelle organisation : les bassins-versants et les agences de l’eau en seront le socle, de sorte à atteindre un grand objectif « zéro pollution et zéro épuisement de la ressource en eau »."},{"kind":"mesure_cle","text":"Créer des éco-régions pour remplacer les régions actuelles, délimitées en cohérence avec les caractéristiques écologiques (bassins-­versants, façades maritimes, massifs montagneux, etc.) et chargées de mettre en œuvre la planification écologique et de protéger les communs (eau, air, sols)","id":"P5C3-K02"},{"kind":"mesure","text":"Impliquer pleinement les communes dans les décisions et la mise en œuvre des investissements de la planification écologique","depth":0,"id":"P5C3-M010"},{"kind":"mesure","text":"Supprimer les régions transfrontalières (ou eurorégions)","depth":0,"id":"P5C3-M011"},{"kind":"mesure","text":"Réserver le statut de collectivité unique aux territoires insulaires et aux Outre-mer","depth":0,"id":"P5C3-M012"},{"kind":"mesure","text":"Mettre en place des Défenseurs de la nature, chargés de l’eau, de l’air, de la forêt, de la végétalisation et de la perméabilité des sols au niveau communal","depth":0,"id":"P5C3-M013"},{"kind":"mesure","text":"Mettre en place des assemblées citoyennes régionales pour débattre des projets d’aménagement et d’investissement en lien avec la planification écologique","depth":0,"id":"P5C3-M014"},{"kind":"mesure","text":"Stopper l’étalement urbain : rapprocher les bassins de vie et les bassins d’emploi","depth":0,"id":"P5C3-M015"},{"kind":"mesure","text":"Adapter les zones habitées et cultivées au changement climatique : désimperméabiliser les sols, créer des îlots et des corridors de fraîcheur","depth":0,"id":"P5C3-M016"},{"kind":"mesure","text":"Renforcer les moyens humains et financiers de l’ingénierie des territoires pour appuyer les collectivités dans le déploiement d’une planification écologique régénérative (restauration des trames vertes et bleues ainsi que des énergies renouvelables)","depth":0,"id":"P5C3-M017"}]},{"title":"L’égalité des populations par la démocratie et les services publics","depth":1,"path":["L’égalité des populations par la démocratie et les services publics"],"blocks":[{"kind":"texte","text":"Les quartiers populaires, les petites villes, les ruralités et les Outre-mer partagent une même condition : celle des territoires délaissés. Laisser le champ libre au privé pour l’organisation de l’essentiel a créé une géographie faite de déserts pour le peuple et d’oasis pour les riches. Remettons de l’ordre et de la justice dans l’organisation du pays. Les services publics seront les piliers de cette politique."},{"kind":"mesure_cle","text":"Défendre et reconstruire un maillage dense et accessible de transports en commun et de services publics, notamment dans les départements ruraux, les quartiers populaires et les Outre-mer, afin de garantir une distance maximale (de 15 à 30 minutes en voiture ou en transport collectif) entre tout lieu d’habitation et les services publics essentiels (école, gare, hôpital, bureau de poste)","id":"P5C3-K03"},{"kind":"mesure","text":"Réaffirmer le rôle du département comme échelle pertinente pour organiser un maillage équilibré du territoire en services publics essentiels à la population","depth":0,"id":"P5C3-M018"},{"kind":"mesure","text":"Organiser des états généraux des quartiers populaires et des états généraux des espaces ruraux pour construire une véritable égalité territoriale, notamment dans les services publics","depth":0,"id":"P5C3-M019"},{"kind":"mesure","text":"Renforcer et réouvrir des accueils physiques dans les services publics","depth":0,"id":"P5C3-M020"},{"kind":"mesure","text":"Développer des services publics itinérants (santé, administrations, culture) pour desservir les communes les plus isolées, en complément des structures fixes","depth":0,"id":"P5C3-M021"},{"kind":"mesure","text":"Renforcer les dotations de l’État pour les collectivités en tenant compte de leurs inégalités sociales et économiques","depth":0,"id":"P5C3-M022"},{"kind":"mesure","text":"Renforcer durablement les moyens des services de sécurité civile et des services de secours en fonction des besoins réels et des risques propres à chaque collectivité","depth":0,"id":"P5C3-M023"},{"kind":"mesure","text":"Instaurer un moratoire sur les fermetures d’écoles, de maternités, de bureaux de poste, de gares et de tous les services publics de proximité","depth":0,"id":"P5C3-M024"},{"kind":"mesure","text":"Garantir une présence postale et des services bancaires accessibles dans toutes les collectivités","depth":0,"id":"P5C3-M025"}]},{"title":"Garantir le droit au logement","depth":1,"path":["Garantir le droit au logement"],"blocks":[{"kind":"texte","text":"En dix ans, le nombre de sans-domicile en France a doublé. Le nombre d’expulsions forcées atteint des records. Près de 3 millions de ménages attendent l’attribution d’un logement public. 4,2 millions de personnes sont mal logées. La part des revenus des classes populaires engloutie par les loyers, elle, a doublé depuis les années 1970. Quant à l’accession à la propriété, elle est réservée de plus en plus exclusivement aux foyers riches. La cause de tout cela ? Avoir confié le logement au marché. Le droit au logement est bafoué. À nous d’agir concrètement pour le rendre effectif, notamment en construisant des logements accessibles."},{"kind":"mesure_cle","text":"Faire appliquer le droit inconditionnel à un hébergement d’urgence de qualité et atteindre l’objectif de « zéro sans-abri » à l’issue du quinquennat","id":"P5C3-K04"},{"kind":"mesure","text":"Interdire les expulsions locatives sans relogement public et abroger la loi dite « Kasbarian »","depth":0,"id":"P5C3-M026"},{"kind":"mesure","text":"Mettre en place une garantie universelle des loyers créant un filet de sécurité contre les impayés de loyers pour les locataires comme pour les propriétaires","depth":0,"id":"P5C3-M027"},{"kind":"mesure","text":"Produire 200 000 logements publics par an et 30 000 logements jeunes pendant 5 ans aux normes écologiques les plus ambitieuses","depth":0,"id":"P5C3-M028"},{"kind":"mesure","text":"Geler les loyers le temps de déployer un encadrement des loyers partout sur le territoire et à la baisse dans les grandes villes","depth":0,"id":"P5C3-M029"},{"kind":"mesure","text":"Encadrer le prix du foncier pour endiguer la spéculation immobilière","depth":0,"id":"P5C3-M030"},{"kind":"mesure","text":"Rehausser le seuil de logements sociaux à 30 % dans les villes (loi relative à la solidarité et au renouvellement urbain, dite « SRU »), le calculer par arrondissements pour les grandes métropoles et aggraver les sanctions contre les communes hors la loi","depth":0,"id":"P5C3-M031"},{"kind":"mesure","text":"Créer une Inspection du logement, sur le modèle de l’Inspection du travail pour faire respecter les droits des locataires, contrôler les bailleurs, sanctionner les manquements et lutter contre la spéculation","depth":0,"id":"P5C3-M032"},{"kind":"mesure","text":"Lutter contre l’habitat indigne, l’habitat insalubre et les passoires thermiques : conditionner toute mise en location en France à l’obtention d’un permis de louer et lancer un grand plan de rénovation des logements","depth":0,"id":"P5C3-M033"},{"kind":"mesure","text":"Rétablir les aides publiques pour les habitations à loyer modéré (HLM), garantir la qualité et l’entretien du parc social et éviter les hausses de loyers à la relocation en logement social","depth":0,"id":"P5C3-M034"},{"kind":"mesure","text":"Utiliser la loi de réquisition des logements vides et les remettre sur le marché, dans des conditions qui respectent les critères du logement décent","depth":0,"id":"P5C3-M035"},{"kind":"mesure","text":"Augmenter le nombre de logements disponibles par une taxe unique sur les logements vacants, progressive selon le nombre de logements vacants détenus","depth":0,"id":"P5C3-M036"},{"kind":"mesure","text":"Lutter contre la spéculation sur le logement en limitant les locations de meublés touristiques de type Airbnb à 60 jours par an, fixer un quota de locations touristiques dans les zones en tension, interdire la location de meublés touristiques dans l’hypercentre des grandes métropoles et supprimer leur niche fiscale","depth":0,"id":"P5C3-M037"},{"kind":"mesure","text":"Limiter la concentration immobilière en instaurant un plafond de 5 logements transmissibles par héritage ; au-delà, les biens sont réquisitionnés par l’État et redistribués entre le parc social et des dispositifs d’accès à la propriété par des organismes de foncier solidaire","depth":0,"id":"P5C3-M038"},{"kind":"mesure","text":"Refonder la taxe foncière pour la rendre progressive et que chacun paie à hauteur de son patrimoine total réel","depth":0,"id":"P5C3-M039"},{"kind":"mesure","text":"Lancer un plan d’urgence de prévention et d’éradication des punaises de lit, avec la création de services publics locaux dédiés","depth":0,"id":"P5C3-M040"},{"kind":"mesure","text":"Réviser les plans de prévention des risques d’inondations à la hauteur des nouvelles menaces et créer un Fonds d’aide à la relocalisation des constructions menacées par les inondations et la montée des mers","depth":0,"id":"P5C3-M041"},{"kind":"mesure","text":"Remplacer l’Agence nationale pour la rénovation urbaine (ANRU) par un office national du logement et de l’amélioration du cadre de vie pour :","depth":0,"id":"P5C3-M042"},{"kind":"sous_mesure","text":"en finir avec les projets de rénovation urbaine qui se font contre les habitants","depth":1,"id":"P5C3-S001","parent":"P5C3-M042"},{"kind":"sous_mesure","text":"garantir le droit à rester vivre dans son quartier","depth":1,"id":"P5C3-S002","parent":"P5C3-M042"},{"kind":"sous_mesure","text":"privilégier la rénovation plutôt que la démolition, planifier la construction de nouveaux quartiers écologiques où il fait bon vivre","depth":1,"id":"P5C3-S003","parent":"P5C3-M042"}]},{"title":"En finir avec l’abandon des Outre-mer","depth":1,"path":["En finir avec l’abandon des Outre-mer"],"blocks":[{"kind":"texte","text":"Les Outre-mer sont maintenus dans un système de dépendance économique et de mal-développement, générateur de pauvreté et d’inégalités. Ils ne doivent plus être des colonies ni l’Hexagone une métropole ! Pourtant, leurs habitants subissent le recul continu des services publics, les retards accumulés en matière d’investissements publics, le poids des situations d’oligarchie ou des monopoles dans l’économie, ainsi que les effets durables des pollutions comme celles dues au chlordécone. Nous refusons une telle rupture d’égalité. Au contraire, la République doit vivre partout et pour tous !"},{"kind":"mesure_cle","text":"Engager un plan pluriannuel d’investissement et de développement des services publics (transports, éducation, santé, logement, culture) en partant des propositions formulées par les mouvements sociaux ultramarins eux-mêmes, notamment en Guyane et à Mayotte","id":"P5C3-K05"},{"kind":"mesure","text":"Mettre en place un encadrement des prix et des marges sur les produits de première nécessité pour lutter contre la vie chère, les monopoles et les oligopoles privés","depth":0,"id":"P5C3-M043"},{"kind":"mesure","text":"Étendre la prime de vie chère aux bénéficiaires des minima sociaux et de l’allocation de solidarité aux personnes âgées, ainsi qu’aux personnes dont les revenus sont inférieurs au seuil de pauvreté","depth":0,"id":"P5C3-M044"},{"kind":"mesure","text":"Assurer la continuité territoriale (desserte de service public à tarifs réglementés) ainsi que le désenclavement intraterritorial et extraterritorial, mettre en œuvre un plan de rattrapage spécifique sur les infrastructures routières et ferroviaires, en particulier à La Réunion et en Guyane","depth":0,"id":"P5C3-M045"},{"kind":"mesure","text":"Garantir l’accueil scolaire et la santé publique gratuite pour tous, reconstruire ou rénover les hôpitaux, renforcer leurs moyens et ceux des structures médicales et paramédicales","depth":0,"id":"P5C3-M046"},{"kind":"mesure","text":"Mettre en œuvre un plan de réparation pour répondre à la crise sociale, économique et sanitaire que traverse l’archipel de Kanaky-Nouvelle-Calédonie","depth":0,"id":"P5C3-M047"},{"kind":"mesure","text":"Soutenir l’enseignement des langues et des cultures d’Outre-mer et intégrer dans les programmes scolaires nationaux, en France hexagonale comme en Outre-mer, l’enseignement de l’histoire des Outre-mer","depth":0,"id":"P5C3-M048"},{"kind":"mesure","text":"Instaurer un principe de faveur, de manière à garantir 50 % de recrutements locaux dans tous les corps de la fonction publique, et privilégier l’accès à l’emploi de cadre en direction des locaux","depth":0,"id":"P5C3-M049"},{"kind":"mesure","text":"Contrôler le prix des billets d’avion entre les Outre-mer et l’Hexagone, lancer un audit relatif à la situation oligopolistique du secteur aérien","depth":0,"id":"P5C3-M050"},{"kind":"mesure","text":"Aligner les prestations sociales et le droit du travail à Mayotte sur l’Hexagone","depth":0,"id":"P5C3-M051"}]}]},{"code":"P6-PRESENTATION","part":"Partie 6 – Un monde ordonné","title":"Présentation de la partie","url":"https://melenchon2027.fr/programme/livre/un-monde-ordonne","sections":[{"title":"","depth":0,"path":[],"blocks":[{"kind":"texte","text":"Nous n’avons jamais été aussi proches d’une guerre généralisée. Avec elle, le droit international et les institutions au service de la paix sont remis en question par des criminels de guerre qui ne répondent qu’à la loi du plus fort. Ce nouvel ordre mondial, que certains aimeraient voir triompher, menace le peuple humain tout entier. Nous le refusons catégoriquement. La France doit être à l’initiative d’un « Front du refus » pour l’empêcher et revenir à un monde ordonné. Il y a urgence àa rendre à la France son indépendance afin qu’elle puisse se mettre au service de la paix et refuser la nouvelle compétition suprémaciste qui se profile. Redonner à notre pays une position non alignée, c’est refuser de fermer les yeux quand l’horreur s’abat sur les peuples bombardés. C’est refuser de se soumettre aux logiques bellicistes de puissances qui voient dans la guerre un moyen de s’approprier des ressources qui ne leur appartiennent pas. C’est défendre la paix et de nouvelles coopérations internationales au service de l’intérêt général humain."}]}]},{"code":"P6C1","part":"Partie 6 – Un monde ordonné","title":"Chapitre 1 : Se libérer du libéralisme en Europe","url":"https://melenchon2027.fr/programme/livre/un-monde-ordonne/chapitre1","sections":[{"title":"","depth":0,"path":[],"blocks":[{"kind":"texte","text":"Depuis bientôt quarante ans, l’Union européenne (UE) a réduit son projet aux principes libéraux : concurrence libre et non faussée, liberté totale de circulation des marchandises et des capitaux, politiques budgétaires austéritaires et banque centrale indépendante. Ces règles ont déjà été rejetées par le peuple français, qui s’est exprimé sur ce texte par référendum en 2005. Ce vote a été tenu pour nul puisque, deux ans plus tard, le Parlement français, réuni en congrès, adoptait le traité de Lisbonne, reprenant l’essentiel des dispositions contre lesquelles le peuple avait voté. Depuis, l’UE a pu se permettre tous les abus de pouvoirs, comme par exemple avec la mise sous tutelle, durant la décennie 2010, d’un État membre, la Grèce, dont le peuple a été martyrisé. Elle a pu passer sans discussion de « l’Europe de la paix » à l’Europe de la défense et de l’économie d’armement. Avant cela, elle a pu abroger sa Charte sociale et la remplacer par un texte lourdement régressif. L’Europe que nous avons sous les yeux est une construction sans rapport avec le projet initial qu’elle annonçait."},{"kind":"texte","text":"Depuis les élections européennes de 2024, l’UE s’enfonce davantage encore dans sa logique ultralibérale et dérégulatrice. Elle défait méthodiquement le peu d’avancées écologiques et sociales acquises lors du mandat précédent. Elle signe des accords de libre-échange destructeurs, notamment avec le Mercosur, l’Inde ou les États-Unis. Et elle cède aux injonctions xénophobes de l’extrême droite en durcissant encore ses politiques migratoires. L’année 2027 sera charnière pour les politiques européennes avec l’adoption du nouveau budget pluriannuel de l’UE et la réforme de la politique agricole commune (PAC). Mais aussi l’extension du marché carbone aux particuliers pour le logement et le transport, qui fera payer aux plus précaires le coût de la transition écologique."},{"kind":"texte","text":"Une nouvelle donne se dessine désormais. Car tous les principes néolibéraux sur lesquels se fondent les traités européens sont devenus publiquement obsolètes. Ils ont été contredits par la réalité elle-même. Deux présidents des États-Unis, Joe Biden (démocrate) et Donald Trump (républicain), ont refermé l’ère du libre-échange. Pendant la crise du Covid-19, les institutions européennes, elles-mêmes, ont été contraintes de suspendre leurs absurdes règles économiques, tant du côté budgétaire que monétaire. Aujourd’hui, de nombreux États, dont l’Allemagne, grande gardienne en Europe de l’ordolibéralisme, passent outre les règles budgétaires et de concurrence pour tenter de sortir de leur récession en réorientant leur économie autour de leur industrie guerrière."},{"kind":"texte","text":"Le moment est mûr pour se libérer du libéralisme en Europe. La France sera à l’initiative de cette proposition avec une stratégie en quatre points. Avec nous, la France ne sortira ni de l’Union, ni de la zone euro ; elle appliquera, en revanche, sans aucune concession, le programme choisi démocratiquement par son peuple, même si cela n’est pas permis par les traités."}]},{"title":"Le principe de non-régression écologique et sociale","depth":1,"path":["Le principe de non-régression écologique et sociale"],"blocks":[{"kind":"texte","text":"Nous proposerons au Parlement français d’adopter un principe de non-régression écologique et sociale, puis de l’inscrire dans la Constitution dans le cadre de la Constituante. La France transcrira dans son droit national les règles européennes seulement si elles améliorent l’existant en matière de protection sociale, de protection de l’environnement et de respect des droits humains. Aucune norme européenne ne pourra donc s’appliquer si elle est moins ambitieuse qu’une norme nationale sur le plan social ou écologique."},{"kind":"texte","text":"Ce principe nous permettra de refuser l’application :"},{"kind":"mesure","text":"Des grands plans de dérégulation dits « omnibus », qui détruisent les rares progrès permis par le droit européen et mettent en danger les travailleurs, la santé et l’environnement, tel celui adopté sur le devoir de vigilance des multinationales, ou celui sur les pesticides, qui réautorise la mise sur le marché de nombreux produits hier interdits","depth":0,"id":"P6C1-M001"},{"kind":"mesure","text":"Du projet dit de « 28e régime », qui veut contourner les législations nationales protectrices des travailleurs et créer toujours plus de niches fiscales et de régimes d’exception, entraînant ainsi une harmonisation « par le bas »","depth":0,"id":"P6C1-M002"},{"kind":"mesure","text":"Des législations européennes sur la migration (pacte sur la migration et l’asile, règlement dit « retour », etc.), qui font obstacle à une politique humaniste et réaliste","depth":0,"id":"P6C1-M003"},{"kind":"mesure","text":"De la directive sur les travailleurs détachés, qui tire vers le bas les systèmes de sécurité sociale des États membres","depth":0,"id":"P6C1-M004"}]},{"title":"Un droit d’objection souveraine sur certaines politiques européennes","depth":1,"path":["Un droit d’objection souveraine sur certaines politiques européennes"],"blocks":[{"kind":"texte","text":"Le Parlement français votera sur la suspension de certaines règles de fonctionnement de l’UE, le temps que ces règles soient révisées, dès lors que cette suspension est indispensable à l’application du programme choisi majoritairement par le peuple français."},{"kind":"texte","text":"Ce moratoire concernera notamment :"},{"kind":"mesure","text":"Le semestre européen, qui met sous surveillance budgétaire les États membres et les contraint à des politiques d’austérité perpétuelles","depth":0,"id":"P6C1-M005"},{"kind":"mesure","text":"La libre circulation sans limite des marchandises et des capitaux, qui empêche, par exemple, la mise en place d’une clause de sauvegarde sanitaire contre l’entrée de certains produits dangereux pour la santé","depth":0,"id":"P6C1-M006"},{"kind":"mesure","text":"Les règles de concurrence appliquées, entre autres choses, aux services publics, et qui nous ont notamment contraint à la libéralisation de biens communs comme l’énergie, le transport et les télécoms","depth":0,"id":"P6C1-M007"},{"kind":"mesure","text":"L’Europe de la défense, aujourd’hui toujours conçue comme un « pilier européen de l’OTAN » (Organisation du traité de l’Atlantique nord) nord-américain","depth":0,"id":"P6C1-M008"},{"kind":"mesure","text":"Les accords de libre-échange","depth":0,"
