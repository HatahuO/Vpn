<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Programme LFI 2027 — consultable</title>
<style>
:root{
  --bg:#fff; --fg:#1c1d21; --muted:#5b5f69; --line:#e2e4e9; --card:#f5f6f8; --card2:#eceef2;
  --accent:#0f5c6e; --accent-fg:#fff; --mark:#ffe48a; --cle-bg:#fff6e0; --cle-line:#e0a526; --warn:#8a4b00;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#121316; --fg:#e9eaed; --muted:#9ca0aa; --line:#2b2e35; --card:#1a1c21; --card2:#23262d;
    --accent:#5cc3d6; --accent-fg:#06222a; --mark:#6d5612; --cle-bg:#2a2210; --cle-line:#b88a1e; --warn:#f0b35a;
  }
}
:root[data-theme="dark"]{
  --bg:#121316; --fg:#e9eaed; --muted:#9ca0aa; --line:#2b2e35; --card:#1a1c21; --card2:#23262d;
  --accent:#5cc3d6; --accent-fg:#06222a; --mark:#6d5612; --cle-bg:#2a2210; --cle-line:#b88a1e; --warn:#f0b35a;
}
*{box-sizing:border-box}
html{scroll-padding-top:92px}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
a{color:var(--accent)}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* barre du haut */
.top{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 16px}
.top-row{display:flex;gap:10px;align-items:center;max-width:1400px;margin:0 auto;flex-wrap:wrap}
.brand{font-weight:700;font-size:15px;white-space:nowrap}
.brand small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.search{flex:1 1 320px;position:relative;min-width:220px}
.search input[type=search]{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);font-size:16px}
.chips{display:flex;gap:8px;flex-wrap:wrap;align-items:center;max-width:1400px;margin:8px auto 0;font-size:14px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border:1px solid var(--line);border-radius:999px;background:var(--card);cursor:pointer;user-select:none}
.chip input{margin:0}
.chip:has(input:checked){background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
select{padding:5px 8px;border:1px solid var(--line);border-radius:8px;background:var(--card);max-width:260px}
.btn{padding:6px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card);cursor:pointer}
.btn:hover{background:var(--card2)}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
#toc-toggle{display:none}

/* mise en page */
.layout{display:grid;grid-template-columns:310px minmax(0,1fr);max-width:1400px;margin:0 auto}
nav#side{position:sticky;top:92px;align-self:start;max-height:calc(100vh - 100px);overflow:auto;padding:12px 8px 40px 16px;font-size:14px;border-right:1px solid var(--line)}
nav#side details{margin:2px 0}
nav#side summary{cursor:pointer;font-weight:600;padding:5px 4px;border-radius:6px}
nav#side summary:hover{background:var(--card)}
nav#side a{display:block;padding:4px 8px;margin-left:8px;border-radius:6px;text-decoration:none;color:inherit;line-height:1.35}
nav#side a:hover{background:var(--card)}
nav#side a[aria-current=true]{background:var(--accent);color:var(--accent-fg)}
nav#side .code{font-variant-numeric:tabular-nums;color:var(--muted);font-size:12px;margin-right:4px}
nav#side a[aria-current=true] .code{color:inherit}
main{padding:20px 24px 80px;min-width:0}
.wrap{max-width:78ch}

/* contenu */
h1{font-size:1.6rem;line-height:1.25;margin:.2em 0 .4em}
h2,h3,h4,h5,h6{line-height:1.3;margin:1.6em 0 .5em}
h2{font-size:1.3rem;border-bottom:1px solid var(--line);padding-bottom:.25em}
h3{font-size:1.12rem} h4,h5,h6{font-size:1rem}
.crumb{font-size:13px;color:var(--muted)}
.src{font-size:13px;color:var(--muted);margin:0 0 1em}
ul.mesures{list-style:none;padding:0;margin:.4em 0}
ul.mesures>li{position:relative;padding:8px 10px 8px 12px;border-left:3px solid var(--line);margin:6px 0;background:var(--card);border-radius:0 8px 8px 0}
ul.mesures ul.sub{list-style:disc;margin:.5em 0 .2em 1.2em;padding:0}
ul.mesures ul.sub>li{padding:2px 0;margin:2px 0;background:none;border:0}
.id{font:12px/1 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--muted);margin-left:6px;white-space:nowrap}
aside.cle{margin:14px 0;padding:10px 14px;background:var(--cle-bg);border-left:4px solid var(--cle-line);border-radius:0 8px 8px 0}
aside.cle b.lbl{display:block;font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--warn)}
table{border-collapse:collapse;margin:1em 0;font-size:14px;display:block;overflow-x:auto}
td,th{border:1px solid var(--line);padding:5px 9px;text-align:left;vertical-align:top}
tr:first-child td{font-weight:600;background:var(--card)}
.flash{animation:flash 2.4s ease-out}
@keyframes flash{0%,30%{outline:3px solid var(--accent);outline-offset:2px}100%{outline:3px solid transparent}}
mark{background:var(--mark);color:inherit;border-radius:3px;padding:0 1px}
.pdfwarn{padding:8px 12px;background:var(--cle-bg);border:1px solid var(--cle-line);border-radius:8px;font-size:14px}

/* résultats */
.res{border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin:10px 0;background:var(--card)}
.res.key{border-left:4px solid var(--cle-line)}
.res .meta{font-size:12.5px;color:var(--muted);margin-bottom:4px}
.res .meta b{color:var(--fg)}
.res .go{font-size:13px;margin-top:6px;display:inline-block}
.summary{color:var(--muted);font-size:14px;margin:4px 0 8px}

/* accueil */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;margin:14px 0}
.card{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--card);text-decoration:none;color:inherit;display:block}
.card:hover{border-color:var(--accent)}
.card .n{font-size:1.5rem;font-weight:700;font-variant-numeric:tabular-nums}
.card .l{font-size:13px;color:var(--muted)}
.tips code{background:var(--card2);padding:1px 6px;border-radius:5px}
.tips li{margin:4px 0}
.ex a{margin-right:10px}
footer{color:var(--muted);font-size:12.5px;margin-top:40px;border-top:1px solid var(--line);padding-top:12px}

@media (max-width:900px){
  .top{position:static}
  html{scroll-padding-top:12px}
  .layout{grid-template-columns:1fr}
  nav#side{display:none;position:static;max-height:none;border-right:0;border-bottom:1px solid var(--line)}
  nav#side.open{display:block}
  #toc-toggle{display:inline-block}
  main{padding:16px}
}
@media print{
  .top,nav#side,.noprint{display:none!important}
  .layout{display:block} main{padding:0} body{font-size:11pt}
  ul.mesures>li,aside.cle{break-inside:avoid}
}
</style>

<script>
const DATA = {"meta":{"title":"Programme de la France insoumise — Présidentielle 2027","source":"https://melenchon2027.fr","generated_at":"2026-11-09","scope":"Périmètre : livre « L'Avenir en commun », plans thématiques, plans d'investissement productif, deux documents PDF d'accompagnement. Exclus : contributions citoyennes, auditions, archives 2022-2025.","expected_measures":1069,"stats":{"LAEC":{"mesure":881,"sous_mesure":81,"mesure_cle":107,"puce":0,"texte":142,"tableau":0},"PT-SANTE":{"mesure":0,"sous_mesure":0,"mesure_cle":0,"puce":126,"texte":74,"tableau":1},"PT-ESR":{"mesure":0,"sous_mesure":0,"mesure_cle":0,"puce":51,"texte":64,"tableau":1},"PT-RURALITE":{"mesure":0,"sous_mesure":0,"mesure_cle":0,"puce":82,"texte":61,"tableau":1},"PI-BTP":{"mesure":0,"sous_mesure":0,"mesure_cle":0,"puce":0,"texte":44,"tableau":1},"PI-AUTO":{"mesure":0,"sous_mesure":0,"mesure_cle":0,"puce":7,"texte":56,"tableau":1},"DOC-BANQUE":{"mesure":0,"sous_mesure":0,"mesure_cle":0,"puce":0,"texte":63,"tableau":0},"DOC-COMPTES":{"mesure":0,"sous_mesure":0,"mesure_cle":0,"puce":0,"texte":176,"tableau":0}},"warnings":["DOC-BANQUE: extraction PDF — graphiques et tableaux chiffrés peu fiables (texte courant OK).","DOC-COMPTES: extraction PDF — graphiques et tableaux chiffrés peu fiables (texte courant OK)."]},"documents":[{"code":"LAEC","kind":"livre","title":"L'Avenir en commun — Le programme de la Nouvelle France (6e édition)","url":"https://melenchon2027.fr/programme/livre/","units":[{"code":"INTRO","part":null,"title":"Introduction : Vers une nouvelle France","url":"https://melenchon2027.fr/programme/livre/introduction","sections":[{"title":"Introduction","depth":1,"path":["Introduction"],"blocks":[{"kind":"texte","text":"Introduction"},{"kind":"texte","text":"de Jean-Luc Mélenchon","md":"*de Jean-Luc Mélenchon*"},{"kind":"texte","text":"Ce livre présente la cinquième édition, depuis 2016, de L’Avenir en commun, un programme déjà riche d’une intense histoire. Il a rencontré le suffrage universel lors de l’élection présidentielle de 2017, quand il a réuni sept millions de voix, puis en 2022, quand il en a fédéré près de huit millions. Sa force populaire et son sérieux, reconnus de toutes parts, lui ont permis d’être la base des programmes d’union de la gauche aux législatives de 2022, avec la Nouvelle Union populaire écologique et sociale et, en 2024, avec le Nouveau Front populaire. Ce texte et sa méthode vivent donc dans la conscience et la volonté populaires, depuis bientôt dix ans d’actualisation ininterrompue, au fil des événements.","md":"Ce livre présente la cinquième édition, depuis 2016, de *L’Avenir en commun*, un programme déjà riche d’une intense histoire. Il a rencontré le suffrage universel lors de l’élection présidentielle de 2017, quand il a réuni sept millions de voix, puis en 2022, quand il en a fédéré près de huit millions. Sa force populaire et son sérieux, reconnus de toutes parts, lui ont permis d’être la base des programmes d’union de la gauche aux législatives de 2022, avec la Nouvelle Union populaire écologique et sociale et, en 2024, avec le Nouveau Front populaire. Ce texte et sa méthode vivent donc dans la conscience et la volonté populaires, depuis bientôt dix ans d’actualisation ininterrompue, au fil des événements."},{"kind":"texte","text":"Les mesures proposées ne sont pas les inventions de quelques technocrates seuls dans un bureau. L’Avenir en commun est une mise en cohérence des programmes produits par la société elle-même. Syndicats, associations, collectifs, scientifiques : chacune des propositions est ancrée dans le mouvement réel de la société, dont elle vient parfois très directement. Ce mouvement, les 80 parlementaires insoumis l’épousent d’abord, chacun ayant la tâche de suivre, de discuter, de travailler avec un secteur particulier de la société. L’Avenir en commun est ensuite le résultat d’une méthode de mise à jour permanente par des travaux programmatiques. Pour réviser, compléter, amender, page après page, la dernière version de ce programme qui datait de 2025, les Insoumis ont organisé une trentaine d’auditions longues et prolongées par des échanges. Ils ont recueilli et traité plus de 24 000 contributions citoyennes. Ils se sont réparti ce travail entre les 40 groupes en charge d’un livret thématique, chacun composé de militants spécialistes de leur domaine.","md":"Les mesures proposées ne sont pas les inventions de quelques technocrates seuls dans un bureau. *L’Avenir en commun* est une mise en cohérence des programmes produits par la société elle-même. Syndicats, associations, collectifs, scientifiques : chacune des propositions est ancrée dans le mouvement réel de la société, dont elle vient parfois très directement. Ce mouvement, les 80 parlementaires insoumis l’épousent d’abord, chacun ayant la tâche de suivre, de discuter, de travailler avec un secteur particulier de la société. *L’Avenir en commun* est ensuite le résultat d’une méthode de mise à jour permanente par des travaux programmatiques. Pour réviser, compléter, amender, page après page, la dernière version de ce programme qui datait de 2025, les Insoumis ont organisé une trentaine d’auditions longues et prolongées par des échanges. Ils ont recueilli et traité plus de 24 000 contributions citoyennes. Ils se sont réparti ce travail entre les 40 groupes en charge d’un livret thématique, chacun composé de militants spécialistes de leur domaine."}]},{"title":"La crise de la civilisation humaine","depth":2,"path":["Introduction","La crise de la civilisation humaine"],"blocks":[{"kind":"texte","text":"Mais un programme n’est pas un simple catalogue de revendications. L’Avenir en commun a été écrit avec un objectif à la fois précis et global : répondre, pour le peuple de France, à la crise de la civilisation humaine. En 2017, lorsque sa première version a été proposée aux suffrages des Français, les scientifiques du monde alertaient : pour limiter le réchauffement climatique à 1,5 °C dans le siècle, et ainsi respecter l’objectif de l’accord de Paris, il fallait baisser les émissions mondiales de gaz à effet de serre à compter de 2025. L’échéance a été dépassée, et la civilisation du pétrole continue sa folle croissance. À l’époque, 2016 avait été l’année la plus chaude jamais enregistrée sur terre. Depuis, le record a été battu en 2020, 2023, 2024 et 2025. Trois canicules consécutives ont enterré cet été l’espoir d’un retour à « la normale ». Autrement dit : le changement climatique et son lot de bouleversements pour la vie sur terre ont commencé et sont irréversibles. Les sécheresses à répétition, et avec elles les conflits sur l’usage de l’eau, ont commencé. L’intensification des pluies torrentielles et destructrices est engagée. Les méga-feux ravageurs, l’érosion du trait de côte, les fissures dans les sols en argile, les inondations débordant sur les villes étalées, la déformation des rails et les incendies des lignes électriques sous l’effet des canicules, la baisse des rendements agricoles, l’arrivée des pandémies par zoonoses ont débuté. Nous vivons sous un nouveau régime, celui de l’incertitude. Les conditions même de la vie en société des êtres humains, comme le climat, la nature des sols, la qualité de l’eau ou de l’air, vont être mises en cause dans des proportions difficiles à prévoir. Une question nous est posée. Elle n’est ni idéologique, ni confuse. Elle est claire et directe, et nous allons être sommés d’y répondre : par quelle méthode allons-nous tenter de perpétuer la vie humaine ?","md":"Mais un programme n’est pas un simple catalogue de revendications. *L’Avenir en commun* a été écrit avec un objectif à la fois précis et global : répondre, pour le peuple de France, à la crise de la civilisation humaine. En 2017, lorsque sa première version a été proposée aux suffrages des Français, les scientifiques du monde alertaient : pour limiter le réchauffement climatique à 1,5 °C dans le siècle, et ainsi respecter l’objectif de l’accord de Paris, il fallait baisser les émissions mondiales de gaz à effet de serre à compter de 2025. L’échéance a été dépassée, et la civilisation du pétrole continue sa folle croissance. À l’époque, 2016 avait été l’année la plus chaude jamais enregistrée sur terre. Depuis, le record a été battu en 2020, 2023, 2024 et 2025. Trois canicules consécutives ont enterré cet été l’espoir d’un retour à « la normale ». Autrement dit : le changement climatique et son lot de bouleversements pour la vie sur terre ont commencé et sont irréversibles. Les sécheresses à répétition, et avec elles les conflits sur l’usage de l’eau, ont commencé. L’intensification des pluies torrentielles et destructrices est engagée. Les méga-feux ravageurs, l’érosion du trait de côte, les fissures dans les sols en argile, les inondations débordant sur les villes étalées, la déformation des rails et les incendies des lignes électriques sous l’effet des canicules, la baisse des rendements agricoles, l’arrivée des pandémies par zoonoses ont débuté. Nous vivons sous un nouveau régime, celui de l’incertitude. Les conditions même de la vie en société des êtres humains, comme le climat, la nature des sols, la qualité de l’eau ou de l’air, vont être mises en cause dans des proportions difficiles à prévoir. Une question nous est posée. Elle n’est ni idéologique, ni confuse. Elle est claire et directe, et nous allons être sommés d’y répondre : par quelle méthode allons-nous tenter de perpétuer la vie humaine ?"}]},{"title":"Suprémacisme ou collectivisme","depth":2,"path":["Introduction","Suprémacisme ou collectivisme"],"blocks":[{"kind":"texte","text":"Deux formules vont s’affronter. D’un côté, le « chacun pour soi » : la compétition entre individus et groupes d’individus. D’abord, le marché et la concurrence pour séparer les bons et les mauvais, les gagnants et les perdants. Puis, les communautés essentialisées, dressées les unes contre les autres, soigneusement hiérarchisées, avec la domination de certains sur les autres comme solution. Le masculinisme pour dominer les femmes. Le racisme pour dominer les non-blancs. L’impérialisme pour dominer les peuples hors de l’Empire. Cela porte un nom : le suprémacisme. Il propose une offre cohérente aux peuples pour répondre aux désordres du monde. Son résultat sera de les aggraver. Surtout, il conduira à consolider le pouvoir exclusif d’une poignée de puissants, amassant des milliards, et construisant une société de ruines, dont ils comptent, pour finir, faire sécession. De l’autre côté, il y a le « tous ensemble ». C’est la solution défendue par ce programme. Elle procède du raisonnement suivant : les êtres humains étant fondamentalement interdépendants, leurs sociétés sont aussi fortes que les liens qui unissent les individus et les groupes entre eux. Ici, il ne s’agit pas de pousser à la compétition partout et tout le temps, mais au contraire de fortifier l’entraide sous toutes ses formes. Cette pensée est celle du collectivisme écologique. Son postulat ? Puisqu’il y a un seul écosystème compatible avec la vie humaine, il y a un intérêt général humain. Celui-ci n’est pas seulement une idée, un grand principe philosophique. Il est une réalité tangible, mesurable chaque jour dans la destruction des conditions d’habitabilité de la Terre. De ce point de vue, l’eau, l’air, les sols, les océans, les forêts et même l’orbite terrestre ne sont pas des ressources vouées à l’exploitation. Ce sont des biens communs, à gérer comme tels, avec pour premier objectif de garantir les conditions nécessaires à leur perpétuation."}]},{"title":"Pour une bifurcation écologique","depth":2,"path":["Introduction","Pour une bifurcation écologique"],"blocks":[{"kind":"texte","text":"Un programme, en phase avec ce moment du monde, doit commencer par la bifurcation écologique. Les êtres humains font partie intégrante du système de la nature. Depuis la nuit des temps, ils ont dû régler leurs rythmes sur ceux des saisons, des crues, des pluies, des floraisons, des migrations animales et combien d’autres encore. Le capitalisme a détraqué cette horloge de précision. Il cherche à soumettre tous les rythmes planétaires, sociaux, biologiques et biophysiques au temps zéro, celui de son profit. Il lui faut valoriser les actions en Bourse et obtenir un retour sur investissement toujours plus grand et plus rapide. Il n’atteint ce but qu’en pressurant les cycles biologiques humains et les cycles de la nature. Il pompe l’eau des nappes phréatiques, coupe rases les forêts, pollue l’atmosphère à un rythme insoutenable. Pour inverser cette logique, nous proposons une « règle verte » : ne pas prendre à la nature plus qu’elle n’est capable de renouveler. Nous visons l’harmonie avec la nature. Non entendue seulement dans un sens métaphorique ou poétique. Car cette harmonie a un sens très concret : celui de la concordance des rythmes. La bataille écologique est donc une bataille pour le temps. Son outil est transversal à toute action publique : la planification. Il s’agit de nous rendre collectivement maîtres du temps pour prévoir, anticiper, décider ce que nous allons produire, consommer, échanger ; comment nous allons nous déplacer, habiter et vivre. Pour cela, nous proposons de construire une République écologique. Les communes, pour mener à bien la planification, en seront l’échelon de base. Surtout, les régions seront réorganisées pour coïncider avec les grandes réalités écologiques du territoire français, et en premier lieu avec les bassins-versants. Les éco-régions auront en charge l’eau, l’air, la terre, la santé et les mobilités, c’est-à-dire les composantes fondamentales de la survie de notre espèce."}]},{"title":"Une économie au service des besoins","depth":2,"path":["Introduction","Une économie au service des besoins"],"blocks":[{"kind":"texte","text":"Tout cela implique un changement complet de logiciel économique. Celui des dirigeants français, depuis le début du néolibéralisme, a conduit à la catastrophe. Avec comme seule visée le redressement des profits des très grandes entreprises et les performances sur le marché mondial, il a élargi, sans cesse, le domaine du marché, et toujours davantage réduit celui de l’État et des services publics. Ces dogmes ont volé en éclats quand le président des États-Unis d’Amérique, lui-même, a décrété la fin du libre-échange et de la concurrence non faussée. En attendant, les conséquences sont là : la France a perdu ses capacités à produire pour elle dans de trop nombreux domaines. Elle dépend tant du travail d’autres qu’elle est obligée d’acheter ses médicaments, son acier, ses automobiles, ses turbines et, maintenant, même son alimentation ! La culture des bras ouverts à la finance a fini par laisser des fonds prédateurs dépouiller des milliers d’entreprises. Les salaires, avec la vie chère, ont reculé, tandis que des fortunes colossales et inédites s’accumulaient dans les mains de quelques-uns. Il faut prendre le problème à la racine pour remettre la politique à l’endroit : toute production est vouée à satisfaire des besoins. Nous proposons de construire une économie non au service du taux de profit ou du marché mondial, mais des besoins humains. Il nous faut pour cela un nouveau pacte productif. Refermons la page de l’État prenant en charge tous les risques du secteur privé, mais n’ayant son mot à dire sur rien. Pas d’arrosage d’aides publiques sans contreparties écologiques et sociales et sans engagements sur les objectifs du Plan. La principale richesse d’une nation ne se mesure pas à la hauteur de la montagne de billets sur laquelle sont assis ses milliardaires. Elle est dans le travail humain, son intelligence, ses qualifications. Les inégalités extrêmes dont nous sommes les témoins aujourd’hui sont purement parasitaires. Les réduire est non seulement un impératif moral, mais aussi le moyen de gagner en efficacité."}]},{"title":"Mettre en sécurité sociale","depth":2,"path":["Introduction","Mettre en sécurité sociale"],"blocks":[{"kind":"texte","text":"La France a déjà inventé un principe pour orienter la mobilisation des ressources vers la satisfaction des besoins. Elle était alors exsangue, appauvrie par la guerre et l’occupation allemande nazie. Mais elle a mis sur pied la Sécurité sociale. Sa règle de fonctionnement ? De chacun selon ses moyens, à chacun selon ses besoins. Pour nous, cette phrase est plus qu’un joli slogan. C’est la base d’une autre organisation sociale. Ainsi, nous nous fixons l’objectif de mettre en sécurité sociale intégrale la population française. Il faudra d’abord consolider la Sécurité sociale, mise obsessionnellement à mal par les libéraux depuis sa naissance ou presque. Ses caisses doivent revenir sous la responsabilité de ses cotisants, à travers des élections spécifiques. Son financement doit être remis en ordre avec, au centre, une cotisation sociale élargie mettant aussi à contribution les revenus du capital. Sur des bases solides, nous pourrons alors travailler à son extension. D’abord, avec le remboursement intégral des soins prescrits par l’Assurance maladie, plus efficace en la matière que toutes les offres privées. L’autonomie du grand âge et de la jeunesse sont aussi des aires d’extensions naturelles de la Sécurité sociale. La société regorge d’autres propositions pour en faire l’institution centrale de la société de l’entraide. Les progrès des solidarités collectives marchent main dans la main avec ceux de l’émancipation personnelle. Les droits nouveaux sont la garantie de la cohésion sociale de la société qui les adopte. Ainsi est-ce le cas, par exemple, là où la liberté de choisir son genre est assurée. Les femmes, en France, ont depuis un demi-siècle conquis par leurs luttes le droit formel de disposer d’elles-mêmes. Mais elles sont encore souvent écrasées sous la charge du travail domestique, des bas salaires, tout comme la violence sexiste, n’a pas disparu. Les héritiers de l’immigration forment un tiers de la société française. Mais ils subissent encore le racisme et les discriminations au travail, pour trouver un logement ou dans leur rapport à la police. Mettre en sécurité sociale, c’est d’abord garantir l’égalité réelle."}]},{"title":"Le goût du futur","depth":2,"path":["Introduction","Le goût du futur"],"blocks":[{"kind":"texte","text":"Prendre au sérieux la crise civilisationnelle ne signifie pas renoncer à un avenir améliorant le présent. Une grande bataille politique se joue en ce moment sur le futur. Les milliardaires du numérique, du pétrole et de la finance veulent s’en arroger le monopole. Pour chaque nouvelle frontière de l’humanité, ils veulent imposer leur projet suprémaciste. La France ne manque pas d’atouts dans ces grands domaines où se déploient aujourd’hui la connaissance et la curiosité humaines. Ils veulent une intelligence artificielle pour remplacer les humains qu’ils jugent remplaçables ? Nous voulons une IA pour aider les humains à progresser ! Dans les mains des seigneurs de la tech, le numérique ne sert qu’à fabriquer des armes, à inventer des moyens de fliquer tout le monde ou de vendre de la pub. Mais nous pouvons faire autre chose : une IA non marchande, tournée vers la recherche scientifique et la santé. Une IA qui, métier par métier, aide à soulager la peine du travail et à améliorer les réussites humaines. Car oui, si la peine de l’être humain peut être soulagée, qui va s’en plaindre ? Mais alors, il faudra organiser aussi la baisse du temps de travail à proportion ! Ils veulent des fusées privées pour aller coloniser Mars ? Nous ne rêvons pas de colonies quand nous regardons, émerveillés, les étoiles. Nous rêvons d’exploration, de connaissances, de prouesses scientifiques. La Nouvelle France fera un avion spatial ! Non pour dominer et détruire, mais pour aider et coopérer. Non pour provoquer une guerre des étoiles, mais une paix des étoiles. Ils veulent forer dans la mer des trous pour en extraire plus de pétrole ? Nous ferons de l’océan la première source d’énergie renouvelable propre ! Ils veulent l’amélioration individuelle du corps humain par le transhumanisme ? Nous allons vaincre les maladies écologiques par l’action collective ! Cancers, diabètes, infertilité ne sont pas seulement des maux individuels. Ils sont des conséquences du mode de production."}]},{"title":"Ordonner le monde","depth":2,"path":["Introduction","Ordonner le monde"],"blocks":[{"kind":"texte","text":"On le voit bien, beaucoup des sujets de notre époque sont d’ampleur mondiale. La crise écologique a fait émerger, avec l’intérêt général humain, un peuple humain identifié à ses causes communes. Protéger les biens communs et la vie nécessite un monde ordonné, où peuples et États peuvent compter sur un droit et des institutions internationales stables, égalitaires et fonctionnelles. Qui l’empêche aujourd’hui, crée le chaos et la prolifération des guerres dans les relations internationales ? C’est le déclin de l’empire des États-Unis d’Amérique. Il est un danger pour le monde entier, car il est géré d’une manière agressive par les élites de cet empire. Faire entendre une autre voix de la France nécessite de rompre nos dépendances avec lui et de nous affirmer non-­alignés. Nous voulons sauver les Nations unies. Elles doivent agir en organe universel capable de produire des normes partagées. Nous voulons instaurer l’ONU comme instance de coordination de tous les peuples du monde. Cela nécessite de défendre le droit international, sans « deux poids deux mesures ». Les droits des peuples doivent s’appliquer en Ukraine comme en Palestine. Nous ne proposons pas une puissance française fondée sur la domination militaire, même si nous devons avoir les moyens de nous défendre seuls. Notre idée est celle d’un nouveau type de diplomatie reposant sur les coopérations pour le progrès humain, c’est-à-dire les causes communes de l’humanité à notre époque. La France peut être davantage entendue par sa culture et sa science que par ses canons et son commerce."}]},{"title":"Fonder la 6e République","depth":2,"path":["Introduction","Fonder la 6e République"],"blocks":[{"kind":"texte","text":"Bref, c’est une toute Nouvelle France que ce programme propose de fonder. Comme à chaque saison agitée de l’Histoire, notre pays va chercher dans sa capacité d’auto-création politique les moyens de sortir de l’ornière. La Constitution de la Ve République est devenue un carcan. Quand elle a été adoptée le 28 septembre 1958, seuls les Français nés avant 1937 ont pu donner leur avis. 1 % de ceux-là sont encore vivants à cette heure. Il s’agissait alors d’acter la fin de l’empire colonial, d’achever l’industrialisation et l’exode rural. Nous parlons d’un pays où il n’y avait ni TGV ni réseau d’autoroutes. Les smartphones, les appels vidéo et les réseaux sociaux étaient encore loin d’être inventés. Pour le meilleur et pour le pire, nous étions encore à l’aube d’une grande accélération dont nous sommes désormais les enfants. Un adage dit que chaque génération est un peuple nouveau. Quand cela a-t-il été plus vrai qu’entre cet hier et aujourd’hui ? Comment comprendre la France sans voir aussi que la moitié de son peuple, les femmes, s’est transformée du tout au tout ? Comment ne pas voir à quel point le peuple français a été brassé par les migrations ? Et d’abord par les migrations intérieures ! Après 1958, une personne sur trois a émigré vers une commune plus grande. Et bien sûr, il y a celles et ceux qui, venus se battre pour la France, la reconstruire ou étudier, ont fait leur vie et leurs enfants ici. Une personne sur trois descend, par au moins un de ses grands-parents, de cette histoire-là. La question sociale, celle des modes de vie, l’urbanisation : tout a changé. Le peuple de France, au seuil du second quart du xxie siècle, est plus éduqué, informé et connecté que jamais. Il demande plus de pouvoir de contrôle. La Nouvelle France a besoin d’une nouvelle République : la 6e République. Ce sera celle de la souveraineté populaire permanente, avec les référendums citoyens, dont celui permettant de révoquer un élu, du conseiller municipal au président. Cette République devra trouver les moyens d’une structure fédérative avec des territoires insulaires et éloignés qui auront le droit à l’autonomie qu’ils demandent. Les libertés publiques, collectives comme individuelles, doivent être rétablies, après avoir été tant maltraitées. Tout cela justifie la convocation d’une Assemblée constituante."},{"kind":"texte","text":"Au final, l’heure n’est pas aux arrangements, aux bricolages ou aux demi-mesures. Oui, pour préparer une vie meilleure, il faut tout changer. La France et son peuple en sont capables, j’en suis convaincu. Je me présente devant elle avec ce programme, et une équipe prête à l’appliquer en condition de gouvernement. Le choix que nous allons faire en 2027, à l’occasion de l’élection présidentielle, est historique. Il dira au monde qui nous sommes devenus, nous Français, les héritiers de 1789 et de la résistance au nazisme. Il déterminera quel monde nous allons laisser à nos enfants. Et il dira surtout où nous nous proposons d’aller. La France va-t-elle rejoindre le camp du suprémacisme mondial ? Ou bien va-t-elle puiser dans le meilleur de son passé pour étonner et entraîner le monde des peuples aux désirs pacifiques ? Les conditions historiques sont réunies pour cela. Pour que les Français montrent qu’un autre monde est possible : celui d’un robuste avenir en commun."}]}]},{"code":"P1-PRESENTATION","part":"Partie 1 – Pour une bifurcation écologique et sociale","title":"Présentation de la partie","url":"https://melenchon2027.fr/programme/livre/pour-une-bifurcation-ecologique-et-sociale","sections":[{"title":"","depth":0,"path":[],"blocks":[{"kind":"texte","text":"La première tâche de la Nouvelle France est de se confronter à la plus grande crise existentielle à laquelle l’humanité ait jamais fait face : la catastrophe écologique, et avec elle son cortège de canicules, tempêtes, sécheresses, inondations et pollutions. Rien de tout cela ne tombe du ciel. Le capitalisme nous précipite droit dans le mur en détruisant les écosystèmes, en déréglant les cycles écologiques qui régissent les conditions nécessaires à la vie sur terre, en instaurant le règne du chacun pour soi et en organisant notre impréparation au changement climatique. Mais l’avenir peut aussi être autre chose qu’une suite de catastrophes angoissantes. L’horizon peut s’ouvrir sur une société d’harmonie entre les êtres humains et avec la nature, dans laquelle les cycles naturels et les cycles de la vie humaine seraient enfin en phase. À une condition : celle de rompre avec ce système en planifiant la bifurcation écologique et sociale."}]}]},{"code":"P1C1","part":"Partie 1 – Pour une bifurcation écologique et sociale","title":"Chapitre 1 : Planification écologique","url":"https://melenchon2027.fr/programme/livre/pour-une-bifurcation-ecologique-et-sociale/chapitre1","sections":[{"title":"La bifurcation écologique pour une société de l’harmonie","depth":1,"path":["La bifurcation écologique pour une société de l’harmonie"],"blocks":[{"kind":"texte","text":"L’urgence écologique et climatique suppose de rompre avec le système de l’argent-roi. L’exigence d’une société d’harmonie des êtres humains entre eux et avec la nature doit déterminer toute l’action de l’État. Elle doit être inscrite au sommet de la hiérarchie des normes grâce à la « règle verte ». L’enjeu est la reconquête collective du temps long. C’est le but de la planification écologique comme méthode pour gouverner par les besoins."},{"kind":"mesure_cle","text":"Inscrire dans la Constitution le principe de la « règle verte », selon laquelle on ne prélève pas davantage sur la nature que ce qu’elle est en état de reconstituer","id":"P1C1-K01"},{"kind":"mesure","text":"Instaurer un moratoire sur les grands projets inutiles, imposés et écocidaires, les réévaluer au regard de la « règle verte » et de leur impact sur la biosphère","depth":0,"id":"P1C1-M001"},{"kind":"mesure","text":"Respecter au plus vite les engagements climatiques de la France, relever le niveau de ses ambitions, avec une baisse de 65 % des émissions de gaz à effet de serre (GES) d’ici 2033, et rendre public un bilan annuel incluant les émissions importées","depth":0,"id":"P1C1-M002"},{"kind":"mesure","text":"Adopter des lois-cadres instaurant une planification écologique et démocratique coordonnant les échelles nationale et locale","depth":0,"id":"P1C1-M003"},{"kind":"mesure","text":"Donner les moyens humains et financiers à l’État et ses opérateurs publics (comme le Centre d’études et d’expertise sur les risques, l’environnement, la mobilité et l’aménagement (Cerema), l’Office national des forêts (ONF), l’Office français de la biodiversité (OFB) ou Météo-France) de mener à bien la planification","depth":0,"id":"P1C1-M004"},{"kind":"mesure","text":"Créer un conseil à la planification écologique pour l’organiser","depth":0,"id":"P1C1-M005"},{"kind":"mesure","text":"Obliger les entreprises à adopter une comptabilité carbone pour les émissions directes et indirectes de GES certifiée par un organisme public agréé en commençant par les secteurs les plus polluants – énergie, transport, bâtiment, industrie lourde – puis selon la taille des entreprises, accompagnée d’une trajectoire de baisse de leurs émissions","depth":0,"id":"P1C1-M006"},{"kind":"mesure","text":"Instaurer un crime climatique de dissimulation et de tromperie sur les émissions carbone des entreprises","depth":0,"id":"P1C1-M007"},{"kind":"mesure","text":"Inscrire dans les comptes publics un diagnostic régulier de l’état des écosystèmes, avec des indicateurs biophysiques et économiques permettant d’évaluer les coûts d’une restauration de leurs capacités","depth":0,"id":"P1C1-M008"},{"kind":"mesure","text":"Développer un outil national via l’Institut national de la statistique et des études économiques (Insee) pour suivre en temps réel les données clés sur l’économie et l’environnement en compilant des images satellites, des mesures terrestres et maritimes, des informations sur les actifs industriels énergétiques et leur impact, etc.","depth":0,"id":"P1C1-M009"},{"kind":"mesure","text":"Mettre en place une logistique verte : rompre avec les flux tendus, développer les modes de transport propres et structurer une logistique territoriale, notamment en renforçant le rôle du train et du fluvial ainsi qu’en mutualisant les flux du dernier kilomètre","depth":0,"id":"P1C1-M010"}]},{"title":"Les Outre-mer, avant-postes de la planification écologique","depth":1,"path":["Les Outre-mer, avant-postes de la planification écologique"],"blocks":[{"kind":"texte","text":"Les Outre-mer seront les pilotes de la planification écologique et du progrès humain. Ces dix dernières années, des « plans pays » ont émergé grâce aux mobilisations des Ultramarins. Ils doivent servir de modèle pour fixer de grands objectifs écologiques capables de satisfaire les besoins essentiels : autonomie énergétique, relocalisation de la production alimentaire, déploiement d’une économie de la mer."},{"kind":"mesure_cle","text":"Faire des Outre-mer des territoires pilotes de la planification écologique : circuits courts, autonomie énergétique et 100 % renouvelable, autosuffisance alimentaire, politique maritime, protection de la biodiversité","id":"P1C1-K02"},{"kind":"mesure","text":"Instaurer un bouclier douanier en faveur des productions locales à faible empreinte écologique","depth":0,"id":"P1C1-M011"},{"kind":"mesure","text":"Appliquer une préférence commerciale pour les produits ultramarins vers l’Hexagone et nouer des partenariats commerciaux équilibrés avec les voisins régionaux","depth":0,"id":"P1C1-M012"},{"kind":"mesure","text":"Tendre vers l’autosuffisance alimentaire grâce à l’agriculture paysanne écologique et aux filières agroalimentaires locales","depth":0,"id":"P1C1-M013"},{"kind":"mesure","text":"Sauver les trésors de biodiversité des Outre-mer en renforçant les moyens d’étude et de protection des espèces animales et végétales","depth":0,"id":"P1C1-M014"},{"kind":"mesure","text":"Promouvoir des plans d’autonomie énergétique","depth":0,"id":"P1C1-M015"},{"kind":"mesure","text":"Renforcer la résilience des Outre-mer face aux risques naturels majeurs en améliorant les dispositifs de prévention, de gestion de crise et de réparation avec des solutions innovantes et des moyens adaptés aux besoins des populations","depth":0,"id":"P1C1-M016"},{"kind":"mesure","text":"Développer l’offre locale de formation aux métiers de la bifurcation écologique (électricité et déploiement d’énergies renouvelables, utilisation de matériaux biosourcés locaux, foresterie et pêche durables)","depth":0,"id":"P1C1-M017"},{"kind":"mesure","text":"Généraliser et faciliter les prélèvements et analyses des sols des « jardins créoles » des particuliers (notamment en Martinique et Guadeloupe) afin d’encourager les pratiques agro­écologiques déjà à l’œuvre","depth":0,"id":"P1C1-M018"},{"kind":"mesure","text":"Engager un plan spécifique de développement des transports collectifs en Outre-mer sur le modèle du projet de tram-train à La Réunion","depth":0,"id":"P1C1-M019"},{"kind":"mesure","text":"Lutter contre la pêche illégale dans les eaux territoriales françaises","depth":0,"id":"P1C1-M020"}]}]},{"code":"P1C2","part":"Partie 1 – Pour une bifurcation écologique et sociale","title":"Chapitre 2 : Produire nous-mêmes pour répondre aux besoins","url":"https://melenchon2027.fr/programme/livre/pour-une-bifurcation-ecologique-et-sociale/chapitre2","sections":[{"title":"Réindustrialiser et relocaliser pour assurer notre indépendance","depth":1,"path":["Réindustrialiser et relocaliser pour assurer notre indépendance"],"blocks":[{"kind":"texte","text":"Avec la désindustrialisation, la France a perdu sa souveraineté dans de nombreux domaines, parfois essentiels. Désastreux sur le plan économique, les deux quinquennats Macron ont aggravé ce phénomène : la production industrielle n’a toujours pas retrouvé son niveau d’avant Covid-19. Voilà le sinistre bilan de sa politique ultralibérale. Tandis que les actionnaires se gorgent de dividendes et d’aides de l’État, des dizaines de milliers de familles françaises voient leur vie bouleversée par les plans sociaux et les délocalisations. La France ne doit pas dépendre d’autres États pour ses productions essentielles : lorsqu’une crise éclate, il est déjà trop tard pour relocaliser."},{"kind":"mesure_cle","text":"Relocaliser les productions essentielles à la vie de notre pays","id":"P1C2-K01"},{"kind":"mesure","text":"Créer une agence pour les relocalisations, placée sous la tutelle du conseil à la planification écologique, en charge du recensement des secteurs industriels indispensables à la souveraineté nationale et à la bifurcation écologique ainsi que de l’établissement d’un plan de relocalisation pour chaque filière ou production stratégique identifiée","depth":0,"id":"P1C2-M001"},{"kind":"mesure","text":"Engager un plan de reconstruction industrielle pour mettre fin à la dépendance de la France dans les domaines stratégiques (semi-conducteurs, médicaments, etc.)","depth":0,"id":"P1C2-M002"},{"kind":"mesure","text":"Réformer et investir les comités stratégiques de filières (CSF) pour en faire de réels lieux d’élaboration de la planification écologique dans le domaine industriel","depth":0,"id":"P1C2-M003"},{"kind":"mesure","text":"Présenter chaque année devant le Parlement la stratégie industrielle globale des administrateurs de l’État, avec un débat en hémicycle suivi d’un vote","depth":0,"id":"P1C2-M004"},{"kind":"mesure","text":"Créer des pactes de commande publique entre l’État et certaines filières industrielles pour garantir un niveau de commandes publiques en échange du respect de certains critères écologiques et sociaux dans la production","depth":0,"id":"P1C2-M005"},{"kind":"mesure","text":"Instaurer un contrat de bifurcation écologique garantissant les droits sociaux, la formation et la rémunération des salariés pour leur assurer un cadre protecteur en cas de reconversion d’une entreprise","depth":0,"id":"P1C2-M006"},{"kind":"mesure","text":"Créer, pour les salariés, un droit de reprise d’activité préférentiel dans un but écologique, en cas de cession ou de fermeture d’entreprise, ainsi qu’un droit de préemption, en cas de pratiques contraires à l’intérêt écologique général","depth":0,"id":"P1C2-M007"}]},{"title":"Investir pour lancer la bifurcation de notre économie","depth":1,"path":["Investir pour lancer la bifurcation de notre économie"],"blocks":[{"kind":"texte","text":"Acier, automobile, chimie, agriculture, robotique ou encore pharmacie : les difficultés de nombreuses filières productives menacent la capacité du pays à conduire la bifurcation écologique et à garantir notre souveraineté. Pour atteindre les objectifs de la planification écologique, il faut être en mesure de fabriquer ici les produits et les infrastructures dont nous avons besoin. Lancer cette grande transformation de notre économie nécessite d’investir au plus vite pour pallier ce qui n’a pas été fait pendant dix ans."},{"kind":"mesure_cle","text":"Lancer un grand plan d’investissements écologiquement et socialement utiles","id":"P1C2-K02"},{"kind":"mesure","text":"Conditionner les aides publiques versées aux entreprises à l’adoption des objectifs écologiques et sociaux définis par le Plan ; exiger le remboursement des aides en cas de non-respect des contreparties","depth":0,"id":"P1C2-M008"},{"kind":"mesure","text":"Reprendre les sites en difficulté ou en cours de vente à l’étranger pour stopper l’hémorragie dans les secteurs stratégiques comme la chimie, l’automobile, le numérique","depth":0,"id":"P1C2-M009"},{"kind":"mesure","text":"Produire en France l’acier décarboné dont nous avons besoin pour la bifurcation écologique, notamment en nationalisant ArcelorMittal France","depth":0,"id":"P1C2-M010"},{"kind":"mesure","text":"Constituer une réserve stratégique nationale d’acier et de minerai","depth":0,"id":"P1C2-M011"},{"kind":"mesure","text":"Planifier la construction de modèles de voitures électriques légères et abordables","depth":0,"id":"P1C2-M012"},{"kind":"mesure","text":"Développer une filière française de bombardiers d’eau et de drones pour lutter contre les feux de forêts","depth":0,"id":"P1C2-M013"},{"kind":"mesure","text":"Proposer des contrats de transition agroécologique sur plusieurs années aux agriculteurs, ouvrant droit à un accompagnement public pour les aider à adapter et transformer leur activité","depth":0,"id":"P1C2-M014"},{"kind":"mesure","text":"Relocaliser 80 principes actifs nécessaires pour des médicaments stratégiques en 5 ans en priorisant les antibiotiques, antidouleurs, antiépileptiques et spécialités de réanimation","depth":0,"id":"P1C2-M015"},{"kind":"mesure","text":"Faire adopter un plan de sortie des dépendances numériques par toutes les administrations publiques, collectivités locales et entreprises publiques","depth":0,"id":"P1C2-M016"},{"kind":"mesure","text":"Planifier le rattrapage de la France en matière de robotisation de l’industrie pour revenir à hauteur avec l’Allemagne, soit 400 robots pour 10 000 salariés","depth":0,"id":"P1C2-M017"},{"kind":"mesure","text":"Développer des filières de robotique dans la santé, la mer et l’espace","depth":0,"id":"P1C2-M018"},{"kind":"mesure","text":"Relancer l’observation spatiale de la Terre au service de la lutte contre le changement climatique grâce à un programme placé sous la responsabilité du Centre national d’études spatiales (CNES)","depth":0,"id":"P1C2-M019"},{"kind":"mesure","text":"Structurer une filière textile autour du lin pour garantir une offre de vêtements français accessibles et développer massivement le réemploi","depth":0,"id":"P1C2-M020"}]},{"title":"Refuser la concurrence généralisée","depth":1,"path":["Refuser la concurrence généralisée"],"blocks":[{"kind":"texte","text":"En mettant les usines françaises en concurrence avec celles de pays aux normes sociales et écologiques moins-disantes, le libre-échange a dépecé l’industrie nationale. Les gouvernements macronistes ont mis le pays dans l’impasse en laissant toute latitude aux actionnaires de délocaliser et de licencier. Pourtant, les unes après les autres, les grandes puissances tournent la page du libre-échange. Cette nouvelle donne est une opportunité pour permettre au pays de produire ce dont il a besoin."},{"kind":"mesure_cle","text":"Adopter des mesures antidumping d’urgence sur les industries stratégiques : sidérurgie, automobile, pharmaceutique","id":"P1C2-K03"},{"kind":"mesure","text":"Réviser le Code des marchés publics pour favoriser les entreprises sociales et solidaires, écologiques et locales","depth":0,"id":"P1C2-M021"},{"kind":"mesure","text":"Faire l’inventaire et l’évaluation des accords de libre-échange déjà appliqués et imposer le respect des normes sociales et écologiques pour la commercialisation des produits importés en France","depth":0,"id":"P1C2-M022"},{"kind":"mesure","text":"Instaurer des droits de douane sur des critères écologiques (émissions carbone, pollution, consommation d’eau)","depth":0,"id":"P1C2-M023"},{"kind":"mesure","text":"Mettre fin aux niches fiscales sur le kérosène pour limiter le dumping exercé par l’e-commerce depuis l’étranger","depth":0,"id":"P1C2-M024"},{"kind":"mesure","text":"Instaurer une taxe kilométrique aux frontières de la France pour dissuader les délocalisations et l’importation de produits trop éloignés","depth":0,"id":"P1C2-M025"},{"kind":"mesure","text":"Exiger un dépôt de garantie préalable auprès de la Banque de France en contrepartie d’un investissement étranger dans le pays","depth":0,"id":"P1C2-M026"},{"kind":"mesure","text":"Supprimer les avantages fiscaux sur l’épargne française investie à l’étranger, notamment pour l’assurance-vie","depth":0,"id":"P1C2-M027"},{"kind":"mesure","text":"Établir des critères de localisation de l’activité pour la commande publique nationale et locale ainsi que pour l’accord des aides aux entreprises","depth":0,"id":"P1C2-M028"},{"kind":"mesure","text":"Rendre effectives les peines de réquisition d’intérêt général pour toute délocalisation ou fermeture d’activité","depth":0,"id":"P1C2-M029"},{"kind":"mesure","text":"Renégocier le cadre de l’Organisation mondiale du commerce (OMC)","depth":0,"id":"P1C2-M030"}]}]},{"code":"P1C3","part":"Partie 1 – Pour une bifurcation écologique et sociale","title":"Chapitre 3 : Les grands chantiers de la bifurcation écologique","url":"https://melenchon2027.fr/programme/livre/pour-une-bifurcation-ecologique-et-sociale/chapitre3","sections":[{"title":"Planifier l’adaptation au changement climatique","depth":1,"path":["Planifier l’adaptation au changement climatique"],"blocks":[{"kind":"texte","text":"Le changement climatique est commencé. Les mandats Sarkozy, Hollande et Macron nous ont fait prendre du retard dans les batailles pour y faire face et s’y adapter. Il y a urgence à planifier la bifurcation écologique de notre économie en lançant de grands chantiers pour relever ce défi. Notre plan peut créer plusieurs centaines de milliers d’emplois et réduire massivement le chômage."},{"kind":"mesure_cle","text":"Engager un plan global de rénovation de nos infrastructures pour les adapter au changement climatique","id":"P1C3-K01"},{"kind":"mesure","text":"Lancer un plan de dépollution de la Méditerranée, ainsi que de nos façades maritimes et fonds marins de l’océan Atlantique, de la mer du Nord, de l’océan Indien et de l’océan Pacifique","depth":0,"id":"P1C3-M001"},{"kind":"mesure","text":"Rénover l’intégralité des réseaux d’eau et d’assainissement pour limiter les fuites et garantir le droit humain à l’eau et à l’assainissement","depth":0,"id":"P1C3-M002"},{"kind":"mesure","text":"Lancer des grands travaux de rénovation des voies ferrées et de réouverture des lignes et gares fermées ces trente dernières années","depth":0,"id":"P1C3-M003"},{"kind":"mesure","text":"Investir dans l’efficacité et la sobriété énergétiques, ainsi que dans les projets énergétiques innovants comme les énergies marines renouvelables","depth":0,"id":"P1C3-M004"},{"kind":"mesure","text":"Accélérer la modernisation et l’enfouissement du réseau de lignes à haute tension","depth":0,"id":"P1C3-M005"},{"kind":"mesure","text":"Réaliser un diagnostic national des ouvrages d’art (ponts, viaducs, digues, barrages) et les consolider","depth":0,"id":"P1C3-M006"},{"kind":"mesure","text":"Reconstituer de manière durable nos capacités productives dans le secteur du bois et fixer les unités de production au plus près des massifs forestiers : sciage, menuiserie (meubles, charpentes, constructions écologiques), production de panneaux, cartons et pâte à papier","depth":0,"id":"P1C3-M007"},{"kind":"mesure","text":"Planifier le développement de filières d’écoconstruction en matériaux biosourcés et géosourcés (dont bois, terre, paille), imposer des quotas dans la commande publique","depth":0,"id":"P1C3-M008"},{"kind":"mesure","text":"Augmenter les effectifs et les moyens des forces de sécurité civile","depth":0,"id":"P1C3-M009"},{"kind":"mesure","text":"Planifier l’installation de solutions de rafraîchissement dans les hôpitaux, les établissements d’hébergement pour personnes âgées dépendantes (EHPAD), les écoles, les lieux collectifs et les espaces publics (réseaux de fraîcheur urbains, climatisation, végétalisation, ombrières, etc.)","depth":0,"id":"P1C3-M010"},{"kind":"mesure","text":"Imposer la gratuité de lieux refuges, rafraîchis en cas d’alerte canicule (piscines publiques, médiathèques, musées, etc.)","depth":0,"id":"P1C3-M011"},{"kind":"mesure","text":"Planifier une stratégie nationale de sobriété métal, qui permette une utilisation de minerai conforme aux besoins collectifs et à l’intérêt général humain","depth":0,"id":"P1C3-M012"}]},{"title":"Le droit à l’eau dans les Outre-mer","depth":1,"path":["Le droit à l’eau dans les Outre-mer"],"blocks":[{"kind":"texte","text":"Dans tous les Outre-mer, les ruptures d’accès à l’eau potable se multiplient malgré la mobilisation des habitants. L’inaction prolongée des gouvernements quant à cette situation est un cas avéré de racisme environnemental. La moitié de l’eau potable se perd à cause des fuites de réseaux de canalisation laissés à l’abandon. Un grand plan d’investissement et d’adaptation des infrastructures s’impose pour garantir le droit à l’eau aux populations des Outre-mer."},{"kind":"mesure_cle","text":"Garantir, quoi qu’il en coûte, l’accès à l’eau courante potable à tous les habitants des Outre-mer","id":"P1C3-K02"},{"kind":"mesure","text":"Rétablir une distribution d’eau de bonne qualité et en volume suffisant dans les territoires d’Outre-mer où le service public de l’eau est défaillant","depth":0,"id":"P1C3-M013"},{"kind":"mesure","text":"Lancer des travaux urgents pour remplacer, notamment en Guadeloupe, les canalisations des réseaux d’eau potable et d’assainissement via un financement de l’État","depth":0,"id":"P1C3-M014"},{"kind":"mesure","text":"Adopter la régie comme mode de gestion de l’eau et de l’assainissement tout en prévoyant des sanctions conséquentes lorsque les délégataires, concessionnaires et fermiers ne remplissent pas leurs obligations contractuelles, notamment en matière d’entretien des réseaux","depth":0,"id":"P1C3-M015"},{"kind":"mesure","text":"En cas de pénurie, déclencher un plan visant à la distribution de bouteilles d’eau (plan ORSEC-eau), en plafonnant leur prix, dans tous les endroits où le service public de l’eau potable et de l’assainissement est défaillant","depth":0,"id":"P1C3-M016"},{"kind":"mesure","text":"Annuler la dette citoyenne résultant du problème de facturation des anciens opérateurs et/ou d’impayés pour service non rendu et cesser le recouvrement forcé de celle-ci","depth":0,"id":"P1C3-M017"},{"kind":"mesure","text":"Garantir que ni la dette existante, ni les investissements à venir des opérateurs de l’eau, ne seront répercutés sur la facture des usagers","depth":0,"id":"P1C3-M018"},{"kind":"mesure","text":"Mettre en œuvre un plan d’urgence pour résoudre la crise de l’eau à Mayotte","depth":0,"id":"P1C3-M019"}]},{"title":"Développer les transports publics écologiques, repenser la mobilité individuelle","depth":1,"path":["Développer les transports publics écologiques, repenser la mobilité individuelle"],"blocks":[{"kind":"texte","text":"Le transport ferroviaire a été sacrifié au nom de la concurrence. Des gares et des milliers de kilomètres de lignes ont été fermés depuis 1970. Les camions envahissent désormais nos routes. La libéralisation du rail empêche toute politique de bifurcation écologique. Il est urgent de relocaliser les productions et de réduire les distances entre bassins de vie et bassins d’emploi."},{"kind":"mesure_cle","text":"Créer un pôle public des transports et de la mobilité","id":"P1C3-K03"},{"kind":"mesure","text":"Mailler tout le pays de transports publics interconnectés combinant trains, transports collectifs urbains et interurbains, vélos","depth":0,"id":"P1C3-M020"},{"kind":"mesure","text":"Renationaliser la Société nationale des chemins de fer français (SNCF) et refuser la mise en concurrence des lignes de transport","depth":0,"id":"P1C3-M021"},{"kind":"mesure","text":"Stopper la suppression des lignes ferroviaires du quotidien et en réouvrir, augmenter le nombre et la fréquence des trains tout en garantissant des tarifs accessibles, maintenir et réimplanter des guichets physiques dans les gares","depth":0,"id":"P1C3-M022"},{"kind":"mesure","text":"Réduire le prix des billets de train, notamment en mettant fin à la gestion algorithmique des prix","depth":0,"id":"P1C3-M023"},{"kind":"mesure","text":"Revenir sur la liquidation de Fret SNCF, poussée par la Commission européenne et mise en place par les gouvernements Macron","depth":0,"id":"P1C3-M024"},{"kind":"mesure","text":"Développer massivement le fret ferroviaire, notamment le wagon isolé, et rendre obligatoire le raccordement des plateformes logistiques au réseau ferré, dès lors qu’aucune contrainte écologique n’existe","depth":0,"id":"P1C3-M025"},{"kind":"mesure","text":"Développer les transports publics à la demande hors des zones denses en transport public","depth":0,"id":"P1C3-M026"},{"kind":"mesure","text":"Supprimer les lignes aériennes intérieures quand l’alternative en train est inférieure à quatre heures","depth":0,"id":"P1C3-M027"},{"kind":"mesure","text":"Rétablir le plan Vélo supprimé par la Macronie et porter les investissements à la hauteur des besoins pour assurer la sécurité des cyclistes","depth":0,"id":"P1C3-M028"},{"kind":"mesure","text":"Limiter la taille, le poids et les dimensions des SUV autorisés à la vente","depth":0,"id":"P1C3-M029"},{"kind":"mesure","text":"Utiliser la commande publique et le leasing social pour diffuser les voitures électriques légères et à prix modeste","depth":0,"id":"P1C3-M030"},{"kind":"mesure","text":"Décréter un moratoire sur les zones à faibles émissions (ZFE) dans leur conception actuelle, dont les critères induisent des inégalités sociales et une trop grande tolérance à l’égard de certains véhicules, notamment les SUV, qualifiés à tort de non-polluants","depth":0,"id":"P1C3-M031"},{"kind":"mesure","text":"Garantir le droit à la mobilité et l’accès aux réseaux dans les collectivités peu dotées en transports collectifs par le soutien aux garages solidaires et une aide suffisante à la réparation dans le cadre du contrôle technique","depth":0,"id":"P1C3-M032"},{"kind":"mesure","text":"Adopter un plan de développement du ferroutage et de report modal (cabotage maritime, fluvial et par dirigeable)","depth":0,"id":"P1C3-M033"},{"kind":"mesure","text":"Interdire les vols de nuit dans tous les aéroports français entre 23 h et 6 h et réduire le nombre de créneaux de décollage disponibles le reste du temps","depth":0,"id":"P1C3-M034"},{"kind":"mesure","text":"Renationaliser les autoroutes en revenant sur les hausses de prix passées, ainsi que les aéroports stratégiques","depth":0,"id":"P1C3-M035"}]},{"title":"Organiser le 100 % d’énergies renouvelables","depth":1,"path":["Organiser le 100 % d’énergies renouvelables"],"blocks":[{"kind":"texte","text":"Les énergies fossiles sont polluantes et responsables du changement climatique. Macron nous a fait perdre dix ans pour en sortir. Le nucléaire n’est pas non plus une solution d’avenir. Il y a donc urgence à engager la bifurcation de notre modèle énergétique pour rattraper notre retard et affronter le dérèglement en cours. Pour réduire les émissions de GES, nous devons atteindre 100 % d’énergies renouvelables."},{"kind":"mesure_cle","text":"Planifier le passage à 100 % d’énergies renouvelables avec un double mot d’ordre : sobriété et efficacité énergétiques","id":"P1C3-K04"},{"kind":"mesure","text":"Atteindre le 100 % d’énergies renouvelables au plus tard en 2060, en commençant par organiser la sortie des énergies fossiles avant 2050 par la montée en puissance des énergies renouvelables, la sobriété et l’efficacité énergétiques","depth":0,"id":"P1C3-M036"},{"kind":"mesure","text":"Arrêter les subventions aux énergies fossiles, y compris à l’étranger","depth":0,"id":"P1C3-M037"},{"kind":"mesure","text":"Planifier la fermeture progressive des centrales nucléaires existantes en ne prolongeant pas au-delà de 60 ans leur durée de vie et arrêter le programme de nouveau nucléaire (EPR2)","depth":0,"id":"P1C3-M038"},{"kind":"mesure","text":"Mettre fin au projet d’enfouissement des déchets nucléaires et poursuivre la recherche pour trouver une solution permettant leur traitement à long terme","depth":0,"id":"P1C3-M039"},{"kind":"mesure","text":"Mettre en place une convention collective unique pour les travailleurs du nucléaire et arrêter l’utilisation massive de la sous-­traitance, tout en garantissant leur reconversion au fur et à mesure des fermetures de centrales","depth":0,"id":"P1C3-M040"},{"kind":"mesure","text":"Planifier le déploiement de technologies de stockage d’énergie et de mécanismes nécessaires à l’équilibre d’un système énergétique 100 % renouvelable","depth":0,"id":"P1C3-M041"},{"kind":"mesure","text":"Remettre en place des tarifs réglementés de l’énergie, calculés à partir des coûts de production, pour les particuliers comme pour les entreprises, les collectivités locales et les bailleurs sociaux, tout en y incluant des objectifs sociaux, comme la gratuité des premières quantités indispensables à une vie digne","depth":0,"id":"P1C3-M042"},{"kind":"mesure","text":"Annuler la libéralisation du marché de l’électricité et du gaz : stopper la privatisation des barrages hydroélectriques, créer un pôle public de l’énergie en lien avec des coopératives locales et EDF, et en renationalisant Engie","depth":0,"id":"P1C3-M043"},{"kind":"mesure","text":"Revenir sur les hausses abusives du prix du gaz","depth":0,"id":"P1C3-M044"},{"kind":"mesure","text":"Favoriser partout sur le territoire le recours aux diverses sources d’énergie les plus adaptées aux conditions météorologiques et géographiques, refuser la méthanisation à outrance","depth":0,"id":"P1C3-M045"},{"kind":"mesure","text":"Abroger la loi qui a fusionné l’Autorité de sûreté nucléaire (ASN) et l’Institut de radioprotection et de sûreté nucléaire (IRSN) et garantir leurs moyens respectifs","depth":0,"id":"P1C3-M046"}]},{"title":"Réussir la rénovation énergétique","depth":1,"path":["Réussir la rénovation énergétique"],"blocks":[{"kind":"texte","text":"Dans notre pays, 10 000 personnes meurent chaque année de la précarité énergétique. Au rythme actuel, il faudrait 2 000 ans pour achever la rénovation thermique d’un parc immobilier dont un logement sur deux est une bouilloire et/ou une passoire thermiques. Alors que le dérèglement climatique s’accélère et que les épisodes caniculaires s’amplifient, il y a donc urgence à engager dès maintenant un plan d’envergure."},{"kind":"mesure_cle","text":"Refaire l’isolation d’au moins 700 000 logements par an","id":"P1C3-K05"},{"kind":"mesure","text":"Se doter d’un service public ambitieux en charge de la plani­fication, du financement, de l’organisation de la rénovation énergétique pour mettre fin prioritairement aux situations de précarité énergétique","depth":0,"id":"P1C3-M047"},{"kind":"mesure","text":"Privilégier les rénovations complètes, interdire réellement la location des passoires thermiques, renforcer les programmes de détection des passoires énergétiques","depth":0,"id":"P1C3-M048"},{"kind":"mesure","text":"Créer un droit opposable à la protection contre les fortes chaleurs, qui oblige les bailleurs à équiper les logements présentant des risques de surchauffe pour les rendre habitables (volets, stores, brasseurs d’air, films solaires)","depth":0,"id":"P1C3-M049"},{"kind":"mesure","text":"Remplacer progressivement tous les chauffages au fioul et au gaz fossile par des systèmes n’émettant pas de GES comme des pompes à chaleur","depth":0,"id":"P1C3-M050"},{"kind":"mesure","text":"Conditionner l’attribution de labels écologiques à l’obtention de résultats énergétiques concrets et vérifiés pour les bâtiments neufs comme pour les rénovations thermiques dans les bâtiments anciens","depth":0,"id":"P1C3-M051"},{"kind":"mesure","text":"Se donner les moyens de la rénovation énergétique : développer les formations aux métiers de la rénovation et de l’adaptation des bâtiments, mettre en place un « guichet unique » public à destination des propriétaires pour les aider à rénover leurs biens","depth":0,"id":"P1C3-M052"},{"kind":"mesure","text":"Réduire l’impact écologique des travaux : développer l’écoconstruction avec des matériaux biosourcés et géosourcés (bois, terre, paille)","depth":0,"id":"P1C3-M053"},{"kind":"mesure","text":"Optimiser les usages de l’énergie dans tous les secteurs, notamment dans le tertiaire (extinction nocturne des bâtiments, équipements LED obligatoires) pour réduire la demande globale en énergie","depth":0,"id":"P1C3-M054"}]},{"title":"Rompre avec la maltraitance animale","depth":1,"path":["Rompre avec la maltraitance animale"],"blocks":[{"kind":"texte","text":"Le retour des zoonoses (Covid-19, grippe aviaire, rage) et la cruauté infligée aux animaux par notre modèle agricole productiviste sont liés. La lutte contre la maltraitance animale est un aspect central de la quête d’harmonie avec la nature. Rompre avec le système économique qui abaisse les êtres sensibles au rang de marchandises est un progrès pour l’humanité."},{"kind":"mesure_cle","text":"Interdire les fermes-usines","id":"P1C3-K06"},{"kind":"mesure","text":"Contre les émissions de GES et la maltraitance animale, réduire de 50 % notre consommation moyenne de protéines animales (viande, poisson, produits laitiers, œufs)","depth":0,"id":"P1C3-M055"},{"kind":"mesure","text":"Limiter les temps de transport des animaux vivants, puis en finir progressivement avec les exportations d’animaux vivants","depth":0,"id":"P1C3-M056"},{"kind":"mesure","text":"Créer un haut-commissariat dédié à la condition animale","depth":0,"id":"P1C3-M057"},{"kind":"mesure","text":"Prohiber les pratiques cruelles : élevage de poules et de lapins en batterie, broyage des oisillons, ablation de la queue, etc.","depth":0,"id":"P1C3-M058"},{"kind":"mesure","text":"Interdire le commerce de la fourrure et l’élevage d’animaux, même domestiques, à cette fin","depth":0,"id":"P1C3-M059"},{"kind":"mesure","text":"Déterminer de nouvelles normes pour améliorer les conditions d’élevage : accès à l’air libre, pâturage, densité, surface minimale","depth":0,"id":"P1C3-M060"},{"kind":"mesure","text":"Bannir l’utilisation des animaux à des fins scientifiques en orientant la recherche vers des méthodes non animales","depth":0,"id":"P1C3-M061"},{"kind":"mesure","text":"Interdire les pratiques de chasse, de pêche et de « loisirs » dès lors qu’elles sont cruelles pour les animaux (déterrage, chasse à courre, pêche au vif, corrida, exploitation des animaux sauvages dans les cirques et les delphinariums, etc.)","depth":0,"id":"P1C3-M062"},{"kind":"mesure","text":"Remplacer les zoos fermés où les animaux sont en captivité par des sanctuaires, lieux de découverte, de préservation d’espèces menacées et de recherche","depth":0,"id":"P1C3-M063"},{"kind":"mesure","text":"Instaurer un moratoire sur les élevages de saumons et interdire préventivement les élevages de céphalopodes avant qu’ils ne se développent en France","depth":0,"id":"P1C3-M064"}]},{"title":"Consommer autrement, organiser une France « zéro déchet »","depth":1,"path":["Consommer autrement, organiser une France « zéro déchet »"],"blocks":[{"kind":"texte","text":"La planète croule sous les déchets. À l’heure actuelle, nous ne pénalisons pas le mésusage des ressources, mais en privons ceux qui ne peuvent payer. Nous devons sortir du cercle vicieux qui consiste à produire plus pour consommer plus. Avec la « règle verte », nous changerons de logique. Préférons la société du réparable et du durable à celle de l’obsolescence programmée et du tout-jetable."},{"kind":"mesure_cle","text":"Structurer un service public du réemploi, avec la mise en place de formations pour certains métiers (électricité, électronique, bâtiment, textile)","id":"P1C3-K07"},{"kind":"mesure","text":"Organiser un maillage de mines urbaines, recycleries et ateliers de réparation dans tout le pays","depth":0,"id":"P1C3-M065"},{"kind":"mesure","text":"Abolir l’obsolescence programmée et allonger les durées de garantie légale des produits","depth":0,"id":"P1C3-M066"},{"kind":"mesure","text":"Interdire immédiatement et réellement les plastiques à usage unique et charger l’Agence de la transition écologique (ADEME) de contrôler la bonne application de cette loi","depth":0,"id":"P1C3-M067"},{"kind":"mesure","text":"Restaurer la consigne sur les bouteilles et bocaux en verre","depth":0,"id":"P1C3-M068"},{"kind":"mesure","text":"Rendre obligatoires le réemploi, le compostage individuel ou collectif, le recyclage (dans cet ordre de priorité), et généraliser, financer et accélérer la mise en place de filières de réemploi et de substitution aux matériaux d’origine fossile","depth":0,"id":"P1C3-M069"},{"kind":"mesure","text":"Imposer l’écoconception des produits afin de limiter l’utilisation de ressources non renouvelables, ainsi que des formations dédiées au low-tech et à l’écoconception dans toutes les écoles publiques d’ingénieurs et de design","depth":0,"id":"P1C3-M070"},{"kind":"mesure","text":"Généraliser l’indice de durabilité des produits (possibilité d’être réparé, durée minimale de vie, etc.) ; encadrer le prix des pièces de rechange et contraindre les fabricants à ce qu’elles soient disponibles à la vente ; empêcher la mise sur le marché de produits qui auraient un score de durabilité insuffisant","depth":0,"id":"P1C3-M071"},{"kind":"mesure","text":"Faire reculer la publicité dans l’espace public, interdire le dépôt de prospectus publicitaires commerciaux dans les boîtes aux lettres, ainsi que les panneaux publicitaires numériques","depth":0,"id":"P1C3-M072"},{"kind":"mesure","text":"Proscrire, sur tous types de supports, la publicité des produits et des services les plus émetteurs de GES et les plus générateurs de déchets","depth":0,"id":"P1C3-M073"},{"kind":"mesure","text":"Diminuer le temps de publicité à la télévision","depth":0,"id":"P1C3-M074"},{"kind":"mesure","text":"Interdire les mentions publicitaires mensongères comme les étiquettes « neutre en carbone », qui trompent les consommateurs et leur font croire à une absence d’impact sur le climat de certains produits","depth":0,"id":"P1C3-M075"},{"kind":"mesure","text":"Instaurer un moratoire sur les nouveaux projets d’incinérateurs de déchets et mettre en place un plan de lutte contre les pollutions de ces installations, notamment contre les polluants éternels (PFAS)","depth":0,"id":"P1C3-M076"},{"kind":"mesure","text":"Réorganiser les filières « responsabilité élargie du producteur », en donnant la priorité à la réduction des déchets","depth":0,"id":"P1C3-M077"}]},{"title":"Souveraineté alimentaire et révolution agricole : pour une agriculture écologique et paysanne","depth":1,"path":["Souveraineté alimentaire et révolution agricole : pour une agriculture écologique et paysanne"],"blocks":[{"kind":"texte","text":"La France n’est plus souveraine sur sa production alimentaire. Pour la première fois depuis très longtemps, elle est même en déficit agricole. La faute à un modèle promu par des choix politiques dictés par la seule recherche du profit. L’agrobusiness met à mal notre capacité à nous nourrir, détruit les écosystèmes et constitue un problème de santé publique. Les maux sont connus : pesticides, gigantisme agricole, soumission aux marchés financiers, destruction de l’emploi et des fermes. Il est temps d’engager la bifurcation agroécologique. Elle seule pourra permettre à la population de se nourrir et aux paysans de vivre dignement de leur travail."},{"kind":"mesure_cle","text":"Instaurer une agriculture relocalisée, diversifiée et écologique et créer 500 000 emplois agricoles","id":"P1C3-K08"},{"kind":"mesure","text":"Garantir des prix rémunérateurs aux producteurs en instaurant des prix planchers pour les agriculteurs, et créer une caisse de défaisance pour reprendre les dettes agricoles des exploitants qui se sont convertis au 100 % bio","depth":0,"id":"P1C3-M078"},{"kind":"mesure","text":"Garantir aux agricultrices et agriculteurs le droit à une retraite digne en engageant une réforme du système de protection sociale agricole","depth":0,"id":"P1C3-M079"},{"kind":"mesure","text":"Refondre la politique agricole commune (PAC) : orienter les aides publiques agricoles pour favoriser la production écologiquement soutenable, l’intensité en main-d’œuvre des exploitations et le développement des protéines végétales","depth":0,"id":"P1C3-M080"},{"kind":"mesure","text":"Conduire une réforme agraire pour encourager la création de nouvelles exploitations à taille humaine en renforçant les possibilités de préemption des terres en faveur de l’installation des nouveaux paysans","depth":0,"id":"P1C3-M081"},{"kind":"mesure","text":"Mettre en place un plan de protection généralisée du foncier agricole, forestier et naturel en vue de mettre en œuvre le « zéro artificialisation nette » (ZAN) des sols dans l’Hexagone","depth":0,"id":"P1C3-M082"},{"kind":"mesure","text":"Instaurer un protectionnisme écologique pour tenir compte des conditions de production : appliquer la « clause de sauvegarde » pour interdire l’importation de produits contrevenant aux normes sanitaires ou environnementales nationales, tout en fixant un prix minimum d’entrée pour lutter contre la concurrence déloyale","depth":0,"id":"P1C3-M083"},{"kind":"mesure","text":"Plafonner le prix des produits alimentaires en fixant des coefficients multiplicateurs et en encadrant les marges des industries agroalimentaires et de la grande distribution","depth":0,"id":"P1C3-M084"},{"kind":"mesure","text":"Développer les circuits courts pour réduire le transport des marchandises et le suremballage","depth":0,"id":"P1C3-M085"},{"kind":"mesure","text":"Protéger nos produits du terroir de la concurrence internationale en sanctuarisant les moyens d’action de l’Institut national de l’origine et de la qualité (INAO), qui délivre l’appellation d’origine protégée (AOP) et l’indication géographique protégée (IGP)","depth":0,"id":"P1C3-M086"}]}]},{"code":"P2-PRESENTATION","part":"Partie 2 – Une économie au service des besoins","title":"Présentation de la partie","url":"https://melenchon2027.fr/programme/livre/une-economie-au-service-des-besoins","sections":[{"title":"","depth":0,"path":[],"blocks":[{"kind":"texte","text":"Dans la société du tout-marché, une caste d’actionnaires se gave, pendant que le peuple se serre la ceinture. Les dividendes explosent, les factures des Français aussi. Il est temps de briser cette logique en mettant au pas la finance et en organisant la production pour qu’elle réponde aux besoins essentiels du plus grand nombre : se nourrir, se chauffer, se loger, se vêtir et se divertir. Le quotidien ne doit plus être marqué par le renoncement à des repas, à des sorties au cinéma ou à des vacances. L’heure est venue d’un nouveau collectivisme, d’une révolution fiscale et d’un pacte productif ambitieux."}]}]},{"code":"P2C1","part":"Partie 2 – Une économie au service des besoins","title":"Chapitre 1 : L’ère d’un nouveau collectivisme","url":"https://melenchon2027.fr/programme/livre/une-economie-au-service-des-besoins/chapitre1","sections":[{"title":"Mettre fin au pillage économique de la Nation","depth":1,"path":["Mettre fin au pillage économique de la Nation"],"blocks":[{"kind":"texte","text":"Infrastructures, services publics, fleurons industriels ou technologiques, industries de souveraineté : combien de privatisations à vil prix, de partenariats abusifs, d’ouvriers aux savoir-faire inestimables jetés dans la précarité ? Ces dernières années, de nombreux secteurs de l’économie française ont été les victimes de fonds financiers prédateurs. Ces biens publics nous appartiennent à tous. Pour l’intérêt général, ils doivent être protégés par la loi."},{"kind":"mesure_cle","text":"Revenir sur les privatisations (aéroports, autoroutes, Française des jeux, etc.)","id":"P2C1-K01"},{"kind":"mesure","text":"Rendre effectif le droit de réquisition des usines et entreprises d’intérêt général par l’État","depth":0,"id":"P2C1-M001"},{"kind":"mesure","text":"Décréter un moratoire sur les partenariats public-privé (PPP), auditer ceux en cours et abroger les dispositions législatives les permettant","depth":0,"id":"P2C1-M002"},{"kind":"mesure","text":"Poursuivre les atteintes au patrimoine industriel français relevant des « intérêts fondamentaux de la Nation », comme le prévoit le Code pénal","depth":0,"id":"P2C1-M003"},{"kind":"mesure","text":"Constituer des pôles publics dans les secteurs stratégiques : médicament, transports et mobilité, banque et assurance, énergie, armement, mines, satellite","depth":0,"id":"P2C1-M004"}]},{"title":"Collectiviser les biens communs fondamentaux","depth":1,"path":["Collectiviser les biens communs fondamentaux"],"blocks":[{"kind":"texte","text":"Une minorité veut vendre au marché jusqu’aux biens les plus essentiels à la survie humaine. L’intérêt général humain exige de protéger dans la loi ces biens communs de l’humanité. C’est au peuple de contrôler démocratiquement leurs usages et d’assurer leur protection. L’eau et l’air, qui permettent la vie, doivent être collectivisés."},{"kind":"mesure_cle","text":"Empêcher le droit de propriété privée de prévaloir sur la protection de l’eau, de l’air, de l’alimentation, du vivant, de la forêt, de la santé et de l’énergie","id":"P2C1-K02"},{"kind":"mesure","text":"Créer un Défenseur des biens communs, chargé de produire un rapport annuel public sur leur état","depth":0,"id":"P2C1-M005"},{"kind":"mesure","text":"Établir dans la Constitution de la 6e République la liste des biens communs et services essentiels à gérer collectivement","depth":0,"id":"P2C1-M006"},{"kind":"mesure","text":"Garantir un accès respectueux à la nature pour tous, en rétablissant un plein accès aux sentiers balisés, restreint par les macronistes","depth":0,"id":"P2C1-M007"}]},{"title":"Reconnaître la citoyenneté dans l’entreprise et des droits nouveaux pour les salariés","depth":1,"path":["Reconnaître la citoyenneté dans l’entreprise et des droits nouveaux pour les salariés"],"blocks":[{"kind":"texte","text":"La 6e République de la Nouvelle France rompra l’état de servitude dans lequel nous sommes maintenus dans les entreprises. La démocratie ne doit pas s’arrêter aux portes des seules institutions politiques. Elle doit également s’imposer à l’économie, et nous ferons tout pour que les citoyens, maîtres dans la cité, le soient aussi sur leur lieu de travail."},{"kind":"mesure_cle","text":"Créer un droit de préemption pour permettre aux salariés de reprendre leur entreprise sous la forme d’une coopérative","id":"P2C1-K03"},{"kind":"mesure","text":"Accorder aux comités d’entreprise un
