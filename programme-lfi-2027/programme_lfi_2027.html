oire de centres de protection maternelle et infantile (PMI) et de lieux ressources pour les parents ; renforcer leurs moyens humains et financiers, afin de développer l’accompagnement à la périnatalité et à la parentalité","depth":0,"id":"P3C3-M022"},{"kind":"mesure","text":"Geler les ouvertures de places du secteur privé lucratif et réorienter les financements vers l’ouverture de places dans le public par l’interdiction des aides publiques aux crèches privées lucratives","depth":0,"id":"P3C3-M023"},{"kind":"mesure","text":"Garantir à chaque jeune enfant une place d’accueil adaptée à ses besoins, avec un accompagnement de qualité, des effectifs réduits et un accès à un espace extérieur réellement végétalisé","depth":0,"id":"P3C3-M024"},{"kind":"mesure","text":"Répondre à la pénurie de professionnelles qualifiées par l’augmentation des salaires et des moyens globaux dédiés à la petite enfance, valoriser ces métiers et offrir des possibilités d’évolution de carrière","depth":0,"id":"P3C3-M025"},{"kind":"mesure","text":"Renforcer la formation initiale et continue des professionnelles, en particulier sur le développement affectif et relationnel de l’enfant, le respect de son intégrité physique et psychique, la prévention des violences, ainsi que l’accompagnement à la parentalité","depth":0,"id":"P3C3-M026"},{"kind":"mesure","text":"Fixer des normes d’encadrement plus ambitieuses pour aller vers un ratio moyen d’encadrement de 5 enfants d’âges mélangés par adulte","depth":0,"id":"P3C3-M027"}]}]},{"code":"P3C4","part":"Partie 3 – Mettre en sécurité sociale","title":"Chapitre 4 : Faire triompher l’égalité contre le racisme et les discriminations","url":"https://melenchon2027.fr/programme/livre/mettre-en-securite-sociale/chapitre4","sections":[{"title":"Éradiquer les agressions racistes","depth":1,"path":["Éradiquer les agressions racistes"],"blocks":[{"kind":"texte","text":"La vie républicaine réclame l’unité du peuple. Aujourd’hui, et depuis longtemps, elle est défigurée par le racisme. Loin d’être un phénomène strictement culturel ou symbolique, celui-ci relève avant tout d’un système de domination matérielle. Emploi, logement, éducation, sûreté, dignité : tous les aspects de l’existence sont traversés par le racisme. Y mettre fin est la condition sine qua non pour une vie meilleure.","md":"La vie républicaine réclame l’unité du peuple. Aujourd’hui, et depuis longtemps, elle est défigurée par le racisme. Loin d’être un phénomène strictement culturel ou symbolique, celui-ci relève avant tout d’un système de domination matérielle. Emploi, logement, éducation, sûreté, dignité : tous les aspects de l’existence sont traversés par le racisme. Y mettre fin est la condition *sine qua non* pour une vie meilleure."},{"kind":"mesure_cle","text":"Mettre en œuvre un plan d’action pour analyser, prévenir et lutter contre l’islamophobie, l’antisémitisme et toutes les formes de racisme et y allouer le milliard de budget nécessaire","id":"P3C4-K01"},{"kind":"mesure","text":"Créer un commissariat à l’égalité doté d’un observatoire des discriminations pour coordonner les politiques publiques de lutte contre les racismes","depth":0,"id":"P3C4-M001"},{"kind":"mesure","text":"Assurer la sécurité des lieux cultuels et culturels de notre pays en renforçant, si nécessaire, toutes les mesures de protection policières dont ils bénéficient, du fait des attaques et menaces contre des mosquées et des synagogues","depth":0,"id":"P3C4-M002"},{"kind":"mesure","text":"Généraliser les campagnes de testing, pouvant donner lieu à des sanctions en cas de pratiques discriminatoires avérées","depth":0,"id":"P3C4-M003"},{"kind":"mesure","text":"Expérimenter les dossiers anonymes dans l’accès à l’emploi, au logement, aux études supérieures, etc.","depth":0,"id":"P3C4-M004"},{"kind":"mesure","text":"Créer un organisme indépendant dédié à la lutte contre les complotismes et contre les haines antisémites et islamophobes en ligne, placé sous l’égide de l’Autorité de régulation de la communication audiovisuelle et numérique (Arcom), dont l’objectif sera notamment d’accompagner les victimes dans leurs démarches","depth":0,"id":"P3C4-M005"},{"kind":"mesure","text":"Mettre en place des règles contre les biais discriminatoires des intelligences artificielles et des technologies médicales, notamment sur la qualité des ensembles de données d’entraînement et les procédures d’essai pour la détection et la correction desdits biais","depth":0,"id":"P3C4-M006"},{"kind":"mesure","text":"Reconnaître officiellement le traumatisme psychique conséquent au vécu raciste, et permettre aux victimes de bénéficier d’une prise en charge et d’une réparation intégrale effective","depth":0,"id":"P3C4-M007"},{"kind":"mesure","text":"Renforcer la lutte contre toutes les discriminations et garantir l’égalité réelle dans l’emploi en renforçant la formation et les moyens de contrôle","depth":0,"id":"P3C4-M008"},{"kind":"mesure","text":"Renforcer les sanctions financières et pénales à l’encontre des entreprises ayant des pratiques discriminatoires, allant jusqu’au refus d’attribution de marchés publics","depth":0,"id":"P3C4-M009"}]},{"title":"Faire France de tout bois","depth":1,"path":["Faire France de tout bois"],"blocks":[{"kind":"texte","text":"La France ne se définit ni par une couleur de peau, ni par une religion, ni même par une langue. Ceux qui naissent en France sont légitimes à devenir Français : c’est le droit du sol, qui existe en France depuis 1515 ! Ces dernières années, ce droit a cependant été détricoté. Il faudra le rétablir, et en finir avec les situations qui créent des catégories de « sous-citoyens »."},{"kind":"mesure_cle","text":"Garantir le droit du sol intégral à tous les enfants nés en France, le rétablir sur l’ensemble du territoire national et faciliter l’accès à la nationalité française","id":"P3C4-K02"},{"kind":"mesure","text":"Abroger les mesures liberticides de la loi dite « contre le séparatisme » et le contrat d’engagement républicain","depth":0,"id":"P3C4-M010"},{"kind":"mesure","text":"Instituer le droit de vote des étrangers aux élections locales","depth":0,"id":"P3C4-M011"}]},{"title":"Décoloniser les mentalités","depth":1,"path":["Décoloniser les mentalités"],"blocks":[{"kind":"texte","text":"La colonisation est un crime. La Nouvelle France s’identifie aux luttes d’émancipation de celles et ceux qui y ont mis fin. Dans notre mémoire collective, ce sont eux que nous devons célébrer et non les maîtres colons."},{"kind":"mesure_cle","text":"Instaurer le 4 février comme jour férié national en mémoire des victimes de l’esclavage et de leurs luttes s’ajoutant au jour de commémoration spécifique à chaque territoire d’Outre-mer","id":"P3C4-K03"},{"kind":"mesure","text":"Développer de manière pluridisciplinaire la recherche universitaire, la formation des enseignants et le contenu des programmes et manuels scolaires sur l’histoire de l’esclavage, de la colonisation et de l’immigration","depth":0,"id":"P3C4-M012"},{"kind":"mesure","text":"Ouvrir les archives sur les guerres de décolonisation, être ouvert à la discussion quant aux demandes de restitution et de circulation des biens culturels issus de la colonisation","depth":0,"id":"P3C4-M013"},{"kind":"mesure","text":"Reconnaître le massacre des Algériens du 17 octobre 1961 comme un crime d’État au cours d’une journée nationale de commémoration","depth":0,"id":"P3C4-M014"},{"kind":"mesure","text":"Instaurer le 2 août comme journée de commémoration du génocide des Roms, des Manouches, des Sinti, des Gitans, des Yéniches et des Voyageurs","depth":0,"id":"P3C4-M015"},{"kind":"mesure","text":"Créer une commission d’enquête sur le massacre des tirailleurs sénégalais à Thiaroye le 1er décembre 1944","depth":0,"id":"P3C4-M016"}]},{"title":"Organiser la formation des fonctionnaires au contact du public et créer un brevet obligatoire pour les policiers","depth":1,"path":["Organiser la formation des fonctionnaires au contact du public et créer un brevet obligatoire pour les policiers"],"blocks":[{"kind":"texte","text":"L’universalité des droits n’est pas négociable en république. Pourtant, les personnes racisées et immigrées sont les plus exposées aux discriminations dans l’accès aux services publics. Et, quand elles sont victimes d’actes racistes, peu d’entre elles osent porter plainte, anxieuses à l’idée de l’accueil qui pourrait leur être réservé. Les associations de défense des droits humains alertent depuis des années sur le racisme au sein de la police française. Les services publics font ainsi face à un défi de taille : faire de l’égalité, principe inscrit dans le droit, une réalité vécue par toutes et tous."},{"kind":"mesure_cle","text":"Mettre en place le récépissé de contrôle d’identité par les agents de police et la gendarmerie pour lutter contre le contrôle au faciès, accompagné de dispositifs de formation, de contrôle et de sanctions","id":"P3C4-K04"},{"kind":"mesure","text":"Former massivement les fonctionnaires au contact du public, notamment au sein de la police, la justice et la santé, à la reconnaissance et à la lutte contre toutes les formes de racisme","depth":0,"id":"P3C4-M017"},{"kind":"mesure","text":"Homologuer la formation à la lutte contre les discriminations par un brevet obligatoire pour les policiers","depth":0,"id":"P3C4-M018"},{"kind":"mesure","text":"Établir un plan de prévention et de lutte contre les dérives racistes au sein des effectifs de police et de gendarmerie afin de garantir la neutralité républicaine des forces de sécurité","depth":0,"id":"P3C4-M019"},{"kind":"mesure","text":"Instaurer des pôles spécialisés au sein des services publics et des cours d’appel","depth":0,"id":"P3C4-M020"},{"kind":"mesure","text":"Abroger les amendes forfaitaires délictuelles, qui remplacent les procès par des jugements arbitraires immédiats des policiers","depth":0,"id":"P3C4-M021"},{"kind":"mesure","text":"Créer un référent discriminations dans chaque hôpital et développer l’interprétariat médical public","depth":0,"id":"P3C4-M022"}]}]},{"code":"P4-PRESENTATION","part":"Partie 4 – Le goût du futur : aux nouvelles frontières de l’humanité","title":"Présentation de la partie","url":"https://melenchon2027.fr/programme/livre/le-gout-du-futur-aux-nouvelles-frontieres-de-l-humanite","sections":[{"title":"","depth":0,"path":[],"blocks":[{"kind":"texte","text":"Le futur vers lequel nous avançons est incertain. Les événements climatiques qui s’annoncent sont en partie imprévisibles, tant parfois ils dépassent les prévisions des scientifiques. Nous refusons d’y voir un motif de fatalisme ou de résignation à un avenir sombre, où le progrès serait synonyme d’une illusion du siècle dernier. Au contraire, ces événements sont l’occasion de protéger nos biens communs, tout en nous portant aux nouvelles frontières de l’humanité : la mer, le numérique, l’espace et la santé. Dans ces quatre domaines, la France ne manque pas d’atouts. Nous pouvons proposer à l’humanité tout entière plus de connaissances, plus de science, plus de prouesses de l’esprit humain, débarrassé de l’obsession mortifère pour le profit. Nous y arriverons en élevant le niveau d’instruction de toutes et tous et en humanisant par la culture et le sport. Voilà le progrès auquel nous aspirons."}]}]},{"code":"P4C1","part":"Partie 4 – Le goût du futur : aux nouvelles frontières de l’humanité","title":"Chapitre 1 : Les nouveaux droits de l’espèce : protéger les biens communs","url":"https://melenchon2027.fr/programme/livre/le-gout-du-futur-aux-nouvelles-frontieres-de-l-humanite/chapitre1","sections":[{"title":"Pollutions : désempoisonner le monde","depth":1,"path":["Pollutions : désempoisonner le monde"],"blocks":[{"kind":"texte","text":"L’empoisonnement du monde est global. L’air, l’eau et les sols sont contaminés par toutes sortes de pollutions plastiques, chimiques, industrielles. Les plus riches polluent le plus. Mais ce sont les plus pauvres qui subissent davantage les conséquences de cet empoisonnement, au premier rang desquelles les nouvelles maladies politiques. Un plan de dépollution national et international s’impose."},{"kind":"mesure_cle","text":"Aider les victimes des pollutions et les lanceurs d’alerte grâce à un fonds abondé par les consommations polluantes","id":"P4C1-K01"},{"kind":"mesure","text":"Redonner à l’État et aux collectivités locales les moyens humains et financiers d’appliquer le triptyque « surveiller, contrôler, sanctionner » et réguler le libre marché","depth":0,"id":"P4C1-M001"},{"kind":"mesure","text":"Revenir sur l’affaiblissement des normes environnementales et des mécanismes de participation publique décidés lors du précédent quinquennat (décrets permettant aux préfets de déroger aux normes environnementales, par exemple)","depth":0,"id":"P4C1-M002"},{"kind":"mesure","text":"Planifier la réduction progressive des doses d’engrais et de pesticides, interdire immédiatement les plus dangereux (glyphosate, néonicotinoïdes) et l’importation de productions qui en contiennent","depth":0,"id":"P4C1-M003"},{"kind":"mesure","text":"Établir un plan d’urgence pour la dépollution rapide des régions durablement polluées en France, dont en priorité la Guadeloupe et la Martinique, victimes du chlordécone","depth":0,"id":"P4C1-M004"},{"kind":"mesure","text":"Prendre en charge et indemniser les victimes, y compris indirectes, des essais nucléaires français et reconnaître leurs dommages environnementaux, en particulier en Polynésie","depth":0,"id":"P4C1-M005"},{"kind":"mesure","text":"Gérer les risques industriels avec la création d’une autorité de sûreté des risques industriels indépendante, augmenter le nombre d’inspecteurs des installations classées pour la protection de l’environnement (ICPE) et renforcer les sanctions en cas de non-­respect de la réglementation","depth":0,"id":"P4C1-M006"},{"kind":"mesure","text":"Créer un centre national de régénération des charbons actifs destinés à la destruction des PFAS dans l’eau","depth":0,"id":"P4C1-M007"},{"kind":"mesure","text":"Lutter contre le cadmium dans les engrais et dans l’alimentation, lancer un plan de réduction de la pollution déjà présente et prendre en charge un réel suivi médical pour les personnes exposées","depth":0,"id":"P4C1-M008"},{"kind":"mesure","text":"En Guadeloupe et en Martinique, reconnaître le statut de crise sanitaire et écologique concernant l’eau potable et son assainissement, la contamination au chlordécone et les effets cocktails avec d’autres substances dont les conséquences sont inconnues","depth":0,"id":"P4C1-M009"},{"kind":"mesure","text":"Instaurer une zone tampon pour protéger les enfants des pesticides et polluants autour des habitations, des crèches, des écoles et des hôpitaux","depth":0,"id":"P4C1-M010"}]},{"title":"L’eau, enjeu central pour l’humanité","depth":1,"path":["L’eau, enjeu central pour l’humanité"],"blocks":[{"kind":"texte","text":"L’eau est le grand défi commun de l’humanité. C’est une urgence écologique de mettre fin au cercle vicieux suivant : le cycle de l’eau est perturbé par le réchauffement climatique et cette perturbation aggrave en retour le changement climatique. L’eau douce disponible devient de plus en plus rare. C’est aussi une urgence sociale. Car des centaines de milliers de Français, les Ultramarins en première ligne, subissent des coupures d’eau et voient leur eau polluée. Les inondations deviennent une menace récurrente. Garantir le droit d’accès à l’eau et à l’assainissement par une gestion publique est une priorité."},{"kind":"mesure_cle","text":"Consacrer une « règle bleue » sur le principe de la « règle verte » : ne pas prélever, ni transformer, ni polluer le cycle de l’eau au-delà de ce que la nature peut reconstituer","id":"P4C1-K02"},{"kind":"mesure","text":"Inscrire que l’eau est un commun et la protection de l’ensemble de son cycle, y compris les nappes phréatiques, les rivières et les fleuves, dans la Constitution, ainsi que le droit à l’eau salubre, à l’assainissement de qualité et à l’hygiène","depth":0,"id":"P4C1-M011"},{"kind":"mesure","text":"Créer un haut-commissariat à l’eau, incluant une instance scientifique indépendante en lien étroit avec les éco-régions","depth":0,"id":"P4C1-M012"},{"kind":"mesure","text":"Multiplier au moins par trois les effectifs de la police de l’eau et des inspecteurs de l’environnement, étendre leurs missions au contrôle de tout le cycle et garantir leur autonomie face aux préfets et au ministère de l’Agriculture","depth":0,"id":"P4C1-M013"},{"kind":"mesure","text":"Organiser la gestion publique autour de régies locales d’eau potable et d’assainissement, ouvertes avec voix délibérative aux habitantes et habitants et aux salariés","depth":0,"id":"P4C1-M014"},{"kind":"mesure","text":"Établir une tarification juste : gratuité des mètres cubes indispensables à une vie digne, suppression de l’abonnement, tarification progressive et différenciée selon les usages, fin des tarifs dégressifs","depth":0,"id":"P4C1-M015"},{"kind":"mesure","text":"Garantir l’accès de tous à l’eau, par la fin des coupures illégales et un maillage de fontaines, douches et sanitaires publics gratuits","depth":0,"id":"P4C1-M016"},{"kind":"mesure","text":"Garantir une eau de bonne qualité au robinet en analysant systématiquement les pollutions (PFAS, pesticides, microplastiques et résidus médicamenteux) dans toutes les eaux, en imposant des seuils plus stricts","depth":0,"id":"P4C1-M017"},{"kind":"mesure","text":"Sanctuariser la ressource en eau en instaurant un moratoire immédiat sur les méga-bassines et en en finissant avec l’accaparement de l’eau","depth":0,"id":"P4C1-M018"},{"kind":"mesure","text":"Planifier la sortie des PFAS en mettant fin à la fabrication, à l’importation et à la vente de produits qui en contiennent","depth":0,"id":"P4C1-M019"}]},{"title":"Défendre la forêt, poumon de la planète et premier réservoir de la biodiversité terrestre","depth":1,"path":["Défendre la forêt, poumon de la planète et premier réservoir de la biodiversité terrestre"],"blocks":[{"kind":"texte","text":"La forêt couvre un tiers du territoire hexagonal et environ 85 % des territoires ultramarins. Pourtant, la forêt française va mal. Sa capacité à absorber du carbone diminue. La mortalité des arbres a augmenté de 125 % en dix ans. Les sécheresses et les méga-feux progressent. Les dynamiques de marchandisation à outrance imposent toujours plus de coupes rases. Les forêts constituent pourtant un atout naturel stratégique pour la Nation, remplissant trois fonctions, environnementale, sociale et économique. Pour qu’elles le restent, il faut s’opposer à l’industrialisation et à la marchandisation de la forêt. Nous devons aussi redonner une place centrale aux services de l’État, et protéger ceux qui s’en occupent au quotidien, tels les agents de l’Office national des forêts (ONF). Le développement d’une filière bois française soutenable et créatrice d’emplois est possible."},{"kind":"mesure_cle","text":"Interdire les coupes rases, sauf en cas d’impasse sanitaire avérée","id":"P4C1-K03"},{"kind":"mesure","text":"Interdire l’installation de photovoltaïque et d’éolien exigeant des coupes rases","depth":0,"id":"P4C1-M020"},{"kind":"mesure","text":"Intégrer pleinement les objectifs climatiques et de biodiversité dans les politiques forestières","depth":0,"id":"P4C1-M021"},{"kind":"mesure","text":"Augmenter les moyens humains et financiers de l’ONF et stopper sa privatisation pour lui permettre d’assurer ses missions, y compris d’accueil du public","depth":0,"id":"P4C1-M022"},{"kind":"mesure","text":"Renforcer les moyens humains et matériels de lutte contre les feux de forêt","depth":0,"id":"P4C1-M023"},{"kind":"mesure","text":"Améliorer les conditions de travail en forêt : interdire le travail détaché, garantir une juste répartition de la valeur dans la filière forêt-bois, reconnaître la pénibilité et les maladies professionnelles, augmenter les salaires des forestiers et préserver le droit à la retraite anticipée","depth":0,"id":"P4C1-M024"},{"kind":"mesure","text":"Augmenter la part des forêts publiques, notamment par l’extension du droit de préemption publique avec des budgets suffisants, et réhabiliter les communs forestiers","depth":0,"id":"P4C1-M025"},{"kind":"mesure","text":"Conditionner les aides publiques à une gestion forestière adaptée au changement climatique, visant l’augmentation des puits de carbone et la préservation d’écosystèmes forestiers variés","depth":0,"id":"P4C1-M026"},{"kind":"mesure","text":"Limiter la taille des engins forestiers et interdire le dessouchage pour préserver les sols forestiers, leur fonction de puits carbone et la biodiversité","depth":0,"id":"P4C1-M027"},{"kind":"mesure","text":"Prioriser la régénération naturelle et favoriser la diversité en essences et en âges pour rendre les forêts résilientes au changement climatique","depth":0,"id":"P4C1-M028"},{"kind":"mesure","text":"Rétablir un maillage de scieries et d’entreprises de transformation du bois en développant les circuits courts","depth":0,"id":"P4C1-M029"},{"kind":"mesure","text":"Adapter et développer l’offre de formation professionnelle publique à la connaissance des écosystèmes et à l’emploi des essences locales","depth":0,"id":"P4C1-M030"},{"kind":"mesure","text":"Stopper les projets industriels de production d’énergie bois et mettre en place une hiérarchisation des usages : le bois d’œuvre d’abord, l’énergie en dernier recours","depth":0,"id":"P4C1-M031"},{"kind":"mesure","text":"Laisser vieillir les forêts et réserver au moins 25 % de la surface de la forêt française en libre évolution","depth":0,"id":"P4C1-M032"},{"kind":"mesure","text":"Rompre avec les accords internationaux qui augmentent la déforestation et industrialisent la forêt : Mercosur, crédits compensation carbone, etc.","depth":0,"id":"P4C1-M033"},{"kind":"mesure","text":"Relocaliser la transformation du bois en encadrant son achat et sa vente à l’étranger","depth":0,"id":"P4C1-M034"},{"kind":"mesure","text":"Bannir de la commande publique et privée les produits liés à la déforestation","depth":0,"id":"P4C1-M035"},{"kind":"mesure","text":"Accroître la coopération internationale afin de lutter contre les pratiques illégales qui détruisent les forêts (trafic de bois, orpaillage et mines)","depth":0,"id":"P4C1-M036"}]},{"title":"Réparer l’écosystème et la biodiversité","depth":1,"path":["Réparer l’écosystème et la biodiversité"],"blocks":[{"kind":"texte","text":"L’activité humaine est responsable de la sixième extinction de masse. La biodiversité recule à cause de la transformation des usages des sols (intensification agricole, déforestation, urbanisation), du changement climatique et des pollutions. Sa préservation se joue au niveau international par la création de normes communes et contraignantes. Elle se joue aussi à l’échelle nationale : la France doit montrer l’exemple."},{"kind":"mesure_cle","text":"Interdire les dépôts de brevets sur des organismes vivants pour empêcher l’appropriation d’espèces animales et végétales par des entreprises privées","id":"P4C1-K04"},{"kind":"mesure","text":"Refuser les organismes génétiquement modifiés (OGM et nouvelles techniques génomiques), mettre fin aux accords commerciaux internationaux dont les conséquences affectent le climat et la biodiversité","depth":0,"id":"P4C1-M037"},{"kind":"mesure","text":"Soutenir les accords internationaux organisant la gestion des biens communs planétaires (traité sur la haute mer, moratoire sur l’exploitation minière des grands fonds marins, traité sur l’interdiction des plastiques)","depth":0,"id":"P4C1-M038"},{"kind":"mesure","text":"Organiser un ambitieux plan national de restauration des écosystèmes pour assurer la conservation de la biodiversité, le stockage du carbone, et l’adaptation au changement climatique","depth":0,"id":"P4C1-M039"}]}]},{"code":"P4C2","part":"Partie 4 – Le goût du futur : aux nouvelles frontières de l’humanité","title":"Chapitre 2 : Élever le niveau d’éducation et de savoirs","url":"https://melenchon2027.fr/programme/livre/le-gout-du-futur-aux-nouvelles-frontieres-de-l-humanite/chapitre2","sections":[{"title":"Éradiquer l’illettrisme et développer l’alphabétisation","depth":1,"path":["Éradiquer l’illettrisme et développer l’alphabétisation"],"blocks":[{"kind":"texte","text":"Les difficultés de lecture touchent un adulte sur dix, les empêchant d’être autonomes dans la vie quotidienne. C’est près de 4 millions de personnes dans l’Hexagone : un tiers vit dans les espaces ruraux et six sur dix sont des femmes. En Outre-mer, 25 % des personnes sont concernées. De plus en plus de démarches s’effectuant uniquement en ligne, les personnes illettrées perdent peu à peu l’accès à leurs droits et ne parviennent même plus à régler leurs factures ou à se déplacer. Nous voulons éradiquer enfin l’illettrisme."},{"kind":"mesure_cle","text":"Éradiquer l’illettrisme pour les jeunes sortis du système scolaire et les adultes à l’horizon 2032","id":"P4C2-K01"},{"kind":"mesure","text":"Développer les structures d’alphabétisation et les cours de langue française pour les personnes non francophones","depth":0,"id":"P4C2-M001"},{"kind":"mesure","text":"Créer un service public de lutte contre l’illettrisme et l’illectronisme et soutenir les programmes associatifs d’accompagnement","depth":0,"id":"P4C2-M002"},{"kind":"mesure","text":"Proposer une formation gratuite aux personnes en situation d’illettrisme","depth":0,"id":"P4C2-M003"},{"kind":"mesure","text":"Mener de grandes campagnes d’information et de sensibilisation à l’illettrisme chaque année, former les agents des services publics à sa détection","depth":0,"id":"P4C2-M004"},{"kind":"mesure","text":"Séparer clairement les dispositifs destinés aux personnes en situation d’illettrisme de ceux destinés aux personnes allophones pour orienter chacun vers la formation qui lui correspond","depth":0,"id":"P4C2-M005"}]},{"title":"Reconstruire une école globale pour l’égalité et l’émancipation","depth":1,"path":["Reconstruire une école globale pour l’égalité et l’émancipation"],"blocks":[{"kind":"texte","text":"Une des grandes conquêtes sociales du siècle passé aura été d’arracher les enfants aux violences de l’usine pour les accueillir à l’école publique. Mais l’école publique, laïque et gratuite, qui est une des clés du progrès social et humain, sort terriblement affaiblie d’une vingtaine d’années marquées par des politiques destructrices. Il faut reconstruire l’école de l’égalité et de l’émancipation, une école dans laquelle tous les élèves sont capables d’apprendre, et qui œuvre à la bifurcation écologique et à la 6e République. Pas de Nouvelle France sans école globale."},{"kind":"mesure_cle","text":"Assurer la gratuité réelle de l’éducation publique, y compris de la cantine, du transport, des activités périscolaires, des manuels et des fournitures","id":"P4C2-K02"},{"kind":"mesure","text":"Reconstruire l’école publique :","depth":0,"id":"P4C2-M006"},{"kind":"sous_mesure","text":"Réduire partout les effectifs par classe pour faire mieux que la moyenne européenne de 19 élèves par classe en donnant la priorité aux maternelles et aux classes des actuels réseaux d’éducation prioritaire (REP)","depth":1,"id":"P4C2-S001","parent":"P4C2-M006"},{"kind":"sous_mesure","text":"Reconstituer les viviers de professeurs remplaçants, afin de mettre un terme au scandale des 15 millions d’heures de cours non assurées chaque année par manque d’enseignants","depth":1,"id":"P4C2-S002","parent":"P4C2-M006"},{"kind":"sous_mesure","text":"Étendre la scolarité obligatoire à 18 ans","depth":1,"id":"P4C2-S003","parent":"P4C2-M006"},{"kind":"sous_mesure","text":"Mettre en place une véritable politique d’éducation prioritaire en refondant la carte de l’éducation prioritaire en fonction des besoins","depth":1,"id":"P4C2-S004","parent":"P4C2-M006"},{"kind":"sous_mesure","text":"Construire un service public national du périscolaire, en lien avec les communes, fondé sur la gratuité, animé par des personnels formés, titulaires de la fonction publique","depth":1,"id":"P4C2-S005","parent":"P4C2-M006"},{"kind":"mesure","text":"Tourner la page du désastre macroniste :","depth":0,"id":"P4C2-M007"},{"kind":"sous_mesure","text":"Abroger le « choc des savoirs »","depth":1,"id":"P4C2-S006","parent":"P4C2-M007"},{"kind":"sous_mesure","text":"Mettre fin au « pacte enseignant »","depth":1,"id":"P4C2-S007","parent":"P4C2-M007"},{"kind":"sous_mesure","text":"Rétablir le diplôme national du baccalauréat, abroger les contre-réformes du lycée, de la voie professionnelle et du collège","depth":1,"id":"P4C2-S008","parent":"P4C2-M007"},{"kind":"sous_mesure","text":"Mettre fin à l’expérimentation de l’uniforme","depth":1,"id":"P4C2-S009","parent":"P4C2-M007"},{"kind":"sous_mesure","text":"Sortir du tout numérique pour un usage raisonné et réfléchi de cet outil, consacrer un droit à la déconnexion des élèves et des personnels","depth":1,"id":"P4C2-S010","parent":"P4C2-M007"},{"kind":"mesure","text":"L’égalité pour toutes et tous :","depth":0,"id":"P4C2-M008"},{"kind":"sous_mesure","text":"Instaurer une nouvelle version de la carte scolaire pour lutter contre la ségrégation socio-scolaire","depth":1,"id":"P4C2-S011","parent":"P4C2-M008"},{"kind":"sous_mesure","text":"Assurer un égal accès aux diverses options et langues, de l’école élémentaire au lycée","depth":1,"id":"P4C2-S012","parent":"P4C2-M008"},{"kind":"sous_mesure","text":"Construire et maintenir des écoles, collèges et lycées publics à taille humaine, afin de garantir l’accès à une école publique à moins de 15 minutes du domicile, et investir dans les équipements sportifs scolaires","depth":1,"id":"P4C2-S013","parent":"P4C2-M008"},{"kind":"sous_mesure","text":"Renforcer l’éducation à l’égalité, contre le sexisme et les discriminations, dans les programmes scolaires","depth":1,"id":"P4C2-S014","parent":"P4C2-M008"},{"kind":"sous_mesure","text":"Intégrer l’enjeu écologique dans les programmes de la maternelle au lycée et introduire de nouveaux enseignements pratiques","depth":1,"id":"P4C2-S015","parent":"P4C2-M008"},{"kind":"sous_mesure","text":"Permettre à toutes les familles d’accéder gratuitement aux dispositifs de type « devoirs faits », de l’école au lycée","depth":1,"id":"P4C2-S016","parent":"P4C2-M008"},{"kind":"sous_mesure","text":"Introduire le droit à la seconde chance en matière d’orientation","depth":1,"id":"P4C2-S017","parent":"P4C2-M008"},{"kind":"mesure","text":"Refonder la relation entre l’État et les établissements privés sous contrat :","depth":0,"id":"P4C2-M009"},{"kind":"sous_mesure","text":"Renforcer le contrôle et le pilotage publics des établissements privés sous contrat en refusant tout intermédiaire dans le dialogue entre ces derniers et l’État","depth":1,"id":"P4C2-S018","parent":"P4C2-M009"},{"kind":"sous_mesure","text":"Abolir les privilèges de l’enseignement privé en interdisant les subventions d’investissement facultatives des collectivités et en abrogeant la loi dite « Carle »","depth":1,"id":"P4C2-S019","parent":"P4C2-M009"},{"kind":"sous_mesure","text":"Appliquer un malus au financement public des établissements privés sous contrat contribuant à la ségrégation socio-scolaire","depth":1,"id":"P4C2-S020","parent":"P4C2-M009"}]},{"title":"Disposer d’une communauté éducative complète et solide","depth":1,"path":["Disposer d’une communauté éducative complète et solide"],"blocks":[{"kind":"texte","text":"Sous Macron, les ministres de l’Éducation se sont succédé à un rythme effréné – pas moins de huit depuis 2017. Ils ont concentré leurs attaques contre le service public de l’éducation et ses fondements en le livrant au marché. La précarité des personnels se généralise, alors que la protection des élèves suppose des équipes stables aux compétences reconnues. L’école doit aussi permettre aux élèves de s’investir dans des missions d’intérêt général et de se préparer à devenir des citoyens."},{"kind":"mesure_cle","text":"Rattraper le gel du point d’indice depuis 2010 et revaloriser les grilles salariales en engageant une négociation avec les organisations syndicales","id":"P4C2-K03"},{"kind":"mesure","text":"Protéger les élèves :","depth":0,"id":"P4C2-M010"},{"kind":"sous_mesure","text":"Renforcer partout les effectifs de la vie scolaire (assistants d’éducation, assistants pédagogiques, conseillers principaux d’éducation) et des personnels sociaux et de santé (médecins et infirmières, psychologues scolaires, assistantes sociales), notamment pour lutter contre le harcèlement","depth":1,"id":"P4C2-S021","parent":"P4C2-M010"},{"kind":"sous_mesure","text":"Former l’ensemble des personnels scolaires et périscolaires à la prévention et à la détection de toutes les formes de violences contre les enfants et du harcèlement scolaire","depth":1,"id":"P4C2-S022","parent":"P4C2-M010"},{"kind":"sous_mesure","text":"Supprimer les stages obligatoires en classes de troisième et de seconde, sans suivi pédagogique, facteurs de discriminations et sans garantie pour la sécurité des élèves","depth":1,"id":"P4C2-S023","parent":"P4C2-M010"},{"kind":"sous_mesure","text":"Fournir les moyens réels pour assurer à tous les élèves en collège et lycée les trois séances annuelles d’éducation à la vie affective, relationnelle et à la sexualité (EVARS) prévues par la loi ; ces séances incluront les problématiques liées au consentement, à l’orientation sexuelle, à l’identité de genre et à la lutte contre les LGBTIphobies","depth":1,"id":"P4C2-S024","parent":"P4C2-M010"},{"kind":"sous_mesure","text":"Interdire toute intervention des fondations « philanthropiques » des entreprises ou associations de défense de leurs intérêts à l’école, rompre la convention entre le Mouvement des entreprises de France (Medef) et l’Éducation nationale","depth":1,"id":"P4C2-S025","parent":"P4C2-M010"},{"kind":"mesure","text":"Reconnaître l’expertise enseignante et revaloriser l’ensemble des personnels de l’Éducation nationale :","depth":0,"id":"P4C2-M011"},{"kind":"sous_mesure","text":"Adopter un plan pluriannuel de recrutement pour l’ensemble des concours, avec un dispositif de pré-recrutement au métier d’enseignant favorisant l’accès des jeunes de tous les milieux sociaux","depth":1,"id":"P4C2-S026","parent":"P4C2-M011"},{"kind":"sous_mesure","text":"Créer des écoles universitaires des métiers de l’éducation, renforcer la formation initiale et continue des personnels, en intégrant notamment une solide formation à la sociologie de l’éducation, aux pédagogies, à toutes les formes de difficultés scolaires, à la psychologie de l’enfant et de l’adolescent ainsi qu’à la lutte contre les discriminations","depth":1,"id":"P4C2-S027","parent":"P4C2-M011"},{"kind":"sous_mesure","text":"Structurer une filière complète des métiers de l’éducation du certificat d’aptitude professionnelle (CAP) à bac + 5","depth":1,"id":"P4C2-S028","parent":"P4C2-M011"},{"kind":"sous_mesure","text":"Mettre fin aux techniques du nouveau management public (indicateurs, contrôle, évaluation permanente) et réaffirmer la liberté pédagogique des enseignants","depth":1,"id":"P4C2-S029","parent":"P4C2-M011"},{"kind":"sous_mesure","text":"Créer un véritable service public d’accompagnement du handicap, avec un nouveau corps de personnels fonctionnaires, mettant fin à la mutualisation des accompagnantes d’élèves en situation de handicap (AESH)","depth":1,"id":"P4C2-S030","parent":"P4C2-M011"},{"kind":"sous_mesure","text":"Titulariser l’ensemble des personnels contractuels de l’Éducation nationale","depth":1,"id":"P4C2-S031","parent":"P4C2-M011"},{"kind":"mesure","text":"Faire de l’école le levier de la bifurcation écologique et démocratique :","depth":0,"id":"P4C2-M012"},{"kind":"sous_mesure","text":"Rénover le bâti scolaire, afin de permettre son adaptation au changement climatique et de garantir la sécurité de chacun face aux risques sanitaires, sociaux et environnementaux (désamiantage, sanitaires propres, végétalisation des espaces notamment)","depth":1,"id":"P4C2-S032","parent":"P4C2-M012"},{"kind":"sous_mesure","text":"Permettre aux élèves de participer activement à la vie de l’établissement dès l’école primaire, et étendre le droit de réunion et d’association pour les lycéennes et lycéens","depth":1,"id":"P4C2-S033","parent":"P4C2-M012"},{"kind":"sous_mesure","text":"Créer un statut de « parents d’élèves délégués »","depth":1,"id":"P4C2-S034","parent":"P4C2-M012"}]},{"title":"Qualifier tout le monde","depth":1,"path":["Qualifier tout le monde"],"blocks":[{"kind":"texte","text":"L’élévation continue du niveau de qualification des travailleuses et des travailleurs est essentielle. La bifurcation écologique nécessite des qualifications de pointe à tous les niveaux et dans tous les secteurs. Il est donc impératif de penser conjointement les offres de formation initiale et de formation tout au long de la carrière, en cohérence avec les objectifs écologiques et sociaux du pays. Nous voulons reconstruire les filières publiques d’enseignement professionnel, aujourd’hui dévastées. Elles sont une voie d’excellence dans laquelle étudie un tiers de la jeunesse du pays."},{"kind":"mesure_cle","text":"Augmenter le nombre de classes et de lycées professionnels et agricoles publics","id":"P4C2-K04"},{"kind":"mesure","text":"Créer des centres polytechniques professionnels de la formation initiale et continue","depth":0,"id":"P4C2-M013"},{"kind":"mesure","text":"Démarchandiser la formation continue","depth":0,"id":"P4C2-M014"},{"kind":"mesure","text":"Rétablir l’encadrement public de la création de centres de formation des apprentis (CFA)","depth":0,"id":"P4C2-M015"},{"kind":"mesure","text":"Interdire les diplômes privés professionnels","depth":0,"id":"P4C2-M016"},{"kind":"mesure","text":"Rétablir le baccalauréat professionnel en quatre ans, abroger les contre-réformes du lycée professionnel, renforcer les enseignements professionnels et généraux, supprimer les nouvelles périodes de stage pour privilégier les cours en atelier","depth":0,"id":"P4C2-M017"},{"kind":"mesure","text":"Protéger les cursus courts dans l’enseignement supérieur et encourager la poursuite d’études après un baccalauréat professionnel ou technologique (actuels brevet de technicien supérieur (BTS) et bachelor universitaire de technologie (BUT) qui seront transformés en licences universitaires de technologie (LUT), licences professionnelles)","depth":0,"id":"P4C2-M018"},{"kind":"mesure","text":"Structurer les filières professionnelles qui répondent aux besoins de la bifurcation écologique et agricole et les préserver des lobbys agro-industriels","depth":0,"id":"P4C2-M019"},{"kind":"mesure","text":"Redonner et développer les moyens humains et financiers de formation aux lycées agricoles publics en les fléchant prioritairement dans les déserts d’enseignement public","depth":0,"id":"P4C2-M020"},{"kind":"mesure","text":"Permettre l’accès et la gratuité des places d’internat aux étudiants et apprentis mineurs, sous condition de ressources et pour les plus éloignés des lieux d’apprentissage","depth":0,"id":"P4C2-M021"},{"kind":"mesure","text":"Réinstaurer un service public national de l’orientation","depth":0,"id":"P4C2-M022"},{"kind":"mesure","text":"Réserver la taxe d’apprentissage aux établissements publics à tous les niveaux","depth":0,"id":"P4C2-M023"},{"kind":"mesure","text":"Renforcer le service public de formation continue des adultes en consolidant le rôle des groupements d’établissements publics locaux d’enseignement (Greta), lieux d’accueil de proximité du réseau public unifié de qualification tout au long de la vie","depth":0,"id":"P4C2-M024"}]},{"title":"Être une grande nation scientifique","depth":1,"path":["Être une grande nation scientifique"],"blocks":[{"kind":"texte","text":"Le développement et le rayonnement scientifiques sont un pilier de notre indépendance et de notre épanouissement à l’ère des incertitudes écologiques. La France doit demeurer une nation du savoir scientifique. L’internationalisme humaniste, auquel nous aspirons, s’écrit aussi dans des coopérations scientifiques."},{"kind":"mesure_cle","text":"Rehausser le niveau d’investissement public dans la recherche","id":"P4C2-K05"},{"kind":"mesure","text":"Financer des plans généraux de thèmes de recherche sur des secteurs d’avenir","depth":0,"id":"P4C2-M025"},{"kind":"mesure","text":"Revenir au principe du recrutement sur statut de chercheur ou d’enseignant-chercheur à l’issue du doctorat","depth":0,"id":"P4C2-M026"},{"kind":"mesure","text":"Développer des universités plus ouvertes sur la société avec des services chargés d’organiser le lien entre les chercheurs et la population, dans un esprit de diffusion des savoirs et de réflexion citoyenne sur leurs usages","depth":0,"id":"P4C2-M027"},{"kind":"mesure","text":"Supprimer l’Agence nationale de la recherche (ANR) et renforcer les grands instituts publics de recherche (Centre national de la recherche scientifique (CNRS), Institut national de la santé et de la recherche médicale (Inserm), Institut national de recherche pour l’agriculture, l’alimentation et l’environnement (INRAE), Institut de recherche pour le développement (IRD), etc.), garants des recherches d’intérêt général","depth":0,"id":"P4C2-M028"},{"kind":"mesure","text":"Supprimer le crédit impôt recherche au profit de dotations récurrentes à hauteur des besoins des universités et instituts de recherche ; garantir leur indépendance afin de libérer la recherche du poids des lobbys","depth":0,"id":"P4C2-M029"},{"kind":"mesure","text":"Mettre fin aux partenariats universitaires avec des entreprises ou institutions impliquées dans des crimes de guerre, des génocides ou des écocides","depth":0,"id":"P4C2-M030"},{"kind":"mesure","text":"Créer un service public de la publication scientifique pour permettre aux citoyens et aux universités d’accéder gratuitement aux articles des chercheurs sans enrichir les revues et bases de données privées, œuvrer à l’extension de ce principe au niveau international","depth":0,"id":"P4C2-M031"},{"kind":"mesure","text":"Favoriser l’accès libre aux revues scientifiques francophones","depth":0,"id":"P4C2-M032"}]},{"title":"Refonder et ouvrir l’enseignement supérieur","depth":1,"path":["Refonder et ouvrir l’enseignement supérieur"],"blocks":[{"kind":"texte","text":"Précarité des étudiants, doctorants et jeunes diplômés, manque de places, sélection à l’entrée, atteintes aux libertés académiques et étudiantes, concurrence entre établissements et entre chercheurs pour des financements insuffisants et aléatoires : c’est dans l’enseignement supérieur que les conséquences de la marchandisation et du démantèlement du service public de l’éducation sont les plus avancées. Tout est à reconstruire pour que prévale la coopération."},{"kind":"mesure_cle","text":"Garantir à tous les bacheliers l’accès sans sélection à la formation de leur choix en démantelant le système Parcoursup et restaurer le droit à la poursuite d’études en master","id":"P4C2-K06"},{"kind":"mesure","text":"Instaurer la gratuité de l’enseignement supérieur, de la licence au doctorat, quelle que soit la nationalité des étudiants","depth":0,"id":"P4C2-M033"},{"kind":"mesure","text":"Rétablir l’égalité d’accès aux aides au logement pour l’ensemble des étudiants, y compris étrangers","depth":0,"id":"P4C2-M034"},{"kind":"mesure","text":"Supprimer la contribution de vie étudiante et de campus (CVEC) et financer à la hauteur des besoins les centres régionaux des œuvres universitaires et scolaires (Crous) comme service public de la vie étudiante","depth":0,"id":"P4C2-M035"},{"kind":"mesure","text":"Mettre fin à la précarité des contractuels et jeunes chercheurs par la titularisation des personnels effectuant des missions pérennes et par un plan pluriannuel de recrutement de titulaires dans toutes les catégories","depth":0,"id":"P4C2-M036"},{"kind":"mesure","text":"Redonner à l’enseignement supérieur et à la recherche les moyens nécessaires à leur bon fonctionnement en les fondant sur des financements pérennes et en augmentant le budget des universités ; planifier les créations d’emplois et la construction de nouveaux établissements à partir d’une cartographie des besoins","depth":0,"id":"P4C2-M037"},{"kind":"mesure","text":"Supprimer le Haut Conseil de l’évaluation de la recherche et de l’enseignement supérieur (Hcéres), refonder une vraie démocratie universitaire et confier le suivi et le cadrage de la recherche et de l’enseignement supérieur aux pairs élus dans les instances nationales et locales","depth":0,"id":"P4C2-M038"},{"kind":"mesure","text":"Abroger la loi relative aux libertés et responsabilités des universités (LRU) et celle dite « Fioraso » ; réaffirmer le caractère national du service public de l’enseignement supérieur (cadre national des diplômes, statut des établissements et des personnel, etc.)","depth":0,"id":"P4C2-M039"},{"kind":"mesure","text":"Réinstaurer le monopole de l’État sur l’attribution des grades et diplômes universitaires, renforcer le contrôle pédagogique de toutes les formations privées et mettre fin aux subventions publiques non conditionnées ou déguisées au privé","depth":0,"id":"P4C2-M040"},{"kind":"mesure","text":"Interdire le caractère lucratif des écoles privées de l’enseignement supérieur (actionnariat, cotation en Bourse)","depth":0,"id":"P4C2-M041"},{"kind":"mesure","text":"Lancer un grand plan pour l’immobilier universitaire, incluant la construction, la rénovation et la mise en accessibilité de laboratoires, d’amphithéâtres et lieux de vie sociale, citoyenne et étudiante","depth":0,"id":"P4C2-M042"},{"kind":"mesure","text":"Augmenter drastiquement le nombre de psychologues au sein des universités et renforcer les services de santé pour assurer un accès gratuit aux soins (dentaires, gynécologiques, etc.) à l’ensemble des étudiants","depth":0,"id":"P4C2-M043"}]},{"title":"Créer une conscription écologique pour le secours collectif","depth":1,"path":["Créer une conscription écologique pour le secours collectif"],"blocks":[{"kind":"texte","text":"Le service national universel (SNU), mis en place par Emmanuel Macron, a été aussi coûteux qu’inutile. Il a été le théâtre de harcèlements, d’agressions sexuelles, de racisme et de punitions collectives intolérables. Il a fini par être abandonné, le gouvernement actant ainsi son échec. Son remplaçant, le service militaire volontaire (SMV), ne va pas non plus dans le bon sens. Long de dix mois, sous-payé : seuls les jeunes les plus précaires pourraient se résoudre à s’y enrôler. Nous proposons à la place un service citoyen obligatoire avant l’âge de 25 ans, rémunéré au SMIC revalorisé pendant neuf mois, participant à l’accompagnement des jeunes dans leur orientation, et ouvrant de nouveaux droits : formation, bilan de santé, permis de conduire. Ces jeunes pourront s’ils le souhaitent, après leur service citoyen, intégrer une garde régionale de la sécurité civile, notamment pour être certains de pouvoir venir en renfort efficace des équipes permanentes dans les épisodes de crise."},{"kind":"mesure_cle","text":"Instaurer une conscription citoyenne écologique","id":"P4C2-K07"},{"kind":"mesure","text":"Mettre en place une conscription citoyenne de neuf mois, dont la principale tâche sera d’aider à l’adaptation de notre société aux crises liées au bouleversement climatique (secours aux personnes, sécurité civile, protection et réparation de l’environnement, appui à des associations labellisées d’intérêt général, appui à la population en cas de crise sanitaire) ; elle comprend également une formation militaire initiale (avec droit d’objection de conscience)","depth":0,"id":"P4C2-M044"},{"kind":"mesure","text":"Proposer aux personnes volontaires disposant d’une formation professionnelle ou de compétences rares, comme dans le domaine cyber, d’être versées dans les services de défense ; celles-ci ne pourront pas être envoyées à l’étranger et ne seront pas casernées","depth":0,"id":"P4C2-M045"},{"kind":"mesure","text":"Intégrer dans cette conscription un bilan de santé et une évaluation des capacités d’écriture, de lecture et de calcul, avec mise à niveau si nécessaire. Elle comprendra aussi une formation gratuite à la conduite et le passage de l’examen du permis de conduire","depth":0,"id":"P4C2-M046"},{"kind":"mesure","text":"Abroger le service militaire volontaire","depth":0,"id":"P4C2-M047"},{"kind":"mesure","text":"Créer une garde nationale et régionale sous commandement civil, composée de la réserve de sécurité nationale, de la réserve de sécurité civile, de la réserve citoyenne et des jeunes en service citoyen obligatoire ayant souhaité intégrer l’une de ces réserves","depth":0,"id":"P4C2-M048"}]}]},{"code":"P4C3","part":"Partie 4 – Le goût du futur : aux nouvelles frontières de l’humanité","title":"Chapitre 3 : Humaniser par la culture et le sport","url":"https://melenchon2027.fr/programme/livre/le-gout-du-futur-aux-nouvelles-frontieres-de-l-humanite/chapitre3","sections":[{"title":"La bifurcation dans les arts et la culture : pour un service public du progrès humain","depth":1,"path":["La bifurcation dans les arts et la culture : pour un service public du progrès humain"],"blocks":[{"kind":"texte","text":"La culture a été bien malmenée ces dernières années : tantôt traitée comme une simple marchandise dont il faudrait subventionner la consommation, tantôt reléguée à un statut « non essentiel » pendant la crise sanitaire, et désormais prise en étau entre la censure de l’extrême droite et celle des logiques commerciales. Nous défendons, au contraire, une politique publique des arts et de la culture forte, où chacune et chacun d’entre nous peut s’exprimer, s’impliquer, et développer un rapport sensible et critique au monde, sur l’ensemble du territoire national. Il y a nécessité de faire confiance aux travailleurs et travailleuses de l’art. Vecteurs d’altérité et d’émancipation, les arts et la culture sont le cœur du progrès humain."},{"kind":"mesure_cle","text":"Porter la dépense publique consacrée à l’art, à la culture et à la création à 1 % du produit intérieur brut (PIB) par an pour mener une politique culturelle ambitieuse, émancipatrice et à l’image de la France d’aujourd’hui","id":"P4C3-K01"},{"kind":"mesure","text":"Adopter une loi pour démanteler et empêcher la formation de monopoles privés contrôlant la création et la diffusion artistiques","depth":0,"id":"P4C3-M001"},{"kind":"mesure","text":"Reprendre les grands travaux culturels pour remédier à l’inégale répartition territoriale des structures de création, d’enseignement, de diffusion et de mémoire artistiques et culturelles","depth":0,"id":"P4C3-M002"},{"kind":"mesure","text":"Renouer avec des financements pérennes pour les structures et associations culturelles, ainsi que pour la création et la programmation artistiques, fondés sur la diversité des formes, des récits et des artistes soutenus","depth":0,"id":"P4C3-M003"},{"kind":"mesure","text":"Étendre la gratuité à tous les musées et les bibliothèques, garantir une tarification abordable dans les institutions publiques et encadrer les tarifs abusifs des cinémas et autres lieux privés (salles de concert, lieux d’exposition, etc.)","depth":0,"id":"P4C3-M004"},{"kind":"mesure","text":"Faire de l’audiovisuel public le premier financeur du cinéma français, revoir la chronologie des médias en cohérence et créer une médiathèque en ligne publique et gratuite avec une plateforme de vidéo à la demande","depth":0,"id":"P4C3-M005"},{"kind":"mesure","text":"Lancer un plan d’envergure pour la diversité et l’indépendance dans l’édition et renforcer les moyens du Centre national du livre (CNL)","depth":0,"id":"P4C3-M006"},{"kind":"mesure","text":"Créer un centre national du jeu vidéo et renforcer la filière publique de formation dans ce domaine","depth":0,"id":"P4C3-M007"},{"kind":"mesure","text":"Garantir aux joueuses et aux joueurs la propriété et l’accès durable aux jeux qu’ils achètent, qu’ils soient physiques ou numériques, et soutenir les initiatives s’opposant à la disparition des jeux physiques","depth":0,"id":"P4C3-M008"},{"kind":"mesure","text":"Abolir tous les privilèges fiscaux liés au mécénat culturel et mettre fin à la mainmise des grandes fortunes et entreprises sur les arts et la culture","depth":0,"id":"P4C3-M009"},{"kind":"mesure","text":"Lutter activement contre les discriminations de genre et d’origine ainsi que toutes formes de violences sexuelles, racistes et pédagogiques qui persistent dans les arts et la culture, y compris dans l’accès aux postes de création, de direction, d’administration et de programmation","depth":0,"id":"P4C3-M010"},{"kind":"mesure","text":"Instituer un « domaine public commun » pour financer la création nouvelle, constitué d’une redevance sur l’usage commercial des œuvres tombées dans le domaine public","depth":0,"id":"P4C3-M011"},{"kind":"mesure","text":"Améliorer le régime des intermittents du spectacle sur la base de l’accord professionnel de 2023, faciliter l’ouverture des droits, notamment pour les primo-cotisants et personnes en rupture de droits, et l’étendre aux autres professions culturelles et événementielles discontinues, comme les « extras » de l’hôtellerie-restauration et les guides-conférenciers","depth":0,"id":"P4C3-M012"},{"kind":"mesure","text":"Mettre en place de véritables droits sociaux pour les artistes-­auteurs, notamment grâce à un système de continuité de revenus financé par une hausse de cotisation des diffuseurs, d’élections professionnelles adaptées et d’instances de démocratie sociale représentatives de ces professions","depth":0,"id":"P4C3-M013"},{"kind":"mesure","text":"Encadrer les intelligences artificielles génératives culturelles en distinguant leurs usages commerciaux et non-commerciaux, et mettre en place des accords de rémunération équitables pour les créateurs dont l’œuvre est utilisée","depth":0,"id":"P4C3-M014"}]},{"title":"Le sport et les corps libérés de l’argent","depth":1,"path":["Le sport et les corps libérés de l’argent"],"blocks":[{"kind":"texte","text":"Alors que la France a accueilli les Jeux olympiques sur son sol, de nombreux clubs de sport amateurs mettent la clé sous la porte et des territoires entiers sont sous-dotés en infrastructures sportives. Pourtant, le sport est un loisir, un espace d’épanouissement autant qu’un impératif de santé publique. L’inactivité physique tue dix fois plus que les accidents de la route chaque année. Mettons fin au sport business et développons le service public du sport : il est urgent de mettre des moyens au service de l’intérêt général pour un sport émancipateur et libéré de l’argent."},{"kind":"mesure_cle","text":"Favoriser la gratuité des activités sportives, en priorité pour les populations les plus pauvres","id":"P4C3-K02"},{"kind":"mesure","text":"Renforcer le financement du sport amateur en augmentant la taxation sur les retransmissions sportives à la télévision et en créant une taxe sur les transferts","depth":0,"id":"P4C3-M015"},{"kind":"mesure","text":"Interdire toute multipropriété dans le sport professionnel","depth":0,"id":"P4C3-M016"},{"kind":"mesure","text":"Démocratiser la gestion des fédérations sportives en assurant la souveraineté des licenciés sur leur fédération et en valorisant davantage le bénévolat","depth":0,"id":"P4C3-M017"},{"kind":"mesure","text":"Assurer un vrai développement du sport féminin pour lutter contre les inégalités d’accès à la pratique sportive et aux postes d’encadrement, instaurer la parité dans la retransmission télévisuelle des grands événements sportifs et étendre leur diffusion sur des chaînes publiques","depth":0,"id":"P4C3-M018"},{"kind":"mesure","text":"Renforcer l’accessibilité aux équipements sportifs des personnes handicapées et développer partout une offre de pratiques sportives adaptées","depth":0,"id":"P4C3-M019"},{"kind":"mesure","text":"Redonner les moyens de mener une politique sportive ambitieuse, notamment en déployant et en renforçant les conseillers techniques et sportifs (CTS) sur tout le territoire","depth":0,"id":"P4C3-M020"},{"kind":"mesure","text":"Mettre en place un plan national d’urgence pour la construction et la rénovation des équipements sportifs, notamment des équipements publics de proximité dédiés aux pratiques libres (piscines, salles d’escalade, salles de remise en forme, pistes de skate, etc.)","depth":0,"id":"P4C3-M021"},{"kind":"mesure","text":"Cesser la criminalisation des supporters et mettre fin aux atteintes aux libertés publiques et aux expérimentations sécuritaires comme la reconnaissance faciale","depth":0,"id":"P4C3-M022"},{"kind":"mesure","text":"Réguler les paris sportifs, notamment en interdisant leur publicité","depth":0,"id":"P4C3-M023"},{"kind":"mesure","text":"Organiser la mise en place réelle, à la fois contrôlée et évaluée, d’un plan d’action, de formation et de sensibilisation sur les violences sexistes, racistes et LGBTIphobes dans le sport pour garantir l’inclusion de toutes et tous dans les pratiques sportives et réaffirmer le refus catégorique des tests de féminité","depth":0,"id":"P4C3-M024"}]},{"title":"Éduquer par le sport et la culture","depth":1,"path":["Éduquer par le sport et la culture"],"blocks":[{"kind":"texte","text":"Le sport et la culture sont des leviers majeurs d’émancipation et de construction de soi. En la matière, le rôle de l’école est central, en particulier pour les enfants qui n’ont pas accès aux pratiques sportives et culturelles en dehors de ce cadre. Face aux inégalités qui persistent, l’école doit être le lieu des premières rencontres avec des disciplines diversifiées. L’éducation par le sport et la culture commence dès le plus jeune âge et continue tout au long de la vie."},{"kind":"mesure_cle","text":"Créer une association sportive et culturelle dans tous les établissements scolaires du premier degré pour rendre gratuite et accessible la pratique de ces activités encadrées par des professionnels","id":"P4C3-K03"},{"kind":"mesure","text":"Mettre en place un plan national pour l’éducation artistique et culturelle, ainsi que pour l’éducation populaire tout au long de la vie, en réorientant les moyens du pass Culture vers des projets collectifs à l’école, en renforçant l’enseignement artistique public et associatif dans tous les domaines et en développant l’éducation aux images et aux nouveaux médias","depth":0,"id":"P4C3-M025"},{"kind":"mesure","text":"Renforcer la place de l’éducation physique tout au long de la scolarité en améliorant la formation des professeurs des écoles et en garantissant quatre heures hebdomadaires d’éducation physique et sportive (EPS)","depth":0,"id":"P4C3-M026"},{"kind":"mesure","text":"Consacrer l’apprentissage de la natation dans le cadre scolaire en le rendant obligatoire et en remédiant au manque d’infrastructures","depth":0,"id":"P4C3-M027"},{"kind":"mesure","text":"Assurer un financement pérenne de la filière des sciences et techniques des activités physiques et sportives (STAPS) pour garantir des conditions d’études et de recherche décentes en formation publique","depth":0,"id":"P4C3-M028"},{"kind":"mesure","text":"Donner aux écoles supérieures d’art, tous domaines confondus, les moyens adéquats pour assurer la spécificité de leurs enseignements, revenir sur les récentes fermetures d’établissements, harmoniser les statuts des personnels de l’enseignement artistique","depth":0,"id":"P4C3-M029"},{"kind":"mesure","text":"Garantir aux étudiants d’écoles d’art les mêmes droits que dans le reste de l’enseignement supérieur","depth":0,"id":"P4C3-M030"}]}]},{"code":"P4C4","part":"Partie 4 – Le goût du futur : aux nouvelles frontières de l’humanité","title":"Chapitre 4 : Faire de la santé un enjeu global","url":"https://melenchon2027.fr/programme/livre/le-gout-du-futur-aux-nouvelles-frontieres-de-l-humanite/chapitre4","sections":[{"title":"S’organiser pour faire face aux maladies écologiques","depth":1,"path":["S’organiser pour faire face aux maladies écologiques"],"blocks":[{"kind":"texte","text":"Une société malade rend malade. 80 % de notre santé est déterminée par notre environnement. Aujourd’hui, nombreuses sont les maladies qui sont liées au mode de production capitaliste : zoonoses, mais aussi cancers, diabète, obésité, infertilité, allergies. Des études scientifiques ont démontré le rôle de la malbouffe, des pesticides, des polluants éternels ou encore des perturbateurs endocriniens dans les manifestations de ces maladies chroniques, qui touchent en priorité les mondes populaires qui ne peuvent s’en protéger. Aucune fatalité à cela. L’eau, l’air et l’alimentation ont été empoisonnés par des pratiques soucieuses uniquement de produire à bas coûts. Éradiquer les facteurs favorisant ces maladies écologiques est possible. Ainsi, 40 % des cancers sont évitables en agissant sur l’environnement. Il faut dépolluer le monde, reconstruire notre système de soin et investir massivement dans la recherche médicale."},{"kind":"mesure_cle","text":"Intégrer la santé environnementale dans toutes les politiques publiques, notamment par une obligation d’évaluation santé-­environnement des projets d’infrastructure et des lois","id":"P4C4-K01"},{"kind":"mesure","text":"Adopter un plan d’éradication des maladies chroniques liées à l’exposition aux pollutions (pesticides, radioactivité, amiante, produits chimiques, etc.)","depth":0,"id":"P4C4-M001"},{"kind":"mesure","text":"Adopter un plan d’action national de protection de la santé contre les perturbateurs endocriniens poursuivant l’objectif « zéro exposition »","depth":0,"id":"P4C4-M002"},{"kind":"mesure","text":"Appliquer un principe de précaution sanitaire, avec une liste d’interdiction des substances dangereuses avérées, suspectées et présumées","depth":0,"id":"P4C4-M003"},{"kind":"mesure","text":"Doubler le budget du programme national de recherche « environnement – santé – travail » et publier le résultat de ses enquêtes","depth":0,"id":"P4C4-M004"},{"kind":"mesure","text":"Augmenter les moyens de l’Institut national du cancer pour améliorer la connaissance sur l’épidémie de cancer via le déploiement effectif du registre national des cancers","depth":0,"id":"P4C4-M005"},{"kind":"mesure","text":"Former massivement les professionnels de santé pour renforcer le dépistage et la prévention des maladies écologiques ainsi que la prise en charge des plus vulnérables","depth":0,"id":"P4C4-M006"},{"kind":"mesure","text":"Mettre en place un interrogatoire allergique lors des visites de médecine scolaire et de médecine du travail pour prévenir le risque allergique","depth":0,"id":"P4C4-M007"},{"kind":"mesure","text":"Créer un fonds d’indemnisation spécifique des victimes, offrant une prise en charge intégrale pour toutes les victimes de maladies liées au chlordécone, qu’elles soient professionnelles ou environnementales","depth":0,"id":"P4C4-M008"}]},{"title":"Se préparer à l’ère des pandémies","depth":1,"path":["Se préparer à l’ère des pandémies"],"blocks":[{"kind":"texte","text":"Tant que les causes des pandémies n’auront pas été réglées, nous devrons nous tenir prêts à des répliques de même nature que le Covid-19. Il nous faudra le faire de la manière la plus efficace et humainement acceptée. Nous choisirons le « tous ensemble » plutôt que le « chacun pour soi ». L’État planificateur sera l’instrument principal de notre adaptation à l’ère des pandémies."},{"kind":"mesure_cle","text":"Reconnaître les épidémies et pandémies au titre des catastrophes naturelles","id":"P4C4-K02"},{"kind":"mesure","text":"Élaborer un plan d’adaptation aux pandémies et zoonoses basé sur la planification sanitaire","depth":0,"id":"P4C4-M009"},{"kind":"mesure","text":"Réquisitionner les entreprises indispensables à la production de matériel sanitaire (masques, tests, purificateurs) en cas de pandémie","depth":0,"id":"P4C4-M010"},{"kind":"mesure","text":"Interdire le dépôt de brevets sur les médicaments et les équipements nécessaires à une réponse sanitaire urgente","depth":0,"id":"P4C4-M011"},{"kind":"mesure","text":"Éradiquer l’épidémie de VIH en France par un grand plan national de prévention, de dépistage, de traitement ainsi que de lutte contre la désinformation et la discrimination des personnes séropositives, tout en renforçant la contribution française au Fonds mondial","depth":0,"id":"P4C4-M012"},{"kind":"mesure","text":"Construire un pôle public du médicament qui devra :","depth":0,"id":"P4C4-M013"},{"kind":"sous_mesure","text":"Assurer une relocalisation de la production de médicaments et une capacité souveraine de production de vaccins","depth":1,"id":"P4C4-S001","parent":"P4C4-M013"},{"kind":"sous_mesure","text":"Garantir l’approvisionnement d’une réserve stratégique de médicaments essentiels","depth":1,"id":"P4C4-S002","parent":"P4C4-M013"},{"kind":"sous_mesure","text":"Reconstruire les capacités de fabrication de médicaments des pharmacies hospitalières","depth":1,"id":"P4C4-S003","parent":"P4C4-M013"},{"kind":"sous_mesure","text":"Nationaliser certaines filiales critiques (par exemple pour atteindre l’autonomie de production du principe actif Doliprane)","depth":1,"id":"P4C4-S004","parent":"P4C4-M013"},{"kind":"sous_mesure","text":"Assurer le contrôle des prix sur l’ensemble des produits de santé et communiquer sur leurs coûts réels","depth":1,"id":"P4C4-S005","parent":"P4C4-M013"},{"kind":"sous_mesure","text":"Produire et diffuser massivement les vaccins et traitements passés sous licence d’office","depth":1,"id":"P4C4-S006","parent":"P4C4-M013"},{"kind":"sous_mesure","text":"Financer la recherche et le développement publics sur les antibiotiques et l’antibiorésistance pour développer des solutions thérapeutiques","depth":1,"id":"P4C4-S007","parent":"P4C4-M013"},{"kind":"sous_mesure","text":"Développer une production publique de biomédicaments, notamment pour les thérapies contre le cancer","depth":1,"id":"P4C4-S008","parent":"P4C4-M013"}]},{"title":"En finir avec la malbouffe","depth":1,"path":["En finir avec la malbouffe"],"blocks":[{"kind":"texte","text":"Nous sommes confrontés à une épidémie de maladies chroniques (diabète, obésité) et de cancers. L’agro-industrie et ses produits, vendus à grand renfort d’additifs et de publicité, en sont une cause majeure. Les plus pauvres sont les premières victimes. En finir avec la malbouffe est un enjeu de santé publique. Nous avons les moyens de produire autrement pour nous nourrir tous et mieux."},{"kind":"mesure_cle","text":"Créer un ministère de la Production alimentaire","id":"P4C4-K03"},{"kind":"mesure","text":"Interdire d’urgence les additifs dangereux pour la santé en limitant la liste aux composants autorisés dans l’agriculture biologique","depth":0,"id":"P4C4-M014"},{"kind":"mesure","text":"Fixer des taux maximaux de sel, de sucre et d’acides gras saturés dans les aliments transformés et garantir l’application de la loi dans les Outre-mer","depth":0,"id":"P4C4-M015"},{"kind":"mesure","text":"Rendre le Nutri-Score (étiquetage nutritionnel) obligatoire pour en finir avec la désinformation de la grande distribution","depth":0,"id":"P4C4-M016"},{"kind":"mesure","text":"Interdire la publicité alimentaire sur tous les supports (radiophonique, audiovisuel et électronique) à destination des enfants et adolescents","depth":0,"id":"P4C4-M017"},{"kind":"mesure","text":"Créer une heure hebdomadaire d’éducation à la nutrition de la maternelle au collège","depth":0,"id":"P4C4-M018"},{"kind":"mesure","text":"Garantir en permanence l’accès à cinq fruits et légumes de saison à prix bloqués","depth":0,"id":"P4C4-M019"},{"kind":"mesure","text":"Porter l’alimentation dans la restauration collective et scolaire à 100 % biologique et locale, diversifier les sources de protéines en augmentant la part des protéines végétales et garantir l’accès à une option végétarienne quotidienne","depth":0,"id":"P4C4-M020"},{"kind":"mesure","text":"Renforcer la place de l’éducation à la nutrition dans les programmes scolaires","depth":0,"id":"P4C4-M021"}]},{"title":"Faire passer la santé d’abord et reconstruire les établissements de santé publics, notamment les hôpitaux","depth":1,"path":["Faire passer la santé d’abord et reconstruire les établissements de santé publics, notamment les hôpitaux"],"blocks":[{"kind":"texte","text":"Notre système de santé a longtemps été le meilleur au monde. Mais les coupes budgétaires et la marchandisation l’ont méthodiquement sacrifié sur l’autel de l’austérité. Il n’est plus en mesure de faire face à la multiplication des maladies chroniques et aux épidémies. En vingt-cinq ans, l’hôpital public a perdu 80 000 lits, des centaines de maternités et de services d’urgence. 6 millions de personnes n’ont pas de médecin traitant et plus d’un tiers de la population vit dans un désert médical. Contre cette pénurie, nous pouvons réparer l’hôpital public, mettre fin aux déserts médicaux, et reconstruire un service public de santé en partant des besoins."},{"kind":"mesure_cle","text":"Reconstruire le service public hospitalier et actionner tous les leviers contre les déserts médicaux","id":"P4C4-K04"},{"kind":"mesure","text":"Remplacer l’objectif national des dépenses d’assurance maladie (ONDAM) par un objectif national des besoins d’assurance maladie (ONBAM)","depth":0,"id":"P4C4-M022"},{"kind":"mesure","text":"Sortir de la tarification à l’acte (T2A) à l’hôpital par un financement diversifié (dotation forfaitaire et en fonction de la population, prix de la journée, etc.)","depth":0,"id":"P4C4-M023"},{"kind":"mesure","text":"Imposer la transparence totale sur le nombre de décès et de complications après un défaut de prise en charge lié au manque de moyens hospitaliers","depth":0,"id":"P4C4-M024"},{"kind":"mesure","text":"Réouvrir progressivement des services d’urgence, des maternités et des établissements d’hébergement pour personnes âgées dépendantes (EHPAD) publics assurant un service public de santé de proximité à moins de 30 minutes de chaque Français","depth":0,"id":"P4C4-M025"},{"kind":"mesure","text":"Engager un plan pluriannuel de recrutement des professionnels du soin et du médico-social (médecins, infirmières, aides-­soignantes et personnels administratifs)","depth":0,"id":"P4C4-M026"},{"kind":"mesure","text":"Revaloriser les métiers et les salaires dans le domaine du soin et la tarification de certains actes libéraux des infirmières et infirmiers","depth":0,"id":"P4C4-M027"},{"kind":"mesure","text":"Actionner tous les leviers pour combattre les déserts médicaux :","depth":0,"id":"P4C4-M028"},{"kind":"sous_mesure","text":"Mailler le territoire de centres de santé publics en exercice salarié et de maisons de santé pluriprofessionnelles","depth":1,"id":"P4C4-S009","parent":"P4C4-M028"},{"kind":"sous_mesure","text":"Recruter des médecins publics","depth":1,"id":"P4C4-S010","parent":"P4C4-M028"},{"kind":"sous_mesure","text":"Réguler l’installation des médecins, généraliser les guichets uniques pour les démarches d’installation des soignants","depth":1,"id":"P4C4-S011","parent":"P4C4-M028"},{"kind":"sous_mesure","text":"Rétablir l’obligation de participation de l’ensemble des médecins à la permanence des soins dans chaque département, en coopération avec l’ensemble des soignants de premier recours","depth":1,"id":"P4C4-S012","parent":"P4C4-M028"},{"kind":"sous_mesure","text":"Augmenter le nombre de places en faculté de médecine et créer des écoles normales de la santé et du social dans les collectivités afin de former davantage de professionnels de santé et du médico-social","depth":1,"id":"P4C4-S013","parent":"P4C4-M028"},{"kind":"sous_mesure","text":"Généraliser les contrats d’études dans les formations médicales et paramédicales","depth":1,"id":"P4C4-S014","parent":"P4C4-M028"},{"kind":"sous_mesure","text":"Lutter contre les déserts de pharmacies, notamment par le déploiement d’un réseau de pharmacies communautaires","depth":1,"id":"P4C4-S015","parent":"P4C4-M028"},{"kind":"mesure","text":"Permettre aux médecins et praticiens diplômés hors Union européenne d’exercer de manière pérenne en France par la validation des équivalences reconnues","depth":0,"id":"P4C4-M029"},{"kind":"mesure","text":"Instaurer un bouclier contre la financiarisation de la santé, notamment en interdisant la détention de structures médicales et médico-sociales par des fonds de capital-investissement","depth":0,"id":"P4C4-M030"},{"kind":"mesure","text":"Instaurer une stratégie nationale pluriannuelle de lutte contre les discriminations dans les soins et renforcer la prévention des discriminations dans la formation des professionnels de santé","depth":0,"id":"P4C4-M031"}]},{"title":"Santé mentale : rompre avec la logique néolibérale","depth":1,"path":["Santé mentale : rompre avec la logique néolibérale"],"blocks":[{"kind":"texte","text":"La France est le premier pays d’Europe touché par la dépression, le nombre de jeunes pensant au suicide a doublé en dix ans et une personne âgée sur trois vivant dans une maison de retraite est en détresse psychologique. À mesure que la santé mentale des Français se détériore, la psychiatrie publique continue de se déliter tandis que la privatisation du secteur progresse. Aujourd’hui, les difficultés d’accès restent massives et la prévention sous-financée. Il y a urgence à restaurer le service public de la psychiatrie en renforçant les moyens financiers et humains qui lui sont dédiés. Le bien-être mental ne doit plus être un tabou, mais un objectif collectif."},{"kind":"mesure_cle","text":"Renforcer le maillage territorial et les moyens des centres médico-­psychologiques et des centres médico-psycho-pédagogiques","id":"P4C4-K05"},{"kind":"mesure","text":"Réouvrir des lits de psychiatrie publics","depth":0,"id":"P4C4-M032"},{"kind":"mesure","text":"Élargir le conventionnement de psychologues par la Sécurité sociale, au-delà de 12 séances par an et avec un remboursement à 100 %","depth":0,"id":"P4C4-M033"},{"kind":"mesure","text":"Augmenter le nombre de places en faculté de médecine dans la filière « psy » et créer des formations délocalisées d’infirmières en pratique avancée et/ou spécialisées en psychiatrie","depth":0,"id":"P4C4-M034"},{"kind":"mesure","text":"Donner les moyens aux professionnels de santé d’aller vers l’abolition de la contention et de la mise à l’isolement, pratiques attentatoires à la dignité humaine, et les remplacer par d’autres pratiques thérapeutiques fondées sur le respect de la personne","depth":0,"id":"P4C4-M035"},{"kind":"mesure","text":"Renforcer la prise en charge par l’Assurance maladie des séances de psychothérapie","depth":0,"id":"P4C4-M036"},{"kind":"mesure","text":"Lancer un plan national de prévention et de prise en charge des troubles des conduites alimentaires","depth":0,"id":"P4C4-M037"}]},{"title":"Addictions et drogues : pour une stratégie sanitaire","depth":1,"path":["Addictions et drogues : pour une stratégie sanitaire"],"blocks":[{"kind":"texte","text":"Alcool et tabac sont les deux premiers facteurs connus de cancers en France. La politique suivie par notre pays en matière de drogues, mais aussi d’autres consommations addictives et néfastes (alcool, tabac, médicaments), se résume trop souvent à la répression ou à l’hypocrisie. Pourtant, les addictions concernent plusieurs millions de personnes. Selon l’Observatoire français des drogues et tendances addictives, 23,1 % des adultes fument quotidiennement, 7 % boivent de l’alcool chaque jour, et le cannabis compte 900 000 usagers quotidiens. C’est une affaire de santé publique ! L’heure est venue de changer de stratégie pour lutter plus efficacement et plus humainement contre les addictions."},{"kind":"mesure_cle","text":"Légaliser et encadrer par un monopole d’État la consommation, la production et la vente de cannabis à des fins médicales et récréatives dans des conditions permettant de lutter publiquement contre l’addiction","id":"P4C4-K06"},{"kind":"mesure","text":"Affecter les recettes des taxes sur le cannabis à des programmes de lutte contre les addictions, notamment en milieu scolaire, et à une politique de prévention, de réduction des risques et d’aide à la désintoxication","depth":0,"id":"P4C4-M038"},{"kind":"mesure","text":"S’attaquer aux causes des addictions pour engager une politique de réduction des risques plutôt que de continuer une politique de répression des consommateurs","depth":0,"id":"P4C4-M039"},{"kind":"mesure","text":"Pérenniser et généraliser les salles de consommation à moindre risque sur l’ensemble du territoire","depth":0,"id":"P4C4-M040"},{"kind":"mesure","text":"Confier le pilotage de la politique de lutte contre les drogues au ministère de la Santé et non plus de l’Intérieur (qui doit voir son rôle réorienté vers la lutte contre le crime organisé)","depth":0,"id":"P4C4-M041"},{"kind":"mesure","text":"Accroître les moyens de police et des douanes à des fins d’investigation et de remontées des filières du crime organisé dans ce domaine","depth":0,"id":"P4C4-M042"},{"kind":"mesure","text":"Renforcer et développer les coopérations judiciaires (magistrats de liaison, attachés douaniers et attachés de sécurité intérieure) en particulier avec les pays de production et d’exportation de drogues","depth":0,"id":"P4C4-M043"},{"kind":"mesure","text":"Viser une jeunesse « zéro tabac » : déployer la prévention avant les premiers usages, renforcer l’accès aux traitements de substitution et à l’accompagnement pour sortir de l’addiction, lutter contre les multinationales qui organisent elles-mêmes le trafic de cigarettes","depth":0,"id":"P4C4-M044"}]}]},{"code":"P4C5","part":"Partie 4 – Le goût du futur : aux nouvelles frontières de l’humanité","title":"Chapitre 5 : Entrer en mer sans saccage","url":"https://melenchon2027.fr/programme/livre/le-gout-du-futur-aux-nouvelles-frontieres-de-l-humanite/chapitre5","sections":[{"title":"Protéger les mers et océans","depth":1,"path":["Protéger les mers et océans"],"blocks":[{"kind":"texte","text":"L’Océan commun est aujourd’hui en danger. La biodiversité marine se dégrade, du fait du dérèglement climatique et des conséquences immédiates de l’activité économique humaine, notamment de la surpêche, de la pollution plastique. Il est urgent de protéger les mers des tensions militaires et du pillage. Il est nécessaire de sanctuariser les écosystèmes marins."},{"kind":"mesure_cle","text":"Œuvrer à l’approfondissement d’un droit international de la biodiversité marine, notamment dans les grands fonds","id":"P4C5-K01"},{"kind":"mesure","text":"Proposer d’accueillir la deuxième COP « Océans » en France en 2028","depth":0,"id":"P4C5-M001"},{"kind":"mesure","text":"Lancer un programme international de dépollution des mers et de l’Océan (récupération des déchets plastiques, équipements des littoraux en stations d’épuration, etc.) en commençant par la mer Méditerranée et les Outre-mer français","depth":0,"id":"P4C5-M002"},{"kind":"mesure","text":"Augmenter le niveau de protection des aires marines protégées (AMP) et en créer de nouvelles, notamment en haute mer","depth":0,"id":"P4C5-M003"},{"kind":"mesure","text":"Mettre fin aux accords de pêche inégaux, qui détruisent les écosystèmes et privent les populations riveraines de leurs moyens de subsistance","depth":0,"id":"P4C5-M004"},{"kind":"mesure","text":"Lutter contre les pratiques de pêche illégales et empêcher la réautorisation de la pêche électrique ; en finir avec les pratiques de pêche destructrices et les engins trop peu sélectifs","depth":0,"id":"P4C5-M005"},{"kind":"mesure","text":"Interdire l’usage des 12 milles côtiers aux navires usines et les réserver progressivement aux pratiques de pêche durables et aux pêcheurs artisans","depth":0,"id":"P4C5-M006"},{"kind":"mesure","text":"Allouer les quotas de pêche et les subventions selon des critères sociaux et environnementaux ; renforcer la définition du lien économique réel avec le territoire exigé","depth":0,"id":"P4C5-M007"},{"kind":"mesure","text":"Mettre en place un moratoire sur les projets de fermes-usines de saumons et favoriser une aquaculture soutenable","depth":0,"id":"P4C5-M008"},{"kind":"mesure","text":"Mettre en place un plan de lutte contre les marées de
