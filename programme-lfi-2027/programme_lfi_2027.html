x soins primaires – qui organisent les soins courants, la prévention et le suivi au long cours – doit permettre un accès équitable et une coopération avec l’hôpital et le médico-social."},{"kind":"texte","text":"Pour enrayer la désertification médicale, un plan national de court, moyen et long terme doit être mis en place. Nous proposons de :"},{"kind":"puce","text":"Mailler le territoire de centres de santé pluri-professionnels. Favoriser l’exercice des soins primaires en équipes (médecins, infirmier·es, kinésithérapeutes, diététicien·nes, médiateur·ices de santé, etc.) et leurs liens avec les hôpitaux publics de secteur. Ces centres seront aussi des lieux de formation privilégiés pour les étudiant·es se destinant à l’exercice des soins primaires","md":"**Mailler le territoire de centres de santé pluri-professionnels.** Favoriser l’exercice des soins primaires en équipes (médecins, infirmier·es, kinésithérapeutes, diététicien·nes, médiateur·ices de santé, etc.) et leurs liens avec les hôpitaux publics de secteur. Ces centres seront aussi des lieux de formation privilégiés pour les étudiant·es se destinant à l’exercice des soins primaires","depth":0,"id":"PT-SANTE-L029"},{"kind":"puce","text":"Développer un réseau de centres de santé publics ou communautaires, pluridisciplinaires et accessibles à toutes et tous, en priorité dans les territoires où l’accès aux soins est le plus difficile. Ces centres reposeront sur des équipes coordonnées et salariées, bénéficiant d’un financement pérenne pour répondre aux besoins de santé de la population et garantir une prise en charge de proximité","md":"**Développer un réseau de centres de santé publics ou communautaires**, pluridisciplinaires et accessibles à toutes et tous, en priorité dans les territoires où l’accès aux soins est le plus difficile. Ces centres reposeront sur des équipes coordonnées et salariées, bénéficiant d’un financement pérenne pour répondre aux besoins de santé de la population et garantir une prise en charge de proximité","depth":1,"id":"PT-SANTE-L030"},{"kind":"puce","text":"Sanctuariser et développer les structures pionnières d’exercice coordonné participatives (qui offrent des consultations médicales, des rendez-vous de prévention, des échanges avec travailleurs sociaux et des réunions de patient·es) en garantissant leur financement intégral par l’assurance maladie","md":"**Sanctuariser et développer** les structures pionnières d’exercice coordonné participatives (qui offrent des consultations médicales, des rendez-vous de prévention, des échanges avec travailleurs sociaux et des réunions de patient·es) en garantissant leur financement intégral par l’assurance maladie","depth":1,"id":"PT-SANTE-L031"},{"kind":"puce","text":"Réguler l’installation des médecins et généraliser les guichets uniques pour les démarches d’installation des soignants","depth":1,"id":"PT-SANTE-L032"},{"kind":"puce","text":"Intégrer dans les centres de santé publics, coopératifs et communautaires des médiateurs de santé, des interprètes de santé et expérimenter les formes qui permettent de définir des priorités sanitaires locales en associant aux équipes soignantes des habitants, des patient·es, des associations","depth":1,"id":"PT-SANTE-L033"},{"kind":"puce","text":"Socialiser et territorialiser les soins pharmaceutiques, notamment par la création de pharmacies publiques et communautaires là où les besoins de la population l’exigent","depth":1,"id":"PT-SANTE-L034"},{"kind":"puce","text":"Renforcer les stages en soins primaires et les liens entre les centres de santé, les universités et les hôpitaux publics, afin de mieux préparer les futurs professionnel·les au travail en équipe et à la prise en charge coordonnée des patient·es","depth":1,"id":"PT-SANTE-L035"},{"kind":"puce","text":"Faire adopter un dispositif anti-concentration contre la financiarisation des structures médicales et médico-sociales impliquant l’interdiction de monopoles privés locaux et une limitation du nombre de structures possédées","md":"**Faire adopter un dispositif anti-concentration contre la financiarisation des structures médicales et médico-sociales** impliquant l’interdiction de monopoles privés locaux et une limitation du nombre de structures possédées","depth":0,"id":"PT-SANTE-L036"},{"kind":"puce","text":"Organiser des assises participatives de la médecine de proximité dans chaque écorégion avec les acteur·ices concerné·es (représentant·es des usager·es, médecins généralistes et spécialistes, régulation SAMU, infirmier·es libéral·es, internes de régions, service d’urgence de secteur, syndicats représentatifs, instances territoriales, etc.) afin de solutionner collectivement les problématiques de désertification médicale et d’accès aux soins","md":"Organiser des **assises participatives de la médecine de proximité** dans **chaque écorégion** avec les **acteur·ices concerné·es** (représentant·es des usager·es, médecins généralistes et spécialistes, régulation SAMU, infirmier·es libéral·es, internes de régions, service d’urgence de secteur, syndicats représentatifs, instances territoriales, etc.) afin de solutionner collectivement les problématiques de désertification médicale et d’accès aux soins","depth":0,"id":"PT-SANTE-L037"},{"kind":"puce","text":"Mettre en place une organisation permettant à l’ensemble du personnel médical et paramédical (étudiant·es compris) d’assurer l’accès à des soins courants de proximité pérennes sur tout le territoire","depth":1,"id":"PT-SANTE-L038"},{"kind":"puce","text":"Lutter contre le surmenage des médecins généralistes : désaturer les centres d’appel 15 qui connaissent jusqu’à 30 minutes d’attente, via un plan de recrutement, une revalorisation salariale et un accompagnement psychologique des assistant·es, développer l’exercice pluriprofessionnel pour garantir la continuité du généraliste avec les autres soignants, accorder aux urgences les moyens de recevoir les patient·es plutôt que de les renvoyer chez le généraliste, assurer une rotation des généralistes sur le flux et supprimer 10 millions de certificats médicaux annuels qui gaspillent du temps médical (certificat pour enfant malade, pour grossesse dans la fonction publique, pour pratique de chant en chorale…)","depth":1,"id":"PT-SANTE-L039"},{"kind":"puce","text":"Mettre en place une rotation de permanence de soins en centre de santé grâce à la mise en place d’un quota horaire mensuel à effectuer en zone de désert médical régionale (généraliste et spécialiste). Ces vacations permettront de venir en aide aux confrères et consœurs de ces localités et d’assurer un accès aux soins à tou·tes (quatre à douze heures mensuelles à définir selon les régions). L’organisation de ces vacations sera pensée collectivement au sein des assises régionales","depth":1,"id":"PT-SANTE-L040"},{"kind":"puce","text":"Garantir les temps hebdomadaires de travail, les rémunérations, les remplacements et repos compensateurs des astreintes et gardes","depth":1,"id":"PT-SANTE-L041"},{"kind":"puce","text":"Créer des postes salariés d’infirmier·e de pratique avancée dans les centres de santé locaux en lien avec les médecins vacataires","depth":1,"id":"PT-SANTE-L042"},{"kind":"puce","text":"Intégrer explicitement les sages-femmes en tant que professionnel·les de soins primaires et ouvrir la prescription au nécessaire à leur exercice","depth":1,"id":"PT-SANTE-L043"}]},{"title":"3.2.3 Refonder l’hôpital public et garantir un système de santé de qualité pour toutes et tous","depth":3,"path":["3. Comment nous allons reconstruire notre système de santé","3.2 – Nos propositions pour faire de la santé un droit pour toutes et tous","3.2.3 Refonder l’hôpital public et garantir un système de santé de qualité pour toutes et tous"],"blocks":[{"kind":"texte","text":"Nous finançons les établissements selon leurs missions, les besoins des populations et les conditions nécessaires à des soins de qualité. L’hôpital doit pouvoir accueillir les situations complexes et les urgences sans dépendre de leur rentabilité."},{"kind":"puce","text":"Rouvrir progressivement des lits en fonction des capacités avec l’objectif de garder un taux de lits vacants disponibles de 20 % pour pouvoir gérer sans tension les variations d’activité","md":"**Rouvrir progressivement des lits** en fonction des capacités avec l’objectif de garder un taux de lits vacants disponibles de 20 % pour pouvoir gérer sans tension les variations d’activité","depth":0,"id":"PT-SANTE-L044"},{"kind":"puce","text":"Rouvrir graduellement des services d’urgences et maternités de proximité afin d’assurer un service de santé public à moins de 30 minutes de chaque Français·e","md":"**Rouvrir graduellement des services d’urgences et maternités de proximité** afin d’assurer un service de santé public à moins de 30 minutes de chaque Français·e","depth":0,"id":"PT-SANTE-L045"},{"kind":"puce","text":"Réformer la gouvernance des hôpitaux afin d’assurer un fonctionnement collégial organisé autour des soins et du projet médical","depth":0,"id":"PT-SANTE-L046"},{"kind":"puce","text":"Sortir du tout T2A (tarification à l’activité) et de la politique du chiffre qui met les établissements hospitaliers en situation de conflits d’intérêt avec la Sécurité sociale. La T2A sera réservée aux actes techniques, standardisés et programmés tandis que les spécialités ayant à traiter des maladies générales seront financées par une dotation globale. Enfin, pour les soins palliatifs, nous reviendrons au prix de journée","md":"**Sortir du tout T2A** (tarification à l’activité) et de la politique du chiffre qui met les établissements hospitaliers en situation de conflits d’intérêt avec la Sécurité sociale. La T2A sera réservée aux actes techniques, standardisés et programmés tandis que les spécialités ayant à traiter des maladies générales seront financées par une dotation globale. Enfin, pour les soins palliatifs, nous reviendrons au prix de journée","depth":0,"id":"PT-SANTE-L047"},{"kind":"puce","text":"Après revalorisation des rémunérations, mettre fin aux dépassements d’honoraires dans une réforme plus profonde du financement","md":"**Après revalorisation des rémunérations, mettre fin aux dépassements d’honoraires** dans une réforme plus profonde du financement","depth":0,"id":"PT-SANTE-L048"},{"kind":"puce","text":"Reconnaître la spécificité des pratiques professionnelles du médico-social et renforcer sa dotation en moyens humains et financiers. Le financement du médico-social sera réalisé à la dotation globale et non à l’activité","md":"Reconnaître la spécificité des pratiques professionnelles du médico-social et **renforcer sa dotation en moyens humains et financiers**. Le financement du médico-social sera réalisé à la dotation globale et non à l’activité","depth":0,"id":"PT-SANTE-L049"},{"kind":"puce","text":"Mettre en place un plan de rénovation du parc hospitalier français","md":"Mettre en place un **plan de rénovation du parc hospitalier français**","depth":0,"id":"PT-SANTE-L050"},{"kind":"puce","text":"Lancer un plan national de rénovation thermique et d’adaptation climatique des établissements de santé, avec priorité aux bâtiments les plus vétustes et aux structures accueillant des publics vulnérables. Associer confort d’été, isolation, ventilation, qualité de l’air intérieur, accessibilité et continuité des soins","depth":1,"id":"PT-SANTE-L051"},{"kind":"puce","text":"Faire de l’adaptation au changement climatique un critère obligatoire des projets de construction et de rénovation : risques de chaleur, d’inondation et de rupture des approvisionnements, gestion de l’eau et maintien des fonctions","depth":1,"id":"PT-SANTE-L052"},{"kind":"puce","text":"Développer les soins palliatifs, le traitement de la douleur et les soins de réadaptation sur tout le territoire. Soutenir les aidants par des possibilités de répit, de formation et d’accompagnement, sans substituer leur travail à celui des professionnel·les","depth":0,"id":"PT-SANTE-L053"},{"kind":"puce","text":"Rendre gratuits les parkings des établissements publics de santé pour les patient·es, leurs proches et les personnels, afin que le stationnement ne constitue pas un obstacle supplémentaire à l’accès aux soins.","md":"**Rendre gratuits les parkings des établissements publics de santé** pour les patient·es, leurs proches et les personnels, afin que le stationnement ne constitue pas un obstacle supplémentaire à l’accès aux soins.","depth":0,"id":"PT-SANTE-L054"},{"kind":"puce","text":"Interdire la concession des parkings des établissements publics de santé à des opérateurs privés et organiser la sortie progressive des contrats existants","depth":1,"id":"PT-SANTE-L055"},{"kind":"puce","text":"Réformer en profondeur les ordres professionnels de santé et les pouvoirs disciplinaires pour mettre fin aux dérives aux dépens des patient·es","md":"**Réformer en profondeur les ordres professionnels de santé et les pouvoirs disciplinaires** pour mettre fin aux dérives aux dépens des patient·es","depth":0,"id":"PT-SANTE-L056"}]},{"title":"3.2.5 – Former, recruter et protéger les professionnel·les de santé","depth":3,"path":["3. Comment nous allons reconstruire notre système de santé","3.2 – Nos propositions pour faire de la santé un droit pour toutes et tous","3.2.5 – Former, recruter et protéger les professionnel·les de santé"],"blocks":[{"kind":"texte","text":"La reconstruction de notre système de santé repose également sur des professionnel·les suffisamment nombreux, formés et respectés. Les recrutements doivent s’accompagner de conditions permettant de rester dans les métiers."},{"kind":"puce","text":"Engager un plan de recrutement pluriannuel pour avoir 100 000 soignant·es et médecins supplémentaires à l’hôpital, 300 000 dans le secteur médico-social et les EHPAD. Rendre obligatoire des ratios minimum de soignant·es par patient·es afin d’en finir avec la maltraitance institutionnelle","depth":0,"id":"PT-SANTE-L057"},{"kind":"puce","text":"Augmenter le nombre de places en faculté de médecine et créer des écoles normales de la santé et du social dans les collectivités afin de former davantage de professionnel·les de santé et du médico-social","depth":0,"id":"PT-SANTE-L058"},{"kind":"puce","text":"Engager un plan de formation massif des professionnel·les de santé. Augmenter les moyens alloués aux facultés de médecine et réformer la formation pratique pour rendre effective la fin du numerus apertus (qui avait lui-même remplacé le numerus clausus après sa suppression en 2020) et rétablir la possibilité de redoublement pour l’entrée en faculté de médecine","depth":0,"id":"PT-SANTE-L059"},{"kind":"puce","text":"Généraliser les contrats d’études dans toutes les formations paramédicales (infirmier·es, aides-soignant·es, ambulancier·es, etc.) avec une rémunération au SMIC pendant la formation contre un engagement à servir dans un établissement ou dans un territoire pendant un certain nombre d’années","depth":0,"id":"PT-SANTE-L060"},{"kind":"puce","text":"Permettre aux étudiant·es en médecine d’étudier dans des conditions correctes jusqu’à la fin de leur internat grâce à une garantie d’autonomie de 1 337 euros et reconnaître leur travail de stage","md":"**Permettre aux étudiant·es en médecine d’étudier dans des conditions correctes** jusqu’à la fin de leur internat grâce à une garantie d’autonomie de 1 337 euros et reconnaître leur travail de stage","depth":0,"id":"PT-SANTE-L061"},{"kind":"puce","text":"Organiser la participation active des étudiant·es tout au long de leur parcours aux différents projets de santé publique dont les assises de la médecine de proximité, en relation avec leur cursus et choix de spécialité (pour les internes)","depth":0,"id":"PT-SANTE-L062"},{"kind":"puce","text":"Augmenter le recours au contrat d’engagement de service public (CESP) pour les étudiant·es en médecine avec un objectif de 10 000 contrats conclus à la fin du quinquennat","md":"**Augmenter le recours au contrat d’engagement de service public (CESP)** pour les étudiant·es en médecine avec un objectif de 10 000 contrats conclus à la fin du quinquennat","depth":0,"id":"PT-SANTE-L063"},{"kind":"puce","text":"Titulariser l’ensemble des contractuel·les à l’hôpital et encourager la formation du personnel. Organiser la polyvalence inter-services uniquement sur la base du volontariat","md":"**Titulariser l’ensemble des contractuel·les** à l’hôpital et encourager la formation du personnel. Organiser la polyvalence inter-services uniquement sur la base du volontariat","depth":0,"id":"PT-SANTE-L064"},{"kind":"puce","text":"Indexer annuellement les tarifs conventionnels des actes infirmiers ainsi que les indemnités forfaitaires et kilométriques de déplacement sur l’inflation. Associer cette indexation à une révision de la nomenclature selon la complexité, la durée et les besoins réels des soins, notamment à domicile ; garantir une prise en charge solidaire sans report du coût sur les patient·es","depth":0,"id":"PT-SANTE-L065"},{"kind":"puce","text":"Créer par un cadre juridique spécifique un statut rémunéré d’« infirmier·e junior » pour les étudiant·es en fin de formation qui le souhaitent, après validation des compétences requises","depth":0,"id":"PT-SANTE-L066"},{"kind":"puce","text":"Permettre une autonomie progressive et supervisée pour des actes expressément définis, avec un·e infirmier·e diplômé·e référent·e disponible, une rémunération au moins égale au SMIC pour un temps plein, du temps d’encadrement financé et une responsabilité clairement établie. Préserver la formation et les repos ; exclure ces étudiant·es du calcul des effectifs minimaux de professionnel·les diplômé·es et interdire leur affectation seuls à une unité ou à une garde","depth":1,"id":"PT-SANTE-L067"}]},{"title":"3.2.6 – Agir sur les déterminants sociaux et environnementaux de la santé","depth":3,"path":["3. Comment nous allons reconstruire notre système de santé","3.2 – Nos propositions pour faire de la santé un droit pour toutes et tous","3.2.6 – Agir sur les déterminants sociaux et environnementaux de la santé"],"blocks":[{"kind":"texte","text":"Il faut adopter une approche intégrée des politiques publiques et réorienter le système de santé vers la prévention. La santé n’est pas réductible aux soins techniques mais doit prendre en compte les composantes physique, psychologique, écologique et sociale qui définissent un bon état de santé. Les inégalités sociales, le taux de pauvreté, la précarité, les conditions de travail, le système éducatif, les conditions d’alimentation, la qualité de l’air ou la qualité du lien social influent de façon déterminante sur la santé. Un programme de santé cohérent doit être articulé avec des mesures sociales et environnementales qui contribuent à l’amélioration de l’état de santé de la population. C’est ce que propose L’Avenir en commun via notamment la promotion de l’agriculture écologique et paysanne, l’éradication de la pauvreté, la sécurisation des postes de travail ou encore la réduction des inégalités socio-économiques. Très concrètement, une fois au pouvoir, le gouvernement intégrera la santé environnementale dans toutes les politiques publiques, notamment en instaurant une obligation d’évaluation santé-environnement pour chaque projet d’infrastructure ou de lois. Il chargera les écorégions, après leur création, de prendre en charge cet aspect pour d’abord définir, en lien avec les professionnel·les de santé, les associations, les représentant·es des malades et de leurs familles, les principaux déterminants environnementaux des maladies sur leur territoire. À partir de ce diagnostic, elles adopteront un plan de réduction des maladies écologiques précisant les actions nécessaires.","md":"Il faut adopter une approche intégrée des politiques publiques et réorienter le système de santé vers la prévention. **La santé n’est pas réductible aux soins techniques mais doit prendre en compte les composantes physique, psychologique, écologique et sociale qui définissent un bon état de santé**. **Les inégalités sociales, le taux de pauvreté, la précarité, les conditions de travail, le système éducatif, les conditions d’alimentation, la qualité de l’air ou la qualité du lien social influent de façon déterminante sur la santé**. Un programme de santé cohérent doit être articulé avec des mesures sociales et environnementales qui contribuent à l’amélioration de l’état de santé de la population. C’est ce que propose L’Avenir en commun via notamment la promotion de l’agriculture écologique et paysanne, l’éradication de la pauvreté, la sécurisation des postes de travail ou encore la réduction des inégalités socio-économiques. Très concrètement, une fois au pouvoir, le gouvernement **intégrera la santé environnementale dans toutes les politiques publiques, notamment en instaurant une obligation d’évaluation santé-environnement pour chaque projet d’infrastructure ou de lois. Il chargera les écorégions, après leur création, de prendre en charge cet aspect pour d’abord définir, en lien avec les professionnel·les de santé, les associations, les représentant·es des malades et de leurs familles, les principaux déterminants environnementaux des maladies sur leur territoire. À partir de ce diagnostic, elles adopteront un plan de réduction des maladies écologiques précisant les actions nécessaires.**"},{"kind":"texte","text":"En parallèle, le gouvernement prendra les mesures suivantes :","md":"**En parallèle, le gouvernement prendra les mesures suivantes :**"},{"kind":"puce","text":"Adopter un plan national d’éradication des maladies chroniques liées à l’exposition aux pollutions (pesticides, radioactivité, amiante, produits chimiques, etc.) à partir des plans écorégionaux","depth":0,"id":"PT-SANTE-L068"},{"kind":"puce","text":"Adopter un plan d’action national de protection de la santé contre les perturbateurs endocriniens poursuivant l’objectif « zéro exposition »","depth":0,"id":"PT-SANTE-L069"},{"kind":"puce","text":"Appliquer un principe de précaution sanitaire avec une liste d’interdiction des substances dangereuses avérées, suspectées et présumées","depth":0,"id":"PT-SANTE-L070"},{"kind":"puce","text":"Doubler le budget du programme national de recherche environnement – santé – travail et publier ses enquêtes","depth":0,"id":"PT-SANTE-L071"},{"kind":"puce","text":"Augmenter les moyens de l’Institut national du cancer pour améliorer la connaissance sur l’épidémie de cancer via le déploiement effectif du registre national des cancers et décliner dans chaque écorégion ce registre","depth":0,"id":"PT-SANTE-L072"},{"kind":"puce","text":"Former massivement les professionnel·les de santé pour renforcer le dépistage et la prévention des maladies écologiques, et la prise en charge des plus vulnérables","depth":0,"id":"PT-SANTE-L073"},{"kind":"puce","text":"Mettre en place un interrogatoire allergique lors des visites de médecine scolaire et de médecine du travail pour prévenir le risque allergique","depth":0,"id":"PT-SANTE-L074"},{"kind":"puce","text":"Créer un fonds d’indemnisation spécifique des victimes, offrant une prise en charge intégrale pour toutes les victimes de maladies liées au chlordécone, qu’elles soient professionnelles ou environnementales","depth":0,"id":"PT-SANTE-L075"},{"kind":"texte","text":"Une grande partie de la politique de prévention des maladies écologiques consistera aussi à déployer un ambitieux plan pour améliorer l’alimentation des Français·es, notamment :","md":"**Une grande partie de la politique de prévention des maladies écologiques consistera aussi à déployer un ambitieux plan pour améliorer l’alimentation des Français·es, notamment :**"},{"kind":"puce","text":"Fixer des taux maximaux de sel, de sucre et d’acides gras saturés dans les aliments transformés et garantir l’application de la loi dans les Outre-mer","depth":0,"id":"PT-SANTE-L076"},{"kind":"puce","text":"Rendre le Nutri-Score (étiquetage nutritionnel) obligatoire pour enfin mettre fin à la désinformation de la grande distribution","depth":0,"id":"PT-SANTE-L077"},{"kind":"puce","text":"Interdire la publicité alimentaire sur tous les supports (radiophonique, audiovisuel et électronique) à destination des enfants et adolescents","depth":0,"id":"PT-SANTE-L078"},{"kind":"puce","text":"Créer une heure hebdomadaire d’éducation à la nutrition de la maternelle au collège","depth":0,"id":"PT-SANTE-L079"},{"kind":"puce","text":"Garantir en permanence l’accès à cinq fruits et légumes de saison à prix bloqués","depth":0,"id":"PT-SANTE-L080"},{"kind":"puce","text":"Porter l’alimentation dans la restauration collective et scolaire à 100% biologique et locale, diversifier les sources de protéines en augmentant la part des protéines végétales et garantir l’accès à une option végétarienne quotidienne","depth":0,"id":"PT-SANTE-L081"},{"kind":"puce","text":"Renforcer la place de l’éducation à la nutrition dans les programmes scolaires","depth":0,"id":"PT-SANTE-L082"},{"kind":"texte","text":"Enfin, nous ferons du plan national santé environnement (PNSE) un moyen d’éradiquer les maladies chroniques liées à la malbouffe et à l’exposition aux pollutions, notamment dans le cadre professionnel (pesticides, radioactivité, amiante, produits chimiques)","md":"Enfin, nous ferons du plan national santé environnement (PNSE) un moyen **d’éradiquer les maladies chroniques liées à la malbouffe et à l’exposition aux pollutions, notamment dans le cadre professionnel (pesticides, radioactivité, amiante, produits chimiques)**"},{"kind":"puce","text":"En réévaluant l’ensemble des substances chimiques utilisées sur le territoire français. Nous refuserons les OGM et bannirons les pesticides nuisibles avec l’interdiction immédiate des plus dangereux (glyphosate, néonicotinoïdes, etc.)","depth":0,"id":"PT-SANTE-L083"},{"kind":"puce","text":"En réglementant de manière bien plus stricte les pratiques de l’industrie agroalimentaire et restreignant davantage les seuils maximums de sel, de graisses et de sucres","depth":0,"id":"PT-SANTE-L084"},{"kind":"puce","text":"En donnant une place prépondérante à la santé environnementale dans les formations des études de santé","depth":0,"id":"PT-SANTE-L085"}]},{"title":"3.2.7 – Protéger la santé au travail et les victimes d’accidents et de maladies professionnelles","depth":3,"path":["3. Comment nous allons reconstruire notre système de santé","3.2 – Nos propositions pour faire de la santé un droit pour toutes et tous","3.2.7 – Protéger la santé au travail et les victimes d’accidents et de maladies professionnelles"],"blocks":[{"kind":"texte","text":"Prévenir les maladies du travail implique d’agir sur les expositions et l’organisation du travail. Le suivi médical ne remplace pas l’obligation de supprimer ou de réduire les risques à la source. Les conséquences d’une exposition peuvent apparaître après le changement d’emploi ou la retraite : les droits doivent suivre la personne tout au long de sa vie."},{"kind":"puce","text":"Élargir la médecine du travail aux chômeur·ses et faire enfin appliquer la loi sur les visites médicales, obligatoires en entreprise tous les 5 ans (et plus fréquemment pour les postes dangereux)","md":"**Élargir la médecine du travail** aux chômeur·ses et faire enfin appliquer **la loi sur les visites médicales**, obligatoires en entreprise tous les 5 ans (et plus fréquemment pour les postes dangereux)","depth":0,"id":"PT-SANTE-L086"},{"kind":"puce","text":"Assurer une visite médicale annuelle (a minima) de tout le personnel de santé afin de prévenir les risques psychosociaux","md":"Assurer une visite médicale annuelle (a minima) de tout le personnel de santé afin de **prévenir les risques psychosociaux**","depth":0,"id":"PT-SANTE-L087"},{"kind":"puce","text":"Renforcer l’accompagnement médical, psychologique, social et juridique des victimes d’accidents du travail et de maladies professionnelles","depth":1,"id":"PT-SANTE-L088"},{"kind":"puce","text":"Faciliter les démarches de reconnaissance et l’accès à une expertise indépendante ; prévenir la sous-déclaration sans imposer aux victimes de démontrer seules leur exposition","depth":1,"id":"PT-SANTE-L089"},{"kind":"puce","text":"Garantir la traçabilité des expositions pendant et après la carrière, notamment aux cancérogènes, à l’amiante et aux pesticides","depth":0,"id":"PT-SANTE-L090"},{"kind":"puce","text":"Assurer un dossier accessible au travailleur, transmissible entre services avec les protections nécessaires, et un suivi post-exposition ou post-professionnel adapté aux connaissances, pour faciliter prévention, dépistage et reconnaissance des maladies","depth":1,"id":"PT-SANTE-L091"},{"kind":"puce","text":"Reconnaître la pénibilité du travail dans les carrières et les droits à la retraite, en prenant en compte les contraintes physiques, le travail de nuit et les horaires alternants. Stabiliser les horaires de travail et garantir le remplacement des personnels absents en portant les effectifs à 120 % de l’effectif cible, afin de prévenir la surcharge de travail et de préserver la santé des travailleurs","depth":0,"id":"PT-SANTE-L092"},{"kind":"puce","text":"Garantir la réadaptation, les aménagements de poste et un retour au travail compatible avec la santé lorsque la personne le souhaite et le peut. Protéger les travailleurs dont la santé ne permet plus le maintien dans l’emploi et assurer les relais après une rupture de parcours","depth":0,"id":"PT-SANTE-L093"}]},{"title":"3.2.8 – Refonder le service public de santé mentale, de psychiatrie et de pédopsychiatrie","depth":3,"path":["3. Comment nous allons reconstruire notre système de santé","3.2 – Nos propositions pour faire de la santé un droit pour toutes et tous","3.2.8 – Refonder le service public de santé mentale, de psychiatrie et de pédopsychiatrie"],"blocks":[{"kind":"texte","text":"Nous reconstruirons une psychiatrie publique accessible et dotée de moyens pérennes. Chaque personne doit pouvoir rencontrer une équipe, recevoir des soins adaptés et être accompagnée dans la durée, quels que soient ses revenus, son âge ou son lieu de vie. Ce service public articulera prévention, soins ambulatoires, hospitalisation et accompagnement social, sans subordonner les prises en charge à leur rentabilité.","md":"**Nous reconstruirons une psychiatrie publique accessible et dotée de moyens pérennes.** Chaque personne doit pouvoir rencontrer une équipe, recevoir des soins adaptés et être accompagnée dans la durée, quels que soient ses revenus, son âge ou son lieu de vie. Ce service public articulera prévention, soins ambulatoires, hospitalisation et accompagnement social, sans subordonner les prises en charge à leur rentabilité."},{"kind":"puce","text":"Réorganiser les secteurs psychiatrique et médico-social pour développer les prises en charge ambulatoires, communautaires et orientées vers le rétablissement, en renforçant les équipes pluridisciplinaires et les moyens qui leur sont consacrés","depth":0,"id":"PT-SANTE-L094"},{"kind":"puce","text":"Réaffirmer le secteur de pédopsychiatrie comme porte d’entrée de proximité, identifiable et accessible à toutes les familles","md":"**Réaffirmer le secteur de pédopsychiatrie comme porte d’entrée de proximité, identifiable et accessible à toutes les familles**","depth":0,"id":"PT-SANTE-L095"},{"kind":"puce","text":"Garantir sa mission d’accueil, d’évaluation et de prise en charge des situations complexes, tout en renforçant la coordination avec les CMPP, les professionnel·les libéraux, les structures médico-sociales et les établissements spécialisés, afin d’orienter chaque enfant vers la réponse la plus adaptée à ses besoins. Réduire les inégalités territoriales d’accès aux soins pédopsychiatriques","depth":1,"id":"PT-SANTE-L096"},{"kind":"puce","text":"Développer des centres d’accueil et de crise, des unités de crise et des équipes mobiles en psychiatrie sur l’ensemble du territoire, afin de garantir une réponse rapide aux situations de crise psychique. Ces dispositifs assureront l’évaluation, l’accompagnement des personnes et de leurs proches ainsi que la coordination avec les professionnel·les de terrain","md":"**Développer des centres d’accueil et de crise, des unités de crise et des équipes mobiles en psychiatrie sur l’ensemble du territoire**, afin de garantir une réponse rapide aux situations de crise psychique. Ces dispositifs assureront l’évaluation, l’accompagnement des personnes et de leurs proches ainsi que la coordination avec les professionnel·les de terrain","depth":0,"id":"PT-SANTE-L097"},{"kind":"puce","text":"Revaloriser le salaire des psychologues dans la fonction publique et créer des postes supplémentaires","depth":0,"id":"PT-SANTE-L098"},{"kind":"puce","text":"Mieux protéger les personnes particulièrement vulnérables aux fortes chaleurs, notamment les personnes vivant avec des troubles psychiques ou un handicap, en intégrant leurs besoins spécifiques dans les plans canicule, les campagnes de prévention et la formation des professionnel·les, et en garantissant des conditions de vie adaptées dans les lieux qui les accueillent","md":"**Mieux protéger les personnes particulièrement vulnérables aux fortes chaleurs, notamment les personnes vivant avec des troubles psychiques ou un handicap**, en intégrant leurs besoins spécifiques dans les plans canicule, les campagnes de prévention et la formation des professionnel·les, et en garantissant des conditions de vie adaptées dans les lieux qui les accueillent","depth":0,"id":"PT-SANTE-L099"}]},{"title":"3.2.9 – Protéger la santé dès la naissance et tout au long de la scolarité","depth":3,"path":["3. Comment nous allons reconstruire notre système de santé","3.2 – Nos propositions pour faire de la santé un droit pour toutes et tous","3.2.9 – Protéger la santé dès la naissance et tout au long de la scolarité"],"blocks":[{"kind":"texte","text":"Les premières années de vie et l’adolescence seront deux priorités de prévention. L’accès doit être universel, avec des moyens renforcés selon les besoins des enfants et des familles."},{"kind":"puce","text":"Construire un véritable service public de prévention périnatale, du projet parental aux deux ans de l’enfant, accessible à toutes les familles et renforcé selon leurs besoins. Ce parcours coordonnera les maternités, la PMI, les soins primaires, la psychiatrie et la santé mentale périnatales, les services sociaux et les structures de la petite enfance. Les moyens humains de la PMI et de la psychiatrie périnatale seront renforcés afin de garantir partout un accompagnement préventif, précoce et de proximité","md":"**Construire un véritable service public de prévention périnatale, du projet parental aux deux ans de l’enfant, accessible à toutes les familles et renforcé selon leurs besoins.** Ce parcours coordonnera les maternités, la PMI, les soins primaires, la psychiatrie et la santé mentale périnatales, les services sociaux et les structures de la petite enfance. Les moyens humains de la PMI et de la psychiatrie périnatale seront renforcés afin de garantir partout un accompagnement préventif, précoce et de proximité","depth":0,"id":"PT-SANTE-L100"},{"kind":"puce","text":"Renforcer la prévention et le repérage précoce des troubles psychiques chez les enfants et les adolescents, en formant les professionnel·les de première ligne et en développant des dispositifs de proximité accessibles aux enfants et aux familles, afin d’intervenir le plus tôt possible et de prévenir l’aggravation des situations","md":"**Renforcer la prévention et le repérage précoce des troubles psychiques chez les enfants et les adolescents**, en formant les professionnel·les de première ligne et en développant des dispositifs de proximité accessibles aux enfants et aux familles, afin d’intervenir le plus tôt possible et de prévenir l’aggravation des situations","depth":0,"id":"PT-SANTE-L101"}]},{"title":"3.2.10 – Lutter contre les discriminations sexistes et de genre dans la médecine et par le soin","depth":3,"path":["3. Comment nous allons reconstruire notre système de santé","3.2 – Nos propositions pour faire de la santé un droit pour toutes et tous","3.2.10 – Lutter contre les discriminations sexistes et de genre dans la médecine et par le soin"],"blocks":[{"kind":"texte","text":"Le consentement, la dignité et la prise en charge de la douleur doivent guider toute relation de soin. Les violences doivent être prévenues, repérées et suivies de réponses accessibles."},{"kind":"puce","text":"Garantir un consentement libre, éclairé et révocable pour les actes médicaux, avec une information adaptée à la personne et dans le respect des exceptions strictement définies par la loi. Former les professionnel·les et faciliter les recours","depth":0,"id":"PT-SANTE-L102"},{"kind":"puce","text":"Prévenir les violences gynécologiques et obstétricales, améliorer le traitement de la douleur et organiser un suivi national des signalements avec les personnes concernées","depth":0,"id":"PT-SANTE-L103"},{"kind":"puce","text":"Engager trois milliards d’euros contre les violences faites aux femmes et coordonner les actions de santé publique avec les acteurs de terrain","md":"Engager trois milliards d’euros contre **les violences faites aux femmes** et coordonner les actions de santé publique avec les acteurs de terrain","depth":0,"id":"PT-SANTE-L104"},{"kind":"puce","text":"Renforcer le repérage des violences subies par les enfants et l’accès aux soins du psychotraumatisme, en lien avec la protection de l’enfance. Former les équipes et garantir la continuité des accompagnements","depth":0,"id":"PT-SANTE-L105"},{"kind":"puce","text":"Garantir l’accès à la contraception, à l’IVG et aux soins de santé sexuelle, et améliorer les parcours pour l’endométriose, les douleurs chroniques et les troubles de la fertilité","depth":0,"id":"PT-SANTE-L106"},{"kind":"puce","text":"Combattre les discriminations dans les soins, notamment envers les personnes handicapées, les personnes précaires, les personnes migrantes et les personnes LGBTI","depth":0,"id":"PT-SANTE-L107"},{"kind":"puce","text":"Maintenir l’accès aux soins des personnes sans titre de séjour et renforcer les dispositifs de droit commun accessibles à toutes et tous","depth":1,"id":"PT-SANTE-L108"}]},{"title":"3.2.11 – Développer la prévention des addictions et la santé sexuelle","depth":3,"path":["3. Comment nous allons reconstruire notre système de santé","3.2 – Nos propositions pour faire de la santé un droit pour toutes et tous","3.2.11 – Développer la prévention des addictions et la santé sexuelle"],"blocks":[{"kind":"texte","text":"La prévention et la réduction des risques doivent disposer d’un financement pérenne et s’appuyer sur les personnes concernées et les associations."},{"kind":"puce","text":"Intensifier la lutte contre la consommation de tabac et d’alcool, premiers facteurs de mortalité prématurée","md":"**Intensifier la lutte** contre la consommation de tabac et d’alcool, premiers facteurs de mortalité prématurée","depth":0,"id":"PT-SANTE-L109"},{"kind":"puce","text":"Légaliser et encadrer par un monopole d’État la consommation, la production et la vente de cannabis à des fins récréatives dans des conditions permettant de lutter contre l’addiction","md":"**Légaliser et encadrer par un monopole d’État la consommation, la production et la vente de cannabis à des fins récréatives dans des conditions permettant de lutter contre l’addiction**","depth":0,"id":"PT-SANTE-L110"},{"kind":"puce","text":"Affecter les recettes des taxes sur le cannabis à des programmes de lutte contre les addictions, notamment en milieu scolaire, et à une politique de prévention, de réduction des risques et d’aide à la désintoxication","md":"Affecter les recettes des taxes sur le cannabis à des **programmes de lutte contre les addictions**, notamment en milieu scolaire, et à une politique de **prévention, de réduction des risques et d’aide à la désintoxication**","depth":0,"id":"PT-SANTE-L111"},{"kind":"puce","text":"Renforcer la prévention du tabagisme et des dommages liés à l’alcool, encadrer les pratiques commerciales et rendre accessibles les accompagnements et traitements des addictions","md":"**Renforcer la prévention du tabagisme et des dommages liés à l’alcool**, encadrer les pratiques commerciales et rendre accessibles les accompagnements et traitements des addictions","depth":0,"id":"PT-SANTE-L112"},{"kind":"puce","text":"Renforcer les centres de soins, d’accompagnement et de prévention en addictologie et les centres d’accueil et d’accompagnement à la réduction des risques pour usagers de drogues. Développer les équipes mobiles et leur coopération avec les soins et les structures sociales","md":"**Renforcer les centres de soins, d’accompagnement et de prévention en addictologie et les centres d’accueil et d’accompagnement à la réduction des risques pour usagers de drogues**. Développer les équipes mobiles et leur coopération avec les soins et les structures sociales","depth":0,"id":"PT-SANTE-L113"},{"kind":"puce","text":"Financer les dispositifs de réduction des risques dans les festivals, concerts et lieux festifs, avec des équipes formées et des liens avec les structures locales","depth":0,"id":"PT-SANTE-L114"},{"kind":"puce","text":"Éradiquer l’épidémie de VIH en France par un grand plan national de prévention, dépistage, traitement, de lutte contre la désinformation et la discrimination des personnes séropositives, et renforcer la contribution française au Fonds Mondial","md":"**Éradiquer l’épidémie de VIH en France** par un grand plan national de prévention, dépistage, traitement, de lutte contre la désinformation et la discrimination des personnes séropositives, et renforcer la contribution française au Fonds Mondial","depth":0,"id":"PT-SANTE-L115"},{"kind":"puce","text":"Intégrer un volet santé dans l’étude d’impact préalable pour tout projet ou proposition de loi","md":"Intégrer un **volet santé dans l’étude d’impact préalable pour tout projet ou proposition de loi**","depth":0,"id":"PT-SANTE-L116"},{"kind":"puce","text":"Garantir la confidentialité, l’accès sans stigmatisation et la participation des populations concernées à la définition des actions","md":"Garantir la **confidentialité, l’accès sans stigmatisation** et la participation des populations concernées à la définition des actions","depth":0,"id":"PT-SANTE-L117"}]},{"title":"3.2.12 – Des médicaments et produits de santé au service de l’intérêt général","depth":3,"path":["3. Comment nous allons reconstruire notre système de santé","3.2 – Nos propositions pour faire de la santé un droit pour toutes et tous","3.2.12 – Des médicaments et produits de santé au service de l’intérêt général"],"blocks":[{"kind":"texte","text":"Notre politique du médicament doit partir des besoins de santé de la population. La prévention et le bon usage des traitements restent insuffisamment soutenus, tandis que les stratégies commerciales des laboratoires influencent les prescriptions et les priorités de recherche. La dépendance aux chaînes de production internationales fragilise l’approvisionnement en médicaments essentiels. Reconstruire notre souveraineté pharmaceutique exige de préserver les capacités industrielles, les emplois et les savoir-faire nécessaires à la continuité des soins. Elle sera facilitée par l’autorisation de la vente de médicaments à l’unité, privilégiant le contrôle des stocks au taux de marge des fabricants.","md":"**Notre politique du médicament doit partir des besoins de santé de la population.** La prévention et le bon usage des traitements restent insuffisamment soutenus, tandis que les stratégies commerciales des laboratoires influencent les prescriptions et les priorités de recherche. La dépendance aux chaînes de production internationales fragilise l’approvisionnement en médicaments essentiels. Reconstruire notre souveraineté pharmaceutique exige de préserver les capacités industrielles, les emplois et les savoir-faire nécessaires à la continuité des soins. Elle sera facilitée par l’autorisation de la vente de médicaments à l’unité, privilégiant le contrôle des stocks au taux de marge des fabricants."},{"kind":"texte","text":"La recherche financée par la collectivité doit bénéficier à la collectivité. Or aujourd’hui, les découvertes issues des laboratoires publics peuvent être valorisées par des entreprises privées, puis acquises par des multinationales, sans garanties suffisantes sur les prix, la disponibilité des traitements ou le maintien de leur production.","md":"**La recherche financée par la collectivité doit bénéficier à la collectivité.** Or aujourd’hui, les découvertes issues des laboratoires publics peuvent être valorisées par des entreprises privées, puis acquises par des multinationales, sans garanties suffisantes sur les prix, la disponibilité des traitements ou le maintien de leur production."},{"kind":"texte","text":"Le cas de Sanofi illustre cette contradiction. En 2025, le groupe a consacré près de 4,8 milliards d’euros aux dividendes et 5 milliards aux rachats d’actions. La même année, il a cédé le contrôle d’Opella, qui commercialise notamment le Doliprane, au fonds américain CD&R. La participation de Bpifrance, limitée à 1,8 %, ne permet pas une maîtrise publique de cette entreprise stratégique. Les discours sur la souveraineté sanitaire se heurtent ainsi à des décisions qui laissent le devenir de nos industries de santé aux intérêts financiers.","md":"Le cas de Sanofi illustre cette contradiction. En 2025, le groupe a consacré près de 4,8 milliards d’euros aux dividendes et 5 milliards aux rachats d’actions. La même année, il a cédé le contrôle d’Opella, qui commercialise notamment le Doliprane, au fonds américain CD&R. La participation de Bpifrance, limitée à 1,8 %, ne permet pas une maîtrise publique de cette entreprise stratégique. **Les discours sur la souveraineté sanitaire se heurtent ainsi à des décisions qui laissent le devenir de nos industries de santé aux intérêts financiers.**"},{"kind":"texte","text":"Pour changer ce rapport de force, nous créerons un pôle public du médicament. Il permettra de développer la recherche et la production publiques, de sécuriser l’approvisionnement en médicaments essentiels et de garantir la transparence des financements, des prix et des décisions industrielles. Les besoins sanitaires doivent guider l’ensemble du parcours du médicament, de la recherche à sa délivrance.","md":"Pour changer ce rapport de force, **nous créerons un pôle public du médicament.** Il permettra de développer la recherche et la production publiques, de sécuriser l’approvisionnement en médicaments essentiels et de garantir la transparence des financements, des prix et des décisions industrielles. Les besoins sanitaires doivent guider l’ensemble du parcours du médicament, de la recherche à sa délivrance."},{"kind":"texte","text":"Ce pôle public aura notamment les missions suivantes :","md":"**Ce pôle public aura notamment les missions suivantes :**"},{"kind":"puce","text":"Assurer une relocalisation de la production de médicaments, principes actifs, réactifs, de dispositifs de diagnostic et de matériels médicaux","md":"**Assurer une relocalisation de la production de médicaments**, principes actifs, réactifs, de dispositifs de diagnostic et de matériels médicaux","depth":0,"id":"PT-SANTE-L118"},{"kind":"puce","text":"Garantir l’approvisionnement d’une réserve stratégique des médicaments dits « essentiels »","depth":0,"id":"PT-SANTE-L119"},{"kind":"puce","text":"Permettre la transparence sur les financements de la recherche et du développement","depth":0,"id":"PT-SANTE-L120"},{"kind":"puce","text":"Assurer le contrôle des prix de l’ensemble des produits de santé et communiquer sur leurs coûts réels","depth":0,"id":"PT-SANTE-L121"},{"kind":"puce","text":"Mettre en place des conditionnalités aux aides perçues par les entreprises privées pour la recherche de vaccins et médicaments","depth":0,"id":"PT-SANTE-L122"},{"kind":"puce","text":"Créer une unité de recherche (via des coopérations avec les unités de recherche fondamentale préexistantes) et favoriser la création d’autres unités satellites au sein des établissements publics","depth":0,"id":"PT-SANTE-L123"},{"kind":"puce","text":"Produire et diffuser massivement les vaccins et traitements passés sous licence d’office","depth":0,"id":"PT-SANTE-L124"},{"kind":"puce","text":"Financer la recherche et développement publics sur les antibiotiques et l’antibiorésistance pour développer des solutions thérapeutiques","depth":0,"id":"PT-SANTE-L125"},{"kind":"puce","text":"Développer une production publique de biomédicaments notamment pour les thérapies contre le cancer","depth":0,"id":"PT-SANTE-L126"},{"kind":"texte","text":"Il sera nécessaire de réorganiser les entités chargées de la régulation et de la fixation du prix des médicaments. Les conflits ou liens d’intérêts privés en seront exclus. En cas de nécessité impérieuse, l’utilisation de licences d’office permettra à ce pôle de nous fournir à prix coûtant les médicaments et produits de santé essentiels."},{"kind":"texte","text":"Pour parvenir à cette indépendance vis-à-vis des lobbys pharmaceutiques, la publicité sur les médicaments et les visiteurs médicaux (hospitaliers ou ambulatoires) seront interdits. Une reconversion dans le public leur sera proposée."},{"kind":"texte","text":"Il faudra aussi revoir le système d’autorisation de mise sur le marché de dispositifs médicaux, afin d’en finir avec la certification par des organismes privés au niveau européen, qui a prouvé son inefficacité."}]},{"title":"3.2.13 – L’État garant de l’organisation face aux pandémies","depth":3,"path":["3. Comment nous allons reconstruire notre système de santé","3.2 – Nos propositions pour faire de la santé un droit pour toutes et tous","3.2.13 – L’État garant de l’organisation face aux pandémies"],"blocks":[{"kind":"texte","text":"La pandémie de Covid-19 a révélé les conséquences humaines de l’impréparation et de la fragilisation de notre système de santé. Les risques de nouvelles crises persistent : la destruction des écosystèmes et certaines pratiques d’élevage favorisent les transmissions entre animaux et humains, tandis que le changement climatique modifie les conditions de propagation de certaines infections. Prévenir ces risques exige d’articuler santé humaine, santé animale et protection de l’environnement, et de garantir un système de soins et de protection sociale solide, capable de faire face aux épidémies sans épuiser les personnels ni interrompre les autres soins.","md":"La pandémie de Covid-19 a révélé les conséquences humaines de l’impréparation et de la fragilisation de notre système de santé. Les risques de nouvelles crises persistent : la destruction des écosystèmes et certaines pratiques d’élevage favorisent les transmissions entre animaux et humains, tandis que le changement climatique modifie les conditions de propagation de certaines infections. **Prévenir ces risques exige d’articuler santé humaine, santé animale et protection de l’environnement**, et de garantir un **système de soins et de protection sociale solide**, capable de faire face aux épidémies sans épuiser les personnels ni interrompre les autres soins."},{"kind":"texte","text":"La gestion du Covid-19 a montré les limites de décisions prises à huis clos, sans débat démocratique suffisant. L’État doit organiser une préparation permanente, transparente et démocratique, fondée sur une expertise indépendante, un contrôle parlementaire effectif et la participation des professionnel·les et de la population. La confiance exige des décisions cohérentes, une information claire sur les connaissances et les incertitudes, ainsi que des protections matérielles permettant à chacun de suivre les mesures sanitaires.","md":"La gestion du Covid-19 a montré les limites de décisions prises à huis clos, sans débat démocratique suffisant. **L’État doit organiser une préparation permanente, transparente et démocratique**, fondée sur une expertise indépendante, un contrôle parlementaire effectif et la participation des professionnel·les et de la population. La confiance exige des décisions cohérentes, une information claire sur les connaissances et les incertitudes, ainsi que des protections matérielles permettant à chacun de suivre les mesures sanitaires."},{"kind":"texte","text":"Afin de pouvoir vivre au temps de la pandémie permanente, nous proposons de :"},{"kind":"texte","text":"• Reconnaître les épidémies et pandémies au titre des catastrophes naturelles"},{"kind":"texte","text":"• Élaborer un plan d’adaptation aux pandémies et zoonoses basé sur la planification sanitaire"},{"kind":"texte","text":"• Réquisitionner les entreprises indispensables à la production de matériel sanitaire (masques, tests, purificateurs) en cas de pandémie"},{"kind":"texte","text":"• Interdire le dépôt de brevets sur les médicaments et les équipements nécessaires à une réponse sanitaire urgente"}]},{"title":"3.2.14 – Mettre le numérique au service du soin et protéger les données","depth":3,"path":["3. Comment nous allons reconstruire notre système de santé","3.2 – Nos propositions pour faire de la santé un droit pour toutes et tous","3.2.14 – Mettre le numérique au service du soin et protéger les données"],"blocks":[{"kind":"texte","text":"Le numérique occupe une place croissante dans notre système de santé : applications mobiles, plateformes de prise de rendez-vous, téléconsultations, dossiers médicaux numériques et outils d’intelligence artificielle. Ces usages peuvent faciliter l’accès aux soins, soutenir les professionnel·les et même permettre de mieux soigner, dépister et comprendre certaines pathologies. Leur développement doit toutefois répondre aux besoins de santé, garantir un accès humain aux services et protéger la confidentialité des informations."},{"kind":"texte","text":"La dépendance aux grandes entreprises du numérique, l’exploitation commerciale des données de santé et les risques de cyberattaque mettent en jeu les droits des patient·es et notre souveraineté numérique. Les données de santé sont particulièrement sensibles : leur protection doit guider les choix technologiques et l’organisation des services.","md":"**La dépendance aux grandes entreprises du numérique, l’exploitation commerciale des données de santé et les risques de cyberattaque mettent en jeu les droits des patient·es et notre souveraineté numérique.** Les données de santé sont particulièrement sensibles : leur protection doit guider les choix technologiques et l’organisation des services."}]}]}],"short":"Plan santé","content_sha256":"79f6bdab02a8e834b14d5b519a181431148495ce2c2470c6165e44679b87ce8b"},{"code":"PT-ESR","kind":"plan_thematique","title":"Comment nous allons refonder l’enseignement supérieur, la recherche et la formation continue","url":"https://melenchon2027.fr/programme/plans-thematiques/esr/","modified":"2026-10-26T18:52:54","units":[{"code":"PT-ESR","part":null,"title":"Comment nous allons refonder l’enseignement supérieur, la recherche et la formation continue","url":"https://melenchon2027.fr/programme/plans-thematiques/esr/","sections":[{"title":"Les universités, la recherche et la formation tout au long de la vie, malades du néolibéralisme","depth":1,"path":["Les universités, la recherche et la formation tout au long de la vie, malades du néolibéralisme"],"blocks":[{"kind":"texte","text":"Partout où il est appliqué, le logiciel néolibéral détruit. L’université et la formation tout au long de la vie en sont particulièrement victimes."},{"kind":"texte","text":"D’un côté, le savoir est progressivement transformé en une marchandise lucrative. Depuis l’adoption de la « stratégie de Lisbonne » par l’Union européenne (UE) en 2000, l’enseignement supérieur et la recherche (ESR) et la formation continue sont soumis à une logique de concurrence entre établissements et entre personnels. Celle-ci est aiguisée par les injonctions à l’innovation court-termiste. Dans ce cadre, le savoir est mis au seul service de la compétitivité des entreprises, ce qui provoque l’explosion de réseaux privés de formation et d’enseignement supérieur, dont certains ont des pratiques commerciales frauduleuses, largement subventionnées. La dépense publique consacrée à l’alternance a presque triplé, pour approcher 23 milliards d’euros en 2025, une gabegie qui bénéficie principalement aux formations privées et aux entreprises, sans effet significatif en termes d’insertion professionnelle. Par comparaison, le budget total de l’enseignement supérieur et de la recherche était de 27 milliards en 2025."},{"kind":"texte","text":"De l’autre, les saignées budgétaires détruisent progressivement l’Université. Depuis 2012, le financement public par étudiant·e a chuté de 23 %. Les dépenses consacrées à l’ensemble des activités de recherche et développement en France correspondent à seulement 2,2 % du PIB en 2024, contre plus de 3 % en Allemagne et aux États-Unis d’Amérique. Cela a conduit à une baisse drastique des recrutements de personnels de toutes catégories et à un sous-investissement dans le bâti universitaire. Le nombre d’enseignant·es-chercheur·ses, comme de personnels BIATSS (bibliothèques, ingénieurs, administratifs, techniques et sociaux et de santé) titulaires, est aujourd’hui dramatiquement insuffisant. La précarité explose, avec le recours aux contractuel·les et aux vacataires. Beaucoup sont contraint·es d’abandonner la recherche ou de quitter notre pays faute de renouvellement des contrats. Le mode de financement sur appels à projets, la création de CDD, de pseudo-CDI de mission et de « chaires junior » précarise encore plus les jeunes enseignant·es-chercheur·ses et les personnels administratifs et techniques."}]},{"title":"Les étudiant·es en première ligne","depth":2,"path":["Les universités, la recherche et la formation tout au long de la vie, malades du néolibéralisme","Les étudiant·es en première ligne"],"blocks":[{"kind":"texte","text":"Les plateformes de sélection scolaire – Parcoursup et MonMaster – articulent ces deux mécanismes : empêcher une grande partie de la jeunesse de choisir ses études, c’est diminuer les budgets universitaires dédiés et accompagner la privatisation des apprentissages. En conséquence, une partie croissante de la jeunesse est privée de savoirs, donc de qualifications, donc de salaires, donc de perspectives. C’est pourquoi elle se soulève depuis l’automne 2026 contre cette injustice majeure et conduit une lutte d’intérêt général."},{"kind":"texte","text":"Mais la destruction de l’université frappe aussi de plein fouet les jeunes qui y accèdent. Aujourd’hui, plus d’un quart des étudiant·es vit sous le seuil de pauvreté. Alors que le nombre d’étudiant·es s’est accru de 480 000 entre 2015 et 2025, le sous-investissement de l’État se traduit par le manque de logements étudiants décents, par un cumul de petits emplois précaires la nuit ou le week-end et par des conditions d’études très dégradées à l’université (TD surchargés, réduction des volumes horaires par diplôme, etc.). Il contraste avec l’investissement soutenu dans les filières dites d’élite que sont les classes préparatoires et les grandes écoles. De surcroît, pour pallier le désengagement général de l’État, une flambée des frais d’inscription est programmée et a déjà démarré dans les grandes écoles, dont les écoles d’ingénieur·es, ainsi que pour les étudiant·es étranger·es. Dans d’autres pays, les mêmes recettes ont poussé à un endettement accru des étudiant·es et ont alimenté une bulle financière spéculative de la dette étudiante. Étudier coûte donc de plus en plus cher, donc les étudiant·es raccourcissent leurs années de formation, réduisant ainsi le niveau général des qualifications."}]},{"title":"Une logique qui menace la recherche et les libertés académiques","depth":2,"path":["Les universités, la recherche et la formation tout au long de la vie, malades du néolibéralisme","Une logique qui menace la recherche et les libertés académiques"],"blocks":[{"kind":"texte","text":"Le néolibéralisme et ses partisans menacent également la recherche fondamentale. Par manque de crédits pérennes, la recherche s’oriente vers toujours plus de projets par appels d’offres, avec des procédures lourdes et chronophages. Du temps perdu en démarches administratives pour rien : l’Agence nationale de la recherche (ANR) a refusé 77,3 % des projets en 2025. La mise en concurrence des laboratoires multiplie encore les démarches kafkaïennes et accroît le mal-être. Pourtant, l’argent est là : le Crédit d’impôt recherche (CIR), niche fiscale notoirement inefficace censée inciter l’investissement privé dans la recherche, nous a coûté plus de 8 milliards d’euros en 2025."},{"kind":"texte","text":"Cette logique de saignée budgétaire, de mise en concurrence et de privatisations se retrouve à tous les niveaux. C’est le cas avec l’« autonomie » des universités décidée en 2009. Combinée avec les regroupements forcés d’établissements sans cohérence scientifique ou de formation, elle assujettit l’ESR aux intérêts économiques et politiques locaux. Ce démantèlement du système universitaire national a mis en concurrence les universités publiques et les force à poursuivre des objectifs absurdes comme le classement de Shanghai. La généralisation en cours des Contrats d’objectifs, de moyens et de performance (COMP) accélère la mise sous tutelle par les rectorats et les politiques de régionalisation. De même, les revues et bases de données scientifiques, alimentées par le travail de chercheur·ses sur financements publics, sont devenues la propriété d’éditeurs privés qui en monnayent l’accès, réalisant des marges faramineuses."},{"kind":"texte","text":"Enfin, le glissement autoritaire du néolibéralisme conduit aussi inexorablement à une réduction des libertés étudiantes, d’expression et académiques. Il remet en cause les processus démocratiques. La France n’y échappe pas. Le mouvement pour la paix, tout comme les mobilisations de la rentrée 2026 dans les universités ont été largement réprimés, tandis que la macronie a organisé une chasse aux sorcières ces dernières années contre les prétendus « wokistes »."}]},{"title":"Notre stratégie : comment nous allons reconstruire un service public de l’enseignement supérieur et de la recherche","depth":1,"path":["Notre stratégie : comment nous allons reconstruire un service public de l’enseignement supérieur et de la recherche"],"blocks":[{"kind":"texte","text":"L’enseignement supérieur, la formation et la recherche constituent un bien commun. Créer, critiquer et transmettre les savoirs sont des tâches nécessaires au développement humain. Elles sont encore plus fondamentales aujourd’hui face à la crise démocratique, sociale et écologique, car elles permettent de comprendre les grandes questions du siècle, d’y réfléchir par soi-même et de contribuer activement à la délibération collective. La production et la diffusion des connaissances sont ainsi essentielles pour l’émancipation, ce qui impose de les confier au secteur public, au service de l’intérêt général. Le niveau de qualification de sa jeunesse est la principale richesse sur laquelle la France peut compter pour le futur. Elle n’a aucun intérêt à rationner le savoir et l’intelligence."},{"kind":"texte","text":"Aussi, nous reconstruirons un service public de l’enseignement supérieur et de la recherche, fondé sur l’égalité d’accès, la liberté académique, la coopération et la collégialité."},{"kind":"texte","text":"Les connaissances développées seront mises au service de l’intérêt général et des grandes causes de notre temps. L’objectif de bifurcation écologique nécessite un effort spécifique de recherche et doit se traduire dans les offres de formation initiale et tout au long de la carrière. Il faut créer les nouvelles filières dont nous avons besoin, adapter les filières actuelles, réfléchir partout à la façon dont chaque métier va être modifié par ce changement profond de mode de production et de consommation."},{"kind":"texte","text":"Pour répondre à ces différents enjeux, il faut sortir des coupes budgétaires et gouverner par les besoins.Nous porterons l’effort de recherche et développement (R&D) à au moins 3 % du PIB, dont 1,5 % pour le secteur public en 2032. Nous mettrons en œuvre le plan d’urgence de 10 mesures porté par la jeunesse à l’automne 2026 : nous abrogerons Parcoursup et engagerons un plan d’ouverture de places massif à l’université. Nous investirons pour rénover les bâtiments universitaires et les agrandir. Nous donnerons à l’excellente recherche publique française les moyens pour travailler. Nous reviendrons aussi sur les regroupements imposés et engagerons la démocratisation des instances de cadrage de l’enseignement supérieur public sur tout le territoire. Nous pèserons de tout le poids de la France pour redéfinir les politiques européennes d’ESR. Nous reconstruirons le service public national de la formation continue."},{"kind":"texte","text":"Nous veillerons à ce que l’enseignement, la création et la critique des savoirs répondent aux quatre exigences suivantes, qui guideront l’ensemble de notre action :"},{"kind":"puce","text":"L’existence d’une démocratie réelle dans les universités et la recherche, qui protège les établissements, les organismes, leurs agent·es et leurs usager·es des pressions de tous ordres","depth":0,"id":"PT-ESR-L001"},{"kind":"puce","text":"L’indépendance et le temps long pour les enseignant·es-chercheur·ses, garantis par le respect des libertés académiques, par un statut national et par des financements pérennes","depth":0,"id":"PT-ESR-L002"},{"kind":"puce","text":"La reconnaissance du caractère collectif de l’enseignement et de la recherche pour sortir de la compétition généralisée et de « l’évaluationnite aiguë »","depth":0,"id":"PT-ESR-L003"},{"kind":"puce","text":"Un dialogue renouvelé entre la science et la société, avec des universités véritablement ouvertes, le développement de pratiques participatives et un lien fort entre l’enseignement supérieur et le secondaire, ainsi qu’entre formation continue et formation initiale","depth":0,"id":"PT-ESR-L004"},{"kind":"tableau","text":"Lexique AFPA : Agence nationale pour la formation professionnelle des adultes ANR : Agence nationale de la recherche ATER : Attaché·e temporaire d’enseignement et de recherche BIATSS : Personnels des bibliothèques, ingénieurs, administratifs, techniques et sociaux et de santé CEA : Commissariat à l’énergie atomique et aux énergies alternatives CIR : Crédit d’impôt recherche CNAM : Conservatoire national des arts et métiers CNED : Centre national d’enseignement à distance CNRS : Centre national de la recherche scientifique CNU : Conseil national des universités COMP : Contrat d’objectifs, de moyens et de performance DN MADE : Diplôme national des métiers d’art et du design EPIC : Établissement public à caractère industriel et commercial EPST : Établissement public scientifique et technologique ESR : Enseignement supérieur et recherche HCÉRES : Haut Conseil de l’évaluation de la recherche et de l’enseignement supérieur GRETA : Groupement d’établissements publics locaux d’enseignements INRAE : Institut national de la recherche pour l’agriculture, l’alimentation et l’environnement INRIA : Institut national de recherche en sciences et technologies du numérique INSERM : Institut national de la santé et de la recherche médicale IRD : Institut de recherche pour le développement ITA : Ingénieur·es, technicien·nes, administratifs LRU : Loi relative aux libertés et responsabilités des universités, dite loi Pécresse PIA : Programme d’investissements d’avenir RIFSEEP : Régime indemnitaire tenant compte des fonctions, des sujétions, de l’expertise et de l’engagement professionnel STS : Section de technicien·ne supérieur·e (BTS) UFR : Unité de formation et de recherche","rows":[["Lexique AFPA : Agence nationale pour la formation professionnelle des adultes ANR : Agence nationale de la recherche ATER : Attaché·e temporaire d’enseignement et de recherche BIATSS : Personnels des bibliothèques, ingénieurs, administratifs, techniques et sociaux et de santé CEA : Commissariat à l’énergie atomique et aux énergies alternatives CIR : Crédit d’impôt recherche CNAM : Conservatoire national des arts et métiers CNED : Centre national d’enseignement à distance CNRS : Centre national de la recherche scientifique CNU : Conseil national des universités COMP : Contrat d’objectifs, de moyens et de performance DN MADE : Diplôme national des métiers d’art et du design EPIC : Établissement public à caractère industriel et commercial EPST : Établissement public scientifique et technologique ESR : Enseignement supérieur et recherche HCÉRES : Haut Conseil de l’évaluation de la recherche et de l’enseignement supérieur GRETA : Groupement d’établissements publics locaux d’enseignements INRAE : Institut national de la recherche pour l’agriculture, l’alimentation et l’environnement INRIA : Institut national de recherche en sciences et technologies du numérique INSERM : Institut national de la santé et de la recherche médicale IRD : Institut de recherche pour le développement ITA : Ingénieur·es, technicien·nes, administratifs LRU : Loi relative aux libertés et responsabilités des universités, dite loi Pécresse PIA : Programme d’investissements d’avenir RIFSEEP : Régime indemnitaire tenant compte des fonctions, des sujétions, de l’expertise et de l’engagement professionnel STS : Section de technicien·ne supérieur·e (BTS) UFR : Unité de formation et de recherche"]]}]},{"title":"Comment nous allons refonder l’enseignement supérieur, la recherche et la formation continue","depth":1,"path":["Comment nous allons refonder l’enseignement supérieur, la recherche et la formation continue"],"blocks":[]},{"title":"Nos mesures d’urgence","depth":2,"path":["Comment nous allons refonder l’enseignement supérieur, la recherche et la formation continue","Nos mesures d’urgence"],"blocks":[]},{"title":"En finir avec Parcoursup pour une université émancipatrice, ouverte et accessible à toutes et tous","depth":3,"path":["Comment nous allons refonder l’enseignement supérieur, la recherche et la formation continue","Nos mesures d’urgence","En finir avec Parcoursup pour une université émancipatrice, ouverte et accessible à toutes et tous"],"blocks":[{"kind":"texte","text":"Il est urgent d’en finir avec le système de sélection Parcoursup, qui est devenu le symbole de la trahison de la promesse égalitaire de la République. Chaque année, à la veille de la rentrée universitaire, des milliers de lycéen·nes sont sans affectation et dans l’attente qu’un algorithme opaque décide de leur avenir. Pire que l’opacité, Parcoursup est devenu une plateforme de tri social. En accentuant la concurrence entre les formations, il renforce le cloisonnement social des filières. Dans son rapport sur l’orientation scolaire publié en juin 2025, le Défenseur des droits dénonçait le « déni persistant de l’Éducation nationale » sur « la discrimination fondée sur l’origine réelle ou supposée des élèves » du système d’orientation – examen des vœux en fonction du lycée d’origine, appréciations discrétionnaires, éclatement des critères de sélection des établissements, informations cachées, règne du coaching privé ou des initiés, etc. Pourtant, dans un monde traversé par des urgences écologiques, sociales et démocratiques, notre pays a besoin d’une jeunesse toujours plus qualifiée, critique et émancipée."}]},{"title":"Permettre à chacun·e l’accès à la formation de son choix","depth":3,"path":["Comment nous allons refonder l’enseignement supérieur, la recherche et la formation continue","Nos mesures d’urgence","Permettre à chacun·e l’accès à la formation de son choix"],"blocks":[{"kind":"texte","text":"Notre première tâche sera d’abolir les plateformes Parcoursup et MonMaster, afin de permettre aux lycéen·nes d’accéder aux formations de la filière de leur choix, et à tou·tes les étudiant·es qui le souhaitent de pouvoir poursuivre en master. Donner aux étudiant·es les moyens de leur émancipation intellectuelle et sociale, c’est également lever tous les obstacles à la poursuite d’études. Le gouvernement insoumis prendra les mesures suivantes :"},{"kind":"puce","text":"Créer 250 000 places dans les formations de l’ESR public et établir une plateforme nationale centralisée pour les candidatures, fondée sur une sectorisation sans sélection, pour faciliter la lisibilité des formations disponibles, avec une attention particulière portée à l’Île-de-France pour contrer les inégalités existantes","depth":0,"id":"PT-ESR-L005"},{"kind":"puce","text":"Créer une garantie d’autonomie pour tous les jeunes détaché·es du foyer fiscal de leurs parents afin qu’aucun·e ne vive en dessous du seuil de pauvreté (1 337 euros pour une personne seule)","depth":0,"id":"PT-ESR-L006"},{"kind":"puce","text":"Instaurer la gratuité de l’enseignement supérieur, de la licence au doctorat, en supprimant également la contribution à la vie étudiante et de campus (CVEC), et en abrogeant l’augmentation des frais d’inscription décidée par Macron pour les étudiant·es étranger·es extracommunautaires","depth":0,"id":"PT-ESR-L007"},{"kind":"puce","text":"Instaurer réellement le repas à un euro dans les CROUS pour tous les étudiant·es en garantissant les financements nécessaires à un repas de qualité. Instaurer l’obligation de présence d’au moins un restaurant universitaire à proximité de chaque campus","depth":0,"id":"PT-ESR-L008"},{"kind":"puce","text":"Financer les CROUS, outils au service de la vie étudiante, à la hauteur des besoins, y compris dans les territoires ultramarins","depth":0,"id":"PT-ESR-L009"},{"kind":"puce","text":"Relancer la construction de logements pour les étudiant·es et jeunes travailleur·ses à hauteur de 30 000 par an et favoriser la rénovation de l’existant","depth":0,"id":"PT-ESR-L010"},{"kind":"puce","text":"Réinstaurer un service public national de l’orientation pour rendre aux lycéen·nes le choix de leur orientation","depth":0,"id":"PT-ESR-L011"},{"kind":"puce","text":"Proposer 8 000 contrats doctoraux supplémentaires par an, avec l’extension du contrat doctoral à 4 ans, et augmenter le nombre de contrats avec des missions d’enseignement","depth":0,"id":"PT-ESR-L012"}]},{"title":"Améliorer les conditions d’étude","depth":3,"path":["Comment nous allons refonder l’enseignement supérieur, la recherche et la formation continue","Nos mesures d’urgence","Améliorer les conditions d’étude"],"blocks":[{"kind":"texte","text":"Afin que chacun·e puisse étudier et apprendre dans de bonnes conditions, nous réduirons le nombre d’étudiant·es par groupe de travaux dirigés (TD) et soutiendrons les pédagogies de coopération plutôt que de compétition. Nous mettrons fin à la généralisation dogmatique de l’approche par compétences, dont l’efficacité n’a jamais été démontrée : elle subordonne les formations universitaires aux seules attentes à court terme des employeurs, marginalise les savoirs disciplinaires, remet en cause la professionnalité des enseignant·es et annule toute progression automatique de carrière d’une entreprise à l’autre. Les enseignant·es-chercheur·ses seront formé·es à l’enseignement pendant le doctorat et bénéficieront aussi d’une formation continue prise en compte dans leur service, fondée sur les résultats de la recherche et visant la maîtrise critique d’une diversité d’approches pédagogiques. Elle permettra aux équipes pédagogiques d’expérimenter et choisir librement, à l’abri des modes et des injonctions institutionnelles, les modalités les plus adaptées à leurs objectifs et à leurs publics. 60 % des étudiant·es présentent des signes de détresse psychologique. Si nous entendons remédier aux causes de cette souffrance (orientation, violences, etc.), nous mettrons également en place un dispositif universel de suivi de la santé physique et mentale des personnels et des étudiant·es, adossé à un service de santé universitaire renforcé en moyens et en effectifs et permettant l’accès gratuit à la santé, à la prévention et à un accompagnement psychologique."}]},{"title":"Lever les obstacles à l’accessibilité, éradiquer les violences et discriminations","depth":3,"path":["Comment nous allons refonder l’enseignement supérieur, la recherche et la formation continue","Nos mesures d’urgence","Lever les obstacles à l’accessibilité, éradiquer les violences et discriminations"],"blocks":[{"kind":"texte","text":"Pour toute une partie de la population, l’accès à l’université n’est pas garanti. Les étudiant·es handicapé·es ont 46 % moins de chance que les étudiant·es valides d’être diplômé·es du supérieur. Nous leur garantirons un meilleur accès aux études : développement de l’accessibilité des documents et des locaux, des enseignements en langue des signes, harmonisation par le haut des aménagements de scolarité. Pour les nouveaux parents et les personnes aidantes, nous mettrons en place une procédure accélérée pour obtenir des aménagements de scolarité adaptés à leur situation sans rupture de droit et de statut. Nous devrons également refaire de l’université un lieu sûr. Selon l’Observatoire des violences sexistes et sexuelles dans l’enseignement supérieur, un·e étudiant·e sur quatre déclare avoir été victime d’agressions sexistes, sexuelles ou LGBTIphobes. Nous mettrons en place un plan de lutte contre toutes les formes de violence et de discrimination dans l’ESR qui comprendra :"},{"kind":"puce","text":"Des dispositifs articulant prévention, signalement, sanctions, protection et accompagnement des victimes. Ils seront gérés dans des cadres strictement indépendants des hiérarchies directes","depth":0,"id":"PT-ESR-L013"},{"kind":"puce","text":"Le recrutement de personnels permanent·es formé·es pour les cellules de lutte contre les discriminations et contre les violences sexistes et sexuelles dans tous les établissements","depth":0,"id":"PT-ESR-L014"},{"kind":"puce","text":"Des formations obligatoires à l’attention des personnels (notamment d’encadrement) ainsi que des étudiant·es","depth":0,"id":"PT-ESR-L015"},{"kind":"texte","text":"Le doctorat est une période particulièrement propice aux violences sexistes et sexuelles. Les modalités d’encadrement doctoral seront ainsi repensées afin de sortir des logiques de dépendance individuelle, en développant des formes d’encadrement ou de suivi collectives. Cela implique une harmonisation nationale des comités de suivi existants. Une formation obligatoire à l’encadrement doctoral intégrera une sensibilisation aux risques psycho-sociaux, aux violences sexistes et sexuelles, aux violences symboliques et à l’éthique. Un dispositif renforcé de protection des doctorant·es sera mis en place. Enfin, nous devons également éradiquer les inégalités dans les carrières de l’ESR. Les procédures de recrutement et d’avancement devront assurer l’égalité femmes-hommes et tout congé d’accueil d’un enfant ouvrira le droit effectif à un congé pour recherches ou conversions thématiques (CRCT)."}]},{"title":"Pour garantir des moyens à la hauteur des besoins","depth":3,"path":["Comment nous allons refonder l’enseignement supérieur, la recherche et la formation continue","Nos mesures d’urgence","Pour garantir des moyens à la hauteur des besoins"],"blocks":[{"kind":"texte","text":"Construire une université ouverte à toutes et tous suppose également de disposer de personnel en nombre suffisant. Depuis plusieurs années, le nombre d’étudiant·es augmente tandis que le taux d’encadrement ne cesse de baisser, que ce soit du côté des enseignant·es-chercheur·ses ou du côté des personnels administratifs. Ces choix budgétaires permettent de justifier la sélection. Nous allons y remédier."}]},{"title":"Recruter massivement des personnels statutaires et revaloriser les rémunérations","depth":3,"path":["Comment nous allons refonder l’enseignement supérieur, la recherche et la formation continue","Nos mesures d’urgence","Recruter massivement des personnels statutaires et revaloriser les rémunérations"],"blocks":[{"kind":"texte","text":"Pour accompagner la progression des effectifs étudiant
