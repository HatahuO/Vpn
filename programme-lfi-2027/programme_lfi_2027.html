t des circuits courts de transformation et de distribution, des coopérations et des échanges entre villes et communes rurales, pour une plus grande autonomie alimentaire des bassins de vie, en favorisant les regroupements de producteurs locaux sous forme de coopératives à taille humaine","depth":0,"id":"PT-RURALITE-L079"},{"kind":"puce","text":"Encourager la création de marchés dans les ruralités et octroyer des places en priorité aux agriculteur·rices et aux artisan·es locaux dans ces marchés","depth":0,"id":"PT-RURALITE-L080"},{"kind":"puce","text":"Développer des petites structures de transformation alimentaire de proximité permettant la valorisation des produits agricoles locaux","depth":0,"id":"PT-RURALITE-L081"},{"kind":"puce","text":"Structurer les filières d’avenir qui permettent le déploiement local d’emplois écologiques (lin, chanvre, miscanthus, etc.)","depth":0,"id":"PT-RURALITE-L082"}]},{"title":"2.5 Pour faire du tourisme un atout, et non une contrainte","depth":3,"path":["III. Comment nous allons garantir l’égalité pour des ruralités où il fait bon vivre","2. Nos mesures pour en finir avec l’abandon et garantir l’égalité","2.5 Pour faire du tourisme un atout, et non une contrainte"],"blocks":[{"kind":"texte","text":"Le tourisme peut être un moteur essentiel pour les économies rurales. Mais il ne doit pas se développer au détriment de celles et ceux qui y vivent. Nous prônons un tourisme qui permette de découvrir et de valoriser le patrimoine naturel, bâti et humain, sans transformer les campagnes en simples décors pour visiteur·ses de passage, ni aggraver la pression sur le logement, le foncier et les ressources naturelles dans les zones les plus touristiques."},{"kind":"texte","text":"Nous soutiendrons les offices de tourisme et les structures d’accompagnement mutualisés à l’échelle intercommunale, pour aider les petites communes à construire une offre touristique maîtrisée et favoriser les retombées économiques locales, tout en coordonnant mieux tourisme, logement, mobilités et préservation des milieux. Cela implique également de garantir un accès digne au logement pour les travailleur·ses saisonnier·es et de renforcer leurs droits et leurs conditions de travail (contrats, rémunérations, etc.)."},{"kind":"texte","text":"Dans les zones en tension, nous régulerons les meublés touristiques, en y fixant un quota maximal de locations, afin de lutter contre la spéculation sur le logement qui se fait au détriment des habitant·es et des travailleur·ses. Nous œuvrerons en parallèle au redéploiement d’auberges de jeunesse, qui offrent un modèle d’hébergement collectif et à prix limité, alternatif aux meublés touristiques, dans les zones rurales et les villes moyennes."},{"kind":"texte","text":"Le gouvernement insoumis soutiendra également le développement de formes de tourisme en accord avec la bifurcation écologique pour garantir l’harmonie entre les êtres humains et la nature. Nous renforcerons la constitution de réseaux de mobilités douces (véloroutes, voies vertes, sentiers de randonnée balisés), qui doivent être pensés pour être utilisés à la fois par les visiteur·ses et les habitant·es dans leurs déplacements du quotidien."},{"kind":"texte","text":"La planification écologique implique également de préserver les écosystèmes. La surfréquentation touristique des sites naturels les plus fragiles est un défi de notre temps auquel nous devons apporter des réponses. Sensibiliser les vacancier·es, baliser et aménager les sites et organiser leur accès de manière à éviter leur saturation sont des leviers qui permettront de protéger les espèces et la biodiversité."}]}]}],"short":"Plan ruralités","content_sha256":"6c65fd4cab466ee658fec04dac09855ea3b134313087edcef4c5954e885f2843"},{"code":"PI-BTP","kind":"plan_investissement","title":"BTP et logement","url":"https://melenchon2027.fr/programme/plans-investissement/btp-logement/","modified":"2026-10-10T18:00:26","units":[{"code":"PI-BTP","part":null,"title":"BTP et logement","url":"https://melenchon2027.fr/programme/plans-investissement/btp-logement/","sections":[{"title":"L’échec de Macron et du marché","depth":1,"path":["L’échec de Macron et du marché"],"blocks":[]},{"title":"La France face à une crise du logement sans précédent","depth":2,"path":["L’échec de Macron et du marché","La France face à une crise du logement sans précédent"],"blocks":[{"kind":"texte","text":"L’organisation du logement en un vaste marché a totalement échoué à garantir un logement digne à toutes et tous. En haut de l’échelle, 3,5 % des ménages possèdent plus de 5 logements et détiennent à eux seuls la moitié des logements en location. De l’autre côté, selon le 31e rapport de la Fondation pour le logement des défavorisés, la France compte désormais 350 000 personnes sans domicile fixe, un chiffre qui a plus que doublé en 10 ans. 2,8 millions de ménages sont en attente d’un logement public, contre 2,1 millions en 2017. Autre indicateur alarmant : 24 556 expulsions locatives ont été réalisées en 2024 avec le concours de la force publique, un record historique découlant principalement de la loi Kasbarian-Bergé, en hausse de 29 % en un an et de 223 % en vingt ans. Dans le même temps, le nombre de logements vacants n’a jamais été aussi important : près de 10 % du parc, soit plus de 3 millions de logements, sont vacants dont plus d’un million depuis au moins 2 ans."},{"kind":"texte","text":"Cette crise est alimentée par une forte baisse du nombre de nouveaux logements disponibles : 20 % sur les mandats Macron par rapport à la moyenne depuis 40 ans. Le parc de résidences principales s’est accru de seulement 270 000 logements en moyenne par an. La chute de production de logements publics est encore plus significative. Alors que 124 000 logements publics étaient financés en 2016, ce chiffre est tombé sous la barre des 100 000 par an depuis 2020 sous l’effet des coupes successives du gouvernement dans les opérateurs de logements sociaux (baisse des aides à la pierre, « réduction de loyer de solidarité », etc.)."},{"kind":"texte","text":"Dans ce contexte marqué par la pénurie de logements abordables, les propositions émises dans le débat public pour liquider le logement public, comme par exemple l’abrogation de la loi SRU, sont irresponsables. Le « Plan relance logement » et sa mesure phare, le « dispositif Jeanbrun » (une réduction d’impôt pour les propriétaires bailleurs) misent quasi exclusivement sur la construction neuve, oubliant son impact écologique et les solutions complémentaires (remise sur le marché de logements vacants, réduction de la multipropriété, etc.). Ce dispositif n’a atteint que 5 % de son objectif."},{"kind":"texte","text":"Enfin, le décrochage des revenus face aux prix immobiliers continue de se creuser. Entre 2010 et 2023, les prix immobiliers ont progressé deux fois plus vite que les salaires dans les grandes villes françaises. Le logement représente désormais 28 % du budget des ménages et souvent bien davantage dans les zones tendues !"}]},{"title":"Le retard écologique s’est accumulé","depth":2,"path":["L’échec de Macron et du marché","Le retard écologique s’est accumulé"],"blocks":[{"kind":"texte","text":"La pénurie de logements se double d’un déficit de qualité des logements : plus de 3 millions de passoires énergétiques subsistent parmi les résidences principales et plus de 4 millions dans l’ensemble du parc, avec pour conséquences des factures énergétiques qui explosent l’hiver et une dégradation de la salubrité. En parallèle, les logements peuvent devenir invivables en période de canicule : près de la moitié des logements sont des bouilloires thermiques."},{"kind":"texte","text":"Les objectifs affichés de rénovation énergétique des logements des gouvernements Macron n’ont été suivis d’aucun dispositif et moyens à la hauteur. Déjà très insuffisant car il ne repose que sur l’initiative individuelle et est inadapté aux classes moyennes et populaires, le dispositif MaPrimeRénov’ a pâti de coupes drastiques, d’une suspension temporaire faute de moyens, de durées d’instructions bien trop longues, de l’instabilité chronique des modalités d’attributions et des montants associés ainsi que de changements incessants de périmètre. Les objectifs de rénovation n’ont de plus pas tenu compte du confort d’été et de l’habitabilité des logements lors des canicules qui doivent être une priorité."},{"kind":"texte","text":"Les politiques d’incitation en matière de chauffage ont été complètement incohérentes par rapport aux objectifs climatiques du secteur du bâtiment. La fiscalité sur l’électricité a en particulier été augmentée à un niveau deux fois supérieur à celle sur le gaz. Ainsi, le nombre de logements chauffés au gaz continue d’augmenter tandis que la demande en pompes à chaleur air-eau a été divisée par deux en 2024 et 2025 par rapport aux années 2021-2023."},{"kind":"texte","text":"Le secteur du logement représente pourtant 15 % de nos émissions de gaz à effet de serre. L’amélioration écologique du bâti tant pour l’existant que pour les nouvelles constructions est un impératif à la fois pour la dignité de la vie populaire et pour l’atténuation du changement climatique. Pour ces raisons, l’heure n’est sûrement pas à revenir en arrière sur les normes écologiques dans le bâtiment que ce soit concernant la performance énergétique ou la qualité des constructions."}]},{"title":"Les besoins auxquels nous devons répondre avec les objectifs associés","depth":1,"path":["Les besoins auxquels nous devons répondre avec les objectifs associés"],"blocks":[{"kind":"texte","text":"Le plan d’investissement productif pour le secteur de la construction et de la rénovation vise à garantir l’accès à un logement digne pour toutes et tous et à mettre le secteur du bâtiment sur la trajectoire de respect des objectifs environnementaux en matière d’émissions de gaz à effet de serre, d’artificialisation des sols et de déchets."}]},{"title":"Atteindre 400 000 nouveaux logements abordables par an dans les 5 prochaines années, dont 200 000 logements publics, par le biais d’une planification pluriannuelle et territorialisée","depth":2,"path":["Les besoins auxquels nous devons répondre avec les objectifs associés","Atteindre 400 000 nouveaux logements abordables par an dans les 5 prochaines années, dont 200 000 logements publics, par le biais d’une planification pluriannuelle et territorialisée"],"blocks":[{"kind":"texte","text":"Notre plan vise à répondre aux besoins de l’ensemble de la population en matière de logement, tels qu’estimés par la Fondation pour le logement des défavorisés, qui les évalue à 400 000 nouveaux logements par an (contre 270 000 en moyenne ces dernières années), et par l’Union sociale pour l’habitat, qui préconise 200 000 logements publics par an (contre 100 000 actuellement)."},{"kind":"texte","text":"Plus de 35 % de ces logements seront créés par la mobilisation du parc existant (réquisition de logements vacants par la loi, renforcement de la taxation sur les logements vacants, changement d’usage, limitation des Airbnb, conventionnement de logements dans le parc ancien), soit 150 000 logements par an. En particulier, la transformation de locaux d’activités aujourd’hui inutilisés (bureaux, entrepôts, locaux commerciaux, bâtiments publics) en logements représente 25 000 logements par an sur les dernières années selon la Caisse des dépôts. Nous doublerons ce montant pour atteindre 50 000 logements par an."},{"kind":"texte","text":"Ces 400 000 nouveaux logements par an devront tous être des logements abordables. 200 000 d’entre eux seront des logements publics, dont 140 000 logements « très sociaux » (dits « PLAI ») comme le préconise la Fondation pour le logement des défavorisés. Nous prévoirons des logements adaptés aux séniors (40 000 par an), aux jeunes étudiant·es et jeunes actifs (30 000 par an) et des logements destinés à l’hébergement d’urgence (10 000 par an)."},{"kind":"texte","text":"Les communes et leurs intercommunalités ont un rôle indispensable dans la production de logements. Nous renforcerons le soutien financier de l’État aux communes qui participent aux objectifs de production de logement de qualité et accessibles pour répondre au besoin de services publics renforcés et augmenterons les sanctions en cas de non-respect de la loi SRU, tout en réhaussant ses objectifs. Pour accélérer le rythme des constructions et en concertation avec les élus locaux, nous pourrons avoir recours aux outils d’urbanisme exceptionnels qui existent dans notre droit, comme les opérations d’intérêt national (OIN)."},{"kind":"texte","text":"L’ensemble des nouveaux logements produits devra correspondre aux meilleures normes écologiques et d’accessibilité. Ils feront l’objet d’un soin esthétique et architectural particulier car l’apparence du logement fait partie intégrante de la qualité de vie des habitant·es."}]},{"title":"Renforcer l’accession à la propriété non spéculative","depth":2,"path":["Les besoins auxquels nous devons répondre avec les objectifs associés","Renforcer l’accession à la propriété non spéculative"],"blocks":[{"kind":"texte","text":"Accéder à la propriété de son logement est une aspiration largement partagée dans notre société. Mais confier cette aspiration aux mécanismes du marché est la meilleure manière de la réserver dans les faits aux classes les plus fortunées. Ainsi, depuis les années 1990, la part des jeunes ménages populaires qui réussit à accéder à la propriété de leur logement est en forte régression (de 34 % à 16 %)."},{"kind":"texte","text":"Nous allons développer l’accession à la propriété non spéculative, notamment à travers le mécanisme du « bail réel solidaire », aujourd’hui sous exploité, en accordant aux organismes qui gèrent ces terrains des prêts bonifiés du pôle public bancaire et en mobilisant le foncier public. Nous utiliserons également l’arme de l’encadrement des prix du foncier prévu par L’Avenir en commun. Enfin, le pôle public bancaire sera aussi mobilisé pour permettre l’accès au crédit aidé pour acheter son logement, mais toujours associé de clauses anti-spéculatives. Dans un contexte de hausse des taux d’intérêts, il proposera des prêts plus avantageux et permettra de réduire l’apport personnel qui empêche souvent les primo accédant·es d’obtenir un crédit."}]},{"title":"Favoriser l’éco construction, en particulier via le recours aux matériaux biosourcés et géosourcés (bois, terre, paille…)","depth":2,"path":["Les besoins auxquels nous devons répondre avec les objectifs associés","Favoriser l’éco construction, en particulier via le recours aux matériaux biosourcés et géosourcés (bois, terre, paille…)"],"blocks":[{"kind":"texte","text":"Le secteur de la construction reste l’un des plus consommateurs de ressources et émetteurs de gaz à effet de serre en France, notamment via le béton, dont la fabrication est particulièrement difficile à décarboner. Développer le bois, la paille, la terre crue, le lin et le chanvre, dont les vertus d’isolation sont grandes, en parallèle des efforts de décarbonation de l’industrie du ciment, permet de réduire significativement l’empreinte carbone d’une construction neuve tout en valorisant des filières locales et renouvelables."},{"kind":"texte","text":"Nous ajouterons aux objectifs d’utilisation de matériaux dans les chantiers relevant de la commande publique les matériaux géosourcés aujourd’hui absents, comme la terre crue, puis relèverons la part des rénovations lourdes ou constructions dans la commande publique faisant intervenir un matériau biosourcé ou géosourcé à 50 % d’ici 2032. Les filières biosourcées représentent un important potentiel de développement industriel et d’emplois non délocalisables, à condition de lever les freins de coût et d’industrialisation qui limitent encore leur passage à l’échelle. Elles nécessitent par exemple des investissements en matière de modernisation des scieries, de création de zones de stockage de la paille ou encore d’unités de tri et de transformation de la terre crue."}]},{"title":"Refaire l’isolation d’au moins 700 000 logements par an pour éradiquer les passoires et bouilloires thermiques","depth":2,"path":["Les besoins auxquels nous devons répondre avec les objectifs associés","Refaire l’isolation d’au moins 700 000 logements par an pour éradiquer les passoires et bouilloires thermiques"],"blocks":[{"kind":"texte","text":"Le rythme actuel des rénovations globales, très inférieur aux objectifs fixés par l’État, ne permet pas de résorber le stock de passoires thermiques avant des décennies. Il est totalement déconnecté de la trajectoire de baisse nécessaire de la consommation énergétique des logements. Pour rénover l’ensemble des passoires thermiques sur la durée du quinquennat, il faut atteindre plus de 700 000 isolations de qualité de logements par an. En particulier, 150 000 logements publics doivent être rénovés chaque année selon l’Union sociale pour l’habitat, soit une hausse de plus de 50 % du rythme actuel."},{"kind":"texte","text":"Pour atteindre ces niveaux sans faire peser de charge sur les ménages modestes, nous mettrons en place un dispositif d’appui public de 100 % du montant des travaux pour les plus modestes, puis dégressif en fonction du niveau de revenus, en excluant les multipropriétaires qui détiennent plus de 5 logements. Le reste à charge sera couvert par des gammes de prêts (prêts de long terme, remboursements différés, etc.) adaptés aux bénéficiaires en lien avec pôle public bancaire. Les ménages bénéficieront d’économies sur leur facture d’énergie après les travaux et les rénovations prendront en compte le confort d’été. Enfin, pour garantir que ces rénovations soient faites à des prix justes et répondent à des normes de qualité, nous conditionnerons l’obtention de labels écologiques à des résultats énergétiques concrets."}]},{"title":"Lancer un grand plan de rénovation et d’adaptation des bâtiments publics, associatifs et tertiaires privés","depth":2,"path":["Les besoins auxquels nous devons répondre avec les objectifs associés","Lancer un grand plan de rénovation et d’adaptation des bâtiments publics, associatifs et tertiaires privés"],"blocks":[{"kind":"texte","text":"Si les logements représentent les trois quarts de la surface immobilière du pays, une politique efficace de rénovation thermique doit aussi s’appliquer au reste des bâtiments."},{"kind":"texte","text":"Les bâtiments publics représentent 30 % du parc tertiaire et 10 % du parc national total. Or, les moyens sont actuellement totalement inadaptés pour atteindre les objectifs de baisse de 50 % de la consommation d’énergie des bâtiments publics d’ici 2040 et de 100 % des bâtiments publics adaptés aux vagues de chaleur, mais également pour garantir leur accessibilité aux personnes handicapées ou à mobilité réduite."},{"kind":"texte","text":"Pour y remédier, nous lancerons un véritable plan de rénovation des bâtiments publics en augmentant les dépenses de l’État sur son patrimoine et les financements à destination des collectivités."},{"kind":"texte","text":"Pour les bâtiments privés (bureaux, entrepôts, etc.), le décret tertiaire fixe un objectif de réduction de la consommation énergétique de 40 % d’ici 2030 puis 50 % en 2040. L’État a complètement abandonné ses ambitions en coupant les financements et en laissant les TPE-PME et les associations souvent sans solution car elles n’ont pas de visibilité sur plusieurs années et ont des difficultés à s’endetter."},{"kind":"texte","text":"Pour atteindre les objectifs et accélérer la cadence, nous aurons d’un côté une réponse réglementaire pour favoriser les rénovations globales plutôt que les petits gestes qui permettent d’atteindre un palier sans résoudre les problèmes structurels."},{"kind":"texte","text":"De l’autre côté, nous rétablirons un système de soutien aux TPE-PME, donnerons accès à des prêts adaptés et avantageux avec le pôle public bancaire et accorderons une attention particulière aux associations dans ces dispositifs."}]},{"title":"Protéger la population face aux canicules","depth":2,"path":["Les besoins auxquels nous devons répondre avec les objectifs associés","Protéger la population face aux canicules"],"blocks":[{"kind":"texte","text":"Les conséquences sanitaires de la canicule de juin-juillet 2026, avec plus de 8 000 morts recensés à ce stade, ont rappelé l’urgence sanitaire d’adapter les logements dont près de la moitié sont des bouilloires thermiques mais également les écoles, EHPAD ou encore hôpitaux. La période a mis en lumière les besoins d’interventions à court terme et de planification de travaux plus importants."},{"kind":"texte","text":"Dès notre arrivée au pouvoir en 2027, nous mettrons en place un plan d’urgence pour préparer l’été. Les bailleurs privés et les grands bailleurs sociaux devront repérer les logements les plus à risque et planifier des interventions simples qui améliorent rapidement le confort en réduisant de plusieurs degrés la température en cas de vague de chaleur : protections solaires, stores, occultations, brasseurs d’air, etc. Des diagnostics et des interventions rapides du même type seront menés pour les bâtiments publics. Des exemples de réussite existent en la matière comme l’école de Grabels où l’ancien maire insoumis René Revol a mis en place des solutions efficaces et peu chères."},{"kind":"texte","text":"Nous planifierons ensuite les travaux d’adaptation de plus long terme nécessaires pour éradiquer les bouilloires thermiques. Pour les écoles, EHPAD et hôpitaux qui le nécessitent, nous planifierons et investirons dans les rénovations plus lourdes et installerons en cas de besoin des dispositifs de climatisation moins énergivores que les climatiseurs mobiles parfois achetés en urgence, par exemple en développant les réseaux de froid."},{"kind":"texte","text":"Pour atteindre ces objectifs, nous intégrerons le confort thermique et l’adaptation aux vagues de chaleur dans les critères des rénovations et conditionnerons les financements publics à leur prise en compte. Nous instaurerons également pour les locataires un droit opposable aux travaux en matière de confort thermique. En matière de financement et en complément du programme de 700 000 rénovations par an, nous investirons dès notre arrivée au pouvoir dans un grand plan d’installation de volets et de brasseurs d’air, en priorisant les logements publics, comme le préconise la Fondation pour le logement des défavorisés."}]},{"title":"Sortir progressivement du chauffage fossile partout où c’est possible","depth":2,"path":["Les besoins auxquels nous devons répondre avec les objectifs associés","Sortir progressivement du chauffage fossile partout où c’est possible"],"blocks":[{"kind":"texte","text":"Le chauffage au fioul ou au gaz est l’une des principales sources d’émissions de CO2 du secteur résidentiel. C’est également un enjeu de souveraineté énergétique pour réduire la dépendance de la France aux importations d’hydrocarbures et à la volatilité de leurs prix."},{"kind":"texte","text":"Si l’installation de chaudières au fioul est désormais interdite, les chaudières à gaz restent autorisées et les ventes repartent à la hausse depuis 2023. Substituer ces équipements par des solutions bas-carbone (pompes à chaleur, géothermie, réseaux de chaleur, etc), partout où cela est possible (notamment, mais pas uniquement, pour les maisons individuelles) permet donc d’accélérer la décarbonation au bénéfice des ménages. Nous viserons le remplacement de 400 000 chaudières au fioul par an (quatre fois plus qu’aujourd’hui) pour quasiment les faire disparaître en 2032, et de 350 000 chaudières à gaz par an pour atteindre les objectifs de la Stratégie nationale bas carbone."},{"kind":"texte","text":"Pour atteindre ces objectifs, nous renforcerons les aides à l’achat pour les équipements bas-carbone de remplacement, en particulier pour les ménages populaires pour qui leur coût peut constituer un frein majeur. Les travaux de rénovations des logements prendront aussi en compte le changement du mode de chauffage pour le cas des immeubles chauffés au gaz où les remplacements individuels sont difficiles."}]},{"title":"Réduire la quantité de déchets et développer le réemploi","depth":2,"path":["Les besoins auxquels nous devons répondre avec les objectifs associés","Réduire la quantité de déchets et développer le réemploi"],"blocks":[{"kind":"texte","text":"Le BTP est le premier producteur de déchets en France : il représente environ 227 millions de tonnes par an, soit près de 70 % du total des déchets produits dans le pays. Pour le bâtiment, l’introduction en 2023 d’une Responsabilité élargie du producteur (REP) des produits et matériaux de construction devait permettre de structurer la filière de traitement de ces déchets, mais la mise en œuvre a été chaotique : manque de points de collectes, lourdeurs administratives, non-coopération de certains éco-organismes, etc. Surtout, elle ne favorise ni l’optimisation des ressources à la construction, ni le réemploi en aval qui représente moins d’1 % des déchets aujourd’hui. Si les déchets sont théoriquement valorisés à 70 %, cela relève pour une large part du remblaiement de carrière, ce qui relève plus de l’élimination déguisée que du recyclage."},{"kind":"texte","text":"Notre objectif sera de structurer une véritable filière du réemploi en le valorisant dans les critères de la commande publique. Nous fixerons, comme le prônent les acteurs du réemploi, un objectif d’augmentation de 75 % par an de la quantité de déchets réemployés dans les constructions sur le quinquennat."},{"kind":"texte","text":"Pour cela, en plus des questions règlementaires concernant l’accès aux gisements ou de gouvernance des éco-organismes, il faudra apporter un soutien aux structures du réemploi en particulier en matière de collecte préservante et de transport des déchets collectés."}]},{"title":"Structurer et soutenir la filière de la rénovation énergétique et de la construction bas-carbone et former des professionnels qualifiés","depth":2,"path":["Les besoins auxquels nous devons répondre avec les objectifs associés","Structurer et soutenir la filière de la rénovation énergétique et de la construction bas-carbone et former des professionnels qualifiés"],"blocks":[{"kind":"texte","text":"La rénovation et la construction bas-carbone mettent en jeu des savoir-faire précis. Les objectifs ne pourront être atteints sans une main-d’œuvre qualifiée en nombre suffisant. Or le secteur souffre d’un déficit chronique d’artisans formés aux techniques d’isolation performante, aux matériaux biosourcés, à l’installation de pompes à chaleur ou aux rénovations globales, ce qui freine la montée en puissance des dispositifs existants malgré les financements disponibles."},{"kind":"texte","text":"Nous nous fixerons comme priorité de structurer des filières de formation (initiale et continue) avec pour objectif la formation de 250 000 salarié·es d’ici 2030. Nous le ferons en sécurisant les débouchés professionnels sur le long terme et en soutenant directement la formation dans le secteur."}]},{"title":"Assurer l’entretien du patrimoine du pays","depth":2,"path":["Les besoins auxquels nous devons répondre avec les objectifs associés","Assurer l’entretien du patrimoine du pays"],"blocks":[{"kind":"texte","text":"Deux tiers des monuments du pays nécessitent des travaux selon le ministère de la Culture et 8 000 sont en péril ou en mauvais état. Pourtant, le gouvernement a choisi de faire des économies sur l’entretien du patrimoine en 2026. Les filières de métiers d’art sollicitées sur ces travaux font aussi les frais des baisses de crédits. Nous nous donnerons l’objectif de doubler le nombre annuel de monuments dont l’état s’améliore, en multipliant par 2 le budget public dédié."}]},{"title":"Investir dans la maîtrise publique du foncier","depth":2,"path":["Les besoins auxquels nous devons répondre avec les objectifs associés","Investir dans la maîtrise publique du foncier"],"blocks":[{"kind":"texte","text":"L’accès au foncier est un des leviers clés pour accélérer la production de logements. La puissance publique d’une part dispose de nombreux fonciers mobilisables (collectivités, SNCF, etc.) et d’autre part de plusieurs outils pour assurer une maîtrise publique, notamment dans les zones tendues avec le droit de préemption urbain, la déclaration d’utilité publique, etc. La maîtrise publique foncière permet de produire des logements à faible prix (bail réel solidaire, accession sociale, logement locatif social)."},{"kind":"texte","text":"L’action et les moyens des établissements publics fonciers doivent être renforcés pour accélérer la maîtrise. Ces actions seront menées en parallèle d’un encadrement des prix du foncier qui évitera la spéculation et permettra de multiplier l’efficacité des investissements."}]},{"title":"Les investissements supplémentaires","depth":1,"path":["Les investissements supplémentaires"],"blocks":[{"kind":"texte","text":"Les sommes présentées dans ce tableau représentent les investissements supplémentaires nécessaires par rapport aux dépenses déjà existantes. Elles seront prises en charge par l’État mais aussi par d’autres opérateurs comme le pôle public bancaire, qui pourront apporter des prêts avantageux voire des soutiens directs."},{"kind":"texte","text":"En s’appuyant notamment sur les travaux de la Dares et de France Stratégie, nous pouvons estimer qu’avec la montée en puissance de la rénovation thermique et de l’adaptation aux vagues de chaleur, le développement des filières de matériaux biosourcés, le soutien aux rénovations du patrimoine, le développement du réemploi, le plan d’investissement productif BTP/logement créera plus de 300 000 emplois."},{"kind":"texte","text":"EN MILLIARDS D’EUROS PAR AN"},{"kind":"tableau","text":"Axe d’investissement | État | Pôle public bancaire et autres acteurs\nNouveaux logements publics | 3,1 | 14\nRénovation des logements sociaux | 0,25 | 1,5\nIsolation des logements | 5,3 | 5,3\nPlan confort d’été | 0,5 | 0,6\nRénovation des bâtiments publics, associatifs et des bâtiments tertiaires privés | 1 | 9\nDéveloppement de la construction bois-terre-paille |  | 0,2\nSortie des chaudières fioul et diminution du nombre de chaudières à gaz | 1 | 2,2\nFormation de professionnels de la rénovation et de la construction bas-carbone | 0,06 | \nRéduction des déchets et réemploi | 0,2 | 0,5\nRénovation et entretien du patrimoine | 0,6 | \nMaîtrise publique du foncier |  | 0,3\nAccession à la propriété non spéculative |  | 2\nTotal par an d’investissements supplémentaires de l’état | 12 milliards d’euros | ","rows":[["Axe d’investissement","État","Pôle public bancaire et autres acteurs"],["Nouveaux logements publics","3,1","14"],["Rénovation des logements sociaux","0,25","1,5"],["Isolation des logements","5,3","5,3"],["Plan confort d’été","0,5","0,6"],["Rénovation des bâtiments publics, associatifs et des bâtiments tertiaires privés","1","9"],["Développement de la construction bois-terre-paille","","0,2"],["Sortie des chaudières fioul et diminution du nombre de chaudières à gaz","1","2,2"],["Formation de professionnels de la rénovation et de la construction bas-carbone","0,06",""],["Réduction des déchets et réemploi","0,2","0,5"],["Rénovation et entretien du patrimoine","0,6",""],["Maîtrise publique du foncier","","0,3"],["Accession à la propriété non spéculative","","2"],["Total par an d’investissements supplémentaires de l’état","12 milliards d’euros",""]]}]}]}],"short":"Investissement BTP & logement","content_sha256":"8f51e4bdb92fbbef869a929edafceea4712c9470dfd21ef97213ee9a1165db48"},{"code":"PI-AUTO","kind":"plan_investissement","title":"Automobile","url":"https://melenchon2027.fr/programme/plans-investissement/automobile/","modified":"2026-10-16T19:24:42","units":[{"code":"PI-AUTO","part":null,"title":"Automobile","url":"https://melenchon2027.fr/programme/plans-investissement/automobile/","sections":[{"title":"L’échec de Macron et du marché","depth":1,"path":["L’échec de Macron et du marché"],"blocks":[{"kind":"texte","text":"L’industrie automobile a été profondément affaiblie sous Emmanuel Macron par les choix stratégiques des constructeurs avec la complicité des gouvernements successifs."},{"kind":"texte","text":"Les chiffres sont révélateurs de cet échec. Le nombre de voitures produites en France a chuté de plus de 40 %, passant de 1,7 million en 2017 à 1 million en 2025 dont seulement 300 000 voitures électriques, très loin du million fixé comme objectif pour 2027 par Emmanuel Macron. La France est ainsi le pays européen qui s’est le plus désindustrialisé dans l’automobile ces 20 dernières années. La balance commerciale est devenue négative dès 2007, bien avant l’arrivée des voitures électriques."},{"kind":"texte","text":"En cause d’abord les constructeurs qui, pour dégager des rendements mirobolants sous la pression de leurs actionnaires, ont accéléré les délocalisations qui font chuter la production et l’emploi depuis 20 ans. En 10 ans, la part de la production de Renault et Stellantis située dans des pays à bas coûts a grimpé respectivement de 9 et 13 points. Plusieurs sites de production ont fermé leurs portes (fin de la production en 2024 sur le site de Flins de Renault par exemple) et ce n’est pas terminé : Stellantis a annoncé la fin de l’assemblage de véhicules sur le site historique de Poissy ainsi que l’arrêt de ses usines de Sochaux, Rennes et Mulhouse pendant une à deux semaines en octobre, alors que le groupe décide de faire fabriquer la nouvelle 2CV électrique en Italie !"},{"kind":"texte","text":"Les constructeurs ont initié et organisé un véritable plan de délocalisation dans toute la filière, avec à la clé une myriade d’établissements équipementiers qui licencient et ferment. L’État, pourtant actionnaire de Renault, Stellantis, Forvia ou encore Valeo, accompagne le mouvement en silence. Pire, alors qu’il aurait pu conditionner son soutien financier et utiliser ses droits de vote au maintien de la production et des emplois en France, il a massivement soutenu les constructeurs à grands coups d’argent public (plus de 17 milliards d’euros entre 2018 et 2024 !), sans contrepartie ni exigence que ces aides aillent à la fabrication de véhicules en France et a fermé les yeux sur les fraudes au chômage partiel."},{"kind":"texte","text":"Pire : le gouvernement a encore aggravé la situation en supprimant en 2024 la prime à la conversion de véhicules anciens (prime à la casse) puis en divisant par deux le bonus écologique en 2025. Conditionné à un score environnemental (éco-score), ce bonus permet pourtant de favoriser l’achat de véhicules électriques fabriqués en France. Il n’a cessé de faire des allers-retours réglementaires et budgétaires, une inconsistance qui mine la prévisibilité nécessaire pour les industriels."},{"kind":"texte","text":"En matière sociale, le bilan est tout aussi désastreux. Entre 2010 et 2023, 140 000 emplois ont été supprimés dans le secteur, soit un tiers du total ! L’hémorragie est particulièrement nette chez les équipementiers et fournisseurs qui ont perdu près de 100 000 emplois sur la période, à cause des choix des constructeurs qui les ont abandonnés face à la concurrence internationale. Cette saignée frappe en premier lieu les ouvriers mais aussi de plus en plus les techniciens et les ingénieurs avec des délocalisations en cascade de bureaux d’études et de centres de recherche et développement : Renault veut par exemple supprimer 2000 postes d’ingénieurs d’ici 2028 et préfère avoir recours à des équipes chinoises. Au contraire, la Chine mise fortement sur l’ingénierie, l’innovation et les capacités de conception. Le désinvestissement dans l’ingénierie condamne la France à perdre toute autonomie stratégique dans le secteur."},{"kind":"texte","text":"La tendance n’est pas près de s’améliorer : Forvia est engagé dans un plan de suppression de 10000 emplois en Europe, Valeo est en train de supprimer près de 900 postes, etc. Au-delà du nombre d’emplois, la qualité des emplois et des conditions de travail se dégrade fortement : recours croissant à l’intérim, intensification des cadences, accords de « compétitivité », etc."},{"kind":"texte","text":"L’écologie et le pouvoir d’achat des Français ont été sacrifiés « en même temps ». Les transports sont ainsi le seul secteur dont les émissions de gaz à effet de serre n’ont pas baissé depuis 1990, notamment en ce qui concerne les véhicules individuels, qui représentent la moitié des émissions liées au transport. Non seulement le gouvernement a échoué à rendre accessibles les alternatives à la voiture, mais il est très en retard dans l’électrification du parc de véhicules."},{"kind":"texte","text":"Les constructeurs français ont progressivement abandonné leurs modèles de citadines abordables pour multiplier les modèles de SUV (gamme de grosses voitures familiales au design de 4×4) sur lesquels ils espèrent pouvoir bénéficier de marges plus confortables. Un choix complètement irresponsable sur le plan climatique : les SUV sont la deuxième source de hausse des émissions de gaz à effet de serre dans le pays sur les 10 dernières années. Ils représentent également plus de 40 % de la production de véhicules électriques, alors qu’un seul SUV nécessite 5 fois plus de lithium, nickel et cobalt qu’une petite citadine électrique."},{"kind":"texte","text":"La stratégie de « valeur plutôt que volume » poussée par les actionnaires et validée par le gouvernement a consisté à raréfier l’offre, relever les prix et privilégier les SUV et les modèles supérieurs plus rémunérateurs à court terme, plutôt que la production de masse pour un public populaire qui était pourtant le positionnement historique des constructeurs français. Les voitures sont donc devenues encore plus inaccessibles qu’avant pour les milieux populaires et intermédiaires : le prix moyen des véhicules vendus en France est passé de 20 000 euros en 2011 à plus de 35 000 euros aujourd’hui pendant que la Chine faisait, elle, baisser le prix de ses voitures électriques, devenues moins chères que ses véhicules thermiques. Par conséquent, seulement 5 % du parc de véhicules est électrifié en France contre plus de 10 % en Chine."},{"kind":"texte","text":"À court terme, les constructeurs et leurs actionnaires ont cru bénéficier d’une manne financière mais les volumes produits ont plongé, fragilisant toute la filière de sous-traitants tout en réservant de fait le marché du neuf à la minorité très étroite des ménages les plus aisés. Résultat : les marges ayant finalement baissé plus qu’anticipé, les constructeurs subissent désormais simultanément la baisse des volumes et l’érosion de leurs marges."},{"kind":"texte","text":"Stellantis en est le cas le plus emblématique. Carlos Tavares a incarné jusqu’à la caricature ce capitalisme automobile de court terme : produire moins, vendre plus cher et dégager des marges exceptionnelles pour rémunérer les actionnaires. Alors que Stellantis a versé 8 milliards d’euros de dividendes en 2024, le groupe a mis à l’arrêt la dernière usine automobile de Seine-Saint-Denis (MA France). Le montant du bonus exceptionnel touché par Tavares aurait à lui seul permis de maintenir l’emploi dans cette usine. Cette stratégie a semblé fonctionner, en apparence, quelques années, au prix d’une compression des investissements, de la dégradation des conditions de travail, de la qualité et de l’innovation et d’une fragilisation de l’appareil industriel. Ainsi, la gestion douteuse des difficultés du moteur PureTech ou les rappels d’airbags Takata mettent aujourd’hui l’entreprise, ses salarié·es et ses fournisseurs en butte à d’importantes difficultés associées à la forte dégradation de la réputation de ses marques."},{"kind":"texte","text":"Les constructeurs français accusent aussi un retard dans l’innovation de pointe. Dans le sillage des incohérences et revirements des constructeurs (allers-retours de Renault sur l’électrique, tentative de repousser au plus tard l’électrification côté Stellantis), beaucoup de retard a été pris sur l’innovation en matière de batteries et sur la structuration de tout l’écosystème industriel indispensable pour développer la production française de batte-ries. Désormais, les grandes annonces de projets se heurtent aujourd’hui au retard massif qui a été pris sur la Chine qui a elle misé dessus depuis 2015."},{"kind":"texte","text":"La course aux véhicules de demain, par exemple les véhicules autonomes, les nouveaux types de batteries ou de transports collectifs se joue donc unique-ment en Chine ou du côté de la Silicon Valley. Ce retard vient au détriment de notre souveraineté et de notre capacité à décider de façon autonome de la manière dont ces technologies pourraient être déployées."}]},{"title":"Les besoins et objectifs associés","depth":1,"path":["Les besoins et objectifs associés"],"blocks":[{"kind":"texte","text":"La politique industrielle automobile doit répondre aux besoins de déplacements des Français·es, préserver les emplois, contribuer efficacement à la réduction des émissions de gaz à effet de serre et plus généralement de l’empreinte environnementale des véhicules. Elle doit donner aux acteurs économiques la visibilité qui a fait tant défaut ces dernières années. Elle doit également contribuer à réduire la consommation et les importations de pétrole et à faire faire des économies aux automobilistes, livrés à eux-mêmes face aux multiples soubresauts géopolitiques. C’est donc bien une question centrale pour la planification écologique que nous mettrons en place : il s’agit d’engager le pays sur la voie du respect de la règle verte tout en améliorant le pouvoir d’achat populaire."},{"kind":"texte","text":"La décarbonation des véhicules par l’électrification du parc automobile n’est pas, à elle seule, une solution miracle. La voiture électrique n’est pas neutre en carbone quand on prend en compte sa production. Son déploiement en remplacement de véhicules thermiques est crucial pour diminuer l’empreinte carbone et le recours aux fossiles au plus vite mais doit s’inscrire dans une politique globale visant à diminuer les déplacements contraints, par exemple en rapprochant les lieux de travail des lieux d’habitation, et à développer massivement les alternatives à l’usage de la voiture pour se déplacer : train, trans-ports en commun, vélo et véhicules intermédiaires."},{"kind":"texte","text":"Pour être efficace écologiquement et correspondre aux besoins des classes populaires et moyennes, la production de voitures électriques en France doit être prioritairement orientée vers les véhicules légers à prix modéré. L’impact carbone d’un véhicule électrique et son prix croissent presque proportionnellement avec son poids, qui dépend majoritairement de la capacité de stockage de sa batterie. La France pourrait ainsi devenir leader européen des véhicules électriques soutenables et abordables. En parallèle, la France doit se positionner sur les sauts technologiques pour ne pas reproduire les erreurs accumulées sur la voiture électrique et les batteries et préparer les véhicules du futur."},{"kind":"texte","text":"Dans sa prospective « Transitions 2050 » qui formule plusieurs scénarios permettant d’atteindre la neutralité carbone en 2050, l’ADEME vise l’objectif de 20 millions de véhicules particuliers électriques en circulation en 2040, soit 18 millions de véhicules à mettre en circulation en partant des 2 millions actuels (scénario 2 « Coopérations territoriales »). Cela implique un rythme d’électrification de 1,5 million de véhicules particuliers par an en moyenne, à comparer avec les quelque 500000 voitures électriques qui devraient être vendues en 2026."},{"kind":"texte","text":"Aujourd’hui, sur 1 million de voitures produites en France, seules 300 000 sont des modèles électriques. C’est donc la quasi-intégralité de la production des 700 000 voitures thermiques et hybrides fabriquées chaque année qu’il faudra convertir à l’électrique d’ici 2032, en priorisant les véhicules les plus polluants et inadaptés à la bifurcation écologique. Pour atteindre les 1,5 million de voitures électriques par an, nous planifierons dans le même temps la montée en charge des sites sous-utilisés pour relocaliser progressivement la production de 500000 voitures électriques supplémentaires par an. Cet objectif ne sera pas seulement mesuré en nombre de véhicules assemblés mais égale-ment en termes de valeur produite sur le territoire, en particulier au niveau des équipements1. Cette politique volontariste permettra d’anticiper l’interdiction à la vente des véhicules thermiques neufs prévue pour 2035 par l’Union européenne et de prendre un avantage décisif en amont de cette échéance."},{"kind":"texte","text":"Enfin, la conversion de la production en véhicules électriques concernera aussi les quelque 500000 utilitaires produits en France, soit au total 2 mil-lions de véhicules électriques (voitures et utilitaires) fabriqués chaque année en France d’ici 2032."},{"kind":"texte","text":"La conversion d’un site d’assemblage à l’électrique conserve l’essentiel des ateliers d’emboutissage, de ferrage, de peinture et de montage final. Les investissements portent surtout sur l’intégration des batteries, les équipements haute tension, la logistique, la sécurité incendie, les contrôles électriques et logiciels et la formation. En revanche, pour les sites de moteurs, boîtes de vitesses, injection et échappements, nous déploierons de véritables projets de reconversion vers les moteurs électriques, l’électronique de puissance, les packs batteries élaborés avec les salariés concernés et leurs représentants."},{"kind":"texte","text":"Au sein des voitures produites, nous fixerons des objectifs ambitieux en matière de petits véhicules légers. En particulier, nous viserons une forte hausse de la part de véhicules de segment A, les plus petits et légers comme les Twingo, dans les ventes (seulement 5 % aujourd’hui). Cette hausse sera portée par le développement de modèles français de kei cars (très petites voitures inventées dans le Japon de l’après-guerre) et de petites citadines populaires qui ont fait le succès de l’automobile française. Nous viserons également une légère augmentation de la part du segment B (Clio, 208, R5 électrique par exemple), et des véhicules familiaux subsisteront en complément pour s’adapter à toutes les situations tout en réduisant l’impact écologique global.","md":"Au sein des voitures produites, nous fixerons des objectifs ambitieux en matière de petits véhicules légers. En particulier, nous viserons une forte hausse de la part de véhicules de segment A, les plus petits et légers comme les Twingo, dans les ventes (seulement 5 % aujourd’hui). Cette hausse sera portée par le développement de modèles français de *kei cars* (très petites voitures inventées dans le Japon de l’après-guerre) et de petites citadines populaires qui ont fait le succès de l’automobile française. Nous viserons également une légère augmentation de la part du segment B (Clio, 208, R5 électrique par exemple), et des véhicules familiaux subsisteront en complément pour s’adapter à toutes les situations tout en réduisant l’impact écologique global."},{"kind":"texte","text":"Le principal obstacle à la production de 2 millions de véhicules électriques produits en France n’est pas la capacité d’assemblage final. Les usines françaises sont aujourd’hui sous-utilisées (seulement 50 % de leurs capacités) et disposent encore de marges importantes de montée en charge. Rien que sur son pôle Douai-Maubeuge, Renault visait initialement 400 000 véhicules produits par an au total, soit 250 000 de plus qu’actuellement."},{"kind":"texte","text":"L’enjeu est désormais de proposer un pacte productif entre l’État actionnaire et les constructeurs qui offre un cadre permettant cette montée en charge. Articulé autour de trois dimensions, ce pacte permettra de parvenir à la production de masse de véhicules électriques légers et abordables à partir de 10 000 euros."},{"kind":"texte","text":"Un environnement réglementaire et commercial adapté :"},{"kind":"puce","text":"Pour fabriquer en France, il faut prendre des mesures fortes de lutte contre les délocalisations et la concurrence internationale. Le différentiel de compétitivité entre la France, l’Europe de l’Est et la Chine est largement exagéré par les constructeurs pour justifier des délocalisations. En effet, la main-d’œuvre ne représente que 15 % du coût final d’une citadine électrique et les écarts de compétitivité vont fortement se réduire dans les années à venir. D’abord, la France et l’Europe sont confrontées à une très forte pression de la concurrence extra-européenne. Si rien n’est fait, l’électrification du parc se fera avec des voitures étrangères. Cela nécessite de prendre des mesures de protection du marché intérieur, non d’une manière excessive et hostile comme le fait Donald Trump, mais plutôt dans le cadre de partenariats commerciaux négociés. L’Union européenne a fait un pas dans cette direction avec un accord conclu avec la Chine, mais il ne porte que sur les voitures hybrides et ne porte aucune vision de long terme. En parallèle, nous nous fonderons sur des dispositifs objectifs appuyés sur l’impact écologique calculé sur tout le cycle de vie du véhicule, par exemple en renforçant le score environnemental (éco-score). Dans le même temps, la concurrence s’exerce aussi au sein même de l’Union européenne. Même si le marché européen était bien protégé, rien ne pousserait les constructeurs à relocaliser la production directement en France. Les dispositifs de soutien détaillés par la suite devront donc intégrer des critères de production française et pas seulement européenne, qui monteront en puissance chaque année pour accompagner la trajectoire de relocalisation.","depth":0,"id":"PI-AUTO-L001"},{"kind":"puce","text":"Pour que l’électrification soit véritablement écologique et populaire, il faut produire des véhicules plus petits et plus légers. L’Union européenne a récemment créé un segment M1E qui offre un cadre réglementaire incitant à orienter la production vers les petits véhicules électriques. Néanmoins, ces critères, adoptés sous la pression des Allemands pour favoriser leur industrie tournée vers les gros véhicules haut de gamme, sont trop larges : ils incluent des véhicules jusqu’à 4,2 mètres de longueur, soit bien plus que le segment A français (3,7 mètres) et que les kei cars japonaises (3,4 mètres), et de poids allant jusqu’à 1 500 kilos. Nous proposons de porter à l’échelle européenne une réforme distinguant les petits véhicules de moins de 3,6 mètres et 1 000 kilos et, en attendant, de créer une catégorie spécifique de réglementations en France pour favoriser les petits véhicules légers et abordables.","md":"Pour que l’électrification soit véritablement écologique et populaire, il faut produire des véhicules plus petits et plus légers. L’Union européenne a récemment créé un segment M1E qui offre un cadre réglementaire incitant à orienter la production vers les petits véhicules électriques. Néanmoins, ces critères, adoptés sous la pression des Allemands pour favoriser leur industrie tournée vers les gros véhicules haut de gamme, sont trop larges : ils incluent des véhicules jusqu’à 4,2 mètres de longueur, soit bien plus que le segment A français (3,7 mètres) et que les *kei cars* japonaises (3,4 mètres), et de poids allant jusqu’à 1 500 kilos. Nous proposons de porter à l’échelle européenne une réforme distinguant les petits véhicules de moins de 3,6 mètres et 1 000 kilos et, en attendant, de créer une catégorie spécifique de réglementations en France pour favoriser les petits véhicules légers et abordables.","depth":0,"id":"PI-AUTO-L002"},{"kind":"puce","text":"La France dispose d’un avantage compétitif très important : un prix de l’électricité parmi les plus bas d’Europe. Une politique sérieuse de réindustrialisation implique de fixer un prix national de l’électricité, émancipé du marché européen libéralisé.","depth":0,"id":"PI-AUTO-L003"},{"kind":"texte","text":"Des débouchés assurés :"},{"kind":"puce","text":"Les entreprises représentent environ la moitié des immatriculations neuves chaque année, soit 700000 véhicules par an, dont 30 % seule-ment sont électriques. Les incitations et réglementations pour pousser à l’achat de véhicules électriques sont beaucoup trop faibles. Pire, 60 % des entreprises ne respectent même pas leurs obligations. Nous mettrons en place une série de mesures pour y remédier : augmentation des seuils d’achat de véhicules électriques (90 % en 2030 contre 70 % actuellement), augmentation de l’amende à 10 000 euros par véhicule dans la limite de 10 % du chiffre d’affaires en cas de non-respect, respect de l’éco-score environnemental en place pour le bonus écologique, etc. La fin des incitations fiscales qui bénéficient encore aujourd’hui aux véhicules de fonction thermiques contribuera aussi à orienter la demande. Avec ces mesures, qui porteront uniquement sur les 3500 plus grandes entreprises du pays, nous garantirons des dé-bouchés aux véhicules électriques produits en France.","depth":0,"id":"PI-AUTO-L004"},{"kind":"puce","text":"Du côté des particuliers, l’État mettra en place une offre publique de location longue durée à des tarifs abordables. Ce seront ainsi plusieurs centaines de milliers de véhicules électriques français par an (1 million au total sur les trois premières années) dont l’achat sera garanti par la commande publique, avec des critères stricts de taille, poids et lieu français d’assemblage et d’approvisionnement en composants2.","depth":0,"id":"PI-AUTO-L005"},{"kind":"texte","text":"Des investissements pour convertir et créer de nouvelles lignes de production :"},{"kind":"puce","text":"Les soutiens aux nouvelles lignes seront attribués par appels à projets, avec prêts avantageux et prises de participation publiques lorsque le risque industriel le justifie. Ils couvriront prioritairement la conversion des lignes, l’intégration des batteries, l’électronique de puissance et la modernisation des sous-traitants. Les montants seront fixés sur la base d’un audit des investissements réellement additionnels et les emplois effectivement maintenus ou créés.","depth":0,"id":"PI-AUTO-L006"},{"kind":"puce","text":"Tout soutien public sera conditionné au respect des objectifs du plan via des conventions pluriannuelles opposables comportant des objectifs de production, de contenu local, d’emploi, d’investissement, de recherche et développement et de commandes aux sous-traitants. Leur non-respect entraînera remboursement, pénalités et exclusion temporaire des dispositifs publics. La Cour des comptes a largement documenté la mauvaise utilisation de l’argent public dans le secteur. Un moratoire sur les fermetures de site sera mis en place.","depth":0,"id":"PI-AUTO-L007"}]},{"title":"Mettre en place un service public de la location abordable","depth":2,"path":["Les besoins et objectifs associés","Mettre en place un service public de la location abordable"],"blocks":[{"kind":"texte","text":"L’orientation de l’offre vers un véhicule électrique à 10 000 euros permettra à des millions de ménages de classe moyenne d’accéder à une voiture électrique neuve, alors que celles-ci sont aujourd’hui trop chères. Pour autant, cela ne suffira pas pour que tous les milieux populaires puissent changer de voiture. Aujourd’hui, 8 millions de Français parmi les plus pauvres ont un véhicule polluant âgé de plus de 10 ans."},{"kind":"texte","text":"Le dispositif de leasing social, c’est-à-dire de location longue durée, activé épisodiquement par le gouvernement, rate largement sa cible. Du côté des ménages, il ne prévoit que 3 ans de location subventionnée : à la fin, rien ne garantit la poursuite de la location, encore moins au même prix, d’autant plus que les concessionnaires sont incités à les revendre à ce moment-là. Du côté budgétaire, le coût du dispositif est très élevé avec une moyenne de 7500 à 9 500 euros de subvention par véhicule, tandis que les loueurs, qui ne sont même pas les constructeurs eux-mêmes mais des filiales de grandes banques françaises, engrangent des profits opaques. Enfin, les volumes de véhicules restent anecdotiques (150000 en 3 ans) et instables selon le bon vouloir du gouvernement, ce qui empêche de structurer une véritable filière.","md":"Le dispositif de *leasing* social, c’est-à-dire de location longue durée, activé épisodiquement par le gouvernement, rate largement sa cible. Du côté des ménages, il ne prévoit que 3 ans de location subventionnée : à la fin, rien ne garantit la poursuite de la location, encore moins au même prix, d’autant plus que les concessionnaires sont incités à les revendre à ce moment-là. Du côté budgétaire, le coût du dispositif est très élevé avec une moyenne de 7500 à 9 500 euros de subvention par véhicule, tandis que les loueurs, qui ne sont même pas les constructeurs eux-mêmes mais des filiales de grandes banques françaises, engrangent des profits opaques. Enfin, les volumes de véhicules restent anecdotiques (150000 en 3 ans) et instables selon le bon vouloir du gouvernement, ce qui empêche de structurer une véritable filière."},{"kind":"texte","text":"En s’appuyant sur les travaux de l’ONG Transport & Environnement France, nous mettrons en place un véritable service public de la location abordable grâce à la constitution d’un parc public de véhicules via des investissements du pôle public bancaire. Opéré en lien avec des régies coopératives locales, il visera un objectif de 1,4 million de véhicules légers et abordables loués d’ici 2032. Pour cela, nous créerons un choc d’offre : 1 million de véhicules com-mandés sur 3 ans, puis 200 000 voitures par an sur les deux dernières années du quinquennat. Il faudra ensuite viser 80 000 véhicules par an sur la décennie 2030–2040. Les voitures seront louées 11 ans avant d’être revendues."},{"kind":"texte","text":"Les bénéficiaires pourront louer une voiture sur cette durée, en changer au sein du parc et auront la possibilité d’acquérir la voiture dans le cadre du renouvellement régulier de la flotte du parc public. Ainsi, les bénéficiaires n’auront plus la crainte de perdre le dispositif au bout de 3 ans comme aujourd’hui : la location publique ne doit pas être une voiture au rabais. Un vaste marché de l’occasion électrique sera créé par ce dispositif, ce qui rendra plus accessible l’achat d’un véhicule électrique."},{"kind":"texte","text":"Pour l’État, la location publique est la solution la moins coûteuse plutôt que de continuer des dispositifs délégués au privé. Pour l’industrie, c’est un moyen de répondre à une demande sociale que son marketing n’identifie pas et de lancer une production de masse de petits véhicules légers, plutôt que de voir le dis-positif changer chaque année. Enfin, la création d’un service public est la solution de location qui permet d’éviter le plus d’émissions de gaz à effet de serre."},{"kind":"texte","text":"Les modèles éligibles devront respecter des critères de prix, de masse, d’empreinte carbone et bien sûr de provenance de la production. Le critère de provenance aura trois caractéristiques. D’abord, il privilégiera la production française et pas seulement européenne. Ensuite, il s’appliquera également au contenu des véhicules, à leurs équipements, pour promouvoir l’ensemble de la filière et pas seulement l’assemblage de pièces fabriquées ailleurs. Enfin, la répartition des contenus français et européens évoluera de manière planifiée sur les cinq ans pour accompagner la montée en puissance de la production française."},{"kind":"texte","text":"Le bonus écologique qui permet d’aider les ménages à acheter une voiture électrique sera réformé. Nous en exclurons les véhicules coûtant plus de 30 000 euros et recalibrerons le barème en faveur des milieux populaires. Nous augmenterons également le montant, qui, après son rabotage par le gouvernement Macron, exclut beaucoup de ménages de l’achat d’un véhicule. Enfin, pour que les aides publiques servent à maintenir la production industrielle en France, l’éco-score qui fonde le bonus écologique sera révisé pour inclure davantage de composants de la voiture dans son évaluation."}]},{"title":"Produire les équipements dont nous avons besoin pour fabriquer les voitures françaises","depth":2,"path":["Les besoins et objectifs associés","Produire les équipements dont nous avons besoin pour fabriquer les voitures françaises"],"blocks":[{"kind":"texte","text":"Pour produire 2 millions de véhicules électriques qui créent de la valeur ajoutée en France, la politique industrielle doit couvrir l’ensemble de la chaîne de valeur : moteurs électriques et réducteurs, électronique de puissance, semi-conducteurs, systèmes thermiques, logiciels, faisceaux haute tension, freinage, pneus, sièges et pièces de structure. Un contrat de filière fixera des objectifs de relocalisation et de montée en capacité par famille de composants, avec priorité aux bassins menacés par la disparition du thermique."},{"kind":"texte","text":"Il faut pour cela intégrer des conditions fortes sur l’origine des équipements des véhicules assemblés en France. Alors que les discussions européennes en cours autour de l’Industrial Accelerator Act s’orientent vers une exigence d’environ 75 % de contenu européen hors batterie, nous irons plus loin en fixant une cible d’au moins 85 % de contenu européen pour les véhicules bénéficiant d’aides publiques, complétée par des exigences spécifiques sur les batteries, les moteurs électriques, l’électronique de puissance, les logiciels embarqués et les matériaux stratégiques. Des exigences similaires devront concerner les équipementiers de rang 1. Mais un objectif de contenu européen ne suffira pas : il faudra aussi décliner cette obligation au niveau français."},{"kind":"texte","text":"La filière a besoin en parallèle d’investissements pour pallier les ravages subis ces dernières années. Pour y répondre, nous réformerons et renforcerons le Fonds Avenir Automobile pour la sous-traitance au sein du pôle public bancaire en le dotant de 4 milliards d’euros pour sauver, moderniser et développer les PME et ETI stratégiques de la filière automobile, pour financer leur conversion vers le véhicule électrique. L’intervention du fonds (en prêts, prises de participation, garanties) sera accompagnée d’engagements pluriannuels de commandes auprès d’eux, imposés aux grands donneurs d’ordres bénéficiant du soutien public."}]},{"title":"Assurer une souveraineté sur les batteries","depth":2,"path":["Les besoins et objectifs associés","Assurer une souveraineté sur les batteries"],"blocks":[{"kind":"texte","text":"Pour rattraper les années de retard pris sur la Chine en matière de batteries, plus de 3 milliards d’euros d’aides publiques ont été engagés en quelques années. Mais construire des usines ne suffit pas : l’enjeu est désormais d’organiser leur montée en cadence, de maîtriser les procédés industriels et chimiques et de leur garantir des débouchés durables. Fin 2025, la capacité de production de batteries ne s’élevait qu’à 1,6 GWh. Si la technologie dominante est aujourd’hui celle des batteries au lithium, qu’il faut savoir produire nous-mêmes pour les générations immédiates de véhicules, nous investirons aussi pour préparer notre avance dans les pro-chaines générations de batteries pour ne pas reproduire le retard accumulé sur la technologie lithium-ion. L’effort de recherche portera notamment sur les chimies LFP (accumulateur lithium-fer-phosphate), peu développées en France aujourd’hui, et sodium-ion."},{"kind":"texte","text":"Nous lancerons un grand plan batterie pour enfin construire une véritable filière française et européenne adaptée aux besoins. Nous favoriserons le développement de batteries adaptées aux petits véhicules sobres plutôt qu’aux modèles lourds et surdimensionnés. Nous fixerons une cible d’au moins 100 GWh de capacité de production annuelle de batteries, un objectif cohérent avec la production de 2 millions de véhicules électriques par an concentrés sur les véhicules sobres. Contrairement au gouvernement, nous nous donnerons les moyens de l’atteindre en déployant une stratégie cohérente et constante dans le temps."},{"kind":"texte","text":"La priorité sera de consolider les capacités déjà implantées en France et d’éviter aux acteurs français émergents d’être victimes d’un scénario à la Northvolt, cette entreprise suédoise de batteries qui devait être le géant européen et a finalement fait faillite. L’État sécurisera la montée en puissance des projets aujourd’hui engagés de production de batteries en France, comme ACC et Verkor, qui se heurtent à des difficultés techniques, industrielles et à la pro-pension des constructeurs à se tourner vers les fournisseurs étrangers. La puissance publique sécurisera leur modèle économique pendant la phase cri-tique de montée en cadence, notamment en garantissant l’accès à une électricité décarbonée à un prix stable et compétitif. En contrepartie des aides publiques, les constructeurs devront conclure des contrats pluriannuels d’approvisionnement avec les producteurs français et européens de cellules. En cas de difficulté temporaire d’une capacité stratégique, l’État pourra la sou-tenir directement."},{"kind":"texte","text":"Les aides publiques seront conditionnées à la localisation française et européenne de la production, de la recherche et développement et des compétences mais aussi à des transferts effectifs de technologies et de savoir-faire sur toute la chaîne pour que nous parvenions au plus vite à la maîtrise techno-logique. L’implantation en France d’acteurs étrangers comme ProLogium sera soutenue uniquement lorsqu’elle renforce notre souveraineté technologique."}]},{"title":"Bâtir l’économie circulaire de l’automobile par la réparation, le réemploi et le recyclage","depth":2,"path":["Les besoins et objectifs associés","Bâtir l’économie circulaire de l’automobile par la réparation, le réemploi et le recyclage"],"blocks":[{"kind":"texte","text":"La planification écologique se fixera les objectifs d’améliorer progressivement la durabilité des véhicules électriques et de réduire au maximum l’empreinte écologique de la filière, notre consommation de matières premières et notre dépendance aux importations de minerais critiques."},{"kind":"texte","text":"Pour cela, nous renforcerons les obligations d’écoconception, de démontabilité, de disponibilité des pièces et des données de réparation. Nous augmenterons les objectifs de réemploi et améliorerons l’efficacité de la filière du traitement des véhicules hors d’usage en luttant contre les filières illégales et en introduisant une meilleure coordination publique pour piloter les 19 éco-organismes impliqués."},{"kind":"texte","text":"Nous agirons pour allonger au maximum la durée de vie des batteries en créant les conditions de leur réemploi. Nous créerons un droit effectif au diagnostic de l’état de santé des batteries et équipements électroniques : les batteries encore utilisables seront prioritairement réparées ou réaffectées à d’autres usages avant d’être recyclées. Des pôles territoriaux de réparation et reconditionnement seront développés dans tout le pays."},{"kind":"texte","text":"Le second levier est celui du recyclage, sur lequel la Chine détient aujourd’hui un quasi-monopole. Si pour le moment les volumes à traiter sont limités compte tenu de la faible quantité de véhicules électriques en fin de vie, ils augmenteront fortement à moyen terme. L’objectif n’est pas seulement de traiter des déchets, mais de construire une véritable « mine urbaine » : les métaux stratégiques contenus dans les batteries en fin de vie devront être récupérés, raffinés et réutilisés dans de nouvelles batteries produites en France."},{"kind":"texte","text":"Pour cela, il faut être présent sur les deux grandes étapes de la chaîne du recyclage des batteries, à savoir le broyage et la séparation mécanique, qui permettent en particulier d’obtenir la « matière noire » contenant les métaux stratégiques, puis le raffinage des métaux qu’elle contient pour les rendre réutilisables dans de nouvelles batteries. Nous soutiendrons ainsi à hauteur d’un milliard d’euros d’investissements le développement des capacités de recyclage pour structurer une filière durable."},{"kind":"texte","text":"Enfin, nous développerons le recyclage et le réemploi des pneus. Nous sou-tiendrons le recyclage à partir de carcasses par pyrolyse en France. Sur le réemploi, nous développerons le rechapage qui consiste à remplacer la bande de roulement usée pour obtenir un pneu drastiquement moins cher qu’un pneu neuf et à l’impact écologique beaucoup plus faible. Aujourd’hui, une seule usine le met en œuvre en France, nous organiserons une véritable filière."}]},{"title":"Rendre accessible la recharge des véhicules","depth":2,"path":["Les besoins et objectifs associés","Rendre accessible la recharge des véhicules"],"blocks":[{"kind":"texte","text":"200 000 bornes de recharge électrique sont en service en France, mais le rythme d’installation ralentit au moment où il y en a le plus besoin. Le déploie-ment étant géré par le marché, il se concentre sur les zones rentables et n’anticipe pas les besoins futurs."},{"kind":"texte","text":"Nous lancerons en lien avec les collectivités un recensement des lieux de travail, parkings de logements publics, habitats collectifs dans les zones sous-dotées où l’installation de bornes serait pertinente et mettrons en place un plan de déploiement public dédié. Cela permettra au réseau électrique de s’adapter et aux automobilistes de recharger au meilleur prix en bénéficiant des heures creuses."}]},{"title":"Faire monter en puissance la formation","depth":2,"path":["Les besoins et objectifs associés","Faire monter en puissance la formation"],"blocks":[{"kind":"texte","text":"Plus de 135000 personnes doivent être formées dans les prochaines années pour que la montée en puissance de la production puisse avoir lieu, notamment chez les équipementiers. La filière a bénéficié de nombreuses aides à l’emploi (1 milliard d’euros en 7 ans) et pourtant les constructeurs ont cessé de financer le Fonds national de l’emploi dédié à l’automobile, qui permettait notamment de financer des formations pour les salariés des sous-traitants. Nous mobiliserons les constructeurs pour qu’ils l’abondent à hauteur de 10 mil-lions d’euros par an. Nous investirons dans les formations des lycées professionnels, notamment en créant une véritable filière polytechnique unifiant tous les diplômes du CAP jusqu’à la licence pro."},{"kind":"texte","text":"Nous investirons également dans la formation professionnelle publique pour les adultes. Les plans de formation seront négociés par bassin d’emploi et financés par les constructeurs, les équipementiers et la puissance publique."}]},{"title":"Investir dans la recherche et le déploiement des futurs modes de transport","depth":2,"path":["Les besoins et objectifs associés","Investir dans la recherche et le déploiement des futurs modes de transport"],"blocks":[{"kind":"texte","text":"La voiture individuelle n’est pas la seule solution de mobilité, y compris sur route. La Chine a par exemple massifié le recours à des minibus autonomes dans plusieurs villes. En France, des expérimentations existent mais restent embryonnaires. Elles montrent pourtant des résultats prometteurs pour ce genre de minibus dans des zones industrielles ou encore des zones rurales où ils comblent les besoins de transports en commun."},{"kind":"texte","text":"Aujourd’hui, seuls quelques millions d’euros par an y sont consacrés dans le programme CORAM porté par France 2030. C’est très largement insuffisant et montre encore une incapacité à innover et anticiper. Nous investirons 50 millions d’euros par an dans la recherche et développement et dans la structuration de la filière en France. Le plan sur la base duquel les conventions pluriannuelles seront signées avec les constructeurs comportera l’objectif de moyen terme d’une filière industrielle pour des véhicules collectifs autonomes et sûrs permettant un déploiement dans toutes les zones d’emploi sur le territoire."}]},{"title":"Les investissements supplémentaires","depth":1,"path":["Les investissements supplémentaires"],"blocks":[{"kind":"texte","text":"Les sommes présentées dans ce tableau représentent les investissements supplémentaires nécessaires par rapport aux dépenses déjà existantes. Elles seront prises en charge par l’État mais aussi par d’autres opérateurs comme le pôle public bancaire. Elles se déclineront selon plusieurs modalités : prises de participation, prêts avantageux, garanties. Au total, l’effort s’élèvera à 1,4 milliard d’euros de dépenses de l’État et à 4,5 milliards d’euros d’investissements par an, tous acteurs confondus."},{"kind":"texte","text":"En s’appuyant notamment sur les travaux de France Nature Environnement, nous pouvons estimer qu’avec la production de 500000 véhicules supplémentaires, la reconstruction des filières de sous-traitance, la montée en puissance de la production de batteries et le développement de l’économie circulaire, le plan d’investissement productif automobile créera plus de 40000 emplois."},{"kind":"tableau","text":"Axe d’investissement | Investissements supplémentaires de l’État | Investissements supplémentaires du pôle public bancaire et d’autres acteurs\nNouvelles lignes de production | 100 | 200\nService public de la location abordable | 300 | 700\nAides à l’achat de véhicules électriques et locaux | 200 | 200\nFonds pour la sous traitance et les équipementiers | 200 | 800\nFilière des batteries | 500 | 900\nRéparation, recyclage, réemploi | 50 | 240\nBornes de recharges |  | 20\nFormation |  | 10\nR&D et déploiement de minibus autonomes | 20 | 30\nTotal | 1,4 millard d’euros | ","rows":[["Axe d’investissement","Investissements supplémentaires de l’État","Investissements supplémentaires du pôle public bancaire et d’autres acteurs"],["Nouvelles lignes de production","100","200"],["Service public de la location abordable","300","700"],["Aides à l’achat de véhicules électriques et locaux","200","200"],["Fonds pour la sous traitance et les équipementiers","200","800"],["Filière des batteries","500","900"],["Réparation, recyclage, réemploi","50","240"],["Bornes de recharges","","20"],["Formation","","10"],["R&D et déploiement de minibus autonomes","20","30"],["Total","1,4 millard d’euros",""]]},{"kind":"texte","text":"En millions d’euros par an","md":"**En millions d’euros par an**"}]}]}],"short":"Investissement automobile","content_sha256":"802512b25ddbfeee4833ea6066429c6d260dfdee7c39b598a422c99af2d4b11a"},{"code":"DOC-BANQUE","kind":"pdf","title":"Pour un pôle public bancaire au service des besoins","url":"https://melenchon2027.fr/wp-content/uploads/2026/10/DP-POLE-PUBLIC-BANCAIRE_ST.pdf","units":[{"code":"DOC-BANQUE","part":null,"title":"Pour un pôle public bancaire au service des besoins","url":"https://melenchon2027.fr/wp-content/uploads/2026/10/DP-POLE-PUBLIC-BANCAIRE_ST.pdf","sections":[{"title":"Page 1","depth":1,"path":["Page 1"],"blocks":[{"kind":"texte","text":"Élection présidentielle - 18 avril et 2 mai 2027"},{"kind":"texte","text":"POUR UN"},{"kind":"texte","text":"PÔLE PUBLIC BANCAIRE AU SERVICE DES BESOINS"}]},{"title":"Page 3","depth":1,"path":["Page 3"],"blocks":[{"kind":"texte","text":"POUR UN PÔLE PUBLIC BANCAIRE AU SERVICE DES BESOINS"},{"kind":"texte","text":"1. UN « PÔLE FINANCIER PUBLIC » MACRONISTE AVEC PEU DE MOYENS ET SOUMIS AUX MARCHÉS"},{"kind":"texte","text":"PROPOSITION : LE FINANCEMENT 2. NOTRE DES BESOINS PRODUCTIFS"},{"kind":"texte","text":"3. LA RÉORIENTATION DE L’ÉPARGNE FRANÇAISE VERS LES ACTIVITÉS UTILES POUR LA NATION"},{"kind":"texte","text":"PUBLIC BANCAIRE : POUR 4. PÔLE UNE REFONTE DE LA GOUVERNANCE"}]},{"title":"Page 4","depth":1,"path":["Page 4"],"blocks":[{"kind":"texte","text":"Pour un pôle public bancaire au service des besoins"},{"kind":"texte","text":"Pour un pôle public bancaire au service des besoins D’immenses investissements productifs sont nécessaires pour faire face à l’urgence sociale et aux bouleversements écologiques. Or, ces investissements reculent. La France subit un record de défaillances d’entreprises. Faute de financements, des pans entiers de notre production s’écroulent, dans l’industrie, les transports, le logement, la santé… Ce manque d’investissements nous empêche de transformer notre appareil productif face aux bouleversements écologiques et conduit à un décrochage technologique majeur et à une perte dramatique de souveraineté économique. Les ménages les plus aisés n’ont pourtant jamais accumulé autant d’épargne et le secteur financier n’a jamais fait circuler autant d’argent. Cet argent n’est pas orienté selon les besoins productifs de notre économie nationale, mais selon la rentabilité des capitaux. Il est utilisé pour piller à moindre coût les savoirs et compétences des entreprises et en extraire le maximum de valeur, pour reverser les profits à de grandes fortunes et pour soutenir des activités nuisibles. C’est la conclusion de la commission d’enquête parlementaire sur les fonds prédateurs, initiée par la France insoumise en 2026."}]},{"title":"Page 5","depth":1,"path":["Page 5"],"blocks":[{"kind":"texte","text":"Pour un pôle public bancaire au service des besoins"},{"kind":"texte","text":"Une finance hors de contrôle qu’il faut contrer À la suite de la crise financière de 2008, des règles nouvelles, certes très insuffisantes, ont été appliquées aux banques afin qu’elles prennent moins de risques. Mais toute une partie de la finance, dite finance de l’ombre ou shadow banking, échappe à ces règles : les compagnies d’assurance, les fonds de pension et surtout les fonds d’investissement. Ces derniers ont alors pu se développer très rapidement et massivement. Ils placent de l’épargne collectée par d’autres (les banques, les assurances ou les fonds de pension) pour en tirer un rendement maximal dans des actions d’entreprises, des obligations, de l’immobilier. Parmi eux, les fonds de private equity et de private credit prennent des parts de capital ou prêtent à des entreprises non cotées en bourse. Les plus spéculatifs, les hedge funds, parient sur les variations de marché avec de l’argent emprunté."},{"kind":"texte","text":"15%"},{"kind":"texte","text":"c’est le taux de rentabilité moyen de la finance non bancaire."},{"kind":"texte","text":"La commission d’enquête parlementaire initiée par la France insoumise montre que cette finance non bancaire agit sans garde-fous, de façon prédatrice, pour atteindre des taux de rentabilité ahurissants pour les capitaux qui y sont placés : 15 % en moyenne. Ce shadow banking gère désormais plus de la moitié des actifs financiers mondiaux. Elle a mis la main sur une grande partie des entreprises françaises : industries stratégiques (numérique, défense nationale ou encore médicaments), santé (cliniques, laboratoires d’analyse médicale, cabinets médicaux), crèches, maisons de retraite, médias... Un emploi sur six dans le privé serait désormais concerné. Les gouvernements successifs ont laissé faire ou même encouragé ces prédations, avec un argument sans cesse asséné : il n’y a pas d’alternative de financement. C’est pourquoi il est urgent de construire une alternative."}]},{"title":"Page 6","depth":1,"path":["Page 6"],"blocks":[{"kind":"texte","text":"Pour un pôle public bancaire au service des besoins Il est temps de reconstruire une finance au service des besoins, qui soit sous contrôle démocratique et qui permette de réaliser, sans creuser la dette publique, les investissements nécessaires. En 2020, un pseudo « pôle financier public » a été mis en place suite à la loi Pacte. Mais la commission d’enquête parlementaire a conclu à la nécessité de créer un véritable pôle public bancaire qui s’appuiera sur les 6 000 agents. Ce pôle public soutiendra les investissements définis dans le cadre d’une planification écologique nationale décidée de façon démoc
