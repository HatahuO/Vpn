 droit de veto suspensif sur les plans de licenciements, les projets de cession, y compris de holdings, et de nouveaux droits de contrôle sur les finances de leur entreprise","depth":0,"id":"P2C1-M008"},{"kind":"mesure","text":"Donner plus de pouvoir aux salariés lors des procédures de redressement et de liquidation d’entreprises ; instaurer le droit à un vote de défiance à l’égard des dirigeants d’entreprises ou des projets stratégiques","depth":0,"id":"P2C1-M009"},{"kind":"mesure","text":"Renforcer la représentation des salariés dans les instances de décision des grandes entreprises à hauteur d’un tiers au moins et inclure d’autres parties prenantes, comme les associations environnementales ou de consommateurs","depth":0,"id":"P2C1-M010"},{"kind":"mesure","text":"Garantir les droits des représentants du personnel et des délégués syndicaux contre les licenciements abusifs des salariés protégés","depth":0,"id":"P2C1-M011"},{"kind":"mesure","text":"Instaurer des comités sociaux et économiques de site (centre commercial, zone industrielle)","depth":0,"id":"P2C1-M012"},{"kind":"mesure","text":"Permettre aux salariés des très petites entreprises d’avoir une représentation syndicale extérieure","depth":0,"id":"P2C1-M013"},{"kind":"mesure","text":"Réformer les tribunaux de commerce en assurant une meilleure représentation des salariés dans leur composition","depth":0,"id":"P2C1-M014"}]},{"title":"Faire la société de l’entraide : bâtir une économie de coopération","depth":1,"path":["Faire la société de l’entraide : bâtir une économie de coopération"],"blocks":[{"kind":"texte","text":"Face à la prédation de la finance et à la dictature des actionnaires, une autre économie est possible. Elle existe déjà, avec ses centaines de milliers d’entreprises et ses millions d’emplois. Nous proposons qu’elle se substitue à l’économie libérale. Il s’agit de remplacer l’autoritarisme individuel par la délibération collective, le travail imposé par le travail émancipateur, la production aveugle par la production planifiée. Puisque le capitalisme ne supporte pas la démocratie, remplaçons-le."},{"kind":"mesure_cle","text":"Généraliser l’économie sociale et solidaire (ESS) et protéger le secteur associatif","id":"P2C1-K04"},{"kind":"mesure","text":"Garantir l’accès de l’ESS au financement et aux marchés publics","depth":0,"id":"P2C1-M015"},{"kind":"mesure","text":"Donner la priorité aux structures non lucratives de l’ESS sur le secteur privé classique pour certaines activités essentielles : petite enfance, aide aux personnes âgées, restauration collective","depth":0,"id":"P2C1-M016"},{"kind":"mesure","text":"Favoriser le développement des sociétés coopératives d’intérêt collectif (SCIC) et des sociétés coopératives et participatives (Scop), ainsi que de services communs fondés sur une gouvernance partagée entre citoyens et usagers, salariés, partenaires publics et privés","depth":0,"id":"P2C1-M017"},{"kind":"mesure","text":"Redonner du pouvoir et des moyens aux associations citoyennes et aux acteurs de l’éducation populaire, sortir de la logique d’appels à projets et généraliser les conventions pluriannuelles afin de leur garantir stabilité, indépendance et visibilité financière","depth":0,"id":"P2C1-M018"},{"kind":"mesure","text":"Garantir les libertés associatives","depth":0,"id":"P2C1-M019"},{"kind":"mesure","text":"Reconnaître et valoriser le bénévolat comme une force d’émancipation, d’éducation populaire et d’expérimentation collective, contribuant pleinement à la vie sociale, démocratique et économique","depth":0,"id":"P2C1-M020"},{"kind":"mesure","text":"Développer les coopératives d’activités et d’emploi (CAE), afin de lutter contre l’autoentrepreneuriat subi et de développer des formes de travail en commun","depth":0,"id":"P2C1-M021"}]}]},{"code":"P2C2","part":"Partie 2 – Une économie au service des besoins","title":"Chapitre 2 : Partager les richesses","url":"https://melenchon2027.fr/programme/livre/une-economie-au-service-des-besoins/chapitre2","sections":[{"title":"Créer un état d’urgence sociale","depth":1,"path":["Créer un état d’urgence sociale"],"blocks":[{"kind":"texte","text":"Covid-19, guerres en Ukraine et en Iran, canicules et sécheresses : les crises écologiques et géopolitiques ont eu des effets sociaux désastreux ces dernières années. Les gouvernements Macron ont multiplié les états d’urgence et d’exception, sécuritaire ou sanitaire, allant tous dans le même sens : la restriction des libertés individuelles et collectives. Nous leur substituerons un « état d’urgence sociale » pour que les désordres du monde ne conduisent pas à la mort sociale de millions de gens."},{"kind":"mesure_cle","text":"Bloquer et encadrer les prix des produits de première nécessité (alimentation, énergie, carburant) et interdire la « réduflation » (réduction des quantités pour le même prix)","id":"P2C2-K01"},{"kind":"mesure","text":"Renforcer le bouclier qualité-prix dans les Outre-mer","depth":0,"id":"P2C2-M001"},{"kind":"mesure","text":"Augmenter immédiatement le SMIC à 1 700 euros net mensuel et les minima sociaux","depth":0,"id":"P2C2-M002"},{"kind":"mesure","text":"Revaloriser la valeur du point d’indice des fonctionnaires de 10 %, inscrire son dégel dans la loi et compenser intégralement cette augmentation pour les collectivités territoriales","depth":0,"id":"P2C2-M003"},{"kind":"mesure","text":"Revaloriser les aides pour le logement (APL) de 10 %","depth":0,"id":"P2C2-M004"},{"kind":"mesure","text":"Mettre en place des stocks tampons de matières premières alimentaires pour lisser les prix et garantir une offre en temps de crise","depth":0,"id":"P2C2-M005"}]},{"title":"Faire la révolution fiscale","depth":1,"path":["Faire la révolution fiscale"],"blocks":[{"kind":"texte","text":"Après dix années de cadeaux aux plus riches, la France est plus que jamais une société de privilèges. Comme l’a écrit le Financial Times : « C’est comme si 1789 n’avait jamais eu lieu. » Désormais, les riches payent moins d’impôts que les autres, quand bien même ils s’enrichissent. La fortune des milliardaires français a doublé. Pendant ce temps, les salaires réels ont baissé, les services publics se sont dégradés. Notre fiscalité doit être entièrement refondée, sur des bases claires et justes, en appliquant le principe de progressivité : plus on gagne d’argent, plus on contribue au bien public !","md":"Après dix années de cadeaux aux plus riches, la France est plus que jamais une société de privilèges. Comme l’a écrit le *Financial Times* : « C’est comme si 1789 n’avait jamais eu lieu. » Désormais, les riches payent moins d’impôts que les autres, quand bien même ils s’enrichissent. La fortune des milliardaires français a doublé. Pendant ce temps, les salaires réels ont baissé, les services publics se sont dégradés. Notre fiscalité doit être entièrement refondée, sur des bases claires et justes, en appliquant le principe de progressivité : plus on gagne d’argent, plus on contribue au bien public !"},{"kind":"mesure_cle","text":"Rendre l’impôt sur le revenu plus progressif avec un barème à 14 tranches contre 5 aujourd’hui","id":"P2C2-K02"},{"kind":"mesure","text":"Refonder l’impôt sur les sociétés pour établir l’égalité devant l’impôt entre petites et moyennes entreprises (PME) et grands groupes ; instaurer un barème progressif et moduler l’impôt selon l’usage des bénéfices afin d’encourager leur réinvestissement plutôt que la distribution de dividendes","depth":0,"id":"P2C2-M006"},{"kind":"mesure","text":"Rétablir et renforcer l’impôt de solidarité sur la fortune (ISF) incluant un volet climatique visant à taxer les gros pollueurs","depth":0,"id":"P2C2-M007"},{"kind":"mesure","text":"Introduire une garantie d’impôt de 2 % sur le patrimoine des centimillionaires, dite « taxe Zucman », et rétablir une exit tax renforcée pour lutter contre l’évasion fiscale","depth":0,"id":"P2C2-M008"},{"kind":"mesure","text":"Supprimer la flat tax et imposer les revenus du capital comme ceux du travail","depth":0,"id":"P2C2-M009"},{"kind":"mesure","text":"Augmenter les droits de succession sur les plus hauts patrimoines en comptabilisant l’ensemble des dons et héritages reçus tout au long de la vie ; créer un héritage maximal de 12 millions d’euros","depth":0,"id":"P2C2-M010"},{"kind":"mesure","text":"Exonérer de droits de succession les héritages inférieurs à 150 000 euros","depth":0,"id":"P2C2-M011"},{"kind":"mesure","text":"Instaurer une « TVA grand luxe » visant des produits de consommation ostentatoires et incompatibles avec l’impératif de sobriété (yachts, jets privés, palaces, etc.)","depth":0,"id":"P2C2-M012"},{"kind":"mesure","text":"Passer au crible les niches fiscales et supprimer celles qui sont injustes, inefficaces socialement ou nuisibles écologiquement ; pour les niches restantes, transformer les réductions d’impôt en crédits d’impôt afin que chacun puisse bénéficier de ces incitations financières à égalité, quels que soient ses revenus","depth":0,"id":"P2C2-M013"},{"kind":"mesure","text":"Instaurer un impôt universel sur les entreprises (basant leur taxation sur l’activité effectivement réalisée en France) et sur les revenus des particuliers pour lutter contre l’évasion fiscale","depth":0,"id":"P2C2-M014"},{"kind":"mesure","text":"Établir une taxe sur les superprofits de toutes les grandes entreprises, activée en cas de hausse soudaine de leurs bénéfices en période de crise","depth":0,"id":"P2C2-M015"},{"kind":"mesure","text":"Mettre fin au quotient conjugal, système patriarcal favorisant les inégalités salariales entre les femmes et les hommes","depth":0,"id":"P2C2-M016"},{"kind":"mesure","text":"Créer un crédit d’impôt par enfant pour toutes les familles","depth":0,"id":"P2C2-M017"},{"kind":"mesure","text":"Faire de la lutte contre la fraude et l’évasion fiscales une priorité en renforçant massivement les moyens humains et financiers du contrôle fiscal, et en assumant des mesures unilatérales en cas de blocage des négociations au niveau européen ou international","depth":0,"id":"P2C2-M018"},{"kind":"mesure","text":"Mettre fin à la convention judiciaire d’intérêt public, qui permet aux entreprises de négocier leur sanction financière en cas de fraude fiscale","depth":0,"id":"P2C2-M019"},{"kind":"mesure","text":"Intensifier les poursuites judiciaires et durcir les sanctions à l’encontre des criminels en col blanc reconnus coupables de fraude fiscale","depth":0,"id":"P2C2-M020"},{"kind":"mesure","text":"Mettre fin aux pratiques frauduleuses d’arbitrage de dividendes","depth":0,"id":"P2C2-M021"},{"kind":"mesure","text":"Rendre obligatoire la publication du montant des aides publiques perçues par les plus grandes entreprises ; créer une commission d’enquête afin d’évaluer leur efficacité et les conditionner au respect d’objectifs définis par le Plan","depth":0,"id":"P2C2-M022"},{"kind":"mesure","text":"Créer une mission spéciale dressant le bilan des faveurs fiscales, des privatisations et des abandons de fleurons comme Alstom, Alcatel, EADS depuis trois décennies, permettre les poursuites judiciaires des responsables de ces cessions","depth":0,"id":"P2C2-M023"},{"kind":"mesure","text":"Rendre l’impôt plus juste en remplaçant la cotisation sur la valeur ajoutée des entreprises (CVAE) par un nouvel impôt sur les entreprises, dont la progressivité sera fonction du chiffre d’affaires et de l’empreinte écologique globale, pour financer l’action des éco-régions","depth":0,"id":"P2C2-M024"}]},{"title":"Augmenter les salaires","depth":1,"path":["Augmenter les salaires"],"blocks":[{"kind":"texte","text":"Alors que les revenus de certains dirigeants explosent de manière indécente, un salarié au SMIC gagne à peine plus que le seuil de pauvreté. 60 % de ces salariés sont des femmes, souvent employées à temps partiel. Depuis 2022, les Français ont par ailleurs connu deux crises inflationnistes, sans que leurs salaires augmentent pour autant. Ce véritable vol de salaire par la hausse des prix doit être corrigé. Il faut relancer à la hausse les salaires dans l’intérêt du bonheur commun."},{"kind":"mesure_cle","text":"Porter immédiatement le SMIC mensuel à 1 700 euros net et indexer les salaires sur l’inflation dans le privé comme dans la fonction publique","id":"P2C2-K03"},{"kind":"mesure","text":"Revaloriser la rémunération des apprentis et des alternants","depth":0,"id":"P2C2-M025"},{"kind":"mesure","text":"Organiser une conférence sociale nationale sur les salaires et les conditions de travail, déclinée dans chaque branche, notamment pour :","depth":0,"id":"P2C2-M026"},{"kind":"sous_mesure","text":"Revaloriser en matière de salaires, de conditions de travail et de parcours professionnels les métiers occupés majoritairement par des femmes dans les secteurs du soin, du lien et du contact","depth":1,"id":"P2C2-S001","parent":"P2C2-M026"},{"kind":"sous_mesure","text":"Lutter contre le temps partiel subi en instaurant une durée minimale quotidienne de travail de 3 heures dans les secteurs y recourant massivement","depth":1,"id":"P2C2-S002","parent":"P2C2-M026"},{"kind":"sous_mesure","text":"Fixer un salaire maximal autorisé pour limiter l’écart de 1 à 20 entre le salaire le plus bas et le salaire le plus haut dans une entreprise","depth":1,"id":"P2C2-S003","parent":"P2C2-M026"},{"kind":"sous_mesure","text":"Créer une commission de contrôle salarié sur l’égalité entre les femmes et les hommes dans l’entreprise et punir sévèrement, par des sanctions financières et pénales, le non-respect de l’égalité de rémunération entre les femmes et les hommes","depth":1,"id":"P2C2-S004","parent":"P2C2-M026"},{"kind":"sous_mesure","text":"Majorer les rémunérations pour les horaires de travail décalés dans la journée (6 h-8 h ou 18 h-22 h) ou le week-end","depth":1,"id":"P2C2-S005","parent":"P2C2-M026"},{"kind":"mesure","text":"Revaloriser le traitement des fonctionnaires","depth":0,"id":"P2C2-M027"},{"kind":"mesure","text":"Interdire les parachutes dorés et les retraites chapeaux","depth":0,"id":"P2C2-M028"},{"kind":"mesure","text":"Supprimer les stock-options et le versement d’actions gratuites aux dirigeants","depth":0,"id":"P2C2-M029"}]}]},{"code":"P2C3","part":"Partie 2 – Une économie au service des besoins","title":"Chapitre 3 : Un pacte productif pour répondre aux besoins","url":"https://melenchon2027.fr/programme/livre/une-economie-au-service-des-besoins/chapitre3","sections":[{"title":"Mettre au pas la finance","depth":1,"path":["Mettre au pas la finance"],"blocks":[{"kind":"texte","text":"La financiarisation est un danger : à nouveau, nous sommes menacés d’une crise financière mondiale. En 2008, la finance a mis à terre l’économie réelle. Sauvées par les États, et donc les contribuables, les banques n’ont pas changé leurs mauvaises habitudes. Bénéficiant de l’absence quasi totale de règles, une nouvelle finance non-bancaire a envahi notre économie. Des fonds prédateurs pillent nos entreprises. Il faut stopper ce cycle infernal en mettant au pas la finance."},{"kind":"mesure_cle","text":"Instaurer une taxe réelle sur les transactions financières","id":"P2C3-K01"},{"kind":"mesure","text":"Séparer strictement les banques d’affaires et les banques de détail","depth":0,"id":"P2C3-M001"},{"kind":"mesure","text":"Contrôler les mouvements de capitaux","depth":0,"id":"P2C3-M002"},{"kind":"mesure","text":"Identifier et interdire les produits dérivés toxiques et inutiles de la finance, limiter les effets de levier et les rendements actionnariaux exorbitants, taxer les rachats d’action","depth":0,"id":"P2C3-M003"},{"kind":"mesure","text":"Protéger le tissu économique des fonds vautours :","depth":0,"id":"P2C3-M004"},{"kind":"sous_mesure","text":"Réguler la « finance de l’ombre » (le secteur financier non-bancaire) aussi strictement que les banques, et interdire aux banques de prêter aux acteurs les plus risqués de la finance non-bancaire","depth":1,"id":"P2C3-S001","parent":"P2C3-M004"},{"kind":"sous_mesure","text":"Instaurer un régime d’autorisation préalable par l’État pour les grandes opérations de rachat d’entreprise avec effet de levier (LBO) tout en supprimant les avantages fiscaux desdits LBO","depth":1,"id":"P2C3-S002","parent":"P2C3-M004"},{"kind":"sous_mesure","text":"Empêcher les manipulations comptables dans les groupes pour échapper à l’impôt ou pour mettre en faillite artificiellement des filiales en interdisant les remontées abusives vers les holdings, en plafonnant les frais de conseil, les frais de management et les prestations intra-groupe","depth":1,"id":"P2C3-S003","parent":"P2C3-M004"},{"kind":"sous_mesure","text":"Renforcer le contrôle des investissements étrangers dans tous les secteurs présentant un caractère stratégique, y compris a posteriori, en obligeant la notification de tout investissement étranger au ministère de l’Économie","depth":1,"id":"P2C3-S004","parent":"P2C3-M004"}]},{"title":"Pour des banques au service de l’intérêt général","depth":1,"path":["Pour des banques au service de l’intérêt général"],"blocks":[{"kind":"texte","text":"Le crédit est à la base de l’activité future. Les banques doivent donc avoir une mission d’intérêt général. Il est crucial d’orienter l’argent en direction des projets socialement et écologiquement utiles. La monnaie doit aussi être un bien commun créé et géré démocratiquement."},{"kind":"mesure_cle","text":"Créer un pôle public bancaire et de l’assurance et transformer la Banque publique d’investissement (BPI) en véritable banque publique des besoins productifs","id":"P2C3-K02"},{"kind":"mesure","text":"Socialiser certaines banques de détail et les intégrer au pôle public bancaire, en vue de financer les très petites entreprises (TPE) sur des critères sociaux et écologiques","depth":0,"id":"P2C3-M005"},{"kind":"mesure","text":"Réaliser un audit du coût économique, social et écologique des banques et de la finance","depth":0,"id":"P2C3-M006"},{"kind":"mesure","text":"Créer des banques de désinvestissement afin de regrouper les actifs écologiquement nocifs et absorber les pertes économiques liées à l’arrêt des activités polluantes","depth":0,"id":"P2C3-M007"},{"kind":"mesure","text":"Dépolluer les flux financiers en pénalisant la détention et l’usage d’actifs financiers qui aggravent le changement climatique et la destruction des écosystèmes, ainsi qu’en renchérissant le crédit pour les entreprises dont la comptabilité carbone contrevient à l’accord de Paris","depth":0,"id":"P2C3-M008"},{"kind":"mesure","text":"Appliquer strictement les réglementations du secteur des crypto-­actifs pour limiter son impact environnemental nocif et ses usages spéculatifs","depth":0,"id":"P2C3-M009"},{"kind":"mesure","text":"Garantir un euro numérique 100 % public qui respecte la vie privée des usagers et ne remplace pas l’argent liquide ; limiter la dépendance de l’économie française aux systèmes de paiement étrangers","depth":0,"id":"P2C3-M010"},{"kind":"mesure","text":"Garantir la gratuité du socle bancaire essentiel pour tous les titulaires d’un compte courant","depth":0,"id":"P2C3-M011"}]},{"title":"Définanciariser l’économie réelle","depth":1,"path":["Définanciariser l’économie réelle"],"blocks":[{"kind":"texte","text":"Les actionnaires exigent des taux de rendement intenables, obtenus au détriment des droits sociaux et des conditions, notamment environnementales, de production. Ils imposent la tyrannie du temps court sur le temps long de l’activité humaine et du rythme écologique. Il faut protéger l’économie réelle des agissements de ces spéculateurs en reprenant le pouvoir sur la finance."},{"kind":"mesure_cle","text":"Établir de nouveaux indicateurs statistiques de progrès humain pour mettre l’économie au service du bien-vivre (santé, éducation, etc.)","id":"P2C3-K03"},{"kind":"mesure","text":"Interdire aux entreprises de distribuer un montant de dividendes supérieur à leurs bénéfices de l’année","depth":0,"id":"P2C3-M012"},{"kind":"mesure","text":"Mettre fin à la cotation continue des entreprises en Bourse et moduler les droits de vote des actionnaires selon la durée d’engagement dans l’entreprise","depth":0,"id":"P2C3-M013"},{"kind":"mesure","text":"Interdire les licenciements boursiers et économiques par les entreprises qui versent des dividendes ou bénéficient des aides de l’État","depth":0,"id":"P2C3-M014"}]},{"title":"Refuser le chantage : définanciariser la dette publique","depth":1,"path":["Refuser le chantage : définanciariser la dette publique"],"blocks":[{"kind":"texte","text":"La dette publique est instrumentalisée pour justifier les saignées budgétaires à répétition et les privatisations. Le patrimoine de l’État est pourtant supérieur à sa dette : en France, chaque enfant naît avec plus de 10 000 euros d’actif public ! Mais la puissance publique a fait le choix de s’abaisser en se plaçant sous l’empire de marchés financiers qui peuvent la menacer d’augmenter les taux d’intérêt. Il y a moyen de faire autrement, en passant par la Banque centrale européenne (BCE), ou en créant des circuits de financement stables pour la dette publique française. Il faut aussi traiter la question des dettes privées, qui est un plus grand danger."},{"kind":"mesure_cle","text":"Proposer la modification du traité de fonctionnement de l’Union européenne (TFUE) et du statut de la BCE pour lui permettre d’acheter de la dette publique sans passer par les banques privées en mettant notamment en place une autorisation de découvert des États auprès d’elle","id":"P2C3-K04"},{"kind":"mesure","text":"Exiger de l’Union européenne (UE) que la BCE soulage les États membres en annulant ou en transformant en dettes perpétuelles à taux nul la part de dette des États qu’elle possède","depth":0,"id":"P2C3-M015"},{"kind":"mesure","text":"Interdire à la BCE de revendre sur les marchés financiers la part de dette des États qu’elle détient","depth":0,"id":"P2C3-M016"},{"kind":"mesure","text":"Reprendre, sans attendre de modification des traités, les programmes de rachat de dettes souveraines par la BCE, comme en 2015 et en 2020","depth":0,"id":"P2C3-M017"},{"kind":"mesure","text":"Réinstaurer un circuit du Trésor pour sortir la dette publique de la main des marchés financiers","depth":0,"id":"P2C3-M018"},{"kind":"mesure","text":"Mettre fin à l’émission de titres de dette souveraine indexés sur l’inflation (soit les obligations assimilables du Trésor indexées sur l’inflation française, OATi), qui ne servent qu’à enrichir les créanciers de l’État et pèsent sur nos comptes publics","depth":0,"id":"P2C3-M019"},{"kind":"mesure","text":"Réformer la Caisse d’amortissement de la dette sociale (Cades), qui prive la Sécurité sociale de 19 milliards d’euros par an","depth":0,"id":"P2C3-M020"}]},{"title":"Un nouveau pacte productif pour les petites entreprises","depth":1,"path":["Un nouveau pacte productif pour les petites entreprises"],"blocks":[{"kind":"texte","text":"Loin du récit imposé par le Mouvement des entreprises de France (Medef), le patronat est tout sauf un bloc homogène. Les politiques libérales de baisse du coût du travail et de délocalisation n’ont profité qu’à une poignée de multinationales. Les TPE-PME, elles, enregistrent aujourd’hui un record de défaillances et une paupérisation de leurs dirigeants. Elles sont pourtant essentielles à la bifurcation de notre économie vers la planification écologique, seule à même de répondre aux besoins fondamentaux et aux défis de notre temps. La puissance publique doit reprendre le contrôle en proposant un nouveau pacte productif pour les entreprises."},{"kind":"mesure_cle","text":"Renforcer les sanctions pour les retards de paiement des grands groupes aux TPE-PME","id":"P2C3-K05"},{"kind":"mesure","text":"Créer une caisse de péréquation interentreprises, financée grâce à un barème progressif, pour aider les TPE-PME à surmonter des difficultés temporaires de trésorerie","depth":0,"id":"P2C3-M021"},{"kind":"mesure","text":"Changer les règles de représentativité dans les instances patronales en faveur des TPE-PME et de l’ESS","depth":0,"id":"P2C3-M022"},{"kind":"mesure","text":"Développer et faciliter le statut d’employeur-salarié afin d’assurer une protection sociale aux petits entrepreneurs","depth":0,"id":"P2C3-M023"},{"kind":"mesure","text":"Garantir que les aides et la commande publiques bénéficient aux PME et à l’ESS, selon leur juste poids dans l’économie et l’emploi","depth":0,"id":"P2C3-M024"},{"kind":"mesure","text":"Favoriser l’installation d’entreprises, d’artisans, de commerçants par la mise en place d’aides spécifiques","depth":0,"id":"P2C3-M025"},{"kind":"mesure","text":"Interdire la refacturation de la taxe foncière aux locataires dans les baux commerciaux et créer un encadrement de ces loyers","depth":0,"id":"P2C3-M026"},{"kind":"mesure","text":"Rétablir des prix encadrés de l’énergie pour les entreprises","depth":0,"id":"P2C3-M027"},{"kind":"mesure","text":"Permettre aux TPE-PME l’accès à des facilités de trésorerie via un droit à l’escompte à taux zéro par le pôle public bancaire","depth":0,"id":"P2C3-M028"},{"kind":"mesure","text":"Plafonner les frais bancaires, notamment sur le paiement par carte bancaire","depth":0,"id":"P2C3-M029"},{"kind":"mesure","text":"Instaurer un service d’affacturage garanti par l’État","depth":0,"id":"P2C3-M030"},{"kind":"mesure","text":"Mettre à disposition des TPE-PME un outil public et gratuit pour la gestion des factures électroniques","depth":0,"id":"P2C3-M031"},{"kind":"mesure","text":"Réserver une partie des marchés publics aux productions locales","depth":0,"id":"P2C3-M032"},{"kind":"mesure","text":"Encadrer la sous-traitance en garantissant, par la loi, la responsabilité des donneurs d’ordre vis-à-vis de leurs sous-traitants et en la limitant à un seul niveau","depth":0,"id":"P2C3-M033"}]}]},{"code":"P3-PRESENTATION","part":"Partie 3 – Mettre en sécurité sociale","title":"Présentation de la partie","url":"https://melenchon2027.fr/programme/livre/mettre-en-securite-sociale","sections":[{"title":"","depth":0,"path":[],"blocks":[{"kind":"texte","text":"Dans notre pays, un parent sur trois se prive de manger pour nourrir ses enfants, sept personnes sur dix ont déjà renoncé à se soigner, et plus de 2 000 enfants dorment dans la rue chaque nuit. Les plus exposés à cette violence sociale sont les femmes, les enfants, les jeunes, les familles monoparentales, les personnes âgées, en situation de handicap ou LGBTI. Ce bilan, c’est celui du logiciel libéral : à force de coupes budgétaires, il détruit les infrastructures de notre système social et in fine nos droits. Il y a donc urgence à mettre en sécurité sociale la Nouvelle France. Ce qui veut dire réparer ce qui a été cassé, mais aussi étendre et créer de nouveaux droits sociaux et économiques. La Sécurité sociale, bâtie en 1945, n’est pas un acquis à démanteler, mais un principe d’organisation de la société à élargir pour généraliser une vie meilleure.","md":"Dans notre pays, un parent sur trois se prive de manger pour nourrir ses enfants, sept personnes sur dix ont déjà renoncé à se soigner, et plus de 2 000 enfants dorment dans la rue chaque nuit. Les plus exposés à cette violence sociale sont les femmes, les enfants, les jeunes, les familles monoparentales, les personnes âgées, en situation de handicap ou LGBTI. Ce bilan, c’est celui du logiciel libéral : à force de coupes budgétaires, il détruit les infrastructures de notre système social et *in fine* nos droits. Il y a donc urgence à mettre en sécurité sociale la Nouvelle France. Ce qui veut dire réparer ce qui a été cassé, mais aussi étendre et créer de nouveaux droits sociaux et économiques. La Sécurité sociale, bâtie en 1945, n’est pas un acquis à démanteler, mais un principe d’organisation de la société à élargir pour généraliser une vie meilleure."}]}]},{"code":"P3C1","part":"Partie 3 – Mettre en sécurité sociale","title":"Chapitre 1 : À chacun selon ses besoins","url":"https://melenchon2027.fr/programme/livre/mettre-en-securite-sociale/chapitre1","sections":[{"title":"Éradiquer la pauvreté","depth":1,"path":["Éradiquer la pauvreté"],"blocks":[{"kind":"texte","text":"Depuis 2017, un million de personnes ont basculé dans la pauvreté. En tout, ce sont plus de 15 % des Français qui vivent sous le seuil de pauvreté : un record jamais enregistré. On pensait les privations révolues, elles reviennent massivement : un Français sur trois déclare acheter de la nourriture en quantité moindre, 4 millions d’entre eux ne parviennent pas à se chauffer correctement, 800 000 ne peuvent pas acheter de vêtements neufs. À cette crise sociale sans précédent s’ajoute une maltraitance institutionnelle qui bloque la sortie de la pauvreté. Cela ne peut plus durer. Notre société sera celle du plein-emploi, où chacun pourra vivre dignement de son travail. Dès les premiers jours, un plan d’urgence sera mis en œuvre pour éradiquer la grande pauvreté."},{"kind":"mesure_cle","text":"Créer une garantie d’autonomie, qui permettra que nul ne soit privé de sa dignité pour vivre : le revenu mensuel de chaque personne atteindra le seuil de pauvreté (1 337 euros pour une personne seule)","id":"P3C1-K01"},{"kind":"mesure","text":"Atteindre l’objectif de « zéro sans-abri » : augmentation significative des places d’accueil dans une logique de « logement d’abord »","depth":0,"id":"P3C1-M001"},{"kind":"mesure","text":"Encadrer le prix des produits alimentaires de première nécessité et interdire la pratique commerciale trompeuse de la « réduflation » (réduction des quantités pour le même prix)","depth":0,"id":"P3C1-M002"},{"kind":"mesure","text":"Instaurer une première tranche gratuite de consommation d’électricité, de chaleur, d’eau, de gaz","depth":0,"id":"P3C1-M003"},{"kind":"mesure","text":"Restructurer les emprunts des ménages surendettés et garantir à tous l’accès effectif aux services bancaires de base","depth":0,"id":"P3C1-M004"},{"kind":"mesure","text":"Plafonner strictement les frais d’incidents bancaires pour empêcher les banques de s’enrichir grâce à la pauvreté","depth":0,"id":"P3C1-M005"},{"kind":"mesure","text":"Garantir l’individualisation des droits et proposer l’automatisation des prestations sociales","depth":0,"id":"P3C1-M006"},{"kind":"mesure","text":"Lutter contre le non-recours aux droits sociaux et civiques par la simplification des démarches et la réouverture des accueils physiques dans les services publics","depth":0,"id":"P3C1-M007"},{"kind":"mesure","text":"Interdire les pratiques de notation des allocataires de prestations sociales, qui engendrent un sur-contrôle des personnes les plus défavorisées, avec des biais discriminatoires","depth":0,"id":"P3C1-M008"},{"kind":"mesure","text":"Assurer la gratuité des protections périodiques pour toutes et tous, quel que soit l’âge","depth":0,"id":"P3C1-M009"}]},{"title":"Établir la garantie d’emploi","depth":1,"path":["Établir la garantie d’emploi"],"blocks":[{"kind":"texte","text":"Une personne au chômage forcé, c’est un savoir-faire gâché pour la société. La collectivité doit intervenir et proposer à chacun de prendre la part du travail qui est nécessaire. Pour cela, tout chômeur de longue durée se verra proposer un emploi utile à la bifurcation écologique ou à l’action sociale (les secteurs d’urgence), en lien avec ses qualifications et sur la base du volontariat."},{"kind":"mesure_cle","text":"Créer une garantie d’emploi : tout chômeur de longue durée pourra se voir proposer d’être embauché au moins au SMIC revalorisé dans un secteur d’urgence","id":"P3C1-K02"}]},{"title":"Un emploi stable pour chacun","depth":1,"path":["Un emploi stable pour chacun"],"blocks":[{"kind":"texte","text":"Près de 4 millions de personnes occupent un emploi précaire. 87 % des embauches ont lieu en contrats courts. La précarité représente un tunnel sans fin : un précaire sur deux obtenait un contrat à durée indéterminée (CDI) au bout d’un an en 1982, contre un sur cinq maintenant ! Et ce, sans compter les temps partiels contraints, quasi exclusivement occupés par des femmes. Dans la France de Macron, ce sont 1,5 million de personnes qui cumulent même deux emplois pour s’en sortir. Cette vision « jetable » des salariés dévalorise le travail, nie les métiers et les savoir-faire. Elle empêche de lancer de vrais projets, de se former ou de s’intéresser à ses clients et à ses usagers."},{"kind":"mesure_cle","text":"Instaurer un quota maximal de contrats précaires dans les entreprises : 10 % pour les petites et moyennes entreprises (PME), 5 % pour les grandes entreprises","id":"P3C1-K03"},{"kind":"mesure","text":"Abroger les ordonnances dites « Pénicaud » ainsi que la loi dite « El Khomri », et rétablir le principe de faveur : un accord d’entreprise doit être plus favorable qu’un accord de branche, lui-même plus favorable que la loi","depth":0,"id":"P3C1-M010"},{"kind":"mesure","text":"Transposer dans le droit français la directive européenne sur la présomption de salariat empêchant les plateformes numériques (Uber, Deliveroo, etc.) d’avoir recours aux faux indépendants","depth":0,"id":"P3C1-M011"},{"kind":"mesure","text":"Titulariser les précaires des trois fonctions publiques","depth":0,"id":"P3C1-M012"},{"kind":"mesure","text":"Démarchandiser le travail temporaire en supprimant le caractère lucratif des entreprises d’intérim et en confiant la gestion des besoins temporaires de main-d’œuvre au service public de l’emploi et à des associations à but non lucratif","depth":0,"id":"P3C1-M013"}]},{"title":"Réduire le temps de travail et faire naître une société du temps choisi","depth":1,"path":["Réduire le temps de travail et faire naître une société du temps choisi"],"blocks":[{"kind":"texte","text":"Le temps de travail des salariés français est reparti à la hausse depuis 2002. La dernière fois qu’ils ont obtenu une semaine de congés payés supplémentaire remonte à quarante ans, avec l’arrivée au pouvoir de François Mitterrand. Pourtant, les avancées technologiques, notamment l’automatisation intelligente, constituent des opportunités uniques pour aller vers une société du temps libéré. La réduction du temps de travail repose le corps et l’esprit, mais elle est aussi une nécessité quand les emplois manquent : pour 1 offre d’emploi vacant, on compte 17 chômeurs dans notre pays ! Progrès social et humain, la réduction du temps de travail apparaît ainsi comme la politique la plus juste, la plus efficace et la moins coûteuse pour lutter contre l’usure des salariés et le sous-emploi. C’est enfin un enjeu de planification écologique. Car il est urgent de réduire le nombre de trajets domicile-travail et d’augmenter le temps individuel dédié à d’autres activités."},{"kind":"mesure_cle","text":"Rétablir immédiatement la durée légale hebdomadaire du temps de travail à 35 heures (en majorant les heures supplémentaires, cotisations incluses, à 25 % pour les quatre premières et 50 % au-delà), passer aux 32 heures dans les métiers pénibles ou de nuit et favoriser leur généralisation par la négociation collective","id":"P3C1-K04"},{"kind":"mesure","text":"Généraliser une sixième semaine de congés payés pour tous les salariés","depth":0,"id":"P3C1-M014"},{"kind":"mesure","text":"Convoquer une conférence nationale sur le partage du temps de travail et l’impact du progrès technologique","depth":0,"id":"P3C1-M015"},{"kind":"mesure","text":"Remettre en cause les autorisations de travail le dimanche","depth":0,"id":"P3C1-M016"},{"kind":"mesure","text":"En finir avec la flexibilisation, l’annualisation contrainte, l’intensification et les horaires fractionnés","depth":0,"id":"P3C1-M017"},{"kind":"mesure","text":"Rétablir le 1er mai comme jour férié chômé payé pour tous les travailleurs","depth":0,"id":"P3C1-M018"},{"kind":"mesure","text":"Instaurer un délégué au travail réel dans les entreprises, chargé de réunir les salariés une fois par mois pour proposer des changements dans l’organisation du travail, auxquels l’employeur devra fournir une réponse justifiée","depth":0,"id":"P3C1-M019"}]},{"title":"Rétablir une assurance chômage protectrice","depth":1,"path":["Rétablir une assurance chômage protectrice"],"blocks":[{"kind":"texte","text":"Les gouvernements Macron ont largement avancé dans le démantèlement de l’assurance chômage. Allongement de la durée minimale de cotisation, réforme du mode de calcul : les perdants de ces réformes sont plus d’un million. Pourtant, le chômage tue : chaque année, 14 000 personnes en meurent à cause du stress, de la dépression, du manque de sommeil. L’assurance chômage doit protéger les personnes privées d’emploi et nous devons créer des emplois en nombre."},{"kind":"mesure_cle","text":"Annuler les réformes Macron sur l’éligibilité et les méthodes de calcul du montant et de la durée de l’allocation, de sorte à indemniser les chômeurs en fonction de leurs derniers salaires, grâce à une assurance calculée à partir du premier jour de travail","id":"P3C1-K05"},{"kind":"mesure","text":"Abroger la loi dite « France Travail » et l’obligation de réaliser 15 heures d’activité hebdomadaire contre un revenu de remplacement : allocation chômage, allocation de solidarité spécifique (ASS), revenu de solidarité active (RSA)","depth":0,"id":"P3C1-M020"},{"kind":"mesure","text":"Élargir la médecine du travail aux chômeurs, avec visite obligatoire au-delà de six mois de chômage","depth":0,"id":"P3C1-M021"},{"kind":"mesure","text":"Indemniser les chômeurs dès le premier jour de la fin de contrat","depth":0,"id":"P3C1-M022"},{"kind":"mesure","text":"Supprimer l’obligation d’accepter une prétendue « offre raisonnable d’emploi »","depth":0,"id":"P3C1-M023"},{"kind":"mesure","text":"Cesser la radiation des chômeurs à la première absence à un rendez-vous et en finir avec la logique de radiation au moindre prétexte pour faire baisser artificiellement les chiffres du chômage","depth":0,"id":"P3C1-M024"},{"kind":"mesure","text":"Rétablir un régime d’assurance chômage spécifique pour les intermittents de l’emploi et les intérimaires permettant de leur assurer une meilleure couverture chômage entre deux périodes d’emploi","depth":0,"id":"P3C1-M025"},{"kind":"mesure","text":"Abroger la présomption de démission en cas d’abandon de poste et le principe de fin des allocations chômage pour les intérimaires et salariés en contrat à durée déterminée (CDD) qui refusent un CDI","depth":0,"id":"P3C1-M026"},{"kind":"mesure","text":"Empêcher l’État de prélever dans les caisses de l’Union nationale interprofessionnelle pour l’emploi dans l’industrie et le commerce (Unédic)","depth":0,"id":"P3C1-M027"}]},{"title":"En finir avec la souffrance et la mort au travail","depth":1,"path":["En finir avec la souffrance et la mort au travail"],"blocks":[{"kind":"texte","text":"La France détient le record européen des morts du travail. Chaque année, on déplore 1 000 décès : accidentés sur des sites dangereux ou par négligence des donneurs d’ordres, travailleurs atteints de maladies professionnelles incurables, poussés au suicide face à des situations insupportables. Les entreprises françaises sont connues pour mettre en danger leurs salariés et les pousser à bout. Des millions de personnes sont éreintées par des douleurs physiques et par des souffrances morales. Tout le monde connaît quelqu’un qui souffre de burn-out ou de surmenage. Le travail doit être une activité sans danger évitable : utile, émancipatrice et respectueuse de la personne. En souffrir n’est pas une fatalité. Le progrès social et humain exige tout l’inverse.","md":"La France détient le record européen des morts du travail. Chaque année, on déplore 1 000 décès : accidentés sur des sites dangereux ou par négligence des donneurs d’ordres, travailleurs atteints de maladies professionnelles incurables, poussés au suicide face à des situations insupportables. Les entreprises françaises sont connues pour mettre en danger leurs salariés et les pousser à bout. Des millions de personnes sont éreintées par des douleurs physiques et par des souffrances morales. Tout le monde connaît quelqu’un qui souffre de *burn-out* ou de surmenage. Le travail doit être une activité sans danger évitable : utile, émancipatrice et respectueuse de la personne. En souffrir n’est pas une fatalité. Le progrès social et humain exige tout l’inverse."},{"kind":"mesure_cle","text":"Fixer un objectif de zéro mort au travail","id":"P3C1-K06"},{"kind":"mesure","text":"Reconnaître le burn-out comme maladie professionnelle","depth":0,"id":"P3C1-M028"},{"kind":"mesure","text":"Doubler les effectifs de l’inspection du travail et l’autoriser à interrompre un chantier pour raison climatique","depth":0,"id":"P3C1-M029"},{"kind":"mesure","text":"Établir des seuils thermiques minimaux et maximaux dans les locaux intérieurs de travail, imposer des temps de pause obligatoires par température extrême","depth":0,"id":"P3C1-M030"},{"kind":"mesure","text":"Renforcer la médecine du travail en l’intégrant au service public de santé et en restaurant la visite médicale obligatoire à l’embauche et les visites périodiques dans la carrière, y compris durant les périodes de chômage","depth":0,"id":"P3C1-M031"},{"kind":"mesure","text":"Restaurer les comités d’hygiène, de sécurité et des conditions de travail (CHSCT) ; augmenter leurs moyens et rendre leurs avis contraignants ; élargir leurs missions aux enjeux de préservation de l’environnement","depth":0,"id":"P3C1-M032"},{"kind":"mesure","text":"Inscrire l’exposition à tous les produits cancérogènes pointés par le Centre international de recherche sur le cancer (CIRC) dans les facteurs de maladies professionnelles, dont les pesticides","depth":0,"id":"P3C1-M033"},{"kind":"mesure","text":"Faire du nombre d’accidents du travail un critère de sélection dans l’attribution des marchés publics et les interdire aux employeurs récidivistes condamnés","depth":0,"id":"P3C1-M034"},{"kind":"mesure","text":"Mettre en place un décompte national unifié et exhaustif des accidents et des morts du travail, incluant l’ensemble des régimes et statuts professionnels dans les statistiques officielles : fonctionnaires, agriculteurs, marins, travailleurs indépendants et des plateformes, etc.","depth":0,"id":"P3C1-M035"},{"kind":"mesure","text":"Lutter contre l’impunité des donneurs d’ordres en instaurant une pénalité financière en fonction du niveau d’accidents et de maladies professionnelles","depth":0,"id":"P3C1-M036"},{"kind":"mesure","text":"Rendre effectif le droit à la déconnexion et encadrer le télétravail","depth":0,"id":"P3C1-M037"},{"kind":"mesure","text":"Cesser la répression des médecins qui prescrivent, à juste titre, des arrêts de travail","depth":0,"id":"P3C1-M038"},{"kind":"mesure","text":"Appliquer le principe de l’humain aux commandes face au management algorithmique : chaque décision, évaluation, recommandation et planification du travail proposée par un algorithme doit être contrôlée et examinée par un humain ; octroyer un droit de veto aux travailleurs, de la conception au déploiement de l’outil algorithmique","depth":0,"id":"P3C1-M039"}]},{"title":"Garantir une retraite digne","depth":1,"path":["Garantir une retraite digne"],"blocks":[{"kind":"texte","text":"Le second mandat d’Emmanuel Macron restera comme celui d’un coup de force : la retraite à 64 ans a été imposée contre le peuple, le Parlement et les syndicats. La retraite est une conquête sociale essentielle, qui permet à la fois le droit au repos et celui à un travail libéré des contraintes de l’emploi. Les contre-réformes qui s’en prennent à elle n’ont pas d’autre objectif que de nous dépouiller de ce droit en liquidant le système par répartition au profit des fonds financiers. Nous devons sauver ce système et restaurer sa progression. Nous pouvons le financer grâce au partage des richesses et aux économies réalisées sur le coût du malheur."},{"kind":"mesure_cle","text":"Abroger la réforme Macron passant l’âge de départ à la retraite à 64 ans, puis abaisser l’âge de départ jusqu’à restaurer le droit à la retraite à 60 ans à taux plein pour 40 annuités de cotisations","id":"P3C1-K07"},{"kind":"mesure","text":"Porter, a minima, toutes les pensions pour une carrière complète (salarié, indépendant, agriculteur) au niveau du SMIC revalorisé, et le minimum vieillesse au niveau du seuil de pauvreté","depth":0,"id":"P3C1-M040"},{"kind":"mesure","text":"Comptabiliser le RSA pour valider des trimestres en vue de la retraite","depth":0,"id":"P3C1-M041"},{"kind":"mesure","text":"Supprimer les avantages fiscaux de la retraite par capitalisation pour financer le système par répartition","depth":0,"id":"P3C1-M042"},{"kind":"mesure","text":"Revenir sur la non-compensation des exonérations de cotisations, qui pénalisent le financement des retraites","depth":0,"id":"P3C1-M043"},{"kind":"mesure","text":"Interdire au Fonds de réserve pour les retraites d’investir dans des secteurs polluants","depth":0,"id":"P3C1-M044"},{"kind":"mesure","text":"Supprimer la décote, qui représente une double peine pour les retraités, en particulier les femmes et les plus précaires","depth":0,"id":"P3C1-M045"}]},{"title":"Construire la Sécurité sociale intégrale","depth":1,"path":["Construire la Sécurité sociale intégrale"],"blocks":[{"kind":"texte","text":"80 ans après sa création, la Sécurité sociale est attaquée de toutes parts. Les assurés font face aux conséquences de la privatisation croissante du risque de maladie : explosion du coût des complémentaires santé et des dépassements d’honoraires, franchises médicales, déremboursement des soins. Après des décennies de réformes néolibérales qui ont affaibli son financement et réduit sa couverture, il est temps de construire la grande Sécu, sans reste à charge, gouvernée par les cotisants et les ayants droit. Et tout ça, en ordonnant son financement pour en faire une Sécurité sociale intégrale. Mais il faut aller plus loin. La Sécurité sociale, à l’origine, devait garantir à chaque travailleur les moyens de satisfaire ses besoins, quelle que soit la situation. Son but était de le libérer de la peur de voir son existence brisée par les aléas de la vie. Plutôt que de réduire son périmètre, comme le dicte l’agenda néolibéral, il faut la consolider et l’étendre à d’autres domaines, comme l’alimentation ou les funérailles, pour que vive sa promesse initiale."},{"kind":"mesure_cle","text":"Instaurer le « 100 % Sécu » en remboursant à 100 % les soins de santé prescrits et en intégrant les assurances maladie complémentaires dans la Sécurité sociale","id":"P3C1-K08"},{"kind":"mesure","text":"Créer une cotisation sociale universelle pour financer la Sécurité sociale, fusionnant les différentes cotisations sociales actuelles et la contribution sociale généralisée (CSG), perçue uniquement et directement par les caisses de la Sécurité sociale, avec une part progressive selon les revenus","depth":0,"id":"P3C1-M046"},{"kind":"mesure","text":"Organiser l’élection des administrateurs de la Sécurité sociale par les assurés eux-mêmes et leur donner le pouvoir de lever les cotisations","depth":0,"id":"P3C1-M047"},{"kind":"mesure","text":"Garantir le zéro reste à charge en supprimant les franchises médicales, les participations forfaitaires et les frais annexes (comme le stationnement payant à l’hôpital)","depth":0,"id":"P3C1-M048"},{"kind":"mesure","text":"Mettre fin aux dépassements d’honoraires dans le secteur conventionné en révisant les inadéquations tarifaires","depth":0,"id":"P3C1-M049"},{"kind":"mesure","text":"Garantir le droit à l’arrêt maladie par l’indemnisation à 100 % du salaire, la suppression des jours de carence et l’auto-déclaration pour les arrêts de courte durée","depth":0,"id":"P3C1-M050"},{"kind":"mesure","text":"Intégrer l’aide médicale d’État (AME) au régime général de la Sécurité sociale, abroger les restrictions d’accès instaurées en 2026 et renforcer sa couverture","depth":0,"id":"P3C1-M051"},{"kind":"mesure","text":"Mettre en place une Sécurité sociale de l’alimentation en expérimentant une garantie universelle d’accès à des aliments choisis et en soutenant les différentes expérimentations locales et communales","depth":0,"id":"P3C1-M052"},{"kind":"mesure","text":"Instaurer une Sécurité sociale funéraire qui prenne en charge les obsèques pour garantir la dignité jusque dans la mort, automatiser le versement du capital-décès et mettre à disposition gratuitement les salles municipales adaptables pour toute demande de funérailles laïques","depth":0,"id":"P3C1-M053"}]},{"title":"Une Sécurité sociale professionnelle","depth":1,"path":["Une Sécurité sociale professionnelle"],"blocks":[{"kind":"texte","text":"Le monde du travail est si instable et précaire qu’il est difficile de progresser dans son métier. Comment se former aux nouveaux outils ou aux dernières inventions lorsqu’on change d’entreprise ou de secteur régulièrement ? Pour remédier à ce problème, nous proposons d’établir une Sécurité sociale professionnelle. À côté de la maladie, des accidents ou du chômage, elle couvrira un nouveau risque : celui de la carrière. La Sécurité sociale professionnelle maintiendra les droits des travailleurs tout au long de la vie, y compris hors du contrat de travail, en les liant à la personne – comme la carte Vitale garantit la continuité du droit à la santé. Cette Sécurité sociale professionnelle rendra le travail indépendant du capital. Les travailleurs pourront choisir librement leur domaine de formation et élever leurs qualifications. Nous inventerons les nouvelles manières de travailler au xxie siècle."},{"kind":"mesure_cle","text":"Assurer la continuité des droits personnels (à la formation, aux congés, à l’ancienneté) hors du contrat de travail, et les transférer d’un contrat à l’autre","id":"P3C1-K09"},{"kind":"mesure","text":"Garantir le maintien du revenu en cas de reconversion ou de formation","depth":0,"id":"P3C1-M054"},{"kind":"mesure","text":"Donner à chaque salarié le droit à 36 heures de formation par an, librement utilisables dans le domaine de son choix","depth":0,"id":"P3C1-M055"},{"kind":"mesure","text":"Intégrer les périodes de stages et d’apprentissage dans la Sécurité sociale professionnelle (ancienneté, congés, formation, retraite)","depth":0,"id":"P3C1-M056"}]}]},{"code":"P3C2","part":"Partie 3 – Mettre en sécurité sociale","title":"Chapitre 2 : Une République de l’égalité réelle et des droits nouveaux","url":"https://melenchon2027.fr/programme/livre/mettre-en-securite-sociale/chapitre2","sections":[{"title":"Une nouvelle étape des libertés et de l’émancipation individuelle","depth":1,"path":["Une nouvelle étape des libertés et de l’émancipation individuelle"],"blocks":[{"kind":"texte","text":"La liberté de choisir sa vie est un droit fondamental de tous les êtres humains. Nos lois doivent garantir ce droit. La 6e République et sa Constitution seront l’occasion de consacrer de nouveaux droits civils, collectifs et individuels, pour aller vers une nouvelle étape de l’émancipation humaine."},{"kind":"mesure_cle","text":"Constitutionnaliser la non-marchandisation du corps humain et le droit fondamental de disposer de soi en toutes circonstances","id":"P3C2-K01"},{"kind":"mesure","text":"Ajouter dans la Constitution le droit de mourir dans la dignité (y compris avec assistance) et l’accès garanti à des soins palliatifs","depth":0,"id":"P3C2-M001"},{"kind":"mesure","text":"Soutenir l’inclusion dans la Charte européenne des droits fondamentaux du droit à l’interruption volontaire de grossesse (IVG) et à la contraception, ainsi que leur accès gratuit pour toutes les personnes menstruées","depth":0,"id":"P3C2-M002"},{"kind":"mesure","text":"Déjudiciariser le changement de sexe à l’état civil en le rendant libre et gratuit devant un officier d’état civil ; tendre vers la suppression de la mention du sexe sur la carte nationale d’identité et le passeport ; pour les mineurs, permettre cette modification avec l’accord d’un des parents","depth":0,"id":"P3C2-M003"},{"kind":"mesure","text":"Établir la filiation par reconnaissance comme principe par défaut, refuser la gestation pour autrui (GPA), faire prévaloir l’intérêt supérieur de l’enfant comme principe premier, en toutes circonstances","depth":0,"id":"P3C2-M004"},{"kind":"mesure","text":"Donner plus de moyens au Défenseur des droits","depth":0,"id":"P3C2-M005"}]},{"title":"Protéger les enfants","depth":1,"path":["Protéger les enfants"],"blocks":[{"kind":"texte","text":"Une société juste protège et respecte les enfants. La France a trop longtemps toléré que s’exercent à bas bruit des violences sur les enfants. Désormais, la mortalité infantile repart à la hausse partout dans le pays. Un pays qui laisse mourir et abandonne ses enfants de la sorte est un pays qui condamne son futur. La Nouvelle France est aussi un pays à hauteur d’enfants."},{"kind":"mesure_cle","text":"Engager un plan de lutte contre le phénomène social massif des violences sexuelles faites aux enfants, fondé sur les préconisations de la Commission indépendante sur l’inceste et les violences sexuelles faites aux enfants (Ciivise)","id":"P3C2-K02"},{"kind":"mesure","text":"Constitutionnaliser la Convention internationale des droits de l’enfant et créer un Code de l’enfance qui prenne en compte l’enfant en tant que personne et oblige l’État à garantir ses droits et libertés fondamentales sans discrimination","depth":0,"id":"P3C2-M006"},{"kind":"mesure","text":"Revenir sur toutes les mesures qui alignent la justice des mineurs sur celle des adultes, rétablir les principes de l’ordonnance de février 1945 de primauté de l’action éducative sur l’action répressive, et doter la Protection judiciaire de la jeunesse (PJJ) de moyens adaptés","depth":0,"id":"P3C2-M007"},{"kind":"mesure","text":"Permettre aux enfants d’apprendre la démocratie en la pratiquant dans les établissements qui les accueillent et tenir compte de leur parole sur les décisions qui les concernent (règles collectives, activités, personnels)","depth":0,"id":"P3C2-M008"},{"kind":"mesure","text":"Combattre les logiques « no kids », qui discriminent les enfants dans l’espace public, les transports, les lieux de vacances","depth":0,"id":"P3C2-M009"},{"kind":"mesure","text":"Recentraliser la protection de l’enfance en augmentant significativement ses moyens financiers et humains pour une égalité entre tous les enfants de la République et un accompagnement éducatif de qualité","depth":0,"id":"P3C2-M010"},{"kind":"mesure","text":"En finir avec tous les lieux de placement indignes (hôtels, campings, Airbnb) en dotant la protection de l’enfance de moyens humains et matériels à la hauteur des besoins par un plan pluriannuel de recrutement et d’ouverture de places en établissements, en familles d’accueil, en structures « hybrides » et en alternatives au placement","depth":0,"id":"P3C2-M011"},{"kind":"mesure","text":"Créer un contrôleur général des lieux de placement, indépendant des pouvoirs publics, pour veiller au respect de plusieurs critères (nombre minimal de professionnels, nombre maximal d’enfants par structure et par professionnel, temps d’accompagnement, formation des professionnels)","depth":0,"id":"P3C2-M012"},{"kind":"mesure","text":"Accompagner socialement et financièrement jusqu’à 25 ans les jeunes sortant de l’aide sociale à l’enfance (ASE)","depth":0,"id":"P3C2-M013"},{"kind":"mesure","text":"Prolonger le délai de prescription du délit de non-dénonciation pour les faits de violences sexuelles, tels que définis par le Code pénal, dès lors qu’ils sont commis sur un mineur","depth":0,"id":"P3C2-M014"},{"kind":"mesure","text":"Engager un plan de rattrapage spécifique pour la protection des droits fondamentaux des enfants dans les Outre-mer","depth":0,"id":"P3C2-M015"},{"kind":"mesure","text":"Déployer des campagnes massives de sensibilisation et de prévention des violences et négligences graves faites aux enfants, faire connaître et renforcer les dispositifs d’alerte et d’accompagnement des parents pour créer une culture protectrice","depth":0,"id":"P3C2-M016"},{"kind":"mesure","text":"Garantir le droit à la santé des enfants, notamment la santé mentale","depth":0,"id":"P3C2-M017"},{"kind":"mesure","text":"Mettre fin aux violations des droits fondamentaux des enfants étrangers, faire respecter l’interdiction d’expulsion des enfants et abolir l’enfermement des mineurs et familles avec enfants en rétention administrative","depth":0,"id":"P3C2-M018"},{"kind":"mesure","text":"Inscrire dans les emplois du temps des élèves des séances d’information, adaptée à leur âge, sur l’enfance maltraitée, notamment sur les violences intrafamiliales à caractère sexuel et sur les violences commises par des adultes exerçant une fonction d’autorité","depth":0,"id":"P3C2-M019"},{"kind":"mesure","text":"Étendre le contrôle des antécédents, au moyen d’une attestation d’honorabilité, à toutes les personnes travaillant dans les établissements scolaires","depth":0,"id":"P3C2-M020"}]},{"title":"Construire l’autonomie des jeunes","depth":1,"path":["Construire l’autonomie des jeunes"],"blocks":[{"kind":"texte","text":"La jeunesse était autrefois une promesse d’autonomie, elle est devenue un piège à précarité. Contrats courts, études chères, loyers excessifs : les jeunes sont les premiers à trinquer pour tout. Les conséquences sont directes, avec une dégradation généralisée de leur état de santé. La Nouvelle France sera un pays qui ne laissera pas sa jeunesse dans les longues files d’attente pour l’aide alimentaire. Les jeunes sont sa plus grande richesse. Il faut leur donner les moyens de choisir leur vie."},{"kind":"mesure_cle","text":"Créer un office pour l’autonomie des jeunes, afin de redonner une direction politique claire aux politiques de jeunesse, aujourd’hui éparpillées entre 28 administrations différentes","id":"P3C2-K03"},{"kind":"mesure","text":"Financer l’autonomie des jeunes détachés du foyer fiscal parental grâce à la garantie d’autonomie qui les portera au-dessus du seuil de pauvreté (1 337 euros pour une personne seule)","depth":0,"id":"P3C2-M021"},{"kind":"mesure","text":"Instaurer réellement le repas à un euro dans les centres régionaux des œuvres universitaires et scolaires (Crous) pour tous les étudiants, en garantissant les financements nécessaires à un repas de qualité ainsi que l’obligation d’au moins un restaurant universitaire à proximité de chaque campus","depth":0,"id":"P3C2-M022"},{"kind":"mesure","text":"Relancer la construction de logements sociaux pour les étudiants et jeunes travailleurs, favoriser la rénovation de l’existant","depth":0,"id":"P3C2-M023"},{"kind":"mesure","text":"Instaurer un « emploi spécifique jeune » d’une durée de cinq ans dans le secteur non marchand et public pour éliminer le chômage des jeunes (trois fois supérieur à celui de leurs aînés à diplôme égal)","depth":0,"id":"P3C2-M024"},{"kind":"mesure","text":"Mettre fin à la précarité des étudiants, notamment en augmentant les indemnités de stage et en négociant avec les branches patronales les postes ouverts aux stages pour en finir avec la pratique des CDD déguisés","depth":0,"id":"P3C2-M025"},{"kind":"mesure","text":"Rembourser les séances de psychothérapie pour les moins de 26 ans","depth":0,"id":"P3C2-M026"},{"kind":"mesure","text":"Offrir à chaque jeune, dans le cadre du service citoyen obligatoire, un bilan de santé et une évaluation des capacités d’écriture, de lecture et de calcul, avec mise à niveau si nécessaire, ainsi qu’une formation gratuite à la conduite et le passage du permis de conduire","depth":0,"id":"P3C2-M027"}]},{"title":"Faire face collectivement à la perte d’autonomie individuelle","depth":1,"path":["Faire face collectivement à la perte d’autonomie individuelle"],"blocks":[{"kind":"texte","text":"Dans la Nouvelle France, on vit plus âgé. Et pourtant, on se désintéresse de ces nouveaux âges de la vie humaine en déniant aux personnes concernées des conditions de vieillesse dignes. Il faut sortir du modèle actuel de maltraitance institutionnelle de nos aînés et des travailleurs qui s’en occupent, en grande majorité des femmes. C’est un enjeu de civilisation humaine. L’objectif doit être de permettre, aussi longtemps et largement que possible, l’autonomie des personnes."},{"kind":"mesure_cle","text":"Construire un service public de la dépendance pour les personnes âgées, qu’elles vivent à domicile ou non","id":"P3C2-K04"},{"kind":"mesure","text":"Développer un réseau public de maisons de retraite aux tarifs harmonisés et accessibles","depth":0,"id":"P3C2-M028"},{"kind":"mesure","text":"Créer 10 000 places par an en établissement d’hébergement pour personnes âgées dépendantes (EHPAD) publics pendant cinq ans, refonder le modèle de financement de ces établissements pour augmenter leurs moyens matériels et humains","depth":0,"id":"P3C2-M029"},{"kind":"mesure","text":"Former, qualifier et recruter du personnel en nombre suffisant pour respecter un ratio minimal d’encadrement « au chevet » des résidents","depth":0,"id":"P3C2-M030"},{"kind":"mesure","text":"Changer de culture dans les EHPAD pour une approche plus humaine, davantage centrée sur la personne (ses aspirations, sa qualité de vie) et sur ses liens avec la société, et développer les structures expérimentales comme les « villages Alzheimer »","depth":0,"id":"P3C2-M031"},{"kind":"mesure","text":"Collectiviser les EHPAD privés à but lucratif et les confier à des associations, coopératives, etc.","depth":0,"id":"P3C2-M032"},{"kind":"mesure","text":"Revaloriser les métiers et revenus de l’ensemble des professionnelles du grand âge, à domicile comme en institution, en refondant les grilles de rémunération et de qualifications","depth":0,"id":"P3C2-M033"},{"kind":"mesure","text":"Prendre en charge les conditions du maintien à domicile (soins, accompagnement, aménagements du logement, équipements médicaux) par la Sécurité sociale","depth":0,"id":"P3C2-M034"},{"kind":"mesure","text":"Mettre en place un réseau d’équipes soignantes du soin à domicile pour mettre fin au traitement inhumain des personnes âgées","depth":0,"id":"P3C2-M035"},{"kind":"mesure","text":"Lutter contre l’isolement des personnes âgées en créant des logements publics intergénérationnels à loyer réduit – retraités, actifs, étudiants, espaces de vie communs, services disponibles","depth":0,"id":"P3C2-M036"},{"kind":"mesure","text":"Créer un véritable statut d’aidant familial, avec une rémunération réelle, une formation adaptée et l’organisation de périodes de repos en attribuant des heures d’aide extérieure","depth":0,"id":"P3C2-M037"}]},{"title":"Lever les obstacles à l’autonomie des personnes en situation de handicap","depth":1,"path":["Lever les obstacles à l’autonomie des personnes en situation de handicap"],"blocks":[{"kind":"texte","text":"Que ce soit à l’école, pour accéder aux services publics ou dans toutes les situations de la vie quotidienne, les personnes en situation de handicap font toujours face à de nombreux obstacles, plus de vingt ans après l’adoption de la loi du 11 février 2005 pour l’égalité des droits et des chances, la participation et la citoyenneté des personnes handicapées. En 2023, la France a ainsi été condamnée parce qu’elle violait la Charte sociale européenne, qui garantit les droits des personnes en situation de handicap. Il faut en finir avec les beaux discours sans lendemain. Place aux actes."},{"kind":"mesure_cle","text":"Assurer l’autonomie financière des personnes en situation de handicap en revalorisant l’allocation aux adultes handicapés (AAH) à hauteur du SMIC","id":"P3C2-K05"},{"kind":"mesure","text":"Affirmer l’objectif de désinstitutionnalisation de la gestion du handicap","depth":0,"id":"P3C2-M038"},{"kind":"mesure","text":"Revenir sur la loi portant évolution du logement, de l’aménagement et du numérique (dite loi « ELAN ») d’Emmanuel Macron pour imposer 100 % de logements accessibles dans les constructions neuves (comme le prévoit la loi de 2005) et faire participer l’État aux financements des travaux d’adaptation des logements anciens","depth":0,"id":"P3C2-M039"},{"kind":"mesure","text":"Augmenter les moyens des maisons départementales des personnes handicapées (MDPH) pour assurer l’égalité de la prise en charge","depth":0,"id":"P3C2-M040"},{"kind":"mesure","text":"Permettre la pleine insertion des personnes handicapées dans le monde du travail, notamment par un financement pérenne et la formation des inspecteurs du travail sur le handicap","depth":0,"id":"P3C2-M041"},{"kind":"mesure","text":"Accorder le statut de salarié aux travailleuses et travailleurs en établissement et service d’aide par le travail (ESAT)","depth":0,"id":"P3C2-M042"},{"kind":"mesure","text":"Faire de l’école pour tous une réalité :","depth":0,"id":"P3C2-M043"},{"kind":"sous_mesure","text":"Créer un corps de fonctionnaires pour les personnels d’accompagnement des élèves en situation de handicap (AESH), en recruter davantage pour renforcer les capacités d’accueil et d’accompagnement et mettre fin à la mutualisation","depth":1,"id":"P3C2-S001","parent":"P3C2-M043"},{"kind":"sous_mesure","text":"Développer, en nombre suffisant, les supports pédagogiques adaptés aux particularités de ces enfants (enseignement bilingue langue des signes française (LSF), apprentissage du braille, communication alternative et augmentée, etc.)","depth":1,"id":"P3C2-S002","parent":"P3C2-M043"},{"kind":"sous_mesure","text":"Mettre en place des actions de sensibilisation pour lutter contre les discriminations dans l’Éducation nationale, de la maternelle au lycée, ainsi que dans l’enseignement supérieur et la formation professionnelle","depth":1,"id":"P3C2-S003","parent":"P3C2-M043"},{"kind":"sous_mesure","text":"Décloisonner l’Éducation nationale et le secteur médico-social","depth":1,"id":"P3C2-S004","parent":"P3C2-M043"},{"kind":"sous_mesure","text":"Rendre accessibles les locaux et les transports scolaires et périscolaires aux élèves en situation de handicap","depth":1,"id":"P3C2-S005","parent":"P3C2-M043"},{"kind":"mesure","text":"Renforcer les dispositifs d’accompagnement à la scolarité dans l’enseignement supérieur pour en garantir l’accès aux personnes handicapées grâce à la fourniture d’aménagements, y compris pour faciliter la mobilité internationale","depth":0,"id":"P3C2-M044"},{"kind":"mesure","text":"Adapter tous les services publics, procédures et documents administratifs aux handicaps, et organiser la généralisation de ces dispositions aux services et entreprises privées","depth":0,"id":"P3C2-M045"},{"kind":"mesure","text":"Objectif « zéro obstacle » : tolérance zéro contre les entraves, c’est-à-dire les obstacles au déplacement ou à la vie quotidienne, permettre aux préfets de se substituer aux maires pour imposer les travaux dans des bâtiments privés et les fermer en cas de non-respect de la loi, imposer un plan de mise en accessibilité des transports","depth":0,"id":"P3C2-M046"},{"kind":"mesure","text":"Assurer la prise en charge par la Sécurité sociale de l’ensemble des dispositifs médicaux nécessaires à la vie quotidienne","depth":0,"id":"P3C2-M047"}]},{"title":"Lutter contre les violences LGBTIphobes","depth":1,"path":["Lutter contre les violences LGBTIphobes"],"blocks":[{"kind":"texte","text":"Si des droits concrets ont été conquis par les luttes ces dernières années, comme l’ouverture de la procréation médicalement assistée (PMA) aux femmes lesbiennes et célibataires en 2021, ces derniers, dans leur globalité, n’ont cessé de reculer dans la France d’Emmanuel Macron. Placé au cinquième rang des États européens pour les droits LGBTI en 2017, notre pays a dégringolé à la quinzième place, et les actes de violences LGBTIphobes sont en constante augmentation. Face à l’offensive réactionnaire, notre devoir est de permettre l’émancipation de chacune et chacun."},{"kind":"mesure_cle","text":"Mettre en œuvre un plan d’éradication des violences à l’encontre des personnes LGBTI","id":"P3C2-K06"},{"kind":"mesure","text":"Faire appliquer l’interdiction des thérapies de conversion en ciblant les acteurs qui en font la promotion","depth":0,"id":"P3C2-M048"},{"kind":"mesure","text":"Former le personnel médical à l’accueil des personnes trans et intersexes","depth":0,"id":"P3C2-M049"},{"kind":"mesure","text":"Rembourser à 100 % par la Sécurité sociale les soins de transition, sans devoir passer par une procédure de reconnaissance d’affection de longue durée (ALD)","depth":0,"id":"P3C2-M050"},{"kind":"mesure","text":"Interdire et sanctionner toute intervention médicale non consentie sur les enfants intersexes (mutilations, traitements hormonaux, stérilisations) et assurer un accès effectif à la justice, via des enquêtes indépendantes et diligentes, pour toute atteinte à leurs droits humains","depth":0,"id":"P3C2-M051"}]},{"title":"Reconnaître toutes les familles","depth":1,"path":["Reconnaître toutes les familles"],"blocks":[{"kind":"texte","text":"Dans la Nouvelle France, les familles ne sont plus construites selon une norme unique. En cinquante ans, le nombre de divorces a triplé. Désormais, la majorité des enfants naissent hors mariage, une famille sur quatre est monoparentale, les familles homoparentales peuvent adopter et les femmes ont accès à la PMA, seules ou avec leur conjointe. En parallèle, de plus en plus de personnes choisissent de vivre et de construire leur vie avec leurs amis, au sein de familles choisies. Pourtant, les liens de solidarité affective qui unissent ces nouvelles familles ne sont ni suffisamment reconnus, ni suffisamment protégés. Il faut donc créer de nouveaux droits."},{"kind":"mesure_cle","text":"Garantir le droit de partir et lutter contre la précarité des mères isolées : déconjugaliser et revaloriser l’allocation de soutien familial (ASF), défiscaliser les pensions alimentaires, réduire les délais de la justice familiale","id":"P3C2-K07"},{"kind":"mesure","text":"Créer un statut « famille monoparentale » sur le modèle du statut « famille nombreuse » ouvrant le droit à des réductions de tarifs dans les transports et les services publics","depth":0,"id":"P3C2-M052"},{"kind":"mesure","text":"Créer une nouvelle forme d’adoption sociale ouvrant à un « partenariat social »","depth":0,"id":"P3C2-M053"},{"kind":"mesure","text":"Accroître les moyens dédiés à la PMA et ouvrir des centres dédiés en nombre suffisant pour réduire les délais, harmoniser les pratiques à l’échelle nationale et rendre la PMA réellement accessible aux personnes trans","depth":0,"id":"P3C2-M054"},{"kind":"mesure","text":"Réformer le don de gamètes pour permettre une gestion nationale fiable, des stocks équilibrés sur l’ensemble du territoire et une égalité de traitement des populations","depth":0,"id":"P3C2-M055"},{"kind":"mesure","text":"Étendre la solidarité aux liens extra-familiaux et amicaux en accordant aux salariés le droit à un congé de proche aidant et à un congé parentalité pour soutenir un ami","depth":0,"id":"P3C2-M056"},{"kind":"mesure","text":"Ouvrir un congé de 7 jours consécutifs pour le décès d’un proche (membre de la famille ou ami)","depth":0,"id":"P3C2-M057"},{"kind":"mesure","text":"Donner un statut légal au baptême civil","depth":0,"id":"P3C2-M058"},{"kind":"mesure","text":"Reconnaître un statut de beau-parent sous condition de l’intérêt supérieur de l’enfant et de la participation effective aux tâches éducatives","depth":0,"id":"P3C2-M059"}]},{"title":"Mettre fin à l’épidémie de solitude","depth":1,"path":["Mettre fin à l’épidémie de solitude"],"blocks":[{"kind":"texte","text":"En France, une personne sur quatre se sent seule quotidiennement, une sur dix est totalement isolée et 750 000 personnes âgées sont même en situation de mort sociale. Le manque de lien social équivaut à fumer 15 cigarettes par jour : il tue. Cette solitude est le produit du néolibéralisme, qui organise le règne de l’individualisme et détruit les infrastructures collectives nécessaires au lien social. Nous mettrons fin à cette épidémie en sortant de la société du tout-marché et en construisant une nouvelle société de l’entraide."},{"kind":"mesure_cle","text":"En finir avec la privatisation et la destruction des espaces communs et publics, et redéployer des espaces de gratuité au service des liens sociaux et affectifs dans nos communes","id":"P3C2-K08"},{"kind":"mesure","text":"Développer, partout, la prescription sociale pour permettre aux professionnels de santé de diriger les personnes se sentant seules vers des structures d’accompagnement non médical gratuites et dédiées à la création de liens sociaux, comme des associations ou des collectifs à l’échelle communale","depth":0,"id":"P3C2-M060"},{"kind":"mesure","text":"Créer et généraliser à l’école, à l’université, au travail et pendant la conscription citoyenne, au même titre que les formations premiers secours, des formations de lutte contre l’isolement social agréées par l’État pour identifier, comprendre et savoir orienter collectivement les personnes concernées","depth":0,"id":"P3C2-M061"}]}]},{"code":"P3C3","part":"Partie 3 – Mettre en sécurité sociale","title":"Chapitre 3 : Entrer pleinement dans l’ère de l’émancipation des femmes","url":"https://melenchon2027.fr/programme/livre/mettre-en-securite-sociale/chapitre3","sections":[{"title":"Atteindre l’égalité salariale","depth":1,"path":["Atteindre l’égalité salariale"],"blocks":[{"kind":"texte","text":"Les femmes gagnent en moyenne 22 % de moins que les hommes et constituent 70 % des travailleurs pauvres. De plus en plus précaires, reléguées en bas de l’échelle, elles subissent le temps partiel imposé et les horaires décalés. Dans la Nouvelle France, les femmes ne seront plus des subalternes dans le monde du travail."},{"kind":"mesure_cle","text":"Lutter contre le temps partiel contraint qui touche à 80 % des femmes","id":"P3C3-K01"},{"kind":"mesure","text":"Revaloriser les rémunérations des métiers occupés majoritairement par des femmes, prendre en compte leur pénibilité en réinstaurant les facteurs de risques supprimés par Macron en 2017 et en créant de nouveaux critères liés aux contraintes émotionnelles fortes","depth":0,"id":"P3C3-M001"},{"kind":"mesure","text":"Augmenter les sanctions financières et pénales à l’encontre des entreprises qui ne respectent pas l’égalité salariale femmes/hommes (amendes et refus d’attribution de marchés publics)","depth":0,"id":"P3C3-M002"},{"kind":"mesure","text":"Créer dans l’entreprise une commission de contrôle salarié sur l’égalité entre les femmes et les hommes","depth":0,"id":"P3C3-M003"},{"kind":"mesure","text":"Imposer la parité entre les femmes et les hommes dans les institutions politiques et économiques, ainsi que dans les administrations, les syndicats et les associations","depth":0,"id":"P3C3-M004"},{"kind":"mesure","text":"Remplacer le congé paternité et le congé maternité actuels par un congé d’accueil de l’enfant, identique et obligatoire pour les deux parents, d’une durée de 20 semaines par parent","depth":0,"id":"P3C3-M005"}]},{"title":"Éradiquer les violences sexistes et sexuelles","depth":1,"path":["Éradiquer les violences sexistes et sexuelles"],"blocks":[{"kind":"texte","text":"Les violences sexistes et sexuelles sont systémiques. Elles sont tellement intriquées à la domination masculine que lutter contre elles, c’est lutter contre cette domination tout entière. Elles appellent une réponse d’ampleur coordonnée, incluant notamment une transformation des institutions policière et judiciaire mais aussi de l’école ou du secteur du logement."},{"kind":"mesure_cle","text":"Adopter une loi de lutte contre les violences sexistes et sexuelles et allouer les 3 milliards de budget demandés par les associations","id":"P3C3-K02"},{"kind":"mesure","text":"Garantir une budgétisation transparente qui prenne en compte le genre","depth":0,"id":"P3C3-M006"},{"kind":"mesure","text":"Mettre fin au harcèlement sexiste et aux agressions sexuelles dans l’espace public en agissant, en particulier, sur la prévention et en promouvant un urbanisme féministe","depth":0,"id":"P3C3-M007"},{"kind":"mesure","text":"Reconnaître et sanctionner les violences obstétricales et gynécologiques","depth":0,"id":"P3C3-M008"},{"kind":"mesure","text":"Combattre l’impunité des agresseurs sexuels et la correctionnalisation des viols","depth":0,"id":"P3C3-M009"},{"kind":"mesure","text":"Adapter le monde du travail à la réalité des violences conjugales et sexuelles et renforcer les obligations de l’employeur en matière de prévention et de traitement des violences sexistes et sexuelles au travail","depth":0,"id":"P3C3-M010"},{"kind":"mesure","text":"Intégrer la prévention et la lutte contre les discours masculinistes à l’ensemble des politiques publiques du numérique, notamment aux séances d’éducation à l’école","depth":0,"id":"P3C3-M011"},{"kind":"mesure","text":"Créer un fonds dédié au dédommagement des enfants des victimes de féminicides","depth":0,"id":"P3C3-M012"},{"kind":"mesure","text":"Soutenir les permanences associatives et les dispositifs itinérants d’aide aux femmes victimes de violences, là où l’offre d’accompagnement est insuffisante, notamment en zones rurales et dans les quartiers populaires","depth":0,"id":"P3C3-M013"},{"kind":"mesure","text":"Rembourser les tests de soumission chimique sur l’ensemble du territoire","depth":0,"id":"P3C3-M014"}]},{"title":"Garantir le droit des femmes à disposer librement de leur corps","depth":1,"path":["Garantir le droit des femmes à disposer librement de leur corps"],"blocks":[{"kind":"texte","text":"La Nouvelle France est le résultat des luttes des femmes pour conquérir le droit à disposer d’elles-mêmes. De ce point de vue, la constitutionnalisation du droit à l’avortement, portée notamment par une proposition de loi de Mathilde Panot, est une conquête. Mais il reste encore du chemin à parcourir pour que le droit à disposer librement de son corps soit effectif pour toutes les femmes."},{"kind":"mesure_cle","text":"Garantir l’égal accès et l’effectivité du droit à l’IVG, tout comme le choix de la méthode d’IVG, et supprimer la double clause de conscience des médecins","id":"P3C3-K03"},{"kind":"mesure","text":"Lutter contre les mouvements anti-choix qui entravent les droits à la santé sexuelle et reproductive et le droit à l’avortement","depth":0,"id":"P3C3-M015"},{"kind":"mesure","text":"Abolir la prostitution, garantir la dignité de la personne et renforcer, sans condition, l’accompagnement social, sanitaire, juridique et professionnel des personnes en situation de prostitution","depth":0,"id":"P3C3-M016"},{"kind":"mesure","text":"Améliorer l’accès à la santé des femmes et leur prise en charge","depth":0,"id":"P3C3-M017"},{"kind":"mesure","text":"Rembourser le traitement hormonal de la ménopause","depth":0,"id":"P3C3-M018"},{"kind":"mesure","text":"Renforcer le planning familial, augmenter et pérenniser les financements des associations féministes et LGBTI","depth":0,"id":"P3C3-M019"}]},{"title":"Faire le service public de la petite enfance","depth":1,"path":["Faire le service public de la petite enfance"],"blocks":[{"kind":"texte","text":"Tant que les femmes auront une charge totale de travail, activité domestique comprise, supérieure à celle des hommes, elles n’auront pas leur juste part de liberté, de loisir et de repos. C’est aux femmes qu’incombe encore trop souvent, et parfois exclusivement, la prise en charge des enfants. Par ailleurs, la maltraitance au sein de crèches privées a été révélée par plusieurs enquêtes : la course aux profits fait des ravages sur le bien-être des enfants et les personnels. La création d’un vaste système public de garde d’enfants est donc impérative pour garantir la liberté des parents, des mères en particulier, un meilleur accueil des tout-petits et de bonnes conditions de travail aux personnels."},{"kind":"mesure_cle","text":"Créer un véritable service public de la petite enfance","id":"P3C3-K04"},{"kind":"mesure","text":"Planifier l’ouverture progressive de 500 000 places pour l’accueil des jeunes enfants (crèches publiques, associatives, assistantes maternelles, jardins d’enfants)","depth":0,"id":"P3C3-M020"},{"kind":"mesure","text":"Garantir la gratuité des crèches publiques","depth":0,"id":"P3C3-M021"},{"kind":"mesure","text":"Mailler le territ
