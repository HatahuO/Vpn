id":"P6C1-M009"},{"kind":"texte","text":"Nous appliquerons immédiatement, dans tous les cas, notre programme au niveau national. Il faudra donc assumer la confrontation avec les institutions européennes. Nous utiliserons pour cela tous les leviers pour faire valoir notre position au Conseil européen (droit de veto sur les accords de libre-échange ou projet d’élargissement, conditionnement de la contribution française au budget européen etc.). Cela veut dire aussi la désobéissance aux règles bloquantes, chaque fois que cela sera nécessaire."},{"kind":"texte","text":"Ces deux stratégies s’alimentent mutuellement : c’est en agissant en éclaireurs que nous pourrons entraîner les autres peuples européens et changer les règles de fond en comble !"}]},{"title":"La construction d’un bloc de bifurcation en Europe","depth":1,"path":["La construction d’un bloc de bifurcation en Europe"],"blocks":[{"kind":"texte","text":"Nous nous appuierons sur les intérêts communs que la France partage avec certains États, notamment au sud de l’Europe. Beaucoup de peuples en Europe souffrent de la construction européenne telle qu’elle est. La France peut construire des coalitions pour obtenir des changements profonds de la politique européenne :"},{"kind":"mesure","text":"La fin de la politique absurde de resserrement monétaire de la Banque centrale européenne (BCE) et la reprise de ses rachats de dettes publiques afin que la politique monétaire serve l’intérêt général, et non les intérêts des banques privées","depth":0,"id":"P6C1-M010"},{"kind":"mesure","text":"La suspension pour tous des règles budgétaires des 3 % de déficit, comme pendant la crise du Covid-19","depth":0,"id":"P6C1-M011"},{"kind":"mesure","text":"La sortie coordonnée du marché européen de l’énergie","depth":0,"id":"P6C1-M012"},{"kind":"mesure","text":"Des mécanismes d’harmonisation fiscale et sociale par le haut, par exemple en étendant la clause de l’Européenne la plus favorisée à tous les domaines","depth":0,"id":"P6C1-M013"},{"kind":"mesure","text":"Une réforme de la politique agricole commune (PAC) pour cesser de favoriser l’agriculture industrielle et destructrice","depth":0,"id":"P6C1-M014"},{"kind":"mesure","text":"L’introduction de protections douanières et d’un impôt sur les multinationales dans le prochain budget européen","depth":0,"id":"P6C1-M015"},{"kind":"mesure","text":"La suspension de l’accord d’association UE-Israël, qui rend l’Union européenne complice du génocide","depth":0,"id":"P6C1-M016"}]},{"title":"Pour la rupture avec le libéralisme du traité de Lisbonne","depth":1,"path":["Pour la rupture avec le libéralisme du traité de Lisbonne"],"blocks":[{"kind":"texte","text":"La France proposera aussi une nouvelle étape pour l’Europe, en rupture avec des décennies de libéralisme, dont les impasses apparaissent aujourd’hui plus clairement que jamais. C’est pourquoi notre position ne sera pas uniquement défensive, mais aussi constructive. Comme pays fondateur, deuxième économie et bientôt première population de l’Union, nous avons toute légitimité pour proposer une refondation de la coopération en Europe sur des principes totalement différents. Ce changement du principe de l’action de l’Union européenne devrait prendre une forme officielle telle qu’une convention ou qu’un nouvel accord général des pays membres réunis en conseil. Nous mettrons sur la table des propositions pour fonder de nouveaux traités :"},{"kind":"mesure","text":"La souveraineté budgétaire des parlements nationaux","depth":0,"id":"P6C1-M017"},{"kind":"mesure","text":"Une BCE placée sous contrôle démocratique et mobilisée pour financer la bifurcation écologique et sociale des États","depth":0,"id":"P6C1-M018"},{"kind":"mesure","text":"La suppression du veto des paradis fiscaux européens en matière fiscale, qui siphonne nos recettes budgétaires et sape le consentement à l’impôt","depth":0,"id":"P6C1-M019"},{"kind":"mesure","text":"La mise en place de règles d’harmonisation sociale, fiscale et écologique à l’intérieur de l’Union","depth":0,"id":"P6C1-M020"},{"kind":"mesure","text":"La mise en place d’un protectionnisme écologique et solidaire, avec notamment une taxe kilométrique aux frontières de l’UE","depth":0,"id":"P6C1-M021"},{"kind":"mesure","text":"Le droit pour les États de venir librement en aide à des entreprises d’intérêt public ou de créer des monopoles publics dans des secteurs stratégiques","depth":0,"id":"P6C1-M022"},{"kind":"mesure","text":"La mise en place d’une autorité éthique indépendante pour contrôler les conflits d’intérêts et empêcher la corruption des dirigeants européens","depth":0,"id":"P6C1-M023"},{"kind":"mesure","text":"L’application de la clause de l’Européenne la plus favorisée pour harmoniser par le haut les droits des femmes","depth":0,"id":"P6C1-M024"},{"kind":"mesure","text":"La garantie du droit à l’avortement partout dans l’UE","depth":0,"id":"P6C1-M025"},{"kind":"mesure","text":"La mise en place d’un dispositif pour accueillir dignement les demandeurs d’asile et sanctionner les États membres qui ne respectent pas les droits humains","depth":0,"id":"P6C1-M026"},{"kind":"mesure","text":"La précision et l’organisation de la clause de défense mutuelle entre États membres","depth":0,"id":"P6C1-M027"},{"kind":"texte","text":"Notre logique est simple. Tant qu’un accord de changement des traités n’est pas acquis, nous négocions avec nos partenaires et désobéissons aux règles bloquantes en parallèle. En cas d’accord, il sera soumis à un référendum."},{"kind":"texte","text":"Depuis soixante ans, l’UE n’est pas une construction figée : c’est un espace politique fondé sur des rapports de force et des coopérations à géométrie variable. Contrairement aux gouvernements français précédents, nous n’hésiterons pas à utiliser tout le poids politique et économique de la France pour appliquer notre programme."}]}]},{"code":"P6C2","part":"Partie 6 – Un monde ordonné","title":"Chapitre 2 : Une France indépendante au service de la paix","url":"https://melenchon2027.fr/programme/livre/un-monde-ordonne/chapitre2","sections":[{"title":"Assumer l’indépendance de la France dans le monde","depth":1,"path":["Assumer l’indépendance de la France dans le monde"],"blocks":[{"kind":"texte","text":"En s’alignant sur les États-Unis, le gouvernement français a laissé commettre un génocide à Gaza. En ne condamnant pas les guerres d’agression contre le Liban et l’Iran, comme elles avaient condamné la guerre d’agression contre l’Ukraine, les autorités françaises ont fait la démonstration de leur double standard diplomatique. La servitude volontaire de l’Europe face à Washington se retourne aujourd’hui contre elle : par ses menaces d’annexion contre le Groenland et le Canada, Trump remet en cause l’intégrité territoriale d’États membres de l’OTAN. Avec sa vision fascisante et suprémaciste, Trump incarne un nouvel âge de l’impérialisme. Il extorque un tribut à ses « alliés » et entreprend une stratégie de généralisation de la guerre pour contrecarrer la place prise par la Chine dans le capitalisme mondialisé. La France doit prendre la tête du camp de la paix : abandonner l’atlantisme et retrouver une voix indépendante sont plus que jamais une nécessité."},{"kind":"mesure_cle","text":"Se retirer immédiatement du commandement intégré de l’OTAN puis, par étapes, de l’organisation elle-même","id":"P6C2-K01"},{"kind":"mesure","text":"Sortir la France de l’isolement occidental et recommencer à parler au monde entier en refusant la doctrine du « choc des civilisations », en portant une action internationale non-alignée au service de la paix, en promouvant une conception universelle et non dévoyée des droits humains","depth":0,"id":"P6C2-M001"},{"kind":"mesure","text":"Renforcer le « Front du refus » contre la stratégie belliciste des États-Unis en étant le premier État membre permanent du Conseil de sécurité à le rejoindre","depth":0,"id":"P6C2-M002"},{"kind":"mesure","text":"Rejeter le tribut, exigé par les États-Unis, de 5 % du PIB consacré aux dépenses de défense","depth":0,"id":"P6C2-M003"},{"kind":"mesure","text":"Protéger le Groenland face aux menaces états-uniennes en étendant à l’ensemble des territoires associés à l’UE les garanties de sécurité prévues par les traités","depth":0,"id":"P6C2-M004"},{"kind":"mesure","text":"Refuser toute inscription de notre pays dans une alliance militaire permanente dans la région Asie-Pacifique et ailleurs","depth":0,"id":"P6C2-M005"},{"kind":"mesure","text":"Engager la formation d’une nouvelle entente altermondialiste","depth":0,"id":"P6C2-M006"},{"kind":"mesure","text":"Rétablir le réseau diplomatique français et stopper son alignement sur l’atlantisme de l’UE","depth":0,"id":"P6C2-M007"}]},{"title":"Construire une défense souveraine au service de la paix","depth":1,"path":["Construire une défense souveraine au service de la paix"],"blocks":[{"kind":"texte","text":"La France doit être capable de se défendre et de porter secours à ses partenaires européens alliés, notamment en vertu de l’article 42-7 du traité sur l’Union européenne (TUE), sans être dépendante des États-Unis. Nous redéfinirons le format de nos armées, en donnant la priorité aux moyens techniques qui rendent possible l’usage de la force : les « encapacitants » stratégiques, c’est-à-dire les moyens du renseignement, information, communication et logistique notamment. Au sein de l’OTAN, ces moyens sont aujourd’hui fournis par les États-Unis. Ces « encapacitants » doivent donc faire l’objet d’un travail de production prioritaire de la France. Ils garantiront notre capacité d’action pour nous-même et, le cas échéant, pour nos partenaires en cas de conflit."},{"kind":"mesure_cle","text":"Donner la priorité à l’investissement dans les « encapacitants » stratégiques, refonder et restaurer toutes les capacités de recherche, de formation et de production stratégique dans les domaines des sauts technologiques pour pallier les dépendances militaires dans une trajectoire compatible avec la bifurcation écologique","id":"P6C2-K02"},{"kind":"mesure","text":"Créer un modèle d’armée basé sur les technologies de ruptures, (cyber, spatial, cloud, IA) et réduire nos dépendances militaires dans ces domaines en développant des programmes souverains","depth":0,"id":"P6C2-M008"},{"kind":"mesure","text":"Porter assistance à nos partenaires par la production d’« encapacitants » de pointe, dans les domaines cyber, spatial et de renseignement, par exemple en offrant une alternative à Starlink","depth":0,"id":"P6C2-M009"},{"kind":"mesure","text":"Créer un pôle public de l’armement pour réintégrer dans le secteur public les entreprises nécessaires pour planifier à long terme la satisfaction de nos besoins industriels et technologiques en matière de défense","depth":0,"id":"P6C2-M010"},{"kind":"mesure","text":"Relancer les processus multilatéraux de désarmement nucléaire et conventionnel dans le cadre de la conférence du désarmement de l’Organisation des Nations unies (ONU) et participer comme observateur au traité sur l’interdiction des armes nucléaires (TIAN)","depth":0,"id":"P6C2-M011"},{"kind":"mesure","text":"Engager une stratégie ambitieuse pour la maîtrise des fonds marins en confortant les services compétents de la Marine, en charge notamment de la cartographie ainsi que de la protection des approches et des infrastructures","depth":0,"id":"P6C2-M012"},{"kind":"mesure","text":"Refuser tout soutien aux guerres illégales, quels qu’en soient les belligérants, en interdisant l’accès aux infrastructures logistiques françaises et en stoppant toutes les exportations d’armement et de biens à double usage","depth":0,"id":"P6C2-M013"},{"kind":"mesure","text":"Instaurer un contrôle parlementaire effectif des exportations d’armes pour s’assurer du respect du droit international humanitaire et des droits humains, en particulier du respect par la France du traité sur le commerce des armes","depth":0,"id":"P6C2-M014"},{"kind":"mesure","text":"Définir, avec la communauté internationale, une doctrine de sécurisation des sites nucléaires en zones de guerre et soutenir la protection immédiate des réacteurs en Ukraine et au Moyen-Orient, par la présence de l’ONU, avec l’appui de l’Agence internationale de l’énergie atomique (AIEA)","depth":0,"id":"P6C2-M015"},{"kind":"mesure","text":"Porter des initiatives de régulation des nouveaux armements dans les enceintes onusiennes : démilitarisation de l’espace, encadrement des systèmes d’armes létales autonomes (SALA)","depth":0,"id":"P6C2-M016"},{"kind":"mesure","text":"Organiser une capacité de projection des forces armées françaises, dont le déploiement se ferait exclusivement dans le cadre d’un mandat de l’ONU","depth":0,"id":"P6C2-M017"},{"kind":"mesure","text":"Faire de la lutte contre les violences sexuelles et sexistes et contre les discriminations au sein des armées une exigence immédiate, dans les unités comme dans les écoles de formation et les lycées militaires","depth":0,"id":"P6C2-M018"},{"kind":"mesure","text":"Adapter le matériel militaire et l’équipement de nos soldats à la nouvelle donne climatique","depth":0,"id":"P6C2-M019"},{"kind":"mesure","text":"Renforcer les moyens dédiés à la condition militaire et les moyens du service de santé des armées ; renforcer le dispositif ATHOS et simplifier l’indemnisation et la reconnaissance des blessures physiques et psychiques au sein de l’armée française","depth":0,"id":"P6C2-M020"}]},{"title":"Renforcer l’ONU pour faire vivre un monde ordonné","depth":1,"path":["Renforcer l’ONU pour faire vivre un monde ordonné"],"blocks":[{"kind":"texte","text":"En dépit de ses insuffisances, l’ONU reste le seul organe légitime, car universel, pour assurer la sécurité collective. Elle est pourtant attaquée dans ses fondements mêmes par le président Donald Trump, qui a retiré les États-Unis de plusieurs de ses organes, et a constitué un prétendu « Conseil de la paix » dans l’objectif avoué de supplanter l’ONU. L’Organisation est également sapée de l’intérieur par des manques financiers structurels, qui la rendent dépendante du bon vouloir de sociétés privées « partenaires ». Pour la paix et le droit international, la France doit œuvrer, sans aucune arrière-pensée, au retour en force de cette institution face aux déséquilibres et aux menaces."},{"kind":"mesure_cle","text":"Réaffirmer que l’ONU est le seul organe légitime pour la sécurité collective","id":"P6C2-K03"},{"kind":"mesure","text":"Refuser toute intervention militaire sans mandat clair de l’ONU, rétablir l’autorité du Comité d’état-major des Nations unies","depth":0,"id":"P6C2-M021"},{"kind":"mesure","text":"Créer une organisation mondiale de l’environnement, défendre l’Organisation des Nations unies pour l’éducation, la science et la culture (Unesco) et œuvrer à ce que l’Organisation mondiale de la santé (OMS) s’affranchisse des intérêts de l’industrie pharmaceutique","depth":0,"id":"P6C2-M022"},{"kind":"mesure","text":"Agir pour une réforme du Conseil de sécurité et de l’Assemblée générale de l’ONU afin que l’organisation fondée en 1945 soit représentative du monde actuel","depth":0,"id":"P6C2-M023"},{"kind":"mesure","text":"Réformer l’Organisation des Nations unies pour l’agriculture et l’alimentation (FAO) afin de favoriser la souveraineté alimentaire, la régulation des marchés et la conversion écologique de l’agriculture","depth":0,"id":"P6C2-M024"},{"kind":"mesure","text":"Soutenir l’action de l’ONU, et notamment de l’UNRWA, l’agence en charge des réfugiés palestiniens, et le renforcement de la présence de l’ONU au Liban","depth":0,"id":"P6C2-M025"},{"kind":"mesure","text":"Construire avec les États et les sociétés concernées, sous l’égide de l’ONU, et dans le cadre du droit international, des solutions politiques partout où la paix n’est pas garantie (Proche et Moyen-Orient, Afrique sahélienne, Afrique centrale, Cachemire, Caucase, Corne de l’Afrique, etc.)","depth":0,"id":"P6C2-M026"},{"kind":"mesure","text":"Porter l’idée de la création d’une force d’intervention et de sécurité écologique sous l’égide de l’ONU","depth":0,"id":"P6C2-M027"}]},{"title":"Agir pour le respect du droit international contre les guerres","depth":1,"path":["Agir pour le respect du droit international contre les guerres"],"blocks":[{"kind":"texte","text":"Face à la généralisation de la guerre, la France doit prendre la tête du camp de la paix. Les déclarations bellicistes d’Emmanuel Macron nous mènent à une impasse. La France et l’Europe se sont ainsi retrouvées évincées par Donald Trump des négociations avec la Russie. La voix de la France doit retrouver clarté et indépendance : les crimes de guerre doivent être jugés, et le droit international respecté. Dans un monde désordonné, ce dernier reste le seul moyen de rétablir notre humanité commune"},{"kind":"mesure_cle","text":"Appuyer le droit international et la justice internationale pour que les mandats d’arrêt émis par la Cour pénale internationale (CPI) ainsi que les mesures conservatoires décrétées par la Cour internationale de justice (CIJ) soient appliqués, et que tous les criminels de guerre soient jugés","id":"P6C2-K04"},{"kind":"mesure","text":"Imposer un cessez-le-feu durable et réel en Palestine, la fin immédiate du blocus et de l’évacuation de la bande de Gaza ainsi que de la colonisation et de l’annexion de la Cisjordanie, de Jérusalem-Est et du plateau du Golan, préalables à une paix juste et durable","depth":0,"id":"P6C2-M028"},{"kind":"mesure","text":"S’opposer à la guerre d’agression menée par Israël au Liban et à ses velléités d’annexion de pans entiers du territoire libanais","depth":0,"id":"P6C2-M029"},{"kind":"mesure","text":"Défendre, conformément au droit international en vigueur, la souveraineté effective de l’État de Palestine sur l’ensemble des territoires palestiniens occupés depuis 1967","depth":0,"id":"P6C2-M030"},{"kind":"mesure","text":"Prendre en compte les autres possibilités d’assurer les droits individuels et collectifs internationalement reconnus des Palestiniens (État binational égalitaire, par exemple) mises en avant, notamment par la société civile palestinienne","depth":0,"id":"P6C2-M031"},{"kind":"mesure","text":"Assumer que, quelle que soit l’option préférentielle du peuple palestinien, aucun respect de ses droits ne sera possible sans contraindre le gouvernement israélien via des sanctions, la rupture de l’accord de coopération économique entre l’UE et Israël, un embargo sur les armes et biens à double usage à destination d’Israël","depth":0,"id":"P6C2-M032"},{"kind":"mesure","text":"Soutenir l’élection d’une assemblée et la formation d’un unique gouvernement palestinien administrant l’ensemble des territoires palestiniens, y compris Jérusalem-Est et la bande de Gaza","depth":0,"id":"P6C2-M033"},{"kind":"mesure","text":"Intensifier tous les efforts diplomatiques pour relancer le processus de paix sur la base des résolutions pertinentes de l’ONU et des droits internationalement reconnus des Palestiniens","depth":0,"id":"P6C2-M034"},{"kind":"mesure","text":"Mettre en place des sanctions contre le gouvernement Netanyahou, faire appliquer le mandat d’arrêt contre le Premier ministre israélien ainsi que les autres responsables israéliens visés, et suspendre l’accord d’association entre l’UE et l’État d’Israël","depth":0,"id":"P6C2-M035"},{"kind":"mesure","text":"Refuser toute participation à la guerre menée par les États-Unis et Israël contre l’Iran et obtenir un cessez-le-feu dans la région du golfe Arabo-Persique","depth":0,"id":"P6C2-M036"},{"kind":"mesure","text":"Entamer des négociations dans le cadre de l’ONU en vue d’un nouvel accord sur le nucléaire iranien","depth":0,"id":"P6C2-M037"},{"kind":"mesure","text":"En Ukraine, agir pour créer un cadre diplomatique permettant d’obtenir un cessez-le-feu, le retrait des troupes russes et l’ouverture de négociations pour une paix durable reposant notamment sur des garanties de sécurité collective, entre belligérants et avec le reste de l’Europe ; tout accord sur une modification des frontières devra être validé par un vote des populations concernées","depth":0,"id":"P6C2-M038"},{"kind":"mesure","text":"Reconvoquer la conférence de Paris pour une nouvelle Europe et rétablir, une fois la paix revenue en Ukraine, l’Organisation pour la sécurité et la coopération en Europe (OSCE) comme cadre paneuropéen stable et pérenne, offrant des garanties de sécurité crédibles à l’ensemble des pays d’Europe centrale et orientale et facilitant les coopérations au bénéfice des populations","depth":0,"id":"P6C2-M039"},{"kind":"mesure","text":"Cesser tout soutien, direct ou indirect, aux forces paramilitaires au Soudan, apporter un soutien humanitaire immédiat à la population, obtenir un cessez-le-feu et juger l’ensemble des criminels de guerre","depth":0,"id":"P6C2-M040"}]},{"title":"Étendre les protections du droit international aux biens communs planétaires","depth":1,"path":["Étendre les protections du droit international aux biens communs planétaires"],"blocks":[{"kind":"texte","text":"La crise écologique ne connaît pas les frontières administratives. Ce qu’un pays rejette dans l’air sera aussi respiré par ses voisins. Ce qu’il déverse dans l’eau échouera sur une côte à l’autre bout du monde. Les responsabilités sont forcément collectives. Les entreprises criminelles et les pollueurs de masse doivent répondre de leurs actes. Il est donc temps d’élargir le droit international à l’impératif climatique et écologique."},{"kind":"mesure_cle","text":"Reconnaître le crime d’écocide","id":"P6C2-K05"},{"kind":"mesure","text":"Faire de la question de l’eau, de sa protection et de son accès pour tous un enjeu prioritaire de la politique internationale et de coopération de la France","depth":0,"id":"P6C2-M041"},{"kind":"mesure","text":"Soutenir la création d’un tribunal international de justice climatique et environnementale","depth":0,"id":"P6C2-M042"},{"kind":"mesure","text":"Créer un tribunal international de justice économique pour juger les crimes financiers transnationaux, car ils contreviennent, par essence, à l’intérêt général humain","depth":0,"id":"P6C2-M043"},{"kind":"mesure","text":"Élargir le dispositif de la licence d’office et lever les brevets sur les vaccins et autres moyens médicaux de lutte contre les pandémies","depth":0,"id":"P6C2-M044"},{"kind":"mesure","text":"Soutenir activement les négociations en cours d’un traité contraignant les multinationales à respecter les droits humains et l’environnement","depth":0,"id":"P6C2-M045"},{"kind":"mesure","text":"Relancer et faire aboutir les négociations en cours d’un traité international de lutte contre les plastiques","depth":0,"id":"P6C2-M046"},{"kind":"mesure","text":"Soutenir le projet d’un traité de non-prolifération des énergies fossiles","depth":0,"id":"P6C2-M047"},{"kind":"mesure","text":"Défendre la gestion des pôles arctique et antarctique comme des biens communs de l’humanité, protégés des activités militaires et économiques, qui pourraient détruire leur écosystème par le pillage de leurs ressources","depth":0,"id":"P6C2-M048"},{"kind":"mesure","text":"Entamer, dans le cadre de l’ONU, des négociations en vue d’aboutir à un traité encadrant les usages de l’intelligence artificielle","depth":0,"id":"P6C2-M049"}]}]},{"code":"P6C3","part":"Partie 6 – Un monde ordonné","title":"Chapitre 3 : Les nouvelles coopérations de la diplomatie altermondialiste","url":"https://melenchon2027.fr/programme/livre/un-monde-ordonne/chapitre3","sections":[{"title":"Refuser le libre-échange, instaurer un protectionnisme écologique et la coopération économique entre les États","depth":1,"path":["Refuser le libre-échange, instaurer un protectionnisme écologique et la coopération économique entre les États"],"blocks":[{"kind":"texte","text":"L’ère du libre-échange généralisé et de la prétendue « mondialisation heureuse » est révolue. Distancés par la Chine, à présent première puissance productive mondiale, les États-Unis se lancent dans une guerre commerciale perdue d’avance. Pour cela, ils imposent des droits de douane, qui brutalisent l’ensemble des échanges internationaux. Au lieu de défendre la souveraineté de la France, Emmanuel Macron a aligné notre pays sur les exigences néolibérales de la Commission européenne. Ce faisant, il a rendu notre pays extrêmement vulnérable. Cette fuite en avant doit prendre fin : un protectionnisme solidaire, négocié et tourné vers la satisfaction des besoins humains, est la seule stratégie viable pour résister à l’offensive économique de Donald Trump. L’indépendance de la France ne peut être effective qu’en s’affranchissant de toute logique impérialiste."},{"kind":"mesure_cle","text":"Porter au sein du Fonds monétaire international (FMI), de la Banque mondiale et de l’Organisation mondiale du commerce (OMC) des propositions de rupture avec le néolibéralisme international, et réinvestir la Conférence des Nations unies sur le commerce et le développement (CNUCED)","id":"P6C3-K01"},{"kind":"mesure","text":"Intégrer le respect des règles fondamentales de l’Organisation internationale du travail (OIT) dans les accords commerciaux","depth":0,"id":"P6C3-M001"},{"kind":"mesure","text":"Agir pour l’adoption à l’ONU d’un règlement contraignant les multinationales à respecter des normes sociales et environnementales","depth":0,"id":"P6C3-M002"},{"kind":"mesure","text":"Œuvrer à un règlement collectif des dettes publiques, indépendamment des mécanismes du marché, dans le cadre de la résolution votée par l’Assemblée générale de l’ONU en 2015","depth":0,"id":"P6C3-M003"},{"kind":"mesure","text":"Interdire l’exportation de pesticides interdits en Europe","depth":0,"id":"P6C3-M004"}]},{"title":"Pour une politique migratoire humaniste et réaliste","depth":1,"path":["Pour une politique migratoire humaniste et réaliste"],"blocks":[{"kind":"texte","text":"Vivre un parcours migratoire est toujours une double souffrance : ne pas être chez soi où l’on vit, et ne plus être chez soi d’où l’on vient. Les migrations sont un sujet trop sérieux pour les réduire à des surenchères. La première tâche est de permettre à chacun de vivre chez soi, auprès de ses proches. Pour cela, il faut arrêter les guerres et les accords commerciaux qui détruisent les économies et affronter le changement climatique."},{"kind":"mesure_cle","text":"Faciliter l’accès aux visas et instituer la carte de séjour de dix ans comme titre de séjour de référence","id":"P6C3-K02"},{"kind":"mesure","text":"Renforcer le Haut-Commissariat des Nations unies pour les réfugiés (HCR) et organiser une conférence annuelle sur les migrations","depth":0,"id":"P6C3-M005"},{"kind":"mesure","text":"S’opposer aux accords commerciaux inéquitables afin d’éviter l’exil des populations","depth":0,"id":"P6C3-M006"},{"kind":"mesure","text":"Créer un statut de « détresse environnementale » apportant une protection temporaire, pouvant devenir durable en fonction de la gravité de la catastrophe ayant entraîné la migration","depth":0,"id":"P6C3-M007"},{"kind":"mesure","text":"Agir contre les conséquences des bouleversements climatiques par des transferts de technologies, de la coopération multilatérale, et du soutien aux initiatives locales","depth":0,"id":"P6C3-M008"},{"kind":"mesure","text":"Refuser l’application du pacte européen sur la migration et l’asile","depth":0,"id":"P6C3-M009"},{"kind":"mesure","text":"Assumer notre devoir d’humanité envers les réfugiés en garantissant sans concession le droit d’asile","depth":0,"id":"P6C3-M010"},{"kind":"mesure","text":"Prendre en charge les personnes migrantes grâce à des structures d’accueil et d’hébergement en nombre suffisant sur tout le territoire, créer un guichet unique d’accueil","depth":0,"id":"P6C3-M011"},{"kind":"mesure","text":"Garantir l’indépendance administrative de l’Office français de protection des réfugiés et apatrides (Ofpra)","depth":0,"id":"P6C3-M012"},{"kind":"mesure","text":"Régulariser les travailleurs, étudiants, parents d’enfants scolarisés sans papiers","depth":0,"id":"P6C3-M013"},{"kind":"mesure","text":"Fermer les centres de rétention administrative (CRA) en les remplaçant par des alternatives plus humaines et efficaces fondées sur l’accompagnement juridique, l’hébergement ouvert et le respect des libertés fondamentales","depth":0,"id":"P6C3-M014"},{"kind":"mesure","text":"Supprimer la liste des pays d’origine sûrs et améliorer la prise en compte des identités de genre et des orientations sexuelles dans les procédures en mettant fin aux discriminations administratives et en assurant une protection réelle","depth":0,"id":"P6C3-M015"},{"kind":"mesure","text":"Abroger les dernières lois sur l’asile et l’immigration, la circulaire dite « Retailleau » et l’ensemble des textes qui criminalisent les personnes étrangères et les personnes aidantes","depth":0,"id":"P6C3-M016"},{"kind":"mesure","text":"Garantir l’accès à l’aide médicale d’État (AME) et assurer un accès effectif au soutien psychosocial pour les demandeurs d’asile","depth":0,"id":"P6C3-M017"},{"kind":"mesure","text":"Assurer l’accès aux droits (justice, santé, etc.) des femmes ayant subi des violences sexuelles dans le cadre de leur parcours migratoire","depth":0,"id":"P6C3-M018"}]},{"title":"Les Outre-mer, fer de lance d’une diplomatie écologique altermondialiste","depth":1,"path":["Les Outre-mer, fer de lance d’une diplomatie écologique altermondialiste"],"blocks":[{"kind":"texte","text":"Grâce aux Outre-mer, la France est présente à tous les points clés de l’écosystème. Elle possède le deuxième domaine maritime au monde. La Guyane française abrite près de 80 % de la biodiversité nationale et partage avec le Brésil la plus longue frontière terrestre de notre pays. Le devoir de la France est fixé par ses responsabilités vis-à-vis des Outre-mer. Elle doit être le fer de lance d’une diplomatie universaliste. Les Outre-mer en seront les points d’appui."},{"kind":"mesure_cle","text":"Construire des politiques internationales à partir des Outre-mer : préservation de l’Amazonie, aide aux peuples autochtones menacés par la montée des eaux et la sécheresse","id":"P6C3-K03"},{"kind":"mesure","text":"Faire des Outre-mer des pôles régionaux de codéveloppement : transfert de technologies auprès des pays voisins, aide logistique et scientifique, établissement de formations de haut niveau bénéficiant à la fois aux étudiants ultramarins et à ceux des pays voisins, coopération militaire de maintien de la paix","depth":0,"id":"P6C3-M019"},{"kind":"mesure","text":"Rejoindre les coopérations régionales : la Communauté d’États latino-américains et caraïbes (CELAC) pour les Antilles et la Guyane française, l’Union africaine pour Mayotte, la Communauté de développement de l’Afrique australe (CDAA) pour La Réunion, qui participera activement aussi à l’Association des États riverains de l’océan Indien (IORA)","depth":0,"id":"P6C3-M020"},{"kind":"mesure","text":"Garantir la paix dans l’océan Indien en négociant des accords de co-souveraineté sur l’espace maritime partagé avec Maurice autour de Tromelin et avec Madagascar autour des îles Éparses","depth":0,"id":"P6C3-M021"}]},{"title":"Construire des coopérations altermondialistes et internationalistes","depth":1,"path":["Construire des coopérations altermondialistes et internationalistes"],"blocks":[{"kind":"texte","text":"Un autre monde est possible, plus juste, plus ordonné, plus écologique. Pour cela, de nouvelles coopérations doivent être engagées et d’autres renforcées. La France doit œuvrer, sans exclusive, à tous les projets sortant d’une conception néolibérale et occidentaliste de la mondialisation, promouvant des biens publics mondiaux exempts des mécanismes du marché et luttant contre les inégalités et la crise écologique. Elle a les moyens de développer des coopérations dans le non-alignement."},{"kind":"mesure_cle","text":"Consacrer 0,7 % du revenu national brut à une aide publique au développement débarrassée du carcan néolibéral","id":"P6C3-K04"},{"kind":"mesure","text":"Agir pour la paix et respecter l’indépendance des États et la souveraineté des peuples","depth":0,"id":"P6C3-M022"},{"kind":"mesure","text":"Relancer le codéveloppement et la coopération, notamment dans la lutte contre le changement climatique","depth":0,"id":"P6C3-M023"},{"kind":"mesure","text":"Soutenir le projet de monnaie commune mondiale face au dollar","depth":0,"id":"P6C3-M024"},{"kind":"mesure","text":"Appuyer la restructuration des dettes souveraines","depth":0,"id":"P6C3-M025"},{"kind":"mesure","text":"Réformer l’aide au développement apportée par l’Agence française de développement (AFD) pour qu’elle ne serve pas les intérêts des régimes oligarchiques ni ceux d’entreprises intéressées aux partenariats public-privé ; décider de son allocation avec les sociétés civiles sur place, dans un objectif de renforcement des droits humains et des souverainetés populaires, et non de mise en dépendance néocoloniale","depth":0,"id":"P6C3-M026"}]},{"title":"Unir le petit bassin méditerranéen autour d’objectifs communs de progrès","depth":1,"path":["Unir le petit bassin méditerranéen autour d’objectifs communs de progrès"],"blocks":[{"kind":"texte","text":"Nous ne nous résignons pas à voir la mer Méditerranée devenir un cimetière pour les migrants. Nous refusons les entreprises politiques de ceux qui cherchent à recommencer la guerre avec l’Algérie. Des millions de familles françaises sont intimement liées au bonheur commun des deux rives de la Méditerranée. La France doit donc assumer en Méditerranée la responsabilité particulière créée par son histoire, sa géographie, sa langue et par la richesse et la diversité de son peuple."},{"kind":"mesure_cle","text":"Créer un réseau d’universités méditerranéennes et organiser un réseau méditerranéen de l’enseignement professionnel","id":"P6C3-K05"},{"kind":"mesure","text":"Créer une force méditerranéenne d’intervention et de sécurité civile pour lutter contre les incendies et pour le secours en mer en cas de catastrophes naturelles","depth":0,"id":"P6C3-M027"},{"kind":"mesure","text":"Mettre en place une structure commune de lutte contre les pollutions et de gestion de la dépollution de l’écosystème de la mer Méditerranée","depth":0,"id":"P6C3-M028"},{"kind":"mesure","text":"Organiser les moyens d’intervention sous-marins à des fins de recherche","depth":0,"id":"P6C3-M029"},{"kind":"mesure","text":"Étendre à la Méditerranée les normes écologiques applicables dans la mer Baltique, notamment en matière de limitation des émissions liées au trafic maritime","depth":0,"id":"P6C3-M030"},{"kind":"mesure","text":"Créer une chaîne de télévision méditerranéenne émettant en plusieurs langues, diffusant ses programmes sur les deux rives de la Méditerranée et sur Internet (sur le modèle de la chaîne franco­allemande Arte)","depth":0,"id":"P6C3-M031"}]},{"title":"Construire une relation avec l’Afrique basée sur la souveraineté des peuples","depth":1,"path":["Construire une relation avec l’Afrique basée sur la souveraineté des peuples"],"blocks":[{"kind":"texte","text":"L’image de la France en Afrique a été fortement abîmée par la politique du président Macron. Le gouvernement français est resté sourd aux aspirations populaires des peuples africains. Il a préféré mettre en œuvre une politique affairiste aux relents colonialistes et répondant aux seuls intérêts bornés des oligarchies. Il est dans l’intérêt des peuples que la France adopte une politique africaine guidée par l’intérêt général humain. La coopération entre les peuples est la méthode qui permettra d’avancer en ce sens."},{"kind":"mesure_cle","text":"Bâtir une politique prenant en compte la réaffirmation de la souveraineté des peuples africains et les transformations profondes de ce continent","id":"P6C3-K06"},{"kind":"mesure","text":"Renforcer l’aide au développement au Sahel et la conditionner au respect des droits humains, démocratiques, sociaux et écologiques des peuples concernés","depth":0,"id":"P6C3-M032"},{"kind":"mesure","text":"Réviser les accords de défense passés avec les pays africains pour qu’ils soient conclus dans l’intérêt des peuples et empêchent toute ingérence dans leurs affaires intérieures","depth":0,"id":"P6C3-M033"},{"kind":"mesure","text":"Œuvrer, aux côtés des pays africains concernés, à mettre un terme à la double monnaie CFA au profit d’une monnaie souveraine dont ils seront les seuls maîtres","depth":0,"id":"P6C3-M034"},{"kind":"mesure","text":"Annuler les dettes « odieuses » de certains pays africains, c’est-à-dire les dettes contractées par des dictatures dans le seul but d’enrichir le clan au pouvoir ou d’engager des actions allant à l’encontre de l’intérêt général","depth":0,"id":"P6C3-M035"}]},{"title":"Passer à la francophonie des peuples","depth":1,"path":["Passer à la francophonie des peuples"],"blocks":[{"kind":"texte","text":"La langue française est la troisième langue la plus parlée au monde. Son centre de gravité réel se trouve sur le continent africain. Il importe de faire vivre cette langue en partage et de développer sa dimension politique. La francophonie est trop souvent ignorée ou confinée dans un cadre officiel inaccessible à la majorité des populations francophones."},{"kind":"mesure_cle","text":"Défendre l’usage du français dans les institutions internationales","id":"P6C3-K07"},{"kind":"mesure","text":"Faire vivre une francophonie des peuples","depth":0,"id":"P6C3-M036"},{"kind":"mesure","text":"Faire une académie de la Francophonie, ouverte sur les évolutions et la créolisation de notre langue commune à travers le monde","depth":0,"id":"P6C3-M037"},{"kind":"mesure","text":"Créer un Erasmus francophone","depth":0,"id":"P6C3-M038"},{"kind":"mesure","text":"Élaborer des contenus éducatifs et des diplômes communs entre pays francophones","depth":0,"id":"P6C3-M039"},{"kind":"mesure","text":"Renforcer les médias audiovisuels francophones","depth":0,"id":"P6C3-M040"},{"kind":"mesure","text":"Renforcer l’Assemblée parlementaire de la Francophonie (APF)","depth":0,"id":"P6C3-M041"},{"kind":"mesure","text":"Participer à la création d’une revue scientifique francophone de premier plan au niveau mondial","depth":0,"id":"P6C3-M042"},{"kind":"mesure","text":"Créer une université francophone de l’espace proposant un cursus universitaire commun d’accès à tous les métiers relatifs au secteur aérospatial","depth":0,"id":"P6C3-M043"},{"kind":"mesure","text":"Recréer des espaces d’expressions culturelles francophones (les scènes nationales, par exemple)","depth":0,"id":"P6C3-M044"},{"kind":"mesure","text":"Renforcer le réseau des Instituts français et Alliances françaises et le renforcement de la présence de l’ONU au Liban","depth":0,"id":"P6C3-M045"}]}]}],"short":"L'Avenir en commun","content_sha256":"e273a48e203e2a511424bd2c9bd3465029a0316c7e19417129d356358c7efda1"},{"code":"PT-SANTE","kind":"plan_thematique","title":"Comment nous allons reconstruire notre système de santé","url":"https://melenchon2027.fr/programme/plans-thematiques/sante/","modified":"2026-11-04T11:00:18","units":[{"code":"PT-SANTE","part":null,"title":"Comment nous allons reconstruire notre système de santé","url":"https://melenchon2027.fr/programme/plans-thematiques/sante/","sections":[{"title":"1. Emmanuel Macron : le fossoyeur de notre système de santé","depth":1,"path":["1. Emmanuel Macron : le fossoyeur de notre système de santé"],"blocks":[{"kind":"texte","text":"Depuis 2017, Emmanuel Macron et ses gouvernements ont démantelé notre système de santé. Le bilan est désastreux : un hôpital durablement sous tension, une psychiatrie qui peine à répondre aux besoins, des inégalités persistantes d’accès aux soins et de nouvelles dépenses imposées aux malades. La crise était ancienne, ils l’ont accentuée jusqu’à la rupture.","md":"**Depuis 2017, Emmanuel Macron et ses gouvernements ont démantelé notre système de santé. Le bilan est désastreux : un hôpital durablement sous tension, une psychiatrie qui peine à répondre aux besoins, des inégalités persistantes d’accès aux soins et de nouvelles dépenses imposées aux malades.** La crise était ancienne, ils l’ont accentuée jusqu’à la rupture."},{"kind":"texte","text":"Des maladies écologiques que les pouvoirs publics laissent prospérer","md":"**Des maladies écologiques que les pouvoirs publics laissent prospérer**"},{"kind":"texte","text":"Notre santé dépend des conditions dans lesquelles nous naissons, travaillons et vieillissons. Les déterminants sociaux et environnementaux influencent l’exposition aux risques, l’apparition des maladies et les possibilités de guérison. L’Organisation mondiale de la santé (OMS) souligne leur rôle majeur dans les inégalités de santé."},{"kind":"texte","text":"D’où l’expression de « maladies écologiques » qui décrit les conséquences sanitaires de décisions économiques et sociales telles que l’exposition à des substances toxiques comme les pesticides, l’intensification du travail, la vie dans des logements insalubres, la malbouffe ou l’affaiblissement des protections collectives. Les mécanismes biologiques des maladies et leurs déterminants sociaux se combinent. Il faudrait agir sur les causes évitables de ces maladies, plutôt que d’exiger des individus qu’ils fassent face seuls aux conditions qui les rendent malades."},{"kind":"texte","text":"Les grandes questions de santé publique sont aujourd’hui liées à notre mode de production. 80 % de notre santé dépend de notre environnement. En France, 40 000 décès chaque année sont attribuables à la pollution de l’air, et notamment aux particules fines. Plus de 433 000 nouveaux cancers ont été diagnostiqués en 2023. C’est deux fois plus qu’en 1990. Le vieillissement de la population ne suffit pas à expliquer cette augmentation. L’alcool, le tabac, l’alimentation et les pollutions sont aussi des facteurs cancérigènes. L’Inserm établit une présomption forte de lien entre certaines expositions professionnelles aux pesticides et plusieurs pathologies, dont les lymphomes (cancers) non hodgkiniens et la maladie de Parkinson. Plus généralement, les chercheurs estiment que 40 % des cancers seraient évitables en réduisant les risques environnementaux et liés au mode de vie. Quant au diabète, le nombre de personnes qui en souffrent a été multiplié par 2 en 20 ans. 9 diabètes sur 10 ont pour cause principale la mauvaise alimentation. 1 couple sur 4 a des difficultés à avoir un enfant. Les perturbateurs endocriniens y sont pour beaucoup, car ils dérèglent les cycles hormonaux humains. Les maladies contagieuses émergentes sont soit de nouvelles zoonoses (Covid, Variole B) – encouragées par la déforestation mondiale et les élevages intensifs, soit le fait de la présence de moustiques plus importante sous les latitudes hexagonales (dengue, chikungunya). Enfin, le problème croissant de l’antibiorésistance trouve aussi son origine dans les pratiques de l’agrobusiness."},{"kind":"texte","text":"Le poids des maladies chroniques oblige à changer de modèle. Il impose de renforcer la prévention des expositions évitables et les capacités de soins. L’agriculture intensive, les pratiques de l’industrie agroalimentaire et les conditions de production doivent être interrogées au regard de leurs conséquences sanitaires. Les dommages supportés par les personnes et la collectivité ne peuvent continuer à être traités comme une contrepartie acceptable des profits privés."},{"kind":"texte","text":"Le coût de ces dommages dépasse les remboursements des soins. Une étude de Santé publique France, publiée en 2025, estime à 12,9 milliards d’euros par an l’impact en santé et en bien-être des maladies étudiées attribuables aux particules fines en France hexagonale. Prévenir les pollutions relève donc aussi de la bonne utilisation des ressources collectives. C’est la seule façon vertueuse de réaliser des économies en matière de santé. Elle est à l’opposé des recettes libérales qui proposent de réduire les soins."},{"kind":"texte","text":"Sur la période 2020-2024, l’écart d’espérance de vie à la naissance entre les 5 % les plus modestes et les 5 % les plus aisés atteint 13 ans chez les hommes et 9 ans chez les femmes. Ces écarts donnent la mesure de l’injustice. Les personnes modestes cumulent plus souvent expositions professionnelles, contraintes alimentaires, logements dégradés et difficultés d’accès aux soins."},{"kind":"texte","text":"Le discours sur la « responsabilisation » des patient·es masque ces contraintes. Une politique de santé qui néglige les revenus, le logement, le travail et l’environnement laisse se reproduire les inégalités qu’elle prétend combattre. La prévention doit donner à chacun les moyens de vivre en bonne santé et combattre les activités qui dégradent cette santé."},{"kind":"texte","text":"Un hôpital détruit à coups de saignées budgétaires","md":"**Un hôpital détruit à coups de saignées budgétaires**"},{"kind":"texte","text":"Notre système de santé n’est pas préparé aux crises qui s’annoncent, faute de moyens et d’anticipation. La pandémie du COVID-19 a ainsi révélé les conséquences des politiques de réduction des capacités et de gestion des établissements sous contrainte. En 2024, les capacités d’hospitalisation complète ont encore reculé de 2 300 lits, tous secteurs confondus, ce qui porte le total de lits supprimés depuis 2017 à plus de 33 000. Les alternatives à l’hospitalisation sont utiles lorsqu’elles répondent aux besoins ; elles ne remplacent pas les lits et les équipes nécessaires aux patient·es qui doivent être hospitalisés. Tout cela a des conséquences très concrètes. Lors de l’été 2026, dans l’écrasante majorité des services d’urgence, une personne sur deux a passé la nuit sur un brancard. 1 500 à 2 000 morts par an seraient évitables si les urgences fonctionnaient correctement. Preuve que le logiciel macroniste est mauvais : les services de l’État montrent que malgré les saignées budgétaires infligées à l’hôpital public, sa situation financière ne s’améliore pas, voire s’empire. Les équipes doivent absorber les tensions, les difficultés de remplacement et le manque de marges dans l’organisation des soins. En aval des urgences, l’insuffisance de capacités adaptées prolonge l’attente et désorganise les parcours. Le dévouement des personnels sert trop souvent à compenser les défaillances du système. Le projet de financement de la Sécurité sociale pour 2027 prolonge la contrainte : la progression de l’objectif national de dépenses d’assurance maladie (ONDAM) serait limitée à 2 %, avec 3 % pour l’enveloppe des établissements de santé. Le budget n’augmente pas suffisamment par rapport aux besoins : ce qui veut dire qu’il baisse. Cette politique de coupes pour l’hôpital est d’autant plus irresponsable que le changement climatique accentue la charge sur les hôpitaux. Dans l’enquête de SAMU-Urgences de France, près de neuf services d’urgence répondants sur dix déclarent une hausse de leur activité pendant les épisodes caniculaires. Le changement climatique exige une anticipation durable : protection des personnes vulnérables, adaptation des bâtiments, capacités de soins et organisation territoriale. Un système maintenu sous tension permanente manque de marges pour absorber les crises."},{"kind":"texte","text":"Des soins de proximité difficiles d’accès et des parcours fragmentés","md":"**Des soins de proximité difficiles d’accès et des parcours fragmentés**"},{"kind":"texte","text":"Trouver un médecin traitant, consulter un spécialiste ou bénéficier d’un suivi coordonné relève le plus souvent du parcours de combattant. Plus d’un·e Français·e sur trois habite dans un désert médical. La reconstruction de notre capacité à soigner doit répondre aux besoins de chaque collectivité."},{"kind":"texte","text":"Aujourd’hui, la pente prise n’est pas celle d’un service public de la santé maillant le territoire, mais bien d’une financiarisation de la santé. Les fonds de capital-investissement transforment les soins en un far-west. Biologie médicale, imagerie, chirurgie dentaire, pharmacie : toutes ces activités sont visées par la finance. Les fonds capitalistes rachètent un nombre croissant d’entités en vue d’extraire une marge nette de 10 %. Le prix de cette marge ? La concentration des structures, la fermeture des établissements de proximité, la réduction des amplitudes horaires, l’intensification du travail des praticiens et des économies sur chaque service rendu. Dans certains départements, un seul groupe détient toute la biologie médicale, lui donnant un pouvoir exorbitant sur l’ensemble des autorités locales et des patient·es !"},{"kind":"texte","text":"La fin du numerus clausus dans les études de santé ne peut être effective qu’avec des enseignant·es, des terrains de stage et des capacités d’encadrement suffisants. La méthode macroniste a consisté à supprimer le numerus clausus en apparence tout en rationnant les moyens pour étudier. Il subsiste donc un numerus clausus caché du fait du manque de moyens. En tout état de cause, former davantage prend du temps. Sans organisation immédiate de la coopération entre professionnel·les, sans structures publiques de proximité et sans conditions d’exercice adaptées aux aspirations des jeunes professionnel·les, les patient·es continueront à subir les manques."},{"kind":"texte","text":"Le cloisonnement entre la ville, l’hôpital, le médico-social et le social aggrave les difficultés. La concurrence et les financements fragmentés font obstacle à des parcours construits autour des personnes – et le gouvernement a même tenté de liquider les structures d’exercice coordonné participatif qui assurent une prise en charge globale de leurs patient·es. La prévention, l’éducation thérapeutique et l’accompagnement disposent de trop peu de place dans une organisation qui valorise d’abord les actes."},{"kind":"texte","text":"Santé mentale et pédopsychiatrie face à l’abandon","md":"**Santé mentale et pédopsychiatrie face à l’abandon**"},{"kind":"texte","text":"Le bilan de Macron en santé mentale est celui d’une priorité proclamée mais restée sans effet. La désignation d’une « grande cause nationale » ne résout ni les délais d’attente, ni le manque d’équipes, ni les ruptures de suivi. D’après les enquêtes récentes, 19 % des lycéen·nes présentaient un risque important de dépression en 2024, soit 3,5 points de plus qu’en 2022. La crise de la psychiatrie est ancienne mais elle s’est aggravée depuis 2017. Quand la consultation arrive trop tard, les personnes peuvent se retrouver aux urgences alors qu’un suivi de proximité aurait pu prévenir l’aggravation. La sortie d’hospitalisation devient elle-même une période à risque lorsque les relais ne sont pas organisés. Les coupes budgétaires ont transformé le manque de moyens en épuisement professionnel.","md":"**Le bilan de Macron en santé mentale est celui d’une priorité proclamée mais restée sans effet.** La désignation d’une « grande cause nationale » ne résout ni les délais d’attente, ni le manque d’équipes, ni les ruptures de suivi. D’après les enquêtes récentes, 19 % des lycéen·nes présentaient un risque important de dépression en 2024, soit 3,5 points de plus qu’en 2022. La crise de la psychiatrie est ancienne mais elle s’est aggravée depuis 2017. Quand la consultation arrive trop tard, les personnes peuvent se retrouver aux urgences alors qu’un suivi de proximité aurait pu prévenir l’aggravation. La sortie d’hospitalisation devient elle-même une période à risque lorsque les relais ne sont pas organisés. Les coupes budgétaires ont transformé le manque de moyens en épuisement professionnel."},{"kind":"texte","text":"La pédopsychiatrie concentre cette faillite. La Cour des comptes relevait une baisse de 34 % du nombre de pédopsychiatres entre 2010 et 2022, une offre saturée et des inégalités territoriales majeures. Le rapport parlementaire publié en 2024 décrit des centres médico-psychologiques infanto-juvéniles saturés et des hospitalisations de mineurs dans des unités pour adultes faute de solutions adaptées. Un enfant en souffrance ne peut attendre que son état se dégrade pour accéder au soin. Ces retards affectent sa vie familiale, sa scolarité et son développement ; les familles doivent trop souvent multiplier les démarches ou financer une solution privée.","md":"**La pédopsychiatrie concentre cette faillite.** La Cour des comptes relevait une baisse de 34 % du nombre de pédopsychiatres entre 2010 et 2022, une offre saturée et des inégalités territoriales majeures. Le rapport parlementaire publié en 2024 décrit des centres médico-psychologiques infanto-juvéniles saturés et des hospitalisations de mineurs dans des unités pour adultes faute de solutions adaptées. Un enfant en souffrance ne peut attendre que son état se dégrade pour accéder au soin. Ces retards affectent sa vie familiale, sa scolarité et son développement ; les familles doivent trop souvent multiplier les démarches ou financer une solution privée."},{"kind":"texte","text":"La santé mentale révèle aussi les conséquences des choix politiques sur les conditions de vie. La précarité, les violences, l’insécurité du logement, les discriminations, l’isolement et l’organisation du travail peuvent déclencher ou aggraver des souffrances. Les troubles psychiatriques ont toutefois des causes multiples et nécessitent des réponses cliniques propres : agir sur les déterminants sociaux et reconstruire les soins sont deux responsabilités complémentaires. Les applications, les campagnes de communication ou les consultations ponctuelles ne constituent pas à elles seules un parcours pour les troubles sévères."},{"kind":"texte","text":"Notre critique porte donc sur un échec concret : une politique incapable de garantir à chaque personne un accueil, une équipe et une continuité de soins adaptés. Réparer cet abandon exige de donner à la psychiatrie publique des moyens pérennes, de restaurer la pédopsychiatrie et de garantir les droits des patient·es, y compris lors des crises."},{"kind":"texte","text":"Les malades passent à la caisse tandis que la solidarité recule","md":"**Les malades passent à la caisse tandis que la solidarité recule**"},{"kind":"texte","text":"Selon UFC-Que Choisir, en 2025, 1 Français·e sur 4 a renoncé au moins une fois à des soins pour des raisons financières. 10 années de libéralisme des gouvernements d’Emmanuel Macron ont aggravé le problème. Chaque année, les mutuelles augmentent leurs tarifs, à mesure que la Sécurité sociale rembourse une part de plus en plus réduite des soins. Depuis le 1er octobre 2026, les plafonds annuels des franchises médicales et des participations forfaitaires pour les médicaments, la consultation d’un médecin généraliste, d’un·e infirmier·e ou l’utilisation d’un transport sanitaire sont passés de 50 à 70 euros chacun. Les assuré·es peuvent désormais payer jusqu’à 140 euros par an contre 100 auparavant. Les malades chroniques ou atteints d’un cancer, par exemple, sont davantage susceptibles d’atteindre ces seuils. Or, ils pèsent plus lourd sur un petit revenu."},{"kind":"texte","text":"Baisser le remboursement ne fait pas disparaître le coût du soin : il en déplace le financement. À cela il faut ajouter les dépassements d’honoraires qui concernent désormais une majorité de médecins spécialistes."},{"kind":"texte","text":"On connaît l’effet contre-productif de ces déremboursements. Soit les personnes renoncent aux soins, soit elles reportent le traitement à plus tard, soit elles n’achètent qu’une partie des remèdes. Dans tous les cas, leur santé se détériore, donc des soins plus intensifs sont nécessaires ensuite, tirant vers le haut les dépenses globales de santé."},{"kind":"texte","text":"Cette facture revient soit directement aux patient·es, soit à leurs organismes de protection sociale. En 2024, les organismes complémentaires ont collecté 46,5 milliards d’euros de cotisations en santé, en hausse de 8,2 %, et leurs charges de gestion ont atteint 8,8 milliards d’euros. Cette superposition de financements entretient des coûts administratifs et des différences de protection. La solidarité de la Sécurité sociale doit être renforcée pour garantir les soins en fonction des besoins."},{"kind":"texte","text":"Enfin, les difficultés d’approvisionnement rappellent la fragilité de notre organisation pharmaceutique : 3 825 déclarations de ruptures (c’est-à-dire de pénurie de médicaments dans une pharmacie) ou de risques de rupture ont été enregistrées en 2024, en baisse par rapport à 2023 mais à un niveau encore important. Ces déclarations montrent que l’accès aux traitements ne peut être laissé aux seules stratégies industrielles."},{"kind":"texte","text":"Le macronisme aura donc conduit à un abandon de la population face aux maladies écologiques, une destruction progressive du service public de la santé et un transfert des dépenses aux patient·es. Reconstruire notre système de santé exige une rupture avec les choix qui organisent cette double injustice.","md":"**Le macronisme aura donc conduit à un abandon de la population face aux maladies écologiques, une destruction progressive du service public de la santé et un transfert des dépenses aux patient·es. Reconstruire notre système de santé exige une rupture avec les choix qui organisent cette double injustice.**"}]},{"title":"2. Notre stratégie pour faire de la santé un bien commun et vaincre les maladies écologiques","depth":1,"path":["2. Notre stratégie pour faire de la santé un bien commun et vaincre les maladies écologiques"],"blocks":[{"kind":"texte","text":"Nous voulons garantir à toutes et tous les moyens de vivre en bonne santé et de recevoir les soins nécessaires, quels que soient leurs revenus, leur lieu de vie et leur situation. La santé est un bien commun. Nous partirons des besoins de la population pour organiser les moyens, les financements et les responsabilités publiques.","md":"**Nous voulons garantir à toutes et tous les moyens de vivre en bonne santé et de recevoir les soins nécessaires, quels que soient leurs revenus, leur lieu de vie et leur situation.** La santé est un bien commun. Nous partirons des besoins de la population pour organiser les moyens, les financements et les responsabilités publiques."},{"kind":"texte","text":"Notre stratégie repose sur quatre orientations."},{"kind":"puce","text":"Agir sur les causes de la maladie. Faire de la santé un objectif des politiques de logement, de travail, d’alimentation, d’éducation et d’environnement. Réduire les expositions dangereuses et développer la prévention, sans culpabiliser les personnes ni sélectionner qui mérite d’être soigné. La prise en compte de la dimension environnementale de la santé sera notamment confiée aux écorégions.","md":"**Agir sur les causes de la maladie.** Faire de la santé un objectif des politiques de logement, de travail, d’alimentation, d’éducation et d’environnement. Réduire les expositions dangereuses et développer la prévention, sans culpabiliser les personnes ni sélectionner qui mérite d’être soigné. La prise en compte de la dimension environnementale de la santé sera notamment confiée aux écorégions.","depth":0,"id":"PT-SANTE-L001"},{"kind":"puce","text":"Reconstruire un grand service public de santé. Organiser la coopération entre les soins primaires, l’hôpital, la psychiatrie, le médico-social et les services sociaux. Garantir une présence adaptée aux besoins dans chaque territoire, avec une attention particulière aux quartiers populaires, aux territoires ruraux et aux outre-mer.","md":"**Reconstruire un grand service public de santé.** Organiser la coopération entre les soins primaires, l’hôpital, la psychiatrie, le médico-social et les services sociaux. Garantir une présence adaptée aux besoins dans chaque territoire, avec une attention particulière aux quartiers populaires, aux territoires ruraux et aux outre-mer.","depth":0,"id":"PT-SANTE-L002"},{"kind":"puce","text":"Faire le 100% Sécu, c’est-à-dire rétablir la solidarité du financement en intégrant les complémentaires privées à la Sécurité sociale, supprimer les barrières financières et planifier les investissements et les effectifs. Réguler les prix et lutter contre les rentes pour consacrer les ressources à la santé de la population, en échappant au racket des laboratoires pharmaceutiques grâce à un pôle public du médicament.","md":"**Faire le 100% Sécu, c’est-à-dire rétablir la solidarité du financement en intégrant les complémentaires privées à la Sécurité sociale**, supprimer les barrières financières et planifier les investissements et les effectifs. Réguler les prix et lutter contre les rentes pour consacrer les ressources à la santé de la population, en échappant au racket des laboratoires pharmaceutiques grâce à un pôle public du médicament.","depth":0,"id":"PT-SANTE-L003"},{"kind":"puce","text":"Rendre le pouvoir aux assurés. Élire directement les conseils d’administration de la Sécurité sociale, indépendante de l’État, pour la placer sous contrôle populaire. Démocratiser les établissements de santé. Associer les patient·es, les professionnel·les et les habitant·es aux décisions, reconnaître les savoirs issus de l’expérience et garantir les droits dans le soin.","md":"**Rendre le pouvoir aux assurés.** Élire directement les conseils d’administration de la Sécurité sociale, indépendante de l’État, pour la placer sous contrôle populaire. Démocratiser les établissements de santé. Associer les patient·es, les professionnel·les et les habitant·es aux décisions, reconnaître les savoirs issus de l’expérience et garantir les droits dans le soin.","depth":0,"id":"PT-SANTE-L004"},{"kind":"texte","text":"Nous distinguerons deux temps d’action. Dès les premières décisions budgétaires et législatives, nous arrêterons les reculs de prise en charge, financerons les besoins les plus urgents et engagerons les recrutements."},{"kind":"texte","text":"Une programmation pluriannuelle organisera ensuite la reconstruction des capacités, la formation et les transformations du financement et de la gouvernance. Les dispositifs d’urgence prépareront les structures durables ; ils ne constitueront pas une succession de solutions provisoires."},{"kind":"texte","text":"Cette programmation portera sur l’accès réel aux soins, les délais, les inégalités, la qualité des prises en charge et les conditions de travail."}]},{"title":"3. Comment nous allons reconstruire notre système de santé","depth":1,"path":["3. Comment nous allons reconstruire notre système de santé"],"blocks":[]},{"title":"3.1 – Nos mesures pour répondre à l’urgence","depth":2,"path":["3. Comment nous allons reconstruire notre système de santé","3.1 – Nos mesures pour répondre à l’urgence"],"blocks":[]},{"title":"3.1.1 – Lever les premiers obstacles financiers aux soins","depth":3,"path":["3. Comment nous allons reconstruire notre système de santé","3.1 – Nos mesures pour répondre à l’urgence","3.1.1 – Lever les premiers obstacles financiers aux soins"],"blocks":[{"kind":"texte","text":"La maladie ne doit pas devenir une sanction financière. Les premières mesures protégeront les patient·es et prépareront le passage au « 100 % Sécu »."},{"kind":"puce","text":"Supprimer les franchises médicales et les participations forfaitaires sur les soins","depth":0,"id":"PT-SANTE-L005"},{"kind":"puce","text":"Renforcer immédiatement les permanences d’accès aux soins de santé, l’accompagnement aux droits, la médiation en santé et maintenir des accueils physiques pour les personnes éloignées du numérique","depth":0,"id":"PT-SANTE-L006"},{"kind":"puce","text":"Garantir une indemnisation protectrice pendant les arrêts de travail et supprimer les restrictions qui fragilisent les revenus, compromettent la continuité des soins ou contraignent à une reprise prématurée","depth":0,"id":"PT-SANTE-L007"},{"kind":"puce","text":"Adapter la durée et les modalités d’indemnisation aux maladies chroniques, aux traitements prolongés et aux besoins de convalescence","depth":0,"id":"PT-SANTE-L008"},{"kind":"puce","text":"Réduire les inégalités sociales de santé en identifiant les causes de « non-recours » aux droits sociaux et y remédier","depth":0,"id":"PT-SANTE-L009"}]},{"title":"3.1.2 – Soutenir les équipes et rétablir les capacités hospitalières indispensables","depth":3,"path":["3. Comment nous allons reconstruire notre système de santé","3.1 – Nos mesures pour répondre à l’urgence","3.1.2 – Soutenir les équipes et rétablir les capacités hospitalières indispensables"],"blocks":[{"kind":"texte","text":"La coopération doit remplacer la concurrence entre les différents compartiments de l’offre de soins. C’est le seul moyen de stopper la désertification médicale et de relever le défi des maladies chroniques.","md":"L**a coopération doit remplacer la concurrence** entre les différents compartiments de l’offre de soins. C’est le seul moyen de stopper la désertification médicale et de relever le défi des maladies chroniques."},{"kind":"texte","text":"Ceci suppose de :"},{"kind":"puce","text":"Constituer un véritable service public de soins primaires organisé autour de centres de santé avec des professionnel·les salarié·es","md":"**Constituer un véritable service public de soins primaires organisé autour de centres de santé avec des professionnel·les salarié·es**","depth":0,"id":"PT-SANTE-L010"},{"kind":"puce","text":"En finir avec la logique perverse de « l’hôpital-entreprise » et lancer une refonte ambitieuse du service public hospitalier articulé avec le service public de soins primaires et financé à hauteur des besoins de la population et des nécessités du personnel","md":"**En finir avec la logique perverse de « l’hôpital-entreprise »** et lancer une **refonte ambitieuse du service public hospitalier articulé avec le service public de soins primaires et** financé à hauteur des besoins de la population et des nécessités du personnel","depth":0,"id":"PT-SANTE-L011"},{"kind":"texte","text":"Pour que l’hôpital public redevienne humain et attractif, la priorité est l’amélioration des conditions de travail pour tous les corps de métiers. Nous proposons donc de :"},{"kind":"puce","text":"Revaloriser immédiatement les salaires des soignants par une augmentation du point d’indice de 10%","md":"**Revaloriser immédiatement les salaires des soignants par une augmentation du point d’indice de 10%**","depth":0,"id":"PT-SANTE-L012"},{"kind":"puce","text":"Protéger les métiers, par exemple en reclassant les ambulanciers hospitaliers en catégorie B ou en programmant le retour à l’exclusivité pour les infirmier·es de bloc opératoire","depth":0,"id":"PT-SANTE-L013"},{"kind":"puce","text":"Coordonner avec les mairies un nombre suffisant de logements à des loyers accessibles permettant au personnel hospitalier d’habiter proche de son lieu de travail","depth":0,"id":"PT-SANTE-L014"},{"kind":"puce","text":"Répondre immédiatement aux besoins de base en matériels et équipements du personnel soignant, administratif et technique","depth":0,"id":"PT-SANTE-L015"},{"kind":"puce","text":"Ouvrir une enveloppe d’urgence destinée aux établissements publics, répartie selon les besoins de soins, les charges et les difficultés territoriales. Sécuriser le versement des crédits destinés aux soins et rendre publiques les décisions de mise en réserve et de régulation","depth":0,"id":"PT-SANTE-L016"},{"kind":"puce","text":"Suspendre les fermetures de services et de lits motivées par les seules économies budgétaires. Réexaminer les capacités nécessaires avec les équipes et les usagers, en garantissant la sécurité clinique","depth":0,"id":"PT-SANTE-L017"}]},{"title":"3.1.3 – Répondre à la crise de la psychiatrie","depth":3,"path":["3. Comment nous allons reconstruire notre système de santé","3.1 – Nos mesures pour répondre à l’urgence","3.1.3 – Répondre à la crise de la psychiatrie"],"blocks":[{"kind":"texte","text":"Dès le début du mandat, mobiliser les moyens nécessaires pour recruter et stabiliser les équipes, rétablir les capacités d’accueil et garantir des soins dignes, accessibles et respectueux des droits des patient·es. Nous proposons de :"},{"kind":"puce","text":"Recruter des psychiatres et des soignant·es et créer 2 500 postes de psychologues dans les centres médico-psychologiques, pour réduire les délais d’attente et assurer la continuité des soins","md":"**Recruter des psychiatres et des soignant·es et créer 2 500 postes de psychologues dans les centres médico-psychologiques**, pour réduire les délais d’attente et assurer la continuité des soins","depth":0,"id":"PT-SANTE-L018"},{"kind":"puce","text":"Ouvrir au moins 360 lits en pédopsychiatrie, avec les équipes nécessaires, et organiser des prises en charge adaptées pour mettre fin aux hospitalisations d’enfants dans les unités pour adultes","md":"**Ouvrir au moins 360 lits en pédopsychiatrie**, avec les équipes nécessaires, et organiser des prises en charge adaptées pour mettre fin aux hospitalisations d’enfants dans les unités pour adultes","depth":0,"id":"PT-SANTE-L019"},{"kind":"puce","text":"Renforcer les équipes mobiles, l’accueil des crises et la prévention du suicide ; garantir un relais de soins effectif après chaque hospitalisation","depth":0,"id":"PT-SANTE-L020"},{"kind":"puce","text":"Engager l’interdiction de la contention mécanique, en développant les alternatives, la formation et les effectifs indispensables. Faire cesser immédiatement les pratiques illégales d’isolement et de contention et garantir les droits des personnes hospitalisées, notamment leur liberté d’aller et venir en soins libres","md":"**Engager l’interdiction de la contention mécanique**, en développant les alternatives, la formation et les effectifs indispensables. Faire cesser immédiatement les pratiques illégales d’isolement et de contention et garantir les droits des personnes hospitalisées, notamment leur liberté d’aller et venir en soins libres","depth":0,"id":"PT-SANTE-L021"},{"kind":"puce","text":"Rénover en priorité les locaux vétustes ou indignes et garantir des conditions d’accueil protégeant l’intimité, la sécurité et la dignité des patient·es","depth":0,"id":"PT-SANTE-L022"}]},{"title":"3.1.4 – Commencer à éradiquer les maladies écologiques","depth":3,"path":["3. Comment nous allons reconstruire notre système de santé","3.1 – Nos mesures pour répondre à l’urgence","3.1.4 – Commencer à éradiquer les maladies écologiques"],"blocks":[{"kind":"texte","text":"Dès son arrivée au pouvoir, le gouvernement insoumis s’attelera à vaincre les maladies écologiques. Il est évident que la prise en charge de la dimension globale, écologique et sociale de la santé humaine est une affaire de plans de moyen terme. Cependant, des mesures d’urgence peuvent être prises en quelques mois."},{"kind":"texte","text":"Aussi :"},{"kind":"puce","text":"Nous interdirons d’urgence les additifs dangereux pour la santé en limitant la liste à ceux autorisés dans l’agriculture biologique","depth":0,"id":"PT-SANTE-L023"},{"kind":"puce","text":"Nous prendrons en charge un réel suivi médical pour les personnes exposées au cadmium","depth":0,"id":"PT-SANTE-L024"},{"kind":"puce","text":"Nous aiderons les victimes des pollutions et les lanceurs d’alerte sur la base d’un fonds abondé par les consommations polluantes","depth":0,"id":"PT-SANTE-L025"},{"kind":"texte","text":"Nous instaurerons une zone tampon pour protéger les enfants des pesticides et polluants autour des habitations, des crèches, des écoles et des hôpitaux."}]},{"title":"3.2 – Nos propositions pour faire de la santé un droit pour toutes et tous","depth":2,"path":["3. Comment nous allons reconstruire notre système de santé","3.2 – Nos propositions pour faire de la santé un droit pour toutes et tous"],"blocks":[]},{"title":"3.2.1 – Instaurer le 100 % Sécu et financer les besoins de santé","depth":3,"path":["3. Comment nous allons reconstruire notre système de santé","3.2 – Nos propositions pour faire de la santé un droit pour toutes et tous","3.2.1 – Instaurer le 100 % Sécu et financer les besoins de santé"],"blocks":[{"kind":"texte","text":"Considérer les dépenses de santé comme un coût à diminuer est un contresens. La santé est un investissement social, la condition indispensable de tout développement de l’humanité, son intelligence, ses facultés, son imagination. Au contraire, les coupes budgétaires dégradent la santé de la population et coûtent, à terme, davantage à la collectivité. Nous devons sanctuariser les moyens et garantir un financement solidaire de notre système de santé, fidèle à l’ambition fondatrice de la Sécurité sociale."},{"kind":"texte","text":"Il faut assurer une prise en charge intégrale des soins et de la prévention, tout en évitant les dépenses inutiles ou préjudiciables à la santé. Notre exigence de solidarité et d’égalité s’accompagne d’une même exigence de bonne utilisation des fonds publics, au service de la sécurité et de la qualité des soins."},{"kind":"puce","text":"Instaurer le « 100 % Sécu » : intégrer les complémentaires privées à la Sécurité sociale et utiliser l’argent ainsi récupéré pour rembourser à 100 % les soins de santé prescrits (dont les soins et appareils dentaires, optiques, auditifs, prothèses)","md":"**Instaurer le « 100 % Sécu » :** intégrer les complémentaires privées à la Sécurité sociale et utiliser l’argent ainsi récupéré pour rembourser à 100 % les soins de santé prescrits (dont les soins et appareils dentaires, optiques, auditifs, prothèses)","depth":0,"id":"PT-SANTE-L026"},{"kind":"puce","text":"Supprimer l’Objectif national de dépenses de l’assurance maladie (ONDAM) et affecter à l’Assurance maladie des ressources propres indépendantes du budget de l’État","md":"**Supprimer l’Objectif national de dépenses de l’assurance maladie (ONDAM)** et affecter à l’Assurance maladie des ressources propres indépendantes du budget de l’État","depth":0,"id":"PT-SANTE-L027"},{"kind":"puce","text":"Lutter contre les dépenses inutiles en définissant démocratiquement un périmètre de la solidarité de tous les biens et services médicaux dont l’utilité médicale est reconnue en renégociant les prix exorbitants exigés par certains laboratoires pharmaceutiques et certaines catégories de professionnel·les (optique, dentaire, audioprothèse, etc.)","md":"**Lutter contre les dépenses inutiles** en définissant démocratiquement un périmètre de la solidarité de tous les biens et services médicaux dont l’utilité médicale est reconnue en renégociant les prix exorbitants exigés par certains laboratoires pharmaceutiques et certaines catégories de professionnel·les (optique, dentaire, audioprothèse, etc.)","depth":0,"id":"PT-SANTE-L028"},{"kind":"tableau","text":"Le « 100 % Sécu », une mesure efficace, solidaire et simple à financer Le 100% Sécu consiste à intégrer les complémentaires privées à la Sécurité Sociale en vue d’une prise en charge intégrale par l’Assurance maladie des dépenses de santé. Une telle mesure est : – Économique : sur 1€ cotisé à la complémentaire, 17 centimes partent en frais de gestion et de concurrence (publicité, marketing, frais divers). Mais sur 1€ cotisé à la Sécurité sociale, seuls 2 centimes sont consacrés aux frais de gestion. En conséquence, transférer l’activité et les emplois des complémentaires vers la Sécurité sociale, c’est économiser près de 10 milliards d’euros de frais de gestion à rediriger vers le remboursement des soins. C’est une mesure qui rapporte de l’argent à l’Assurance maladie. – Solidaire : le financement et le niveau de couverture des complémentaires sont inégalitaires (cotisations qui dépendent de l’âge et du lieu de vie, niveaux de prise en charge très disparates selon les contrats, contrats très coûteux pour les retraité·es et les indépendant·es, prime aux plus aisés via la déduction des cotisations dans l’impôt sur le revenu) alors que l’Assurance maladie propose le même niveau de couverture pour tou·tes et a vocation à être financée par des cotisations sociales, liées aux revenus. – Simple à financer : la transformation des primes versées aux complémentaires en cotisations sociales, les économies réalisées sur les frais de gestion, la suppression des dépassements d’honoraires et la régulation de prix aujourd’hui excessifs permettent de financer cette mesure. Le 100 % Sécu ne se traduira par aucun licenciement : Les salarié·es des complémentaires dont les activités sont concernées par le « 100 % Sécu » se verront proposer une intégration au sein de l’Assurance maladie ou une reconversion professionnelle prise en charge financièrement. Les mutuelles pourront réorienter leurs autres salarié·es et leurs réserves financières vers les mutuelles dites du Livre III (les centres de santé mutualistes, par exemple)","rows":[["Le « 100 % Sécu », une mesure efficace, solidaire et simple à financer Le 100% Sécu consiste à intégrer les complémentaires privées à la Sécurité Sociale en vue d’une prise en charge intégrale par l’Assurance maladie des dépenses de santé. Une telle mesure est : – Économique : sur 1€ cotisé à la complémentaire, 17 centimes partent en frais de gestion et de concurrence (publicité, marketing, frais divers). Mais sur 1€ cotisé à la Sécurité sociale, seuls 2 centimes sont consacrés aux frais de gestion. En conséquence, transférer l’activité et les emplois des complémentaires vers la Sécurité sociale, c’est économiser près de 10 milliards d’euros de frais de gestion à rediriger vers le remboursement des soins. C’est une mesure qui rapporte de l’argent à l’Assurance maladie. – Solidaire : le financement et le niveau de couverture des complémentaires sont inégalitaires (cotisations qui dépendent de l’âge et du lieu de vie, niveaux de prise en charge très disparates selon les contrats, contrats très coûteux pour les retraité·es et les indépendant·es, prime aux plus aisés via la déduction des cotisations dans l’impôt sur le revenu) alors que l’Assurance maladie propose le même niveau de couverture pour tou·tes et a vocation à être financée par des cotisations sociales, liées aux revenus. – Simple à financer : la transformation des primes versées aux complémentaires en cotisations sociales, les économies réalisées sur les frais de gestion, la suppression des dépassements d’honoraires et la régulation de prix aujourd’hui excessifs permettent de financer cette mesure. Le 100 % Sécu ne se traduira par aucun licenciement : Les salarié·es des complémentaires dont les activités sont concernées par le « 100 % Sécu » se verront proposer une intégration au sein de l’Assurance maladie ou une reconversion professionnelle prise en charge financièrement. Les mutuelles pourront réorienter leurs autres salarié·es et leurs réserves financières vers les mutuelles dites du Livre III (les centres de santé mutualistes, par exemple)"]]},{"kind":"texte","text":"Renouer avec la promesse initiale du 100% Sécu exige également de revenir à une gestion démocratique de l’Assurance maladie. Nous le ferons en remettant en place les conseils d’administration avec leurs prérogatives de gestion qui ont été supprimées pour donner à l’État tous les pouvoirs, notamment sur les budgets via les lois de financement de la Sécurité sociale. Pour cela, la priorité sera de rétablir les élections permettant de désigner les représentants des assurés sociaux dans les conseils d’administration.","md":"**Renouer avec la promesse initiale du 100% Sécu exige également de revenir à une gestion démocratique de l’Assurance maladie**. Nous le ferons en remettant en place les conseils d’administration avec leurs prérogatives de gestion qui ont été supprimées pour donner à l’État tous les pouvoirs, notamment sur les budgets via les lois de financement de la Sécurité sociale. Pour cela, la priorité sera de rétablir les élections permettant de désigner les représentants des assurés sociaux dans les conseils d’administration."}]},{"title":"3.2.2 – Construire un service public des soins de proximité","depth":3,"path":["3. Comment nous allons reconstruire notre système de santé","3.2 – Nos propositions pour faire de la santé un droit pour toutes et tous","3.2.2 – Construire un service public des soins de proximité"],"blocks":[{"kind":"texte","text":"Un maillage des points d’accès au
