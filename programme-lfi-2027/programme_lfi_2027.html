s et répondre aux besoins de recherche, nous lancerons un plan pluriannuel de recrutement de 40 000 personnels statutaires à minima sur 5 ans. Ce plan inclura :"},{"kind":"puce","text":"Un état des lieux des besoins dans tous les corps de métier de l’ESR afin d’ajuster les recrutements nécessaires","depth":0,"id":"PT-ESR-L016"},{"kind":"puce","text":"La titularisation de tou·tes les contractuel·les volontaires exerçant des fonctions pérennes – dans tous les corps, CDI de mission et chaires de professeur junior compris","depth":0,"id":"PT-ESR-L017"},{"kind":"puce","text":"Le plafonnement du recours aux non-titulaires à 5 % des effectifs hors doctorant·es et stagiaires","depth":0,"id":"PT-ESR-L018"},{"kind":"texte","text":"Il nous faut également en finir avec la précarité des personnels de l’enseignement supérieur et de la recherche, tous corps confondus. La rémunération sera fondée sur des grilles claires et objectives, afin de supprimer les primes et rémunérations au mérite – celles-ci favorisent la concurrence plutôt que la coopération et accroissent la souffrance au travail. Le gouvernement insoumis mettra en œuvre :"},{"kind":"puce","text":"La revalorisation de la valeur du point d’indice des fonctionnaires de 10 % et l’inscription de son dégel dans la loi","depth":0,"id":"PT-ESR-L019"},{"kind":"puce","text":"La revalorisation salariale des catégories B et C des personnels BIATSS et ITA, dans le cadre de la renégociation des grilles de la fonction publique","depth":0,"id":"PT-ESR-L020"},{"kind":"puce","text":"L’indexation des salaires des non-titulaires sur ceux des fonctionnaires à grade équivalent","depth":0,"id":"PT-ESR-L021"},{"kind":"puce","text":"Un rattrapage spécifique pour les ATER dont le statut est particulièrement précaire","depth":0,"id":"PT-ESR-L022"},{"kind":"texte","text":"Nous reconnaîtrons mieux les personnels administratifs et techniques. Sans les BIATSS et ITA, les universités et les organismes de recherche ne peuvent pas fonctionner. Nous organiserons un plan pluriannuel de concours et de promotion. Afin de calibrer ce plan de promotion, nous effectuerons un état des lieux sur l’adéquation entre l’exercice des missions et les grades. Une attention particulière sera portée au respect des missions, des compétences et des capacités de proposition des personnels administratifs et techniques."}]},{"title":"Libérer du temps pour enseigner et chercher","depth":3,"path":["Comment nous allons refonder l’enseignement supérieur, la recherche et la formation continue","Nos mesures d’urgence","Libérer du temps pour enseigner et chercher"],"blocks":[{"kind":"texte","text":"Le plan pluriannuel de recrutements s’accompagnera d’une baisse des obligations statutaires d’enseignement. Cette réduction est indispensable pour laisser du temps à la recherche et à un meilleur accompagnement des étudiant·es. Elle s’articulera par :"},{"kind":"puce","text":"Un abaissement progressif du service d’enseignement des enseignant·es-chercheur·ses à 160 heures de TD par an","depth":0,"id":"PT-ESR-L023"},{"kind":"puce","text":"Un abaissement du service des enseignant·es sans obligation de recherche, de 384 à 320 heures équivalent TD par an","depth":0,"id":"PT-ESR-L024"},{"kind":"puce","text":"Un plafonnement des heures complémentaires, des vacations et des CDD techniques, et une augmentation progressive du taux horaire pour les vacataires","depth":0,"id":"PT-ESR-L025"},{"kind":"puce","text":"L’application effective du droit à un congé pour recherche, à hauteur d’une année tous les sept ans","depth":0,"id":"PT-ESR-L026"}]},{"title":"Rénover les bâtiments","depth":3,"path":["Comment nous allons refonder l’enseignement supérieur, la recherche et la formation continue","Nos mesures d’urgence","Rénover les bâtiments"],"blocks":[{"kind":"texte","text":"Nous lancerons un grand plan pour l’immobilier universitaire écologique et accessible, de construction et de rénovation de laboratoires, de lieux d’enseignement et de vie sociale, citoyenne et étudiante."},{"kind":"texte","text":"Une approche systémique sera engagée en concertation avec les personnels pour assurer la bifurcation écologique de l’enseignement et de la recherche, y compris dans leur organisation quotidienne : transparence des fournisseurs et partenariats, intégration des critères éthiques, écologiques et sociaux dans les achats et missions (matériel, équipements, alimentation, etc.), en priorisant les filières écologiques et matériaux bio-sourcés."}]},{"title":"Pour assurer le respect des libertés académiques et l’indépendance de l’ESR","depth":2,"path":["Comment nous allons refonder l’enseignement supérieur, la recherche et la formation continue","Pour assurer le respect des libertés académiques et l’indépendance de l’ESR"],"blocks":[{"kind":"texte","text":"Les attaques contre les libertés académiques se multiplient partout dans le monde. La réélection de Donald Trump en tant que président des États-Unis a été marquée par des attaques sans précédent sur la science, qu’il a accusée d’être le foyer des idéologies de gauche. La communauté scientifique française avait alors montré sa solidarité avec le monde universitaire étasunien."},{"kind":"texte","text":"Pourtant, les gouvernements successifs d’Emmanuel Macron ont accéléré la transformation néolibérale du modèle universitaire français et sa convergence avec le modèle étasunien. Ces dernières années, l’université française a été la cible d’attaques multiples et répétées. Les mobilisations sociales de la rentrée 2026 en ont encore donné un triste exemple : des policiers sont entrés sur les campus universitaires sans autorisation et des fermetures administratives ont empêché toute liberté de réunion et d’expression, autant pour les étudiant·es que pour la communauté éducative."},{"kind":"texte","text":"Nous garantirons le plein respect des libertés académiques, des droits et libertés étudiants (droit d’association, de réunion, d’expression, de débat, de participation à la démocratie universitaire) et des franchises universitaires. Nous abrogerons les lois et dispositifs, qui, sous couvert de lutte contre les discriminations ou de lutte contre l’apologie du terrorisme, ne visent qu’à réprimer des mobilisations étudiantes."},{"kind":"texte","text":"Nous reviendrons également sur l’extension abusive des zones à régime restrictif (ZRR), outils de contrôle politique et administratif pour empêcher l’accès à la recherche scientifique, au-delà des secteurs sensibles comme la défense."}]},{"title":"Refonder la démocratie universitaire","depth":3,"path":["Comment nous allons refonder l’enseignement supérieur, la recherche et la formation continue","Pour assurer le respect des libertés académiques et l’indépendance de l’ESR","Refonder la démocratie universitaire"],"blocks":[{"kind":"texte","text":"Une vraie démocratie universitaire doit réaffirmer les principes de coopération et de collégialité. Cette volonté s’articulera autour des mesures suivantes dans les universités :"},{"kind":"puce","text":"Un mandat unique sera instauré pour les président·es, désigné·es par les seul·es membres élu·es du Conseil d’administration et du Conseil académique en leur sein ; il sera révocable par elles et eux et l’élection sera privilégiée pour les postes à responsabilité","depth":0,"id":"PT-ESR-L027"},{"kind":"puce","text":"Un rééquilibrage des collèges dans les instances décisionnelles sera engagé pour une meilleure représentativité, avec notamment une augmentation du nombre d’élu·es étudiant·es, en concertation avec les syndicats, et la prime majoritaire sera supprimée","depth":0,"id":"PT-ESR-L028"},{"kind":"puce","text":"Les instances des CROUS seront transformées pour une meilleure représentation des étudiant·es et des personnels","depth":0,"id":"PT-ESR-L029"}]},{"title":"En finir avec le pilotage par la performance","depth":3,"path":["Comment nous allons refonder l’enseignement supérieur, la recherche et la formation continue","Pour assurer le respect des libertés académiques et l’indépendance de l’ESR","En finir avec le pilotage par la performance"],"blocks":[{"kind":"texte","text":"Le Haut conseil à l’évaluation (HCÉRES) sera supprimé. Les modalités de l’évaluation des formations et des unités de recherche seront discutées par concertation entre les différents acteurs de la recherche (par exemple, les comités du CNRS) et dans le cadre des organes délibératifs du Conseil national de l’ESR (CNESER) et du Conseil national des universités (CNU), qui seront rénovés, renforcés et démocratisés. Nous ferons appliquer le principe d’évaluations qualitatives et non plus quantitatives ou bibliométriques dans les recrutements et évolutions de carrières pour assurer l’intégrité scientifique plutôt que la course à la publication. L’obtention de subventions publiques par les revues scientifiques sera conditionnée au respect de règles démocratiques dans la constitution et le fonctionnement des comités de revues."}]},{"title":"Garantir l’indépendance de la recherche publique","depth":3,"path":["Comment nous allons refonder l’enseignement supérieur, la recherche et la formation continue","Pour assurer le respect des libertés académiques et l’indépendance de l’ESR","Garantir l’indépendance de la recherche publique"],"blocks":[{"kind":"texte","text":"Le modèle de financement de la recherche n’a cessé d’être fragilisé, la rendant de plus en plus dépendante des lobbys et de leurs intérêts. Le développement et le rayonnement scientifiques sont pourtant un pilier de notre indépendance. Nous rehausserons le niveau d’investissement public dans la recherche."},{"kind":"texte","text":"Ce financement à la hauteur des besoins garantira l’indépendance de la recherche publique face à l’immixtion des lobbys privés (chaires partenariales, participation aux instances exécutives, etc.). Nous supprimerons le Crédit d’impôt recherche au profit de dotations récurrentes à hauteur des besoins pour les universités et instituts de recherche."},{"kind":"texte","text":"Nous organiserons également la libération progressive de l’université et de la recherche de l’emprise des GAFAM, en soutenant la bifurcation vers les logiciels libres et les solutions souveraines."},{"kind":"texte","text":"Enfin, nous travaillerons à fixer un cadre à l’utilisation de l’intelligence artificielle générative à l’université et dans la recherche pour garantir que cette nouvelle frontière de l’humanité soit mise au service de l’intérêt général humain. L’IA doit demeurer un outil d’assistance et d’émancipation, et non un substitut aux capacités humaines d’apprentissage, de raisonnement et de jugement. Nous refuserons que son usage soit imposé aux personnels comme aux étudiant·es. Nous engagerons avec l’ensemble de la communauté universitaire un travail visant à construire une vision commune et à définir des principes directeurs pour un usage responsable et sûr de l’IA générative dans l’enseignement supérieur."}]},{"title":"Nos mesures pour refonder le service public de l’enseignement supérieur, de la recherche et de la formation continue","depth":1,"path":["Nos mesures pour refonder le service public de l’enseignement supérieur, de la recherche et de la formation continue"],"blocks":[]},{"title":"Pour reconstruire le service public de l’enseignement supérieur","depth":2,"path":["Nos mesures pour refonder le service public de l’enseignement supérieur, de la recherche et de la formation continue","Pour reconstruire le service public de l’enseignement supérieur"],"blocks":[{"kind":"texte","text":"Depuis les années 2000, une série de réformes a précarisé le modèle universitaire français et mis en concurrence les établissements. Nous abrogerons les lois LRU et Fioraso, et rétablirons le cadre national des diplômes de l’enseignement supérieur, dont le premier d’entre eux, le baccalauréat. Les établissements publics relevant de ce cadre national seront laïques et seuls autorisés à remettre des diplômes reconnus pour les concours de la fonction publique et les conventions collectives."},{"kind":"texte","text":"Nous conditionnerons toutes les subventions publiques au privé (qualité pédagogique, transparence financière, mixité sociale) et renforcerons le contrôle pédagogique de toutes les formations privées existantes. Nous interdirons le caractère lucratif des écoles privées de l’enseignement supérieur (actionnariat, cotation en bourse). Les établissements reconnus d’« intérêt général » auront la possibilité de rejoindre le service public d’enseignement supérieur et de la recherche."},{"kind":"texte","text":"Les établissements expérimentaux et « grands établissements » devront redevenir des universités de droit commun. Les fusions d’établissements déjà réalisées ou amorcées seront soumises à référendum, après audit public lorsque la fusion a déjà eu lieu. Toute évolution structurelle sera conditionnée à un processus de validation démocratique mené par composante."},{"kind":"puce","text":"La fin de la mise en concurrence des établissements passera également par :","depth":0,"id":"PT-ESR-L030"},{"kind":"puce","text":"Le retrait des établissements des classements internationaux type Shanghai et la fin des financements dédiés aux stratégies marketing ou à l’obtention de labels et autres « marques »","depth":0,"id":"PT-ESR-L031"},{"kind":"puce","text":"La suppression de l’Agence nationale de la recherche (ANR) et des structures liées au Programme d’investissements d’avenir (PIA) qui sont inefficaces et chronophages pour les personnels","depth":0,"id":"PT-ESR-L032"},{"kind":"puce","text":"La réaffectation des fonds équivalents aux unités sous forme de crédits récurrents","depth":0,"id":"PT-ESR-L033"},{"kind":"puce","text":"Le soutien au développement de réseaux et de fédérations de recherche nationaux et internationaux, tels que les Groupes de Recherche (GDR) au CNRS","depth":0,"id":"PT-ESR-L034"}]},{"title":"Unifier l’offre de formations et développer leur maillage","depth":3,"path":["Nos mesures pour refonder le service public de l’enseignement supérieur, de la recherche et de la formation continue","Pour reconstruire le service public de l’enseignement supérieur","Unifier l’offre de formations et développer leur maillage"],"blocks":[{"kind":"texte","text":"Pour beaucoup de jeunes, l’accès aux études dépend encore du lieu de résidence. Nous développerons le caractère pluridisciplinaire des universités et leur implantation de proximité. Nous reconstruirons une carte de formations d’enseignement supérieur cohérente, y compris dans les villes moyennes et des Outre-mer, en renforçant à la fois les réseaux de transports en commun et les antennes universitaires."},{"kind":"texte","text":"Nous redonnerons des moyens égaux aux filières, y compris professionnelles et technologiques. En ce sens, le gouvernement insoumis s’attachera à :"},{"kind":"puce","text":"Protéger les cursus courts dans l’enseignement supérieur et encourager la poursuite d’études après un bac professionnel ou technologique (BTS, BUT actuels qui seront transformés en licences LUT, licences professionnelles, etc.)","depth":0,"id":"PT-ESR-L035"},{"kind":"puce","text":"Intégrer l’ensemble des formations au système universitaire à terme, en alignant par le haut les moyens octroyés (classes préparatoires, écoles post-bac liées aux formations sanitaires et sociales, grandes écoles publiques, etc.), et en respectant les spécificités professionnelles","depth":0,"id":"PT-ESR-L036"}]},{"title":"Aller vers un recrutement national et pluraliste","depth":3,"path":["Nos mesures pour refonder le service public de l’enseignement supérieur, de la recherche et de la formation continue","Pour reconstruire le service public de l’enseignement supérieur","Aller vers un recrutement national et pluraliste"],"blocks":[{"kind":"texte","text":"Pour garantir l’équité entre les candidatures, locales ou non, et lutter contre les dérives du localisme, nous ouvrirons un débat avec toute la communauté universitaire pour un recrutement national par le CNU, sur le modèle du CNRS, c’est-à-dire un concours avec une phase d’admissibilité sur dossier, puis des auditions nationales pour l’admission, tout en prenant en compte les besoins des universités en termes de profil."},{"kind":"texte","text":"Nous réviserons le périmètre des sections CNU, avec par exemple la création d’une section « Économie et société » afin d’assurer le pluralisme dans l’enseignement et la recherche économique et sociale, et lancerons une concertation nationale sur la création d’une section « Travail social / intervention sociale »."}]},{"title":"Pour renforcer le CNRS et les autres organismes nationaux de recherche","depth":2,"path":["Nos mesures pour refonder le service public de l’enseignement supérieur, de la recherche et de la formation continue","Pour renforcer le CNRS et les autres organismes nationaux de recherche"],"blocks":[{"kind":"texte","text":"Le CNRS et les instituts de recherche font, avec les universités, la force de la recherche en France. Ils ont permis des avancées majeures pour les connaissances mondiales. Loin des velléités de destruction de leurs statuts, nous renforcerons leur indépendance et leur démocratisation."},{"kind":"texte","text":"Nous refuserons la hiérarchisation des équipes de recherche induite par le projet – heureusement abandonné – des « Key Labs », qui impliquait de concentrer les moyens sur des projets qui seraient soi-disant les plus en capacité de répondre aux exigences de la compétition internationale, sans concertation interne sur le choix de ces projets et au détriment du financement des autres laboratoires de recherche. Nous défendrons la diversité et la richesse de l’écosystème de recherche, tant fondamentale que finalisée."},{"kind":"texte","text":"En cohérence, nous mettrons fin à l’affaiblissement des grands instituts publics de recherche (CNRS, INRAE, INSERM, INRIA, IRD etc.) qui subissent satellisation, démantèlement et fusions forcées. Nous ferons de ces organismes des acteurs forts de la recherche publique avec une collaboration accrue au sein d’équipes mixtes et de projets multi-unités."}]},{"title":"Faire de la recherche un pilier de la bifurcation écologique","depth":3,"path":["Nos mesures pour refonder le service public de l’enseignement supérieur, de la recherche et de la formation continue","Pour renforcer le CNRS et les autres organismes nationaux de recherche","Faire de la recherche un pilier de la bifurcation écologique"],"blocks":[{"kind":"texte","text":"À l’ère des incertitudes écologiques, la recherche publique doit permettre d’éclairer nos choix collectifs et ouvrir des perspectives à l’humanité tout entière, sans dépendre des intérêts de court terme. C’est la raison pour laquelle nous financerons des plans généraux de thèmes de recherche sur des secteurs d’avenir."},{"kind":"texte","text":"Les instituts de recherche finalisée seront mobilisés pour mener les recherches nécessaires à la bifurcation écologique et aux objectifs de production dans les filières stratégiques tels qu’ils sont détaillés dans les plans d’investissement. Des recrutements seront effectués pour répondre à ces nouvelles missions. Cet objectif implique également un décloisonnement entre domaines des sciences et techniques et sciences humaines et sociales et une coordination renforcée avec les EPIC concernés (ADEME, Ifremer, CNES, CEA, etc.). Un nouvel institut de recherche finalisée sur ce modèle sera créé et dédié à l’intelligence artificielle."}]},{"title":"Pour démarchandiser la formation continue et renforcer les liens avec la formation initiale","depth":2,"path":["Nos mesures pour refonder le service public de l’enseignement supérieur, de la recherche et de la formation continue","Pour démarchandiser la formation continue et renforcer les liens avec la formation initiale"],"blocks":[{"kind":"texte","text":"Nous garantirons le droit à la formation à chacun·e, quelle que soit son origine sociale, géographique, ses moyens financiers, son expérience scolaire ou son âge, un droit qui passe d’abord par la généralisation de la gratuité réelle des formations, fournitures et équipements compris."},{"kind":"texte","text":"Pour ce faire, nous agirons sur deux plans complémentaires : d’un côté, la démarchandisation de la formation continue, et de l’autre, le renforcement des liens entre la formation continue et la formation initiale."}]},{"title":"En finir avec la marchandisation de la formation continue","depth":3,"path":["Nos mesures pour refonder le service public de l’enseignement supérieur, de la recherche et de la formation continue","Pour démarchandiser la formation continue et renforcer les liens avec la formation initiale","En finir avec la marchandisation de la formation continue"],"blocks":[{"kind":"texte","text":"En macronie, la formation continue n’a pas cessé d’être marchandisée. Nous entendons mettre un terme à cette dérive."},{"kind":"puce","text":"Supprimer l’obligation de mise en concurrence entre organismes de formation : les formations seront confiées en priorité aux organismes publics (AFPA, GRETA, centres polytechniques professionnels, CNAM, universités)","depth":0,"id":"PT-ESR-L037"},{"kind":"puce","text":"Rétablir l’encadrement public de la création de Centres de formation des apprenti·es (CFA)","depth":0,"id":"PT-ESR-L038"},{"kind":"puce","text":"Réaffirmer la primauté des qualifications, liées aux grilles de classification et codifiées dans les conventions collectives, par opposition à des « compétences » individuelles aux contours flous et non reconnus, certifiées par des organismes privés contre rémunération","depth":0,"id":"PT-ESR-L039"},{"kind":"puce","text":"S’assurer que les stages, apprentissages et alternances soient organisés et cadrés en fonction de leur intérêt pédagogique ou non au sein de chaque formation, et non sous pression du marché du travail","depth":0,"id":"PT-ESR-L040"}]},{"title":"Renforcer les liens entre formation continue et formation initiale","depth":3,"path":["Nos mesures pour refonder le service public de l’enseignement supérieur, de la recherche et de la formation continue","Pour démarchandiser la formation continue et renforcer les liens avec la formation initiale","Renforcer les liens entre formation continue et formation initiale"],"blocks":[{"kind":"texte","text":"Une fois cette démarchandisation opérée, nous rapprocherons la formation continue et la formation initiale pour permettre une élévation continue du niveau de qualification des travailleur·ses et répondre aux besoins sociaux et écologiques de notre pays. Pour cela, nous créerons un Conseil national de la qualification professionnelle chargé de l’élaboration et de la révision du cadre national des diplômes et des certifications, base de l’établissement de la carte nationale des formations, dans un esprit de complémentarité et de coopération entre les organismes dédiés. Ce Conseil sera le lieu où établir collectivement les besoins de qualification et mettre en place, de façon organisée et coopérative, les formations nécessaires pour y répondre. Ce processus collectif mobilisera toute la société, en associant les acteurs et actrices de la formation, les représentant·es des salarié·es, des organisations patronales et branches professionnelles, les collectivités territoriales – en particulier les éco-régions et communes – les chercheur·ses, les représentant·es des formateur·rices, des enseignant·es, des étudiant·es et lycéen·nes et les acteurs et actrices du monde associatif."},{"kind":"texte","text":"Il sera également chargé de remplacer l’organisme certificateur Qualiopi qui a échoué à garantir la qualité des formations et permis à des entreprises commerciales de vendre des formations inadaptées aux besoins des citoyen·nes et des professionnel·les."},{"kind":"texte","text":"En parallèle, un réseau national de Centres polytechniques professionnels de la formation initiale, du CAP à la licence pro, et de la formation continue sera créé sur tout le territoire, pour associer, coordonner et faire monter en puissance les structures existantes (lycées pro et agricoles, GRETA, AFPA, CNAM, composantes universitaires, etc.). La mission de validation des acquis de l’expérience (VAE) sera confiée aux Centres polytechniques et aux établissements dispensateurs de diplômes d’État."}]},{"title":"Faciliter l’accès à la formation au plus grand nombre","depth":3,"path":["Nos mesures pour refonder le service public de l’enseignement supérieur, de la recherche et de la formation continue","Pour démarchandiser la formation continue et renforcer les liens avec la formation initiale","Faciliter l’accès à la formation au plus grand nombre"],"blocks":[{"kind":"texte","text":"Une fois cette démarchandisation et ce rapprochement entre formation continue et formation initiale opérés, nous travaillerons à rendre accessibles ces formations au plus grand nombre. Aussi, le gouvernement insoumis s’assurera :"},{"kind":"puce","text":"Que des possibilités de poursuite d’études soient systématiquement proposées dans l’ensemble des structures des centres polytechniques professionnels et ce, du lycée jusqu’à l’enseignement supérieur","depth":0,"id":"PT-ESR-L041"},{"kind":"puce","text":"Que les moyens de ces centres soient renforcés pour l’accueil et la formation dans de bonnes conditions, notamment pour engager des rénovations et l’extension des locaux ; mais aussi pour investir dans des plateaux techniques et matériels performants","depth":0,"id":"PT-ESR-L042"},{"kind":"puce","text":"Que des passerelles soient créées entre les filières, allant du CAP au BTS et au niveau licence professionnelle/ingénieur","depth":0,"id":"PT-ESR-L043"},{"kind":"puce","text":"Qu’un socle renforcé d’enseignements généraux et disciplinaires soit garanti dans toutes les formations professionnelles pour faciliter les passerelles et former des travailleur·ses qualifié·es et capables d’adaptation","depth":0,"id":"PT-ESR-L044"}]},{"title":"Pour favoriser la diffusion des connaissances et la coopération internationale et francophone","depth":2,"path":["Nos mesures pour refonder le service public de l’enseignement supérieur, de la recherche et de la formation continue","Pour favoriser la diffusion des connaissances et la coopération internationale et francophone"],"blocks":[{"kind":"texte","text":"Les résultats de la recherche publique doivent rester une propriété publique collective."},{"kind":"texte","text":"L’accès ouvert et gratuit aux revues scientifiques sera généralisé par la création d’un service public de la publication scientifique articulé autour de :"},{"kind":"puce","text":"La pérennisation des outils existants et la relance des presses universitaires","depth":0,"id":"PT-ESR-L045"},{"kind":"puce","text":"L’ouverture des données de la recherche grâce à un plan national de gestion des données, s’appuyant sur les plateformes existantes, pour garantir la conservation des résultats et des outils développés par la recherche publique","depth":0,"id":"PT-ESR-L046"},{"kind":"puce","text":"L’action en faveur de l’extension de ce principe au niveau international et l’appui aux initiatives déjà existantes","depth":0,"id":"PT-ESR-L047"},{"kind":"texte","text":"Les connaissances acquises par les organismes publics et les universités seront ainsi par défaut rendues accessibles à tou·tes, y compris donc aux acteurs privés."}]},{"title":"Ouvrir l’université et la recherche sur la société","depth":2,"path":["Nos mesures pour refonder le service public de l’enseignement supérieur, de la recherche et de la formation continue","Ouvrir l’université et la recherche sur la société"],"blocks":[{"kind":"texte","text":"Afin d’assurer leur mission d’émancipation, les universités et la recherche développeront, avec des services dédiés, le lien entre les chercheur·ses et la population. Chaque université aura une mission de partage des savoirs au-delà des effectifs de formation initiale, auprès de tous les publics (reprise d’études, formation continue, temps libre), avec notamment des cours libres assurés volontairement par des enseignant·es-chercheur·ses dans le cadre de leur service. La mission de diffusion de la recherche scientifique dans l’audiovisuel public sera renforcée."},{"kind":"texte","text":"En parallèle, le gouvernement insoumis prendra des mesures pour décloisonner la recherche et la placer au cœur de la société, de la fonction publique à l’enseignement supérieur. Ainsi, nous œuvrerons pour :"},{"kind":"puce","text":"Le soutien aux projets de recherche associant les citoyen·nes dans un esprit de diffusion des savoirs et de réflexion citoyenne sur leur usage et le soutien à la recherche-action, à la recherche-création et aux doctorats en formation continue","depth":0,"id":"PT-ESR-L048"},{"kind":"puce","text":"Le développement des Centres de culture scientifique, technique et industrielle (CCSTI) afin d’accroître le partage des connaissances avec les citoyens et citoyennes, en incluant les sciences humaines et sociales et en organisant la coordination avec les services de diffusion/médiation de la recherche dans les universités et instituts de recherche","depth":0,"id":"PT-ESR-L049"},{"kind":"puce","text":"Une meilleure intégration des docteur·es dans la fonction publique et l’obligation d’avoir un doctorat pour les postes d’encadrement des politiques scientifiques dans les EPST et les universités","depth":0,"id":"PT-ESR-L050"},{"kind":"puce","text":"La participation de l’enseignement secondaire dans des lycées généraux, technologiques et professionnels à des programmes de recherche (y compris en dehors des villes universitaires)","depth":0,"id":"PT-ESR-L051"}]},{"title":"Favoriser des nouvelles coopérations","depth":3,"path":["Nos mesures pour refonder le service public de l’enseignement supérieur, de la recherche et de la formation continue","Ouvrir l’université et la recherche sur la société","Favoriser des nouvelles coopérations"],"blocks":[{"kind":"texte","text":"Les coopérations entre universités et centres de recherche internationaux seront développées, en sortant de la logique de mise en concurrence systématique, de spécialisation à outrance des universités et de financement par appels à projets."},{"kind":"texte","text":"Nous voulons faire des Outre-mer de véritables pôles régionaux de développement, par le transfert de technologies auprès des pays voisins et l’aide logistique et scientifique, et grâce à des établissements de formations de haut niveau bénéficiant à la fois aux étudiant·es des Outre-mer et à celles et ceux des pays voisins."},{"kind":"texte","text":"Nous proposerons une alliance universitaire de la Méditerranée, qui permettra des échanges d’étudiant·es, d’enseignant·es et de chercheurs et chercheuses des deux rives. La création d’universités internationales thématiques, comme la mer et l’espace, sera proposée à nos partenaires. Nous engagerons plus largement des formes de coopération internationale tournées vers un partage des savoirs solidaires avec les États et universités qui le souhaitent."},{"kind":"texte","text":"L’université et la recherche francophones seront encouragées, par la création d’un Erasmus francophone, l’élaboration de contenus éducatifs et de diplômes communs entre pays francophones. Nous soutiendrons le développement d’une encyclopédie scientifique francophone des savoirs en accès libre."},{"kind":"texte","text":"Nous renforcerons et développerons les moyens consacrés à l’accueil des étudiant·es et scientifiques réfugié·es en pérennisant et en élargissant le programme PAUSE. Enfin, il sera mis fin aux partenariats universitaires avec des entreprises ou institutions impliquées dans des crimes de guerre, génocides ou écocides."}]}]}],"short":"Plan enseignement supérieur & recherche","content_sha256":"a46d331fb4f1871b18bf966e18061bb820c27e5622518a738b8bc692180acd0d"},{"code":"PT-RURALITE","kind":"plan_thematique","title":"Comment nous allons garantir l’égalité pour des ruralités où il fait bon vivre","url":"https://melenchon2027.fr/programme/plans-thematiques/ruralite/","modified":"2026-11-04T11:00:39","units":[{"code":"PT-RURALITE","part":null,"title":"Comment nous allons garantir l’égalité pour des ruralités où il fait bon vivre","url":"https://melenchon2027.fr/programme/plans-thematiques/ruralite/","sections":[{"title":"I. Entre vision fantasmée et délaissement : les ruralités à l’épreuve de l’abandon","depth":1,"path":["I. Entre vision fantasmée et délaissement : les ruralités à l’épreuve de l’abandon"],"blocks":[{"kind":"texte","text":"10 ans de macronisme qui creusent les inégalités","md":"**10 ans de macronisme qui creusent les inégalités**"},{"kind":"texte","text":"L’égalité des citoyen·nes est indissociable de l’idéal républicain. Mais alors qu’un·e Français·e sur trois réside en zone rurale, l’inégalité d’accès aux droits entre les populations ne cesse de croître."},{"kind":"texte","text":"Alignés sur les injonctions du marché et les orientations de l’Union européenne, les gouvernements successifs d’Emmanuel Macron ont accéléré les politiques libérales de métropolisation, de mise en concurrence des collectivités et des populations, et de course au productivisme et à la rentabilité."},{"kind":"texte","text":"Les réformes administratives territoriales conduites dans une logique comptable et un contexte de coupes budgétaires ont réduit les compétences des communes. Les réformes de la fiscalité locale et les baisses de dotations ont réduit leurs marges de manœuvre financières. Leurs capacités d’action de proximité ont ainsi été amoindries et diluées, quand elles n’ont pas été transférées aux intercommunalités éloignées des citoyen·es."},{"kind":"texte","text":"Les habitant·es des ruralités : les oublié·es du développement économique","md":"**Les habitant·es des ruralités : les oublié·es du développement économique**"},{"kind":"texte","text":"Fermeture des services publics, désertion des centres-villes et centres-bourgs, disparition des commerces de proximité et des lieux de vie, abandon des agriculteur·rices et des petites entreprises fragilisées par la concurrence déloyale : voici les maux très concrets que subissent les populations et qui découlent des choix politiques des gouvernements successifs. Les conséquences se font particulièrement sentir dans les zones rurales et creusent le sentiment d’un abandon qui éloigne des conditions de vie du reste de la population. Cette logique se retrouve à toutes les étapes du quotidien et tout d’abord dans la santé. Si les déserts médicaux sont une réalité partagée par plus d’un tiers des Français·es, les populations rurales y sont particulièrement exposées. 70 % des personnes en ruralités ont ainsi renoncé à consulter un professionnel de santé faute de spécialistes à proximité raisonnable."},{"kind":"texte","text":"À cela s’ajoute la difficulté de se loger. D’un côté, des centres-villes et centres-bourgs en perte de vitesse économique connaissent une forte vacance immobilière liée au vieillissement du parc et aux coûts de rénovation élevés. D’autre part, certaines zones rurales ou périurbaines voient les prix de l’immobilier s’envoler avec l’arrivée de familles aisées, poussant au départ et reléguant toujours plus loin les classes moyennes et populaires qui ne peuvent plus se loger là où elles le souhaitent. Face aux biens invendables d’un côté et ceux inaccessibles de l’autre, de nouvelles zones pavillonnaires voient le jour, favorisant l’étalement urbain, éloignant toujours plus les populations des services publics et des lieux de vie."},{"kind":"texte","text":"En parallèle, le tissu productif rural s’affaiblit. En 2025, près de 70 000 entreprises ont fait défaut, notamment en raison de l’explosion des prix de l’énergie. Construction, artisanat, industrie, agriculture : les secteurs qui structurent les ruralités et les villes moyennes sont particulièrement touchés. Derrière ces fermetures, suppressions d’activités et défaillances, ce sont des emplois, des savoir-faire et des pans entiers de l’économie locale qui disparaissent. Ce délitement est accompagné par la fermeture des commerces de proximité. La réalité est implacable : en 2021, plus de 21 000 communes rurales, soit 62 % d’entre elles, ne disposaient d’aucun commerce, contre 25 % en 1980. Cette désertion des centres-villes et bourgs au profit de grosses zones d’activités commerciales a fait disparaître les anciens lieux de vie pour leur substituer des lieux de consommation uniformisés et bien moins accessibles."},{"kind":"texte","text":"L’éloignement entre lieux de vie et lieux d’activité entraîne ainsi un recours toujours plus accru à la voiture, rendant les populations rurales particulièrement vulnérables aux crises inflationnistes énergétiques. 13,5 % des Français habitant en zones rurales qui ont une voiture consacrent plus d’un mois de revenu annuel en carburant. Cette proportion ne dépasse pas 9 % en milieu urbain. La surexposition aux crises énergétiques y est d’autant plus violente que les transports en commun sont progressivement supprimés. Et ceux restant manquent d’investissements pour les maintenir. La voiture individuelle est donc aussi incontournable que pesante pour une grande partie des actes du quotidien : travailler, se soigner, faire ses courses ou encore accompagner ses enfants."},{"kind":"texte","text":"Faire face au changement climatique","md":"**Faire face au changement climatique**"},{"kind":"texte","text":"Les bouleversements écologiques récents ont particulièrement touché les ruralités. Les sécheresses, les incendies, l’épuisement des ressources en eau, la dégradation des sols et l’effondrement de la biodiversité y sont tous visibles. Tous sont les conséquences d’un modèle prédateur fondé sur l’exploitation toujours plus intensive des ressources et de la nature."},{"kind":"texte","text":"Pourtant, les ruralités regorgent de ressources naturelles (eau, forêts, terres agricoles, biodiversité) et sont le berceau de nombreuses initiatives en faveur de la bifurcation écologique. Celles-ci dépendent cependant souvent de choix individuels et locaux. Faute d’ambition et de planification nationale, bon nombre d’entre elles ne peuvent voir le jour, que ce soit par manque de moyens financiers, matériels ou humains. Beaucoup d’élu·es se retrouvent désorienté·es devant la confusion des niveaux d’administrations, la logique de compétition des appels d’offres et ne trouvent pas d’interlocuteurs pour les aider."},{"kind":"texte","text":"L’Agenda rural de 2019 avait pourtant fait de l’accompagnement en ingénierie l’une de ses priorités. La création de l’Agence nationale de la cohésion des territoires (ANCT), chargée notamment d’accompagner les collectivités, devait renforcer cette capacité d’action. Mais l’insuffisance de ces dispositifs et leur logique de mise en concurrence des communes se montrent incapables de faire face à l’ampleur des besoins."},{"kind":"texte","text":"L’offensive réactionnaire contre les ruralités","md":"**L’offensive réactionnaire contre les ruralités**"},{"kind":"texte","text":"Face à ces nombreuses difficultés, l’extrême droite cherche à construire un récit étriqué et nostalgique, masquant la dureté des politiques néolibérales. D’ailleurs elle soutient ces orientations au Parlement européen et à l’Assemblée nationale. Elle mène une véritable bataille culturelle pour imposer son récit des ruralités. Autour de réseaux d’influence, de médias, d’événements festifs ou de prétendues célébrations du « terroir », elle cherche à imposer une représentation fantasmée des campagnes : une France rurale uniforme et nostalgique, attachée à un ordre social présenté comme menacé par l’immigration, l’émancipation des femmes, la visibilité des personnes LGBTI et, plus largement, par les transformations de la société française. Les onéreux banquets du Canon français, liés à l’écosystème de Pierre-Édouard Stérin, illustrent cette tentative d’investir les imaginaires populaires et ruraux pour diffuser une vision identitaire et réactionnaire de la France, à rebours des festivités populaires qui structurent encore de nombreuses communes grâce aux associations locales."}]},{"title":"II. Notre stratégie : reconstruire l’autonomie et garantir l’égalité des populations","depth":1,"path":["II. Notre stratégie : reconstruire l’autonomie et garantir l’égalité des populations"],"blocks":[{"kind":"texte","text":"À cette France fantasmée et à ces inégalités de traitement, nous voulons opposer un autre avenir partagé : celui des habitant·es des ruralités qui refusent cet abandon et se mobilisent pour vivre dans des campagnes solidaires et préservées. Cette Nouvelle France rurale existe et veut s’épanouir."},{"kind":"texte","text":"Les campagnes d’aujourd’hui n’ont rien d’un monde figé. Elles sont à l’image de la Nouvelle France. Les plus exposé·es aux violences sociales vécues dans les ruralités sont les mêmes que partout en France : les classes populaires, les femmes, les enfants, les jeunes, les familles monoparentales, les personnes âgées, en situation de handicap ou LGBTI."},{"kind":"texte","text":"Cette Nouvelle France rurale ne demande pas à revenir en arrière. Des luttes contre les fermetures de classes, de gares, de services hospitaliers ou de bureaux de poste aux mobilisations pour préserver l’eau, les forêts et les terres agricoles : les populations ne se résignent pas et agissent pour préserver leurs conditions de vie. Elles s’organisent, inventent des solidarités et cherchent à reprendre prise sur leur avenir. La mobilisation des Gilets Jaunes entre 2018 et 2019 nous rappelle que la colère populaire est un moteur extraordinaire pour recréer solidarité et désir d’un avenir meilleur."},{"kind":"texte","text":"Dans le même temps, de nombreuses initiatives pour s’adapter et construire d’autres façons de produire, de se déplacer, de se nourrir, d’habiter et de faire vivre les communes émergent dans les campagnes. Des collectivités, des associations, des agriculteur·rices et des collectifs citoyens expérimentent des solutions concrètes."},{"kind":"texte","text":"C’est à partir de cette capacité d’agir que nous voulons reconstruire l’égalité. Elle ne peut pas être une promesse abstraite, elle doit se traduire dans la vie quotidienne. Notre méthode repose sur trois leviers complémentaires."},{"kind":"texte","text":"Redonner aux communes le pouvoir d’agir","md":"**Redonner aux communes le pouvoir d’agir**"},{"kind":"texte","text":"Les communes sont le premier échelon de la République. Elles doivent retrouver les moyens humains, financiers et démocratiques pour agir. Nous renforcerons leur libre administration et leur capacité à répondre aux besoins de la population, en leur donnant la possibilité d’assurer leurs missions et de porter leurs propres projets."},{"kind":"texte","text":"Faire des ruralités des actrices de la bifurcation écologique","md":"**Faire des ruralités des actrices de la bifurcation écologique**"},{"kind":"texte","text":"Le changement climatique n’attend pas et nous oblige à bifurquer sans délai. La planification écologique ne pourra pas réussir si elle est vécue comme une succession de contraintes imposées aux populations. Pour nous il s’agit au contraire d’un projet collectif dont l’objectif permet de mieux vivre en protégeant et en valorisant les biens communs. Il s’agit de cette façon de relocaliser les activités essentielles, rapprocher l’emploi, la production et les ressources des lieux de vie."},{"kind":"texte","text":"Reconstruire la proximité et relocaliser l’emploi et la production","md":"**Reconstruire la proximité et relocaliser l’emploi et la production**"},{"kind":"texte","text":"Nous reconstruirons une proximité aujourd’hui fragilisée, en rapprochant les services essentiels des populations et en garantissant leur accessibilité. Vivre en ruralités suppose aussi de pouvoir y travailler. Nous rapprocherons l’emploi, la production et les ressources des lieux de vie. Cela passera par la relocalisation des activités grâce à la planification écologique. Elle permettra visibilité et stabilité des aides pour le soutien à l’industrie, à l’artisanat, notamment dans le cadre des initiatives d’économie circulaire et de l’économie sociale et solidaire. Mais aussi par une transformation de nos modèles agricoles et la reconstruction du maillage des commerces de distribution ."}]},{"title":"III. Comment nous allons garantir l’égalité pour des ruralités où il fait bon vivre","depth":1,"path":["III. Comment nous allons garantir l’égalité pour des ruralités où il fait bon vivre"],"blocks":[]},{"title":"1. Nos mesures prioritaires","depth":2,"path":["III. Comment nous allons garantir l’égalité pour des ruralités où il fait bon vivre","1. Nos mesures prioritaires"],"blocks":[]},{"title":"1.1 Pour redonner aux campagnes et aux villes moyennes le pouvoir de décider","depth":3,"path":["III. Comment nous allons garantir l’égalité pour des ruralités où il fait bon vivre","1. Nos mesures prioritaires","1.1 Pour redonner aux campagnes et aux villes moyennes le pouvoir de décider"],"blocks":[{"kind":"texte","text":"Les campagnes et les villes moyennes représentent 88 % des communes du pays. Elles ne sont ni condamnées au déclin, ni à la relégation. Des millions de personnes aspirent à pouvoir vivre, travailler et vieillir en ruralité. Mais les politiques libérales menées par les gouvernements Macron désorganisent des communes toujours plus fragilisées. Les budgets communaux connaissent des coupes importantes du fait des choix néolibéraux, et les élus locaux ne s’y retrouvent plus. De la loi NOTRe (qui a créé les métropoles, l’intercommunalité obligatoire et les grandes régions) à la loi 3DS (qui a introduit le principe de différenciation), de l’inégale répartition des dotations à la suppression de la taxe d’habitation, chacune de ces décisions a réduit l’autonomie fiscale et la capacité d’investissement des communes, renforçant leur dépendance vis-à-vis du gouvernement et des banques privées."},{"kind":"texte","text":"Refaire des communes la cellule de base de la démocratie locale","md":"**Refaire des communes la cellule de base de la démocratie locale**"},{"kind":"texte","text":"Nous rétablirons les communes comme cellules de base de notre démocratie. Cela suppose de leur rendre leur autonomie et leurs pouvoirs de décision, et de les doter enfin des moyens dont elles ont besoin."},{"kind":"puce","text":"Supprimer les métropoles technocratiques en abrogeant les lois ayant organisé la concentration des pouvoirs locaux, et restituer aux communes leur libre choix d’association","depth":0,"id":"PT-RURALITE-L001"},{"kind":"puce","text":"Refuser les fusions forcées de communes","depth":0,"id":"PT-RURALITE-L002"},{"kind":"puce","text":"Mettre fin à la concentration excessive des pouvoirs dans les mains des préfets et redonner les moyens de leur action autonome aux administrations déconcentrées","depth":0,"id":"PT-RURALITE-L003"},{"kind":"texte","text":"Donner aux communes les moyens d’agir et aux élu·es les moyens d’exercer leur mandat","md":"**Donner aux communes les moyens d’agir et aux élu·es les moyens d’exercer leur mandat**"},{"kind":"texte","text":"L’État doit garantir l’égal financement des communes où qu’elles soient. Le système des dotations sera revu et équilibré afin que chaque commune reçoive sa juste part."},{"kind":"tableau","text":"La dotation globale de fonctionnement (DGF), c’est quoi ? La DGF est un concours financier de l’État au budget des collectivités territoriales (commune, communauté de communes ou établissement public de coopération intercommunale, département, région). C’est la principale enveloppe fournie par l’État aux collectivités territoriales pour leur fonctionnement. Elle est globale et libre d’emploi et vise à compenser les charges supportées par les collectivités.","rows":[["La dotation globale de fonctionnement (DGF), c’est quoi ? La DGF est un concours financier de l’État au budget des collectivités territoriales (commune, communauté de communes ou établissement public de coopération intercommunale, département, région). C’est la principale enveloppe fournie par l’État aux collectivités territoriales pour leur fonctionnement. Elle est globale et libre d’emploi et vise à compenser les charges supportées par les collectivités."]]},{"kind":"texte","text":"Une de nos premières missions sera d’augmenter les moyens des communes et de rendre leur financement plus juste. Pour cela, nous voulons :"},{"kind":"puce","text":"Rééquilibrer la dotation globale de fonctionnement (DGF) versée aux communes pour lutter contre les inégalités territoriales et l’indexer sur l’inflation","depth":0,"id":"PT-RURALITE-L004"},{"kind":"puce","text":"Préserver et augmenter l’enveloppe de dotation aux équipements des territoires ruraux","depth":0,"id":"PT-RURALITE-L005"},{"kind":"puce","text":"Augmenter l’enveloppe budgétaire des communes rurales par la création d’un fonds de soutien communal notamment pour recruter et revaloriser les agent·es","depth":0,"id":"PT-RURALITE-L006"},{"kind":"puce","text":"Rétablir une taxation locale selon un barème tenant compte des revenus et des commodités des logements","depth":0,"id":"PT-RURALITE-L007"},{"kind":"puce","text":"Revenir à une ingénierie publique gratuite pour les petites communes, notamment en préservant les Conseils d’architecture, d’urbanisme et de l’environnement (CAUE) de la logique marchande et en rétablissant l’instruction gratuite des permis de construire","depth":0,"id":"PT-RURALITE-L008"},{"kind":"puce","text":"Réformer la fiscalité sur les logements vacants par une taxe unique et progressive selon le nombre de logements vacants détenus","depth":0,"id":"PT-RURALITE-L009"},{"kind":"texte","text":"Nous mettrons également en place un véritable statut de l’élu permettant à chacun·e de pouvoir s’investir pleinement dans sa mission au service de toutes et tous."},{"kind":"puce","text":"Aller plus loin que la loi du 22 décembre 2025 portant la création d’un statut de l’élu local, en garantissant le plein maintien des droits sociaux, des trimestres pour le calcul de la retraite et une formation continue réellement accessible. Et bien sûr, il s’agit de garantir aussi une protection effective contre les violences, les menaces et les pressions liées à l’exercice du mandat","depth":0,"id":"PT-RURALITE-L010"},{"kind":"puce","text":"Garantir que les indemnités des élu·es locaux·ales tiennent compte du temps de travail réel et des responsabilités exercées","depth":0,"id":"PT-RURALITE-L011"},{"kind":"puce","text":"Imposer la parité dans les exécutifs municipaux et communautaires, maire et premier·ère adjoint·e, présidence et vice-présidences, sans exception","depth":0,"id":"PT-RURALITE-L012"},{"kind":"puce","text":"Augmenter l’implication citoyenne dans le développement et la mise en œuvre des politiques locales, en étant attentif au nombre de participant·es et à leur diversité","depth":0,"id":"PT-RURALITE-L013"}]},{"title":"1.2 Pour assurer la planification écologique","depth":3,"path":["III. Comment nous allons garantir l’égalité pour des ruralités où il fait bon vivre","1. Nos mesures prioritaires","1.2 Pour assurer la planification écologique"],"blocks":[{"kind":"texte","text":"Les campagnes sont bouleversées par le changement climatique et ses phénomènes extrêmes (incendies, sécheresses, inondations…). Elles sont aussi au cœur des conflits d’accaparement de l’eau, des terres et des ressources naturelles. Nous y engagerons la planification écologique pour rapprocher l’emploi des lieux de vie dans le respect de la règle verte : ne pas prendre à la nature davantage qu’elle ne peut donner."},{"kind":"texte","text":"Cette planification doit transformer nos modes de production et de consommation, permettre la maîtrise publique du foncier agricole, forestier et énergétique, et garantir que les communs restent sous le contrôle démocratique plutôt que d’être livrés aux intérêts privés."},{"kind":"texte","text":"Ces politiques seront notamment mises en œuvre par les éco-régions que nous créerons pour remplacer les régions actuelles, délimitées en cohérence avec les caractéristiques écologiques (bassins versants, façades maritimes, massifs montagneux, etc.). L’organisation de l’État se mettra ainsi au service prioritaire de la planification écologique en :"},{"kind":"puce","text":"Instaurant un droit de préemption des communes sur les zones stratégiques pour la planification écologique dans les plans locaux d’urbanisme (carrières, énergies renouvelables, protection des forêts)","depth":0,"id":"PT-RURALITE-L014"},{"kind":"puce","text":"Mettant en place des défenseurs de la nature, chargés de la protection de l’eau, l’air, la forêt, la végétalisation et la perméabilité des sols","depth":0,"id":"PT-RURALITE-L015"},{"kind":"puce","text":"Renforçant les moyens humains et financiers de l’ingénierie publique pour appuyer les collectivités dans une planification écologique régénérative (restauration des trames vertes et bleues, et développement des énergies renouvelables)","depth":0,"id":"PT-RURALITE-L016"},{"kind":"texte","text":"Nous reprendrons la main sur nos ressources et nos sous-sols en :"},{"kind":"puce","text":"Adaptant les zones habitées au changement climatique notamment en désimperméabilisant les sols et en créant des îlots et corridors de fraîcheur","depth":0,"id":"PT-RURALITE-L017"},{"kind":"puce","text":"Mettant en place un plan de protection généralisée du foncier agricole, forestier et naturel en vue de mettre en œuvre le zéro artificialisation nette (ZAN) des sols en Hexagone","depth":0,"id":"PT-RURALITE-L018"},{"kind":"puce","text":"Garantissant une gestion publique et démocratique de l’eau et en priorisant les usages domestiques et agricoles nourriciers en cas de tension sur la ressource","depth":0,"id":"PT-RURALITE-L019"},{"kind":"puce","text":"Sanctuarisant les forêts face aux pressions de surexploitation et de privatisation des forêts publiques et en soutenant une gestion forestière à couvert continu et diversifié associant les communes forestières et les propriétaires","depth":0,"id":"PT-RURALITE-L020"},{"kind":"texte","text":"Enfin, une politique de l’habitat est primordiale pour permettre à toutes celles et ceux qui le souhaitent de bien vivre en ruralités : planifier la réhabilitation de logements vacants, mettre en œuvre un plan de financement massif des projets de rénovation écologique de l’habitat, construire massivement des logements publics. Nous prendrons donc les mesures suivantes :"},{"kind":"puce","text":"Refaire l’isolation d’au moins 700 000 logements par an","depth":0,"id":"PT-RURALITE-L021"},{"kind":"puce","text":"Se doter d’un service public ambitieux en charge de la planification, du financement, de l’organisation de la rénovation énergétique pour mettre fin prioritairement aux situations de précarité énergétique","depth":0,"id":"PT-RURALITE-L022"},{"kind":"puce","text":"Remplacer progressivement tous les chauffages au fioul et au gaz fossile par des systèmes n’émettant pas de gaz à effet de serre comme des pompes à chaleur et la géothermie","depth":0,"id":"PT-RURALITE-L023"},{"kind":"puce","text":"Se donner les moyens de la rénovation énergétique. Pour cela nous mettrons en place un « guichet unique » public pour les propriétaires et nous développerons les formations aux métiers de la rénovation et de l’adaptation des bâtiments en créant une filière globale du CAP à la licence professionnelle","depth":0,"id":"PT-RURALITE-L024"}]},{"title":"1.3 Pour rompre l’isolement et rétablir une vie en société","depth":3,"path":["III. Comment nous allons garantir l’égalité pour des ruralités où il fait bon vivre","1. Nos mesures prioritaires","1.3 Pour rompre l’isolement et rétablir une vie en société"],"blocks":[{"kind":"texte","text":"L’éloignement des services, la dispersion de l’habitat et le vieillissement de la population peuvent renforcer la solitude dans les ruralités. Personnes âgées privées de lien après le départ de leurs enfants, agriculteur·rices isolé·es sur leur exploitation, nouveaux et nouvelles arrivant·es sans réseau affectif, jeunes sans lieu pour se retrouver : cette situation n’est pas une fatalité, elle est le résultat du néolibéralisme qui a organisé la destruction des infrastructures communes, des services publics et des espaces solidaires de proximité. Nous voulons y remédier en recréant des liens, des lieux de sociabilité et des services accessibles au plus près des habitant·es."},{"kind":"texte","text":"Le gouvernement insoumis se chargera de :"},{"kind":"puce","text":"Mettre en œuvre un vaste plan de redéploiement des espaces de gratuité au service des liens sociaux et affectifs","depth":0,"id":"PT-RURALITE-L025"},{"kind":"puce","text":"Créer un plan national de lutte contre l’isolement des personnes âgées ou dépendantes en zone rurale, en développant les visites à domicile et en soutenant les réseaux de veille et de solidarité de voisinage","depth":0,"id":"PT-RURALITE-L026"},{"kind":"puce","text":"Renforcer les dispositifs d’écoute et de prévention destinés aux agriculteur·rices, en s’appuyant sur les associations dans le domaine, et développer les visites de convivialité entre pairs pour les exploitant·es isolé·es","depth":0,"id":"PT-RURALITE-L027"},{"kind":"puce","text":"Soutenir les associations locales. Assurer le développement des lieux intergénérationnels et des cafés associatifs. Mais aussi organiser des dispositifs itinérants, dans les communes dépourvues de lieu de sociabilité, pour recréer des espaces de rencontre, notamment pour les jeunes","depth":0,"id":"PT-RURALITE-L028"},{"kind":"texte","text":"Le sport, la culture et la vie associative sont des leviers majeurs d’émancipation et de construction de soi, notamment pour la jeunesse. Ils sont parfois le seul lien social. Il s’agira de les faire vivre pleinement, afin de créer des nouveaux espaces d’épanouissement :"},{"kind":"puce","text":"Entretenir le développement et la pérennité du réseau associatif local en garantissant les subventions, en généralisant les conventions pluriannuelles. Il est temps de sortir de la logique bureaucratique des appels à projets","depth":0,"id":"PT-RURALITE-L029"},{"kind":"puce","text":"Créer ou rénover des espaces jeunesse de proximité (maisons des jeunes, foyers ruraux, auberges de jeunesse, espaces ados), avec des animateur·rices dédié·es et des horaires adaptés aux week-ends et vacances scolaires","depth":0,"id":"PT-RURALITE-L030"},{"kind":"puce","text":"Favoriser l’accès des jeunes aux responsabilités au sein des associations en mobilisant le Fonds national de développement de la vie associative. L’objectif est de soutenir le renouvellement de l’engagement bénévole par la formation et la valorisation des compétences acquises","depth":0,"id":"PT-RURALITE-L031"},{"kind":"puce","text":"Encourager le déploiement dans le pays de lieux physiques (librairies indépendantes, cinémas avec un ou quelques écrans, scènes de spectacle vivant, salles de concerts, etc.) et accompagner la rénovation des lieux existants","depth":0,"id":"PT-RURALITE-L032"},{"kind":"puce","text":"Mettre en place un plan national d’urgence pour la construction et la rénovation des équipements sportifs, notamment des équipements publics de proximité favorables aux pratiques libres (piscines, salles d’escalade, salles de remise en forme, pistes de skate, etc.) et développer les transports pour y accéder","depth":0,"id":"PT-RURALITE-L033"},{"kind":"puce","text":"Développer une politique de la création artistique fondée sur le temps long, via un plan d’implantation et d’itinérance des artistes partout dans le pays, en s’appuyant notamment sur des médiathèques et bibliobus itinérants pour les communes dépourvues d’équipement fixe","md":"Développer une politique de la création artistique fondée sur le temps long, *via* un plan d’implantation et d’itinérance des artistes partout dans le pays, en s’appuyant notamment sur des médiathèques et bibliobus itinérants pour les communes dépourvues d’équipement fixe","depth":0,"id":"PT-RURALITE-L034"},{"kind":"puce","text":"Créer un fonds dédié à la sauvegarde du petit patrimoine rural et soutenir les chantiers participatifs associant habitant·es et associations de sauvegarde","depth":0,"id":"PT-RURALITE-L035"},{"kind":"puce","text":"Soutenir les fêtes populaires et événements locaux qui font vivre le lien social rural (comices agricoles, fêtes de village), en résistance aux tentatives de récupération identitaire de ces moments par l’extrême droite","depth":0,"id":"PT-RURALITE-L036"}]},{"title":"2. Nos mesures pour en finir avec l’abandon et garantir l’égalité","depth":2,"path":["III. Comment nous allons garantir l’égalité pour des ruralités où il fait bon vivre","2. Nos mesures pour en finir avec l’abandon et garantir l’égalité"],"blocks":[]},{"title":"2.1 Pour rompre l’isolement et rétablir une vie en société","depth":3,"path":["III. Comment nous allons garantir l’égalité pour des ruralités où il fait bon vivre","2. Nos mesures pour en finir avec l’abandon et garantir l’égalité","2.1 Pour rompre l’isolement et rétablir une vie en société"],"blocks":[{"kind":"texte","text":"Vivre à la campagne ou dans une ville moyenne ne doit pas obliger à renoncer aux services essentiels. Nous voulons garantir à chaque habitant·e, où qu’il ou elle vive, un accès réel aux services publics, avec des lieux d’accueil physique, des agent·es disponibles et des solutions adaptées aux réalités des communes les plus isolées. Cela passera notamment par :"},{"kind":"puce","text":"Réaffirmer le rôle du département comme organisateur central de l’égalité territoriale en lui donnant les moyens nécessaires pour assurer le maillage des services publics essentiels","depth":0,"id":"PT-RURALITE-L037"},{"kind":"puce","text":"Rouvrir des guichets physiques dans les services publics et refuser le tout numérique qui prive de droits de nombreuses personnes, notamment les plus âgées","depth":0,"id":"PT-RURALITE-L038"},{"kind":"puce","text":"Organiser des états généraux des espaces ruraux pour proposer les moyens d’une véritable égalité territoriale notamment dans les services publics","depth":0,"id":"PT-RURALITE-L039"},{"kind":"puce","text":"Stopper les fermetures de services publics et mettre en place un plan de redéploiement pour les populations rurales et périurbaines : bureaux de poste, gares de proximité, hôpitaux et services de santé, écoles, palais de justice, Trésor public","depth":0,"id":"PT-RURALITE-L040"},{"kind":"puce","text":"Développer des services publics itinérants pour desservir les populations les plus isolées, comme le bus des services publics, qui regroupe le Trésor Public, la caisse primaire d’assurance maladie ou France Travail, en veillant à la confidentialité et à la qualité de l’accueil","depth":0,"id":"PT-RURALITE-L041"},{"kind":"texte","text":"L’égalité d’accès aux services publics doit se faire dès l’enfance. Pour les plus petits, nous souhaitons créer un service public de la petite enfance. En ruralités, celui-ci doit s’adapter aux contraintes et horaires des travailleur·euses. L’éloignement des crèches, écoles et solutions de garde frappe tout particulièrement les mères qui assurent 75 % des trajets d’accompagnement des enfants. Nous garantirons l’accès à une école publique laïque de proximité à toutes les familles. Nous redonnerons à l’école de la République la place qu’elle mérite, partout et pour toutes et tous en :"},{"kind":"puce","text":"Densifiant le maillage des établissements en zones rurales afin de limiter à 15 minutes les temps de transport scolaire","depth":0,"id":"PT-RURALITE-L042"},{"kind":"puce","text":"Maintenant les écoles à classe unique","depth":0,"id":"PT-RURALITE-L043"},{"kind":"puce","text":"Abrogeant les « conventions ruralité » qui conduisent à la fermeture ou au regroupement d’écoles de proximité éloignées des lieux de vie des enfants","depth":0,"id":"PT-RURALITE-L044"},{"kind":"puce","text":"Rendant les transports scolaires gratuits et accessibles à tous et toutes","depth":0,"id":"PT-RURALITE-L045"},{"kind":"puce","text":"Garantissant une offre éducative diversifiée dans les lycées ruraux, notamment via des options rares, enseignements spécifiques répartis sur plusieurs classes pour éviter toute ségrégation interne et favorisant les jumelages d’établissements entre urbains et ruraux pour élargir l’horizon social, culturel et géographique des élèves","md":"Garantissant une offre éducative diversifiée dans les lycées ruraux, notamment *via* des options rares, enseignements spécifiques répartis sur plusieurs classes pour éviter toute ségrégation interne et favorisant les jumelages d’établissements entre urbains et ruraux pour élargir l’horizon social, culturel et géographique des élèves","depth":0,"id":"PT-RURALITE-L046"},{"kind":"puce","text":"Construisant des lycées professionnels dotés d’équipements de qualité et en implantant des centres polytechniques professionnels dans les zones dépourvues d’offre diversifiée pour garantir un maillage de proximité et offrir de véritables choix d’orientation aux élèves","depth":0,"id":"PT-RURALITE-L047"},{"kind":"puce","text":"Rétablissant l’encadrement public de la création de centres de formation des apprentis (CFA)","depth":0,"id":"PT-RURALITE-L048"},{"kind":"puce","text":"Réinstaurant un service public national de l’orientation pour permettre à chaque jeune d’avoir l’information nécessaire pour choisir son avenir et en développant des forums métiers itinérants pour rapprocher les jeunes ruraux des filières et des entreprises locales","depth":0,"id":"PT-RURALITE-L049"},{"kind":"puce","text":"Ouvrant des places d’internat gratuites pour les élèves de la voie professionnelle et les apprenti·es sous statut scolaire, en donnant la priorité aux jeunes les plus éloigné·es de leurs établissements ou lieux d’apprentissage","depth":0,"id":"PT-RURALITE-L050"},{"kind":"texte","text":"Les politiques austéritaires ont sacrifié notre système de santé. Environ 6 millions de personnes n’ont pas de médecin traitant, dont une grande partie qui vit en milieu rural. Mettre fin aux déserts médicaux sera une des priorités du gouvernement insoumis qui aura pour objectif de :"},{"kind":"puce","text":"Garantir un service public de santé de proximité en rouvrant progressivement des services d’urgences, de maternités et des EHPAD publics assurant un service de santé public de proximité à moins de trente minutes de chaque Français·e","depth":0,"id":"PT-RURALITE-L051"},{"kind":"puce","text":"Actionner tous les leviers pour combattre les déserts médicaux : régulation de l’installation des médecins, recrutement de médecins publics, maillage du pays de centres de santé publics en exercice salarié et de maisons de santé pluriprofessionnelles, réouverture de pharmacies, etc.","depth":0,"id":"PT-RURALITE-L052"},{"kind":"puce","text":"Engager un plan pluriannuel de recrutement des professionnels du soin et du médico-social, revaloriser les métiers et les revenus","depth":0,"id":"PT-RURALITE-L053"},{"kind":"puce","text":"Construire un service public de la dépendance au service des personnes âgées, qu’elles vivent chez elles ou non et mettre en place un réseau d’équipes soignantes du soin à domicile","depth":0,"id":"PT-RURALITE-L054"},{"kind":"puce","text":"Renforcer le maillage territorial et les moyens des centres médico-psychologiques y compris spécialisés pour les enfants","depth":0,"id":"PT-RURALITE-L055"},{"kind":"texte","text":"Les habitant·es des ruralités sont par ailleurs particulièrement exposé·es aux pollutions qui touchent l’eau, l’air et les sols et qui sont la cause de maladies écologiques : 40 % des cancers sont évitables en agissant sur l’environnement. Nous instaurerons une zone tampon pour protéger les enfants des pesticides et polluants autour des habitations, des crèches, des écoles et des hôpitaux et adopterons un plan d’éradication des maladies chroniques liées à l’exposition aux pollutions (pesticides, radioactivité, amiante, produits chimiques, etc.)."}]},{"title":"2.2 Pour lutter contre les discriminations en ruralités","depth":3,"path":["III. Comment nous allons garantir l’égalité pour des ruralités où il fait bon vivre","2. Nos mesures pour en finir avec l’abandon et garantir l’égalité","2.2 Pour lutter contre les discriminations en ruralités"],"blocks":[{"kind":"texte","text":"En ce qui concerne la lutte contre les violences faites aux femmes, nous développerons des lieux de permanence et des solutions itinérantes pour les associations d’aide aux victimes, au sein de sites multi-accueils (mairies, lieux partagés) et en allant directement à la rencontre des femmes dans les ruralités. Nous tiendrons également l’engagement de création des nouvelles brigades de gendarmerie de proximité en zone rurale, aujourd’hui à l’arrêt, condition matérielle d’un accès de proximité au dépôt de plainte pour les victimes."},{"kind":"texte","text":"Nous assurerons en parallèle la formation des gendarmes et de l’intégralité des fonctionnaires au contact du public à l’accueil des victimes de violences sexuelles et discriminatoires (racisme, LGBTIphobies, etc.), et encouragerons la nomination de personnes relais ou d’élu·es référent·es dans chaque équipe municipale."},{"kind":"texte","text":"Nous garantirons également l’accès aux droits sexuels et reproductifs. Nous permettrons à chaque personne d’avoir un accès effectif à l’IVG à proximité de son domicile, y compris via des consultations itinérantes. En ce qui concerne la procréation médicalement assistée (PMA), certaines personnes doivent parcourir des dizaines de kilomètres pour y avoir accès. Nous renforcerons le réseau des Centres d’étude et de conservation des œufs et du sperme humains qui conservent et attribuent les dons de sperme et d’ovocytes et développerons les consultations dans les hôpitaux de proximité.","md":"Nous garantirons également l’accès aux droits sexuels et reproductifs. Nous permettrons à chaque personne d’avoir un accès effectif à l’IVG à proximité de son domicile, y compris *via* des consultations itinérantes. En ce qui concerne la procréation médicalement assistée (PMA), certaines personnes doivent parcourir des dizaines de kilomètres pour y avoir accès. Nous renforcerons le réseau des Centres d’étude et de conservation des œufs et du sperme humains qui conservent et attribuent les dons de sperme et d’ovocytes et développerons les consultations dans les hôpitaux de proximité."},{"kind":"texte","text":"Nous sanctuariserons et renforcerons le financement public des centres de planification et d’éducation familiale (CPEF) et des antennes du Planning familial en milieu rural. Ils sont aujourd’hui menacés de fermeture faute de subventions, pour garantir partout un accueil anonyme et gratuit sur la contraception, la sexualité et les discriminations LGBTIphobes."},{"kind":"texte","text":"Nous nous assurerons également que les personnes en situation de handicap ne soient pas oubliées. Nous garantirons ainsi à toutes les personnes en situation de mobilité réduite, aux personnes âgées et handicapées l’accès à une solution de mobilité de proximité."}]},{"title":"2.3 Pour désenclaver et relier les campagnes","depth":3,"path":["III. Comment nous allons garantir l’égalité pour des ruralités où il fait bon vivre","2. Nos mesures pour en finir avec l’abandon et garantir l’égalité","2.3 Pour désenclaver et relier les campagnes"],"blocks":[{"kind":"texte","text":"L’impératif écologique nous oblige à transformer nos modes de déplacements et à reconstruire un véritable réseau de transports publics."},{"kind":"texte","text":"Nous créerons un pôle public des transports et de la mobilité pour reprendre la main sur les politiques de déplacement et nous maillerons tout le pays de transports publics interconnectés combinant trains, transports collectifs et vélos. L’application concrète de ces objectifs passera notamment par :"},{"kind":"puce","text":"La renationalisation de la SNCF et la fin de la mise en concurrence des lignes ferroviaires","depth":0,"id":"PT-RURALITE-L056"},{"kind":"puce","text":"La réouverture des lignes du quotidien en lien avec les éco-régions","depth":0,"id":"PT-RURALITE-L057"},{"kind":"puce","text":"L’augmentation du nombre et de la fréquence des trains, la mise en oeuvre des tarifs accessibles, ainsi que le maintien et la réimplantation des guichets physiques dans les gares","depth":0,"id":"PT-RURALITE-L058"},{"kind":"puce","text":"Le développement des usages partagés de la voiture (autopartage, covoiturage)","depth":0,"id":"PT-RURALITE-L059"},{"kind":"puce","text":"Le développement des transports publics à la demande hors des zones bien desservies","depth":0,"id":"PT-RURALITE-L060"},{"kind":"puce","text":"L’ouverture des transports scolaires à d’autres usager·es, y compris hors périodes scolaires, afin d’assurer une continuité de services publics de transport","depth":0,"id":"PT-RURALITE-L061"},{"kind":"puce","text":"L’utilisation de la commande publique et le leasing social (location longue durée et/ou avec option d’achat) pour diffuser les voitures électriques légères et à prix modeste","depth":0,"id":"PT-RURALITE-L062"},{"kind":"puce","text":"Le soutien aux garages solidaires ainsi qu’une aide suffisante à la réparation dans le cadre du contrôle technique","depth":0,"id":"PT-RURALITE-L063"},{"kind":"puce","text":"La redynamisation du fret ferroviaire, fluvial et maritime pour diminuer le nombre de camions sur les routes qui transportent les marchandises","depth":0,"id":"PT-RURALITE-L064"},{"kind":"texte","text":"Désenclaver les ruralités, c’est également en finir avec les zones blanches et les connexions capricieuses. Le numérique doit être un outil d’émancipation et d’égalité, pas une nouvelle source d’exclusion. Nous voulons garantir à toutes et tous un accès effectif à internet et aux services numériques, partout en France, y compris dans les communes rurales et de montagne. Mais l’égalité numérique ne se résume pas à disposer d’une connexion : elle suppose de pouvoir accéder également matériellement aux services publics, être accompagné·e et choisir la manière dont on échange avec l’administration. La dématérialisation doit donc rester une possibilité, jamais une obligation. Pour cela, voici les actions que nous entreprendrons :"},{"kind":"puce","text":"Achever la couverture numérique de tout le pays en fibre et garantir une couverture mobile de qualité dans toutes les ruralités, en déployant des réseaux de télécommunication sous contrôle public","depth":0,"id":"PT-RURALITE-L065"},{"kind":"puce","text":"Faire de l’accès à Internet un véritable service d’intérêt général en développant des infrastructures publiques d’accès (Wi-Fi gratuit dans les mairies, bibliothèques, gares, équipements publics, maisons France services) et des postes informatiques accessibles à toutes et tous","depth":0,"id":"PT-RURALITE-L066"},{"kind":"puce","text":"Garantir le maintien de l’accès aux guichets et à des formulaires papier en parallèle de la dématérialisation des services publics","depth":0,"id":"PT-RURALITE-L067"}]},{"title":"2.4 Pour travailler et entreprendre près de chez soi","depth":3,"path":["III. Comment nous allons garantir l’égalité pour des ruralités où il fait bon vivre","2. Nos mesures pour en finir avec l’abandon et garantir l’égalité","2.4 Pour travailler et entreprendre près de chez soi"],"blocks":[{"kind":"texte","text":"Travailler près de chez soi implique de rapprocher les lieux de travail des lieux de vie. Nous renforcerons le commerce de proximité face à la concurrence déloyale des grandes surfaces et du e-commerce, nous relocaliserons les activités industrielles essentielles et nous ferons la bifurcation de notre agriculture. C’est pourquoi le gouvernement insoumis :"},{"kind":"puce","text":"Encouragera l’installation des commerces de proximité dans les villages par un dispositif d’aides à l’installation, subventions d’investissement et de fonctionnement. Cela sera articulé avec le renforcement des prérogatives de la commission départementale d’aménagement commercial, et le prêt de locaux","depth":0,"id":"PT-RURALITE-L068"},{"kind":"puce","text":"Soutiendra le développement des commerces ambulants et des points multiservices (épicerie, poste, point relais, café) dans les communes dépourvues de commerce fixe","depth":0,"id":"PT-RURALITE-L069"},{"kind":"puce","text":"Refondera les critères permettant le développement de nouvelles grandes et moyennes surfaces (GMS) pour les soumettre aux objectifs de zéro artificialisation nette des sols et de préservation des petits commerces, tout en prenant en compte les GMS déjà existantes","depth":0,"id":"PT-RURALITE-L070"},{"kind":"puce","text":"Développera des lieux et espaces de travail partagés équipés des services nécessaires, pour mutualiser les outils de travail et rompre l’isolement des indépendant·es, créateur·rices d’entreprises, personnes en télétravail, etc.","depth":0,"id":"PT-RURALITE-L071"},{"kind":"puce","text":"Mettra en place une garantie d’emploi : tout·e chômeur·se de longue durée pourra se voir proposer d’être embauché·e au moins au SMIC – revalorisé – dans un secteur utile","depth":0,"id":"PT-RURALITE-L072"},{"kind":"puce","text":"Accompagnera et favorisera l’installation d’activités économiques locales via des structures publiques","md":"Accompagnera et favorisera l’installation d’activités économiques locales *via* des structures publiques","depth":0,"id":"PT-RURALITE-L073"},{"kind":"texte","text":"Si l’imaginaire collectif associe volontiers industrialisation et urbanisation, l’espace rural est pourtant, historiquement, profondément marqué par l’industrie. Ce maillage industriel a porté le développement économique et social de nombreuses communes, aujourd’hui fragilisées par les grandes vagues de désindustrialisation, aggravées par les quinquennats Macron. Des milliers de familles voient leur vie bouleversée par les plans sociaux et les délocalisations. Nous relocaliserons les productions essentielles à la vie de notre pays et investirons dans de grands chantiers créateurs d’emplois, en partant des besoins écologiques et sociaux du pays. Un de ces chantiers sera la construction et la rénovation des bâtiments, enjeu crucial des ruralités. À cette ambition s’ajoute le développement des entreprises de l’économie sociale et solidaire, alternative à l’économie libérale et inscrite dans un nouveau pacte productif. Nous y arriverons notamment par :"},{"kind":"puce","text":"La relocalisation et la reconquête de la maîtrise de secteurs industriels stratégiques pour la bifurcation écologique en sanctuarisant nos industries et nos savoir-faire","depth":0,"id":"PT-RURALITE-L074"},{"kind":"puce","text":"L’encouragement de la commande publique au niveau local en modifiant le code des marchés publics pour que les collectivités puissent émettre des appels d’offres adaptés aux filières locales","depth":0,"id":"PT-RURALITE-L075"},{"kind":"puce","text":"Le conditionnement des aides aux entreprises à des critères de localisation dans les territoires fragiles et de maintien des emplois","depth":0,"id":"PT-RURALITE-L076"},{"kind":"puce","text":"Le soutien actif aux entreprises de l’économie sociale et solidaire, afin de répondre aux besoins de commerces et de services marchands de proximité","depth":0,"id":"PT-RURALITE-L077"},{"kind":"puce","text":"Le soutien à la création et la reprise d’entreprises en coopératives (sociétés coopératives d’intérêt collectif et sociétés coopératives et participatives) pour sauver des emplois menacés par des fermetures ou des défaillances d’entreprises","depth":0,"id":"PT-RURALITE-L078"},{"kind":"texte","text":"La relocalisation de notre agriculture et sa bifurcation vers un modèle paysan créeront des milliers d’emplois. C’est dans les ruralités que se trouvent les forces vives de cette tâche majeure dans le cadre de la planification écologique. L’essor de ce modèle paysan et le soutien aux petites industries agroalimentaires nécessitent l’appui de l’État pour pouvoir s’exercer dans les conditions nécessaires :"},{"kind":"puce","text":"Appuyer le développemen
