ratique. Ainsi, une partie de l’argent des ménages sera réorientée, de façon non contraignante, vers des productions utiles à la Nation. La proposition de pôle public bancaire figure dans le programme de la France insoumise depuis sa création, mais sa nécessité est encore plus grande dans le contexte actuel. Nous exposons notre projet, que nous mettrons en place dès la première année."}]},{"title":"Page 7","depth":1,"path":["Page 7"],"blocks":[{"kind":"texte","text":"Pour un pôle public bancaire au service des besoins"},{"kind":"texte","text":"1. Un « pôle financier public » macroniste avec peu de moyens et soumis aux marchés En 2019, la loi Pacte a créé un « pôle financier public », rapprochant des institutions plus ou moins anciennes, toutes sous contrôle public : la Caisse des Dépôts et consignations (CDC), la Banque publique d’investissement (Bpifrance), qui finance des entreprises et fonds d’investissement, la Société de financement local (SFIL), qui est une banque publique finançant des collectivités locales ou des hôpitaux, la Banque postale, qui est une banque publique généraliste, et CNP Assurances, qui est sa compagnie d’assurance publique. C’est la CDC, établissement public, qui contrôle l’ensemble et détient avec l’État toutes les autres institutions du pôle. Le bilan de la CDC s’élève en 2025 à 1 400 Md€ comprenant (1) le Fonds d’épargne, (2) les bilans de la Banque postale et de la CNP, de la BPI et de la SFIL. Le Fonds d’épargne est constitué de l’épargne des ménages placée sur les livrets réglementés : le livret A et des livrets moins utilisés, les livrets LDDS, LEP et Jeune. En tout, ce sont 700 Md€ d’épargne qui sont collectés. Mais seuls 60 %, soit 400 Md€, sont centralisés dans le pôle financier public : 40 % de cette épargne reste dans les mains des banques commerciales privées (BNP Paribas, Crédit agricole, BPCE, Société générale, etc.). Les banques commerciales sont censées financer, avec cette épargne, les PME, la transition écologique et l’économie sociale et solidaire, mais cette consigne n’est pas un engagement contraignant et reste sans contrôle ni sanction. Ainsi, ce sont seulement 400 Md€, soit 6 % de l’épargne financière des ménages français (6 500 Md€), dont la puissance publique dispose pour financer des activités d’intérêt général. Notre objectif est d’augmenter significativement ce taux, d’autant plus que l’épargne est historiquement élevée en France."}]},{"title":"Page 8","depth":1,"path":["Page 8"],"blocks":[{"kind":"texte","text":"Pour un pôle public bancaire au service des besoins"},{"kind":"texte","text":"À quoi sert aujourd’hui l’épargne des Français·es ? En France, l’épargne se répartit ainsi :"},{"kind":"texte","text":"2 200 Md€ 2 200 Md€ 2 100 Md€"},{"kind":"texte","text":"en comptes et dépôts bancaires, dont 700 Md€ sur des livrets réglementés en assurance-vie et épargne retraite en actions d’entreprises, obligations, titres de créances, fonds immobiliers"},{"kind":"texte","text":"Les assurances-vie sont utilisées par 40 % des épargnants. Elles bénéficient d’avantages fiscaux considérables qui coûtent au contribuable sans que la puissance publique ne puisse en orienter l’usage. Elles financent par exemple aujourd’hui les énergies fossiles. Une moitié des dépôts de l’assurance-vie est placée hors de France."}]},{"title":"Page 9","depth":1,"path":["Page 9"],"blocks":[{"kind":"texte","text":"Pour un pôle public bancaire au service des besoins Avec ces ressources, le « pôle financier public » injecte actuellement 100 Md€ par an dans l’économie française : 29 Md€ pour la BPI, 43 Md€ pour la Banque des Territoires qui utilise le Fonds d’épargne, 14 Md€ pour la Banque postale, 9 Md€ pour la SFIL. Ce faisant, il finance l’économie française sous forme de prêts, de garanties et de prises de participation dans des entreprises. Ces montants sont estimatifs car les financements du « pôle financier public » restent opaques. Ainsi, la liste des financements effectués par la BPI n’a pu être reconstituée que grâce à la commission d’enquête parlementaire ! Les conclusions de sa rapporteure, Aurélie Trouvé, sont les suivantes : •"},{"kind":"texte","text":"Malgré des missions d’intérêt général, une grande partie des activités de ces institutions sont guidées par la rentabilité financière, sans choix public et démocratique d’allocation du capital. La loi Pacte précise d’ailleurs que ces institutions devront être gérées selon les « standards du marché » ;"},{"kind":"texte","text":"La BPI finance directement des activités nuisibles ou co-investit avec des fonds prédateurs, mais refuse de financer des entreprises essentielles pour notre souveraineté économique et nos besoins ;"},{"kind":"texte","text":"Les financements ne sont nullement adossés à une politique publique cohérente, encore moins à une planification, et ils sont sans pilotage démocratique : c’est un patchwork de fonds et de prêts au bon vouloir de leurs directeurs, sans réelle supervision du gouvernement ou du Parlement."},{"kind":"texte","text":"En ce qui concerne l’épargne collectée par les livrets réglementés, le bilan n’est pas non plus glorieux. Certes, le logement social et la transition écologique sont deux missions importantes. Mais c’est aussi le cas de plus en plus du nouveau nucléaire. Le président Macron a d’ailleurs déclaré que les nouveaux réacteurs « EPR » seront financés à hauteur de 60 % par le livret A. La Caisse des dépôts et consignations détenait encore fin 2025 près de 10 Md€ dans les énergies fossiles. Par exemple, elle possède 1,3 % du capital de Total, sans pour autant pouvoir peser sur les décisions de la multinationale."}]},{"title":"Page 10","depth":1,"path":["Page 10"],"blocks":[{"kind":"texte","text":"Pour un pôle public bancaire au service des besoins Ainsi, le « pôle financier public » constitue un bon point de départ, du fait des savoir-faire de ses 6 000 agents. Mais il comporte beaucoup d’écueils, reste soumis aux marchés et se comporte essentiellement comme une banque privée."},{"kind":"texte","text":"2. Notre proposition : le financement des besoins productifs"},{"kind":"texte","text":"Le pôle public bancaire est un engagement de longue date de la France insoumise. Il s’appuie sur de nombreux exemples dans l’histoire et dans le monde."},{"kind":"texte","text":"La maîtrise publique du financement de l’économie dans l’histoire et dans le monde Dans la période de l’après-guerre, la France a expérimenté une version maximale du pôle public bancaire. Un vaste secteur bancaire public et parapublic est constitué des quatre grandes banques de dépôt nationalisées, de la Caisse des dépôts, du Crédit national, du Crédit foncier, du Crédit agricole, des PTT et des comptes chèques postaux. Le Conseil national du crédit, le Fonds de développement économique et social et la Commission des investissements orientent l’investissement dans l’économie française vers les priorités du Plan. L’État joue lui-même le rôle de principale banque de l’économie et de la société, d’émetteur de monnaie, et de force d’orientation du crédit."}]},{"title":"Page 11","depth":1,"path":["Page 11"],"blocks":[{"kind":"texte","text":"Pour un pôle public bancaire au service des besoins"},{"kind":"texte","text":"En Allemagne, le choix a été fait en 2024-2025 d’augmenter drastiquement les investissements publics. Il faut distinguer plusieurs institutions. Le fonds spécial pour les infrastructures et la neutralité climatique est géré directement par l’État fédéral. Il doit dépenser 500 milliards d’euros en 12 ans, et en a déjà investi une cinquantaine depuis son lancement à l’automne 2025. La KfW est la banque publique historique allemande, elle est gérée le plus souvent au niveau des Länder. Ces dernières années, elle a augmenté ses engagements en Allemagne d’environ 40 milliards d’euros par rapport à la période pré-Covid."},{"kind":"texte","text":"L’objectif est de substituer à la logique de rentabilité financière une logique d’intérêt général : ce n’est plus de cibler des projets rentables selon les conditions du marché, mais d’orienter le capital vers les besoins définis dans la planification écologique, dans des investissements de long terme, parfois risqués mais nécessaires, qui ne sont pas financés (ou le sont à des conditions exorbitantes et de façon insuffisante) par les banques privées. Il s’agit notamment : •"},{"kind":"texte","text":"des productions nécessaires aux besoins humains : logement social (qui a été négligé ces dernières années) et rénovation énergétique, production de médicaments et santé, agriculture biologique, etc. ;"},{"kind":"texte","text":"de la reconversion d’entreprises industrielles fragilisées mais stratégiques (acier, automobile, textile…) ;"},{"kind":"texte","text":"des entreprises de l’économie sociale et solidaire et des TPE et PME ;"}]},{"title":"Page 12","depth":1,"path":["Page 12"],"blocks":[{"kind":"texte","text":"Pour un pôle public bancaire au service des besoins •"},{"kind":"texte","text":"des productions nécessaires à notre souveraineté : numérique, robotique, spatial, etc. ;"},{"kind":"texte","text":"des réseaux et transports (eau, route, ferroviaire, maritime…)."},{"kind":"texte","text":"Pour soutenir toutes ces productions, le pôle public bancaire proposera : •"},{"kind":"texte","text":"des prêts dont les conditions de taux, de durée et de frais varieront en fonction de l’adéquation des projets aux objectifs du plan et des besoins de l’emprunteur. Les conditions seront plus favorables pour les TPE et PME, les coopératives, les entreprises de l’économie sociale et solidaire (ESS), les collectivités locales et organismes publics ;"},{"kind":"texte","text":"des prises de participation dans des entreprises de secteurs stratégiques ;"},{"kind":"texte","text":"des achats d’obligations (émises par les collectivités, les infrastructures, éventuellement l’État) ;"},{"kind":"texte","text":"des garanties pour les prêts que ces entreprises contracteront auprès de banques privées."},{"kind":"texte","text":"Ses missions sont différentes de celles de l’État et de son budget : le pôle public bancaire doit rester à l’équilibre financier, ce qui signifie que les projets soutenus, qu’il s’agisse d’entreprises, de collectivités locales ou encore de bailleurs sociaux, puissent rembourser sur le long terme. Ainsi, les activités utiles mais sans revenus, comme la restauration d’une zone humide, ne relèvent pas de ses missions. Beaucoup d’autres activités comme les services publics ont vocation à rester financées par le budget de l’État. Le pôle public bancaire ne se substitue pas à d’autres moyens d’orienter l’activité économique dans le cadre budgétaire, comme les aides publiques conditionnées et ciblées. Ce pôle ne financera ni les activités polluantes ou inutiles, ni celles qui ont déjà les financements nécessaires, ni celles dont la puissance publique ne peut contrôler ou conditionner strictement les décisions prises, ni encore celles qui profitent essentiellement à de grandes fortunes."}]},{"title":"Page 13","depth":1,"path":["Page 13"],"blocks":[{"kind":"texte","text":"Pour un pôle public bancaire au service des besoins"},{"kind":"texte","text":"3. La réorientation de l’épargne française vers les activités utiles pour la Nation Les mécanismes de réorientation de l’épargne française seront tous non contraignants et toujours rémunérateurs pour les épargnants. Le pôle public bancaire s’appuiera d’abord sur les moyens financiers existants du pôle financier public, sans peser sur le budget de l’État. Il les augmentera de plusieurs façons : •"},{"kind":"texte","text":"par une utilisation renforcée des fonds de la SFIL, qui a des marges de manœuvre inexploitées1, ce qui permettra de débloquer 30 Md€ supplémentaires ;"},{"kind":"texte","text":"par une augmentation de la part de l’épargne collectée par les livrets réglementés reversée au pôle public bancaire : elle est actuellement de 60 %, nous la porterons à 80 %, ce qui permettra de drainer 140 Md€ supplémentaires ;"},{"kind":"texte","text":"par une augmentation du plafond du livret A de 23 000 à 30 000 € ce qui permettra de dégager d’emblée 40 Md€ supplémentaires2, ainsi que l’a luimême reconnu Olivier Sichel, directeur général de la CDC ;"},{"kind":"texte","text":"pour que les épargnants aient davantage recours au livret A et à l’ensemble des livrets réglementés, leur rémunération sera portée à un niveau au moins égal au taux d’inflation3. Actuellement, le taux d’intérêt du livret A est de 1,7 %, pour une inflation annuelle à 2,1 %, ce qui signifie que les petits épargnants perdent de l’argent à financer des projets d’intérêt général sur le livret A ! Il n’y a aucune raison qu’il en soit ainsi, alors que les grandes fortunes peuvent s’octroyer des taux de rémunération de 15 % dans les fonds d’investissement ;"},{"kind":"texte","text":"La SFIL a assaini progressivement sa situation héritée de l’ancienne banque Dexia et se retrouve maintenant dans une situation où elle pourrait supporter un niveau d’encours beaucoup plus important au regard de sa santé financière et des règles prudentielles"},{"kind":"texte","text":"Nous avons pris une fourchette haute de l’estimation d’Olivier Sichel, en comptant sur le fait qu’en plus, le taux de centralisation sera augmenté de 60 à 80%"},{"kind":"texte","text":"Pour éviter tout problème de financement du logement social, un système d’aides à la pierre permettra de compenser les surcoûts éventuels pour les bailleurs sociaux issus d’un relèvement du taux du livret A"}]},{"title":"Page 14","depth":1,"path":["Page 14"],"blocks":[{"kind":"texte","text":"Pour un pôle public bancaire au service des besoins •"},{"kind":"texte","text":"par la création d’un plan d’épargne de long terme (Livret B), adossé à un fonds public de production. Contrairement au livret A, l’épargne serait bloquée sur 3,5 ou 10 ans, et garantie à terme à un niveau supérieur à l’inflation. Comme les autres livrets réglementés, il bénéficiera d’une défiscalisation pour ses détenteurs. Ce plan d’épargne serait géré par Bpifrance."},{"kind":"texte","text":"par une création monétaire supplémentaire et en utilisant pleinement ses possibilités de refinancement auprès de la BCE, comme le font toutes les banques dans le cadre des traités. Ainsi, il faudra rechercher une moindre dépendance du pôle public bancaire aux marchés financiers en réduisant les obligations émises auprès d’eux."},{"kind":"texte","text":"L’objectif est que l’épargne drainée par le pôle public financier soit doublée, pour mobiliser non plus 6 % (soit 400 Md€) mais 12 % (soit 800 Md€) de l’épargne française, et que ses moyens globaux soient sensiblement augmentés, permettant d’injecter en moyenne non plus 100 Md€ mais 200 Md€ par an dans l’économie. Ces sommes doivent permettre de financer des plans d’investissements pour l’industrialisation écologique et de souveraineté."}]},{"title":"Page 15","depth":1,"path":["Page 15"],"blocks":[{"kind":"texte","text":"Pour un pôle public bancaire au service des besoins"},{"kind":"texte","text":"4. Pôle public bancaire : pour une refonte de la gouvernance Il s’agit de mettre le futur pôle public bancaire sous contrôle démocratique, puisqu’il est un outil de planification économique. Cependant, le pôle et ses différentes institutions conserveront leur statut actuel et ne deviendront pas des administrations publiques au sens de la comptabilité nationale. Le contrôle du Parlement sera néanmoins renforcé dans le sens du respect des objectifs du plan. Ce pôle public bancaire décidera enfin de l’ensemble de ses financements de façon cohérente entre toutes ses institutions. Pour cela, un conseil de coordination permanent entre elles sera créé, qui veillera à associer des représentants de l’État, des parlementaires de la majorité et de l’opposition, des salariés et du patronat, des usagers d’associations de consommateurs, des syndicats de l’ESS, des élus locaux, etc. Les décisions d’investissements prises dans les différentes institutions du pôle seront cohérentes avec les objectifs de la planification écologique nationale. Toute l’activité de financement sera rendue publique. Tout octroi ou refus de crédit à une entreprise sera motivé au regard de la grille de critères publiée, avec un recours possible devant la Médiation du crédit de la Banque de France."}]},{"title":"Page 16","depth":1,"path":["Page 16"],"blocks":[{"kind":"texte","text":"Pour un pôle public bancaire au service des besoins"}]}]}],"short":"Pôle public bancaire","content_sha256":"1b3eb5f204bfa83ad71c252cde7afc6c2be7c008fbbc5ebe8638b09b924167cb"},{"code":"DOC-COMPTES","kind":"pdf","title":"Comment nous allons remettre de l'ordre dans les comptes publics","url":"https://melenchon2027.fr/wp-content/uploads/2026/10/Comment-nous-allons-remettre-de-l-ordre-dans-les-comptes-publics.pdf","units":[{"code":"DOC-COMPTES","part":null,"title":"Comment nous allons remettre de l'ordre dans les comptes publics","url":"https://melenchon2027.fr/wp-content/uploads/2026/10/Comment-nous-allons-remettre-de-l-ordre-dans-les-comptes-publics.pdf","sections":[{"title":"Page 1","depth":1,"path":["Page 1"],"blocks":[{"kind":"texte","text":"Élection présidentielle - 18 avril 2027"},{"kind":"texte","text":"COMMENT NOUS ALLONS"},{"kind":"texte","text":"REMETTRE DE L'ORDRE DANS"},{"kind":"texte","text":"LES COMPTES PUBLICS"}]},{"title":"Page 3","depth":1,"path":["Page 3"],"blocks":[{"kind":"texte","text":"COMMENT NOUS ALLONS REMETTRE DE L’ORDRE DANS LES COMPTES PUBLICS"},{"kind":"texte","text":"1. RÉPONDRE AUX URGENCES Relancer l’activité par les revenus des classes populaires Répondre aux urgences en renforçant les services publics Enclencher la planification écologique Mettre en sécurité sociale"},{"kind":"texte","text":"8 8 9 10 11"},{"kind":"texte","text":"2. DÉGAGER LES RESSOURCES NÉCESSAIRES"},{"kind":"texte","text":"3. INVESTIR DANS L’ÉCONOMIE DES BESOINS"},{"kind":"texte","text":"STRATÉGIE DES COUPES BUDGÉTAIRES EST 4. LA UNE IMPASSE"},{"kind":"texte","text":"DE LA DÉPENDANCE AUX MARCHÉS 5. SORTIR FINANCIERS"}]},{"title":"Page 4","depth":1,"path":["Page 4"],"blocks":[{"kind":"texte","text":"Comment nous allons remettre de l’ordre dans les comptes publics"},{"kind":"texte","text":"Comment nous allons remettre de l’ordre dans les comptes publics La politique budgétaire menée par Macron depuis 2017 est une catastrophe. Il va laisser un pays avec 1 300 milliards d’euros de dette supplémentaire. Il a décidé de favoriser le capital financier en lui faisant des cadeaux fiscaux massifs et en baissant les salaires à son profit. Graphique - L’envolée de la dette sous les trois derniers présidents Année"},{"kind":"texte","text":"645"},{"kind":"texte","text":"Sarkozy : + 2007 – 2012 milliards"},{"kind":"texte","text":"358"},{"kind":"texte","text":"Hollande : + 2012 – 2017 milliards"},{"kind":"texte","text":"1 314"},{"kind":"texte","text":"Macron : + 2017 – 2026 milliards"},{"kind":"texte","text":"Dette publique, en milliards d’euros"},{"kind":"texte","text":"2007"},{"kind":"texte","text":"1 278"},{"kind":"texte","text":"2008"},{"kind":"texte","text":"1 331 1 562"},{"kind":"texte","text":"2009 2010"},{"kind":"texte","text":"1 731"},{"kind":"texte","text":"2011"},{"kind":"texte","text":"1 812"},{"kind":"texte","text":"2012"},{"kind":"texte","text":"1 923"},{"kind":"texte","text":"2013"},{"kind":"texte","text":"1 996"},{"kind":"texte","text":"2014"},{"kind":"texte","text":"2 068"},{"kind":"texte","text":"2015"},{"kind":"texte","text":"2 141"},{"kind":"texte","text":"2016"},{"kind":"texte","text":"2 218"},{"kind":"texte","text":"2017"},{"kind":"texte","text":"2 281"},{"kind":"texte","text":"2018"},{"kind":"texte","text":"2 305"},{"kind":"texte","text":"2019"},{"kind":"texte","text":"2 379 2 645"},{"kind":"texte","text":"2020"},{"kind":"texte","text":"2 775"},{"kind":"texte","text":"2021"},{"kind":"texte","text":"2 923"},{"kind":"texte","text":"2022"},{"kind":"texte","text":"3 056"},{"kind":"texte","text":"2023"},{"kind":"texte","text":"3 232"},{"kind":"texte","text":"2024"},{"kind":"texte","text":"3 417"},{"kind":"texte","text":"2025"},{"kind":"texte","text":"3 595"},{"kind":"texte","text":"2026"},{"kind":"texte","text":"L’objectif prétendu de cette politique était de dynamiser l’activité économique et la croissance. La stratégie du « ruissellement » est un échec cuisant. Tous les signaux économiques sont au rouge : un million de pauvres en plus, baisse du pouvoir d’achat, économie au bord de la récession, remontée du chômage, explosion du travail précaire et uberisé, baisse des investissements privés et de la productivité, record des défaillances d’entreprises, etc. En 2026, un seul chiffre bat des records : les dividendes, pour lesquels nous sommes champions d’Europe et vice-champions du monde derrière les États-Unis."}]},{"title":"Page 5","depth":1,"path":["Page 5"],"blocks":[{"kind":"texte","text":"Comment nous allons remettre de l’ordre dans les comptes publics Voilà où est principalement parti ce financement public d’un capital improductif qui nous coûte trop cher. Les macronistes donnent des leçons de rigueur budgétaire alors que ce sont précisément leurs politiques qui ont conduit à l’explosion du déficit public, bien au-delà de leurs prévisions. Les cadeaux au capital ont grevé les recettes de l’État et expliquent pour moitié le déficit actuel. Graphique - Évolution des dépenses, des recettes et du déficit sous Macron Dépenses"},{"kind":"texte","text":"Recettes"},{"kind":"texte","text":"Déficit"},{"kind":"texte","text":"Recettes maintenues au niveau de 2017"},{"kind":"texte","text":"en % du PIB"},{"kind":"texte","text":"61,7"},{"kind":"texte","text":"59,5"},{"kind":"texte","text":"58,4 58"},{"kind":"texte","text":"57,7 56,8"},{"kind":"texte","text":"56,4 56"},{"kind":"texte","text":"57,3"},{"kind":"texte","text":"55,3"},{"kind":"texte","text":"54,3"},{"kind":"texte","text":"2,9"},{"kind":"texte","text":"53,7 53"},{"kind":"texte","text":"52,8"},{"kind":"texte","text":"52,9 52,2 51,4"},{"kind":"texte","text":"51,2"},{"kind":"texte","text":"2023"},{"kind":"texte","text":"2024"},{"kind":"texte","text":"2017"},{"kind":"texte","text":"2018"},{"kind":"texte","text":"2019"},{"kind":"texte","text":"2020"},{"kind":"texte","text":"2021"},{"kind":"texte","text":"2022"},{"kind":"texte","text":"2025"},{"kind":"texte","text":"En France, si les recettes étaient restées au niveau de 2017, le déficit serait de 2,9 % du PIB au lieu de 5,1 %. Cette politique a aggravé la crise climatique et empêché la bifurcation écologique. Depuis deux ans, les budgets de l’écologie baissent alors qu’ils auraient dû augmenter par dizaines de milliards. Faute d’anticipation, la dette écologique ne cesse de s’alourdir et la facture se fait toujours plus onéreuse. Les effets du dérèglement climatique (canicule, incendies, sécheresse) ont coûté 16 milliards d’euros à la nation cette année. Nous aurions pu en atténuer les effets si, depuis dix ans, nous nous étions préparés davantage. Le pays a besoin de rompre avec cette politique. Toutes celles et tous ceux qui proposent la poursuite de la politique de l’offre et ses cadeaux fiscaux, ou veulent accélérer le rythme des coupes dans les dépenses sociales ou de services publics, nous enfoncent dans la crise. Le budget 2027 va ainsi aggraver la situation."}]},{"title":"Page 6","depth":1,"path":["Page 6"],"blocks":[{"kind":"texte","text":"Comment nous allons remettre de l’ordre dans les comptes publics Graphique - Comparaison de la croissance et du déficit public des principaux pays de la zone euro en 2025 et 2026 Croissance du PIB"},{"kind":"texte","text":"en %, pays classés par croissance décroissante en % du PIB"},{"kind":"texte","text":"Déficit public"},{"kind":"texte","text":"2025"},{"kind":"texte","text":"2026 2,8 %"},{"kind":"texte","text":"Espagne"},{"kind":"texte","text":"France"},{"kind":"texte","text":"Italie"},{"kind":"texte","text":"Allemagne"},{"kind":"texte","text":"2,5 %"},{"kind":"texte","text":"Espagne"},{"kind":"texte","text":"2,2 % 0,9 %"},{"kind":"texte","text":"Allemagne"},{"kind":"texte","text":"5,1 % 0,5 %"},{"kind":"texte","text":"Italie"},{"kind":"texte","text":"3,1 % 0,3 %"},{"kind":"texte","text":"France"},{"kind":"texte","text":"2,7 %"},{"kind":"texte","text":"2,1 % 1,3 % 3,7 % 0,8 % 2,9 % 0,4 % 5,4 %"},{"kind":"texte","text":"Nous devons au contraire relancer l’économie au plus vite par la consommation populaire, l’investissement productif, la bifurcation écologique et un partage des richesses du capital vers le travail. Les services publics et la Sécurité sociale sont l’armature de la nation française. Ils représentent des modèles de société alternatifs à la marchandisation généralisée. Il faut les renforcer, en commençant par revenir sur les dégâts d’une décennie de macronisme. Pour financer ces besoins, il est nécessaire de récupérer l’argent là où il s’est accumulé lors des deux derniers quinquennats : revenus du capital, ménages les plus fortunés et profits des grandes entreprises. Une partie de cette œuvre de justice fiscale devra être orientée vers la réduction de notre déficit du fait de sa situation déplorable. Elle permettra aussi de relancer l’économie, ce qui à terme aura un effet positif sur les finances publiques. Ainsi, nous proposons d’augmenter d’un peu plus de 100 milliards d’euros les recettes fiscales pour l’année prochaine – uniquement en faisant contribuer les plus riches. Les dépenses d’urgence que nous proposons pour les services publics, le pouvoir d’achat et la planification écologique représentent un peu plus de 80 milliards d’euros. Cette loi de finances, si elle était adoptée pour 2027, permettrait un ajustement de 25 milliards d’euros l’année prochaine, nous mettant sur une trajectoire crédible pour stabiliser notre dette par rapport au PIB en un quinquennat, à l’inverse de la politique macroniste. Ces ordres de grandeur, comparables à ce qui a déjà été fait pour sortir de réces-"}]},{"title":"Page 7","depth":1,"path":["Page 7"],"blocks":[{"kind":"texte","text":"Comment nous allons remettre de l’ordre dans les comptes publics sions, permettent d’effacer le bilan de la politique macroniste (plus de 63 milliards de pertes de recettes) et de faire contribuer le capital et les plus riches à la réduction du déficit et au financement des grands chantiers prioritaires. La clé pour l’amélioration de notre situation économique est la bifurcation écologique et sociale par la relance et l’investissement. Nous proposons donc la construction d’un pôle public bancaire issu d’une refonte du pôle public financier (Caisse des dépôts et consignations, Banque publique d’investissement, Banque postale, etc.). Celui-ci doit pouvoir, grâce à une réorientation de l’épargne non contraignante pour les ménages, financer les priorités de la planification sociale et écologique et restaurer notre souveraineté économique. 100 milliards d’euros de plus par an peuvent être mobilisés en investissements pour la planification écologique et notre souveraineté. L’effet de ces investissements publics dans le logement, les transports, l’énergie, l’industrialisation écologique, l’économie maritime et le numérique, combiné à la hausse du pouvoir d’achat des classes populaires et moyennes, devrait permettre à la France de connaître, dès l’année 2028, un regain d’activité économique et de redresser ses comptes. Ce document présente donc les grandes orientations budgétaires que la France insoumise propose pour l’année 2027. Il ne constitue pas un chiffrage complet du programme L’Avenir en Commun qui s’étalera sur plusieurs années."},{"kind":"texte","text":"Schéma - L’économie des besoins Augmentation des salaires"},{"kind":"texte","text":"Retour sur les cadeaux fiscaux de Macron et justice fiscale"},{"kind":"texte","text":"Investissements du pôle public bancaire"},{"kind":"texte","text":"Hausse des revenus et de la consommation populaire"},{"kind":"texte","text":"Investissements dans la planification écologique et les industries stratégiques"},{"kind":"texte","text":"Relance de l’économie, recettes fiscales supplémentaires"},{"kind":"texte","text":"Réduction du déficit public"},{"kind":"texte","text":"Réponse aux besoins"}]},{"title":"Page 8","depth":1,"path":["Page 8"],"blocks":[{"kind":"texte","text":"1 - Répondre aux urgences"},{"kind":"texte","text":"1 - Répondre aux urgences La logique d’un budget devrait être de répondre aux besoins de la population et du pays. Pendant dix ans, la macronie a fait l’inverse. Elle a mis l’élaboration du budget au service d’une politique de l’offre bénéficiant essentiellement aux riches et aux grands actionnaires. Par conséquent, elle a comprimé sans cesse les dépenses, appauvrissant le pays, ses infrastructures et ses services publics. Ce faisant, elle nous a entraînés dans une spirale récessive, particulièrement dangereuse. C’est elle qui nous enferme dans le piège de la dette, au moment où les taux d’intérêt remontent."},{"kind":"texte","text":"Relancer l’activité par les revenus des classes populaires Le plus urgent est de sortir la France de la récession qui aggrave sa situation financière. Le pouvoir d’achat des ménages baisse depuis deux années consécutives, ce qui est inédit depuis près d’un demi-siècle. Puisque la consommation des ménages représente la moitié du PIB français, il est logique que cela nous entraîne dans la récession. La loi de finances peut inverser la tendance en augmentant les revenus pour lesquels l’État est décisionnaire : en augmentant de 10% les fonctionnaires, dont le point d’indice a été gelé huit années sur dix durant les deux quinquennats d’Emmanuel Macron (17 milliards d’euros), en protégeant les milieux populaires et les familles de l’inflation, sur laquelle nous indexerons toutes les pensions, allocations familiales et APL, qui seront rehaussées de 10 % (8 milliards d’euros). Pour mettre un terme au logement trop cher, il faut relancer la construction de logements publics via un plan d’investissement. Il faut aussi résorber le mal-logement et le sans-abrisme immédiatement, en budgétant 3 milliards d’euros dans la création de logements d’urgence et la réquisition de logements vacants. De nouveaux droits sont également nécessaires, notamment au bénéfice de la génération mobilisée en ce mois d’octobre, dans le mouvement de jeunesse le plus important depuis mai 1968. Nous proposons d’avancer immédiatement vers la garantie d’autonomie pour les jeunes, qui financera leur réussite durant les études et la formation. Elle leur attribuera un pouvoir d’achat directement injecté dans leur consommation courante et les entreprises qui la fournissent. Son principe : plus aucun jeune ne doit vivre sous le seuil de pauvreté, fixé à 1 337 euros par mois, ce qui coûtera 9,5 milliards d’euros."}]},{"title":"Page 9","depth":1,"path":["Page 9"],"blocks":[{"kind":"texte","text":"1 - Répondre aux urgences Ces mesures d’urgence sociale doivent être complétées par une hausse du SMIC à 1 700 euros net. Cette hausse sera accompagnée de la convocation d’une conférence exceptionnelle sur les salaires et d’une indexation généralisée de ceux-ci sur l’inflation. Dans le cadre de l’état d’urgence sociale, un décret de blocage des prix du carburant sera pris pour ramener le prix à la pompe à 1,70 euro par litre. Toutes ces mesures sont indispensables pour empêcher des millions de personnes de sombrer dans la pauvreté. Elles sont la clé d’une stratégie pour empêcher le déclin économique et financier du pays en relançant l’activité. Ces dépenses sont donc essentielles pour nous mettre sur une trajectoire pluriannuelle stabilisant le ratio dette / PIB."},{"kind":"texte","text":"Répondre aux urgences en renforçant les services publics La mobilisation des lycées et des étudiants n’est pas que sectorielle. Elle traduit le refus du modèle de société qu’ont voulu nous imposer les 10 budgets de la macronie : celui d’une marchandisation générale par le démantèlement des services publics. Cette logique est bien connue : mettre en ruine l’école, l’université ou l’hôpital publics ouvre la voie à des services privés proposant éducation ou santé aux conditions du marché. Mais la nation française est construite autour de son État et de ses services publics. Ainsi, rompre avec leur démantèlement, c’est répondre aux causes profondes des crises sociale et politique que nous traversons. La société française a besoin de services publics puissants pour se stabiliser. L’augmentation du point d’indice des fonctionnaires déjà évoquée sera une première mesure importante puisqu’elle contribue à renforcer l’attraction de la fonction publique et de ses concours. À l’heure où de grands services publics comme l’Éducation nationale peinent à recruter, ce n’est pas négligeable. Ensuite, il faut ouvrir des postes, à tous les niveaux de la scolarisation. Notre objectif, en un mandat, serait de nous rapprocher de la moyenne européenne (dans le primaire et le secondaire) de 19 élèves par classe, alors qu’elle est actuellement de 23 en France. Il apparaît évident que le secondaire public est prioritaire, alors que 70 % des classes y comptent plus de 30 élèves et 20 % plus de 35. Nous proposons donc d’ouvrir 10 000 postes pour l’année prochaine, ce qui annule les suppressions de postes d’Emmanuel Macron depuis 2017 et représente 500 millions d’euros. Plus globalement, nous répondrons par un plan d’urgence pour l’éducation, tel que voulu par le mouvement lycéen. Nous mettrons en place la gratuité de la cantine scolaire, pour 3,6 milliards d’euros. Pour répondre aux attentes si longtemps négligées de la jeunesse, il faut aussi se mettre en position d’abolir Parcoursup et MonMaster. La logique de ce système est d’adapter le"}]},{"title":"Page 10","depth":1,"path":["Page 10"],"blocks":[{"kind":"texte","text":"1 - Répondre aux urgences nombre d’étudiants au nombre de places à l’université. La nôtre est inverse : nous voulons adapter l’université aux besoins des étudiants en créant 250 000 places pour 3,5 milliards d’euros. L’autre grand service public où les décisions budgétaires ne peuvent plus attendre est l’hôpital public. À une époque où nous pouvons de nouveau être frappés par une pandémie, où les vagues de chaleur systématiques font souffrir les corps en été, et où le mode de production fait augmenter les maladies chroniques, nous devons recruter plus de personnel soignant. Nous proposons une hausse globale de 3 milliards d’euros du budget des hôpitaux avec au moins 10 000 créations de postes de personnel soignant. Ces derniers mois ont rappelé les défaillances coupables de la prise en charge des violences sexistes et sexuelles et des violences contre les enfants dans notre pays. Pour lutter efficacement contre les violences sexistes et sexuelles, nous proposons un plan d’urgence pour atteindre les 3 milliards d’euros de budget demandés par les associations (soit 2,6 milliards d’euros supplémentaires pour y parvenir). Nous ajouterons 2 milliard d’euros sur la lutte contre les violences faites aux enfants. Enfin, les coupes successives du gouvernement ont détruit de nombreux services publics ces dernières années : travail, logement, culture, sport, diplomatie, aide au développement, etc. Nous reviendrons sur les coupes budgétaires subies depuis 2026 et indexerons leur budget 2027 sur l’inflation, pour un coût de 7 milliards d’euros."},{"kind":"texte","text":"Enclencher la planification écologique L’été catastrophique que nous venons de vivre montre l’état d’impréparation à la nouvelle donne climatique dans laquelle 10 ans de politique macroniste nous ont mis. Il faut d’urgence et dès maintenant commencer les investissements nécessaires. Il s’agit en premier lieu du logement. Pour résorber les pires passoires et bouilloires thermiques (classes F et G) en un mandat, il faut passer à 700 000 rénovations par an. Dans le même temps, il faut enclencher un plan de rénovation des bâtiments publics, en priorisant les écoles et les hôpitaux, pour faire cesser au plus vite les situations indignes que professeurs, élèves, pa-"}]},{"title":"Page 11","depth":1,"path":["Page 11"],"blocks":[{"kind":"texte","text":"1 - Répondre aux urgences tients et soignants ont vécues cet été. Nous mettrons également tout en œuvre pour mettre à niveau au plus vite nos équipements anti-incendie et l’équipement des pompiers, comme les bombardiers d’eau, les hélicoptères, les drones ou le matériel roulant. Il faut d’urgence financer les moyens pour s’adapter aux prochaines canicules, incendies, sécheresses, car l’année 2026 n’aura bientôt plus rien d’exceptionnel. Ce plan d’urgence contre les canicules commencera par équiper les hôpitaux, Ehpad, écoles et logements dits « bouilloires thermiques » contre les incendies. Il s’agira également de renforcer les moyens matériels et humains des services départementaux d’incendie et de secours (SDIS) et de la sécurité civile, mais aussi de mieux adapter les exploitations agricoles face aux sécheresses. Enfin, des investissements doivent être engagés dans l’énergie, les transports et les industries pour freiner le changement climatique et transformer et adapter notre économie à la crise climatique. Une grande partie de ces dépenses peut être prise en charge, non par le budget de l’État mais par le pôle public bancaire dans la mesure où il s’agit d’investissements qui génèrent des revenus. 10 milliards devront être investis dès 2026 pour permettre au pays de faire face plus efficacement aux effets du dérèglement climatique."},{"kind":"texte","text":"Mettre en sécurité sociale Le macronisme s’est attaqué à la Sécurité sociale, car il veut mettre la main sur les 700 milliards d’euros qu’elle distribue et ainsi les offrir au marché. La stratégie libérale consiste à réduire les droits des assurés sociaux afin de les forcer à souscrire des assurances privées, aux frais de gestion exorbitants et inaccessibles pour les plus pauvres… donc créatrices d’épidémies, de clusters et de renoncement aux soins qui nuisent à toute la population. Pour nous, la maxime de la Sécurité sociale « de chacun selon ses moyens, à chacun selon ses besoins » est un principe général d’organisation de la société. Pour l’étendre, il faudra dès l’année prochaine revenir sur les contre-réformes du macronisme. C’est pourquoi nous abrogerons la réforme Borne qui a porté la retraite à 64 ans, ce qui occasionnera une dépense de 9 milliards d’euros. Cette abrogation immédiate sera un premier pas vers le retour à la retraite à 60 ans avec 40 annuités, objectif sur un mandat. Comme évoqué précédemment, il faudra protéger le pouvoir"}]},{"title":"Page 12","depth":1,"path":["Page 12"],"blocks":[{"kind":"texte","text":"1 - Répondre aux urgences d’achat en refusant la désindexation des pensions et porter la pension minimum au niveau du SMIC pour une carrière complète. De même, les gouvernements d’Emmanuel Macron ont réduit les droits à l’assurance chômage en tous points : conditions d’accès, montant, durée et dégressivité de l’indemnité. Nous proposons, dès l’année prochaine, d’abroger ces réformes pour un coût de 3 milliards d’euros."},{"kind":"texte","text":"BILAN DES DÉPENSES D’URGENCE Relancer l’activité par les revenus des classes populaires : 37,5 milliards d’euros Répondre aux urgences en renforçant les services publics : 22,2 milliards d’euros Enclencher la planification écologique : 10 milliards d’euros1 Mettre en sécurité sociale : 12 milliards d’euros"},{"kind":"texte","text":"1. La majorité des investissements pour la planification écologique seront pris en charge par le pôle public bancaire, à hauteur de 100 milliards d’euros par an"}]},{"title":"Page 13","depth":1,"path":["Page 13"],"blocks":[{"kind":"texte","text":"2 - Dégager les ressources nécessaires"},{"kind":"texte","text":"2 - Dégager les ressources nécessaires La situation dégradée des finances publiques s’explique par la forte baisse des recettes en proportion du PIB (2,1 points selon l’Insee, soit plus de 60 milliards d’euros) sous l’effet des réductions d’impôts d’Emmanuel Macron. Celles-ci ont avant tout bénéficié aux plus riches et aux plus grandes entreprises, tout en démontrant leur totale inefficacité à créer de l’activité économique. En effet, le déficit public approcherait 3 % du PIB si les recettes avaient été maintenues au niveau de 2017. La dette publique serait au moins inférieure de 400 milliards d’euros et serait proche des 100 % du PIB. Par conséquent, nous proposons d’aller chercher l’argent là où il est, à savoir chez les plus riches détenteurs du capital et les grandes entreprises, grands gagnants de l’ère macroniste. Cela permettra de financer les urgences et de réduire le déficit laissé par Macron, sans tuer toute activité économique dans l’œuf. Pour cela, nous reviendrons sur les mesures fiscales les plus injustes des mandats d’Emmanuel Macron : suppression de la flat tax pour que le capital ne soit pas moins imposé que le travail (9 milliards d’euros), rétablissement d’un impôt sur la fortune renforcé (10 milliards d’euros), rabotage et suppression des niches fiscales et sociales les plus injustes dont le coût a explosé (22 milliards d’euros en 2027), rétablissement de la CVAE sur les plus grandes entreprises (3 milliards). Mais cette politique a eu pour effet une accumulation des richesses sans égale depuis la fin de la Seconde Guerre mondiale au profit des ultra riches. Une étude du Conseil des prélèvements obligatoires de septembre 2026 confirme que les 1 % des contribuables les plus riches assujettis à l’impôt sur le revenu sont les grands gagnants du macronisme ; en particulier les quelques milliers d’ultra riches qui ne paient pas cet impôt car ils ont transféré leur fortune vers des actifs financiers considérés comme un patrimoine professionnel. Ils sont globalement bien moins imposés que la moyenne des contribuables en France. On connaît l’aubaine que cela représente pour les 500 plus riches : ils ont doublé leur patrimoine depuis 2017 ! Ils constituent une noblesse d’argent qui gagne sur tous les tableaux grâce à une taxation sur mesure des successions. Ils sont gagnants de leur vivant, en recevant, et à la fin de leur vie, en transmettant. Il faudra donc aller plus loin en s’attaquant à cet enrichissement indécent. Cela passera par exemple par l’instauration de la taxe Zucman pour les personnes possédant plus de 100 millions d’euros de patrimoine (15 milliards"}]},{"title":"Page 14","depth":1,"path":["Page 14"],"blocks":[{"kind":"texte","text":"2 - Dégager les ressources nécessaires d’euros de recettes) et par une réforme des droits de succession (20 milliards d’euros la première année). Nous réformerons l’impôt sur le revenu au cours du mandat pour le rendre plus progressif avec l’instauration de 14 tranches. Nous ferons également porter l’effort sur la finance afin de préserver les activités productives, notamment celle des PME et TPE. Le taux implicite d’imposition à l’impôt sur les sociétés est de près de 24 % pour les PME contre 14,7 % pour les grandes entreprises. Ces dernières bénéficient de niches fiscales, de moyens d’optimisation et d’une délocalisation des profits des multinationales vers des pays à fiscalité réduite. Nous reviendrons sur cette injustice, et cette perte de recettes de l’État, via une réforme de l’impôt sur les sociétés (3 milliards), une taxe universelle sur les multinationales (5 milliards la première année) qui permettra de les imposer selon l’activité réellement effectuée en France et le renforcement de la taxe Gafam (3,9 milliards). Nous nous attaquerons également aux superprofits engrangés par les profiteurs de guerre en instaurant une véritable taxe sur les superprofits (5 milliards d’euros). Dans le même temps, nous renforcerons l’arsenal antispéculation en augmentant les taxes sur les transactions financières (5 milliards d’euros), les rachats d’actions (2,5 milliards) et les crypto-actifs (1 milliard). La lutte contre la fraude fiscale sera également renforcée grâce à la reconstruction des effectifs de fonctionnaires et pourra rapporter 2 milliards d’euros la première année. Enfin, les exonérations de cotisations sociales doivent cesser de constituer la seule politique d’emploi de ce pays, à la fois chère, inefficace et indiscriminée. Créées en 1993, ces exonérations ont explosé sous la présidence d’Emmanuel Macron pour atteindre 75,6 milliards d’euros en 2025, soit 10 % de la masse salariale du secteur privé. Contrairement aux engagements initiaux, la Sécurité sociale n’est même plus intégralement compensée à hauteur de ses pertes, et l’État est privé de recettes fiscales pour la part qu’il assume. Aussi proposons-nous d’interrompre cette subvention au-dessus de 2 SMIC, où les exonérations ne sont plus qu’un effet d’aubaine sans aucun effet sur l’emploi."},{"kind":"texte","text":"BILAN 106,4 milliards d’euros de recettes 81,7 milliards de dépenses 24,7 milliards de réduction du déficit 100 milliards d’investissements du pôle public bancaire"}]},{"title":"Page 15","depth":1,"path":["Page 15"],"blocks":[{"kind":"texte","text":"3 - Investir dans l’économie des besoins"},{"kind":"texte","text":"3 - Investir dans l’économie des besoins L’action de l’État dans l’économie dépasse largement la seule intervention budgétaire. La France, comme tous les autres États européens, est devant un mur d’investissements nécessaires, notamment pour la bifurcation écologique et la souveraineté numérique. En France, le rapport Pisani-Ferry–Mahfouz chiffrait à 37 milliards d’euros supplémentaires l’investissement public nécessaire en matière environnementale d’ici 2030 pour respecter les accords de Paris. Faute d’actions depuis, il doit être bien supérieur aujourd’hui. On ne parviendra pas à financer ce mur d’investissements par la seule augmentation des recettes. Aujourd’hui, d’autres institutions publiques peuvent agir économiquement par des prêts, des garanties, des prises de participation ou d’autres dispositifs : la Caisse des dépôts et consignations, la Banque postale, la Banque publique d’investissement, la SFIL (banques des collectivités). Nous comptons réformer ces institutions pour créer un véritable pôle public bancaire dont le mandat est l’investissement public en lien avec les objectifs de la planification écologique. Le plus grand mal structurel de l’économie française est la baisse de l’investissement. L’investissement net des entreprises a été divisé par 3 depuis les années 1970. Quant à l’investissement public net, il est passé de 3 % à 0,5 % du PIB sur la même période. Ce dernier est particulièrement crucial car il entraîne un effet multiplicateur sur tout le reste de l’économie. Nous avons besoin de plans d’investissement public dans de nombreux domaines. Il s’agit donc d’assurer la bifurcation écologique dans l’énergie, les transports, la sidérurgie, le textile. Il s’agit aussi de planifier notre propre souveraineté dans des domaines clés comme le numérique, le médicament, le spatial ou le domaine maritime. Pour tout cela, il faudra non seulement un pôle public à la gouvernance renouvelée mais aussi mieux financer. Ainsi, nous souhaitons mieux orienter l’épargne financière des ménages français. Les Français ont 6 600 milliards d’euros en épargne. 400 milliards d’euros, soit 6 % de ce total, sont fléchés vers la Caisse des Dépôts pour qu’elle les investisse via son fonds d’épargne. Il s’agit de 60 % de l’argent mis sur des livrets A, des livrets développement durable et solidaire, des livrets d’épargne populaire ou des livrets jeunes. Les 40 % restants sont à"}]},{"title":"Page 16","depth":1,"path":["Page 16"],"blocks":[{"kind":"texte","text":"3 - Investir dans l’économie des besoins la disposition des banques privées. Augmenter ce taux de centralisation, par exemple en le passant progressivement à 80 %, permettrait d’augmenter les fonds du pôle public bancaire. Récemment, le président de la Caisse des dépôts et consignations (CDC) a annoncé qu’un relèvement du plafond de dépôt maximal sur le livret A à 30 000 euros (contre 22 950 euros aujourd’hui) pourrait rapporter 30 à 40 milliards supplémentaires. Enfin, nous envisageons aussi la création d’un « livret B », pour de l’épargne de moyen et long termes, avec une durée minimale de dépôt. Ce livret offrirait aux épargnants disposant déjà d’une épargne de première précaution, comme le livret A, un nouveau produit leur garantissant que leur argent sera investi dans l’intérêt national (contrairement aux assurances-vie, qui sont, par exemple, investies pour moitié hors de France). Avec ces différentes mesures non contraignantes et rémunératrices pour tous les épargnants, le pôle public bancaire pourrait investir chaque année 100 milliards d’euros supplémentaires dans l’économie française, permettant ainsi de réduire le déficit public grâce à l’activité créée."}]},{"title":"Page 17","depth":1,"path":["Page 17"],"blocks":[{"kind":"texte","text":"4 - La stratégie des coupes budgétaires est une impasse"},{"kind":"texte","text":"4 - La stratégie des coupes budgétaires est une impasse Les macronistes et le RN présentent leur politique, qui consiste à empiler les coupes massives dans les dépenses publiques et sociales, comme la seule solution face à l’état de nos finances publiques. Pourtant, penser que cela améliore la situation des finances publiques est un mythe. Ces solutions ont déjà été appliquées et leur bilan est catastrophique. Cette année, en vertu du budget Lecornu, c’est en France que la politique de saignées budgétaires est la plus sévère de la zone euro selon le rapport sur les finances publiques de la Commission européenne. Le bilan est implacable : hausse de 0,3 point du déficit, une des croissances les plus faibles du siècle hors crises et baisse du pouvoir d’achat."},{"kind":"texte","text":"LES CONSÉQUENCES DU BUDGET 2026 EN FRANCE > 30 milliards d’euros de coupes > Baisse de 0,5 point de la croissance > Déficit qui passe de 5,1 % à 5,4 % (+0,3 point)"},{"kind":"texte","text":"Les exemples de politiques de coupes budgétaires contre-productives sont légion en Europe, notamment dans les années 2010. L’Espagne a par exemple mis en place des politiques de coupes drastiques à partir de 2010 : l’activité a chuté et il a fallu cinq ans pour que le PIB revienne à son niveau initial ! Au Portugal, la saignée imposée par l’Union européenne a fait reculer de 6,6 points le PIB et exploser le chômage de 126 %."}]},{"title":"Page 18","depth":1,"path":["Page 18"],"blocks":[{"kind":"texte","text":"4 - La stratégie des coupes budgétaires est une impasse Graphique - Les coupes budgétaires ne fonctionnent pas : l’exemple de l’Espagne"},{"kind":"texte","text":"Les coupes budgétaires"},{"kind":"texte","text":"La relance"},{"kind":"texte","text":"2009 – 2014"},{"kind":"texte","text":"2018 – 2025"},{"kind":"texte","text":"Le PIB diminue (en milliards d'euros)"},{"kind":"texte","text":"1 073"},{"kind":"texte","text":"1 077"},{"kind":"texte","text":"1 068"},{"kind":"texte","text":"Le PIB augmente"},{"kind":"texte","text":"1 035"},{"kind":"texte","text":"1 025"},{"kind":"texte","text":"1 038"},{"kind":"texte","text":"La dette publique double (en % du PIB)"},{"kind":"texte","text":"2009"},{"kind":"texte","text":"60,3"},{"kind":"texte","text":"2010"},{"kind":"texte","text":"1 212"},{"kind":"texte","text":"La dette publique se stabilise"},{"kind":"texte","text":"89,6 53,1"},{"kind":"texte","text":"1 690"},{"kind":"texte","text":"100"},{"kind":"texte","text":"104,4"},{"kind":"texte","text":"99,8"},{"kind":"texte","text":"100,5"},{"kind":"texte","text":"2013"},{"kind":"texte","text":"2014"},{"kind":"texte","text":"2018"},{"kind":"texte","text":"2025"},{"kind":"texte","text":"69,5"},{"kind":"texte","text":"2011"},{"kind":"texte","text":"2012"},{"kind":"texte","text":"Ce constat est prouvé par les études économiques. En effet, les coupes dans les dépenses et l’investissement public entraînent une réduction du pouvoir d’achat et de l’investissement des entreprises. En conséquence, la baisse de la consommation et de l’activité font chuter les recettes et ralentissent l’économie. C’est pourquoi le FMI conclut « qu’en moyenne, la consolidation budgétaire ne réduit pas les ratios dette/PIB ». En février 2026 encore, les économistes Philipp Heimberger, Anna Matzner et Bernhard Schütz ont montré que ces politiques font chuter le PIB et l’investissement, ainsi qu’augmenter le chômage et les inégalités. Ces effets négatifs sont renforcés quand la situation économique est mauvaise, soit exactement ce que nous vivons aujourd’hui. Ainsi, refuser les coupes budgétaires et proposer un autre chemin, ce n’est pas seulement le résultat d’une vision politique, c’est aussi le choix économique le plus rationnel."}]},{"title":"Page 19","depth":1,"path":["Page 19"],"blocks":[{"kind":"texte","text":"5 - Sortir de la dépendance aux marchés financiers"},{"kind":"texte","text":"5 - Sortir de la dépendance aux marchés financiers Le problème structurel de nos finances publiques est le suivant : nous dépendons trop des marchés financiers internationaux. Cet état de fait nous met sous une triple pression. D’abord, nous sommes en concurrence avec les marchés de capitaux mondiaux pour financer notre dette. Ainsi, en ce moment, nous sommes mis en concurrence avec la demande d’obligations pour financer la bulle spéculative autour de l’IA qui contribue à la hausse mondiale des taux d’intérêt. Nous sommes également en concurrence, et c’est nouveau, avec l’Allemagne, qui, pour financer ses investissements, a décidé de recourir à la dette. C’est cette concurrence, à notre désavantage, qui explique en partie l’accroissement du spread (écart de taux d’intérêt sur les obligations à 10 ans) entre nos deux pays. Ensuite, nous sommes à la merci de certains acteurs de ces marchés financiers dont le mode opératoire est de parier sur des attaques spéculatives contre tel ou tel État. C’est ainsi que sur les cinq dernières années, la part des fonds spéculatifs (hedge funds) dans les échanges de dettes de la zone euro a doublé. Il ne faut pas sous-estimer non plus la responsabilité de l’exécutif français qui, pour imposer ses budgets austéritaires, dramatise encore plus la situation, provoquant en retour une défiance des marchés. C’était vrai en 2025 quand François Bayrou en est venu à agiter le spectre ridicule d’un FMI aux portes de la France, causant deux semaines après une dégradation de la note française par les agences de notation. C’est vrai de Sébastien Lecornu aujourd’hui. Certes les taux d’intérêt augmentent et avec eux progressivement la charge de la dette, qui est aussi poussée à la hausse par les obligations indexées sur l’inflation (OATi), mais pas dans des proportions aussi dramatiques que certains veulent faire croire. La charge de la dette en 2027 sera de 2,9 % du PIB, ce qui est loin d’être un record (entre 1996 et 2004, elle était comprise entre 3 et 4 %). Enfin, les marchés financiers internationaux ont aussi des préférences politiques. Généralement, ils soutiennent les politiques néolibérales puisque les acteurs financiers les plus importants sont dirigés par des individus qui ont intérêt à maintenir ce statu quo. Nous voulons donc mener des réformes de structure pour sortir de cette dépendance. Une première proposition pour le faire est d’utiliser"}]},{"title":"Page 20","depth":1,"path":["Page 20"],"blocks":[{"kind":"texte","text":"5 - Sortir de la dépendance aux marchés financiers la situation créée par les rachats de dettes publiques par la Banque centrale européenne (BCE) sur le marché secondaire en 2015 et 2020. Aujourd’hui, la BCE rejette de l’huile sur le feu car elle diminue son bilan de dettes des États. Depuis 2024, elle a ainsi décidé de ne pas renouveler les dettes Covid arrivées à échéance. De 600 milliards et 18 % de notre dette globale, la dette détenue par la Banque de France en 2026 a diminué de 80 milliards. Ce ne sera plus que 13 % de notre dette en 2027 ! Elle contribue elle-même à la hausse des taux d’intérêt en obligeant les États à refinancer les titres de dette qu’elle possédait et qui arrivent à échéance en passant par les marchés financiers. Mais sa position lui ouvre la possibilité de faire autre chose. Pour aider les États membres à financer les investissements en matière écologique et numérique, elle pourrait décider de recourir à d’autres programmes de rachats de dettes souveraines. Enfin, tout ceci serait dans l’intérêt des investisseurs et de la BCE : sans investissements, avec une inflation galopante sous l’effet des nombreux dégâts écologiques, la BCE ne pourrait plus tenir sa cible de 2 % d’inflation et les créanciers auraient de moins en moins intérêt à prêter à des États fracassés par la crise climatique (alors qu’ils sont aujourd’hui une source d’obligations sûres). La BCE pourrait aller plus loin avec les programmes de rachat qu’elle a effectués : geler ou annuler la part des dettes publiques qu’elle possède. Ainsi, elle allégerait les États de la zone euro du poids de devoir refinancer l’ensemble de ces titres de dette. Elle ferait ainsi baisser les taux d’intérêt. Cela ne nécessite pas de révision des traités, car l’article 123 du traité de fonctionnement de l’Union européenne (TFUE) interdit le prêt direct aux États mais pas ce type d’opérations. À condition de le vouloir et d’œuvrer en ce sens, la France pourrait convaincre ses partenaires de pousser dans le même sens. Elle n’est pas le seul État qui aurait intérêt à cette intervention de la Banque centrale : la montée des taux touche l’ensemble des pays de la zone euro et les besoins d’investissement sont partagés. C’est la solution privilégiée que nous mettrons en œuvre. Nous avons confiance pour y parvenir sachant qu’une fenêtre s’ouvre devant les urgences identiques qui menacent les pays européens. Au-delà, il sera utile de se rappeler que la France possédait auparavant un circuit du Trésor qui lui permettait de se financer sans passer par les mar-"}]},{"title":"Page 21","depth":1,"path":["Page 21"],"blocks":[{"kind":"texte","text":"5 - Sortir de la dépendance aux marchés financiers chés financiers. Il serait possible d’en remettre en place une version modernisée en s’appuyant sur le pôle public bancaire et les acteurs financiers qui opèrent en France. La mise du pays dans les mains des marchés n’est pas une donnée naturelle mais une construction et un choix de la fin du XXe siècle, qu’il est possible de surmonter."}]},{"title":"Page 22","depth":1,"path":["Page 22"],"blocks":[{"kind":"texte","text":"Notes"}]}]}],"short":"Comptes publics","content_sha256":"fe395eb8811cb5d0eb631bc5625a358705b082ecd51f6f1c596ab9a60dbb6af9"}]};
(() => {
"use strict";
const D = DATA, META = D.meta;
const $ = s => document.querySelector(s);
const esc = s => s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* repli accents / casse en conservant la longueur (indispensable au surlignage) */
function fold(s){
  let o = "";
  for (const c of s){
    const n = c.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
    o += n.length === c.length ? n : c;
  }
  return o;
}
const PROP = new Set(["mesure","sous_mesure","mesure_cle","puce"]);
const KIND_NAME = {mesure:"Mesure", sous_mesure:"Sous-mesure", mesure_cle:"Mesure clé", puce:"Élément de liste", texte:"Texte", tableau:"Tableau"};

/* index plat */
const rows = [], unitIndex = {}, blockIndex = {};
D.documents.forEach(d => d.units.forEach(u => {
  unitIndex[u.code] = {d, u};
  u.sections.forEach(s => s.blocks.forEach(b => {
    const r = {d, u, s, b, f: fold(b.text + " " + (b.id || ""))};
    rows.push(r);
    if (b.id) blockIndex[b.id] = r;
  }));
}));

/* ---------- en-tête / filtres ---------- */
$("#brand-title").textContent = META.title.replace("Programme de la France insoumise — Présidentielle ", "Programme LFI ");
$("#brand-date").textContent = "extrait le " + META.generated_at;
const docsel = $("#docsel");
docsel.innerHTML = '<option value="">Tous les documents</option>' +
  D.documents.map(d => `<option value="${d.code}">${esc(d.short)}</option>`).join("");

/* ---------- sommaire ---------- */
function buildNav(){
  let h = "";
  D.documents.forEach(d => {
    if (d.kind === "livre"){
      h += `<details open><summary>${esc(d.short)}</summary>`;
      let part = null, open = false;
      d.units.forEach(u => {
        if (u.part !== part){
          if (open) h += "</details>";
          part = u.part;
          if (part){ h += `<details open><summary style="font-weight:500">${esc(part)}</summary>`; open = true; } else open = false;
        }
        const lab = u.code.endsWith("PRESENTATION") ? "Présentation" : esc(u.title.replace(/^Chapitre \d+ : /, ""));
        const code = u.code.endsWith("PRESENTATION") ? "" : (u.code === "INTRO" ? "" : u.code);
        h += `<a href="#${u.code}" data-u="${u.code}"><span class="code">${code}</span>${lab}</a>`;
      });
      if (open) h += "</details>";
      h += "</details>";
    } else if (d.kind === "pdf"){
      if (!nav_pdf_open){ h += `<details><summary>Annexes (PDF)</summary>`; nav_pdf_open = true; }
      h += `<a href="#${d.units[0].code}" data-u="${d.units[0].code}">${esc(d.short)}</a>`;
    } else {
      if (nav_pdf_open){ h += "</details>"; nav_pdf_open = false; }
      h += `<a href="#${d.units[0].code}" data-u="${d.units[0].code}" style="margin-left:0;font-weight:600">${esc(d.short)}</a>`;
    }
  });
  if (nav_pdf_open) h += "</details>";
  $("#side").innerHTML = `<a href="#" data-u="" style="margin-left:0;font-weight:600">⌂ Accueil</a>` + h;
}
let nav_pdf_open = false;
buildNav();

/* ---------- rendu Markdown léger -> HTML ---------- */
function md(b){
  let t = esc(b.md || b.text);
  t = t.replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  t = t.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>").replace(/(^|[^*])\*([^*]+)\*/g, "$1<em>$2</em>");
  return t;
}
const idTag = b => b.id ? `<span class="id">${b.id}</span>` : "";

function unitHTML(d, u){
  let h = `<div class="wrap"><div class="crumb">${esc(d.short)}${u.part ? " › " + esc(u.part) : ""}</div>`;
  h += `<h1>${esc(u.title)}</h1><p class="src"><a href="${u.url}" target="_blank" rel="noopener">Page d'origine</a></p>`;
  if (d.kind === "pdf") h += `<p class="pdfwarn">⚠️ Texte extrait d'un PDF : les graphiques et tableaux chiffrés sont mal restitués. Se reporter au PDF d'origine pour les chiffres.</p>`;
  let inList = false, liOpen = false, inSub = false;
  const closeList = () => { if (inSub){ h += "</ul>"; inSub = false; } if (liOpen){ h += "</li>"; liOpen = false; } if (inList){ h += "</ul>"; inList = false; } };
  u.sections.forEach(s => {
    if (s.title && !(s.depth === 1 && s.title === u.title)){ closeList(); const lv = Math.min(6, s.depth + 1); h += `<h${lv}>${esc(s.title)}</h${lv}>`; }
    s.blocks.forEach(b => {
      const k = b.kind;
      if (k === "mesure" || (k === "puce" && !(b.depth > 0))){
        if (inSub){ h += "</ul>"; inSub = false; }
        if (liOpen){ h += "</li>"; liOpen = false; }
        if (!inList){ h += '<ul class="mesures">'; inList = true; }
        h += `<li id="${b.id}">${md(b)}${idTag(b)}`; liOpen = true;
      } else if (k === "sous_mesure" || k === "puce"){
        if (!inList){ h += '<ul class="mesures">'; inList = true; }
        if (!inSub){ h += '<ul class="sub">'; inSub = true; }
        h += `<li id="${b.id}">${md(b)}${idTag(b)}</li>`;
      } else {
        closeList();
        if (k === "mesure_cle") h += `<aside class="cle" id="${b.id}"><b class="lbl">⭐ Mesure clé${idTag(b)}</b>${md(b)}</aside>`;
        else if (k === "tableau") h += "<table>" + b.rows.map(r => "<tr>" + r.map(c => `<td>${esc(c)}</td>`).join("") + "</tr>").join("") + "</table>";
        else h += `<p>${md(b)}</p>`;
      }
    });
  });
  closeList();
  return h + "</div>";
}

/* ---------- accueil ---------- */
function homeHTML(){
  const st = META.stats.LAEC, tot = st.mesure + st.sous_mesure + st.mesure_cle;
  let h = `<div class="wrap"><h1>${esc(META.title)}</h1>
  <p class="src">Source : <a href="${META.source}" target="_blank" rel="noopener">${META.source.replace("https://","")}</a> · extrait le ${META.generated_at} · document <strong>non officiel</strong> : seul le site fait foi.</p>
  <div class="cards">
    <div class="card"><div class="n">${tot}</div><div class="l">mesures dans <em>L'Avenir en commun</em><br>(${st.mesure} mesures + ${st.sous_mesure} sous-mesures + ${st.mesure_cle} mesures clés ; le site en annonce ${META.expected_measures})</div></div>
    <div class="card"><div class="n">${D.documents.length}</div><div class="l">documents : livre, plans thématiques, plans d'investissement, annexes PDF</div></div>
  </div>
  <h2>Chercher</h2>
  <ul class="tips">
    <li>Tapez un ou plusieurs mots : tous doivent être présents (accents et majuscules ignorés).</li>
    <li>Expression exacte : <code>"100 % Sécu"</code> · Exclure un mot : <code>retraite -âge</code></li>
    <li>Retrouver une mesure par son identifiant : <code>P3C1-M002</code> (partie 3, chapitre 1, mesure 2).</li>
    <li><em>Propositions</em> = mesures, sous-mesures, mesures clés et listes des plans ; <em>Tout le texte</em> inclut aussi les paragraphes d'analyse.</li>
  </ul>
  <p class="ex">Essayer : ${["retraite","SMIC","\"100 % Sécu\"","nucléaire","logement -étudiant"].map(x => `<a href="#" data-q='${esc(x)}'>${esc(x)}</a>`).join("")}</p>
  <h2>Documents</h2><div class="cards">`;
  D.documents.forEach(d => {
    const c = META.stats[d.code];
    const n = d.kind === "livre" ? tot : (c.puce || 0);
    const lab = d.kind === "livre" ? "mesures" : (d.kind === "pdf" ? "paragraphes" : "éléments de liste");
    h += `<a class="card" href="#${d.units[0].code}"><div class="l">${esc(d.kind === "livre" ? "Livre-programme" : d.kind === "plan_thematique" ? "Plan thématique" : d.kind === "plan_investissement" ? "Plan d'investissement" : "Annexe PDF")}</div><strong>${esc(d.short)}</strong><div class="l">${d.kind === "pdf" ? c.texte : n} ${lab}</div></a>`;
  });
  h += `</div>`;
  if (META.warnings && META.warnings.length) h += `<footer>Notes d'extraction : ${META.warnings.map(esc).join(" · ")}</footer>`;
  return h + "</div>";
}

/* ---------- état / navigation ---------- */
const main = $("#main");
let current = "";  // code d'unité affichée
function setActive(code){
  document.querySelectorAll("#side a").forEach(a => a.setAttribute("aria-current", String(a.dataset.u === code && code !== "")));
}
function showUnit(code, blockId){
  const e = unitIndex[code];
  if (!e){ main.innerHTML = homeHTML(); current = ""; setActive(""); window.scrollTo(0,0); return; }
  if (current !== code){ main.innerHTML = unitHTML(e.d, e.u); current = code; }
  setActive(code);
  if (blockId){
    const el = document.getElementById(blockId);
    if (el){ el.scrollIntoView({block:"center"}); el.classList.remove("flash"); void el.offsetWidth; el.classList.add("flash"); return; }
  }
  window.scrollTo(0,0);
}
function route(){
  const h = decodeURIComponent(location.hash.slice(1));
  if (!h){ showUnit(""); return; }
  if (blockIndex[h]){ clearSearch(true); showUnit(blockIndex[h].u.code, h); return; }
  clearSearch(true); showUnit(unitIndex[h] ? h : "");
}

/* ---------- recherche ---------- */
function parseQuery(q){
  const pos = [], neg = [], re = /(-?)"([^"]+)"|(-?)(\S+)/g;
  let m;
  while ((m = re.exec(q))){
    const isNeg = (m[1] || m[3]) === "-", t = fold(m[2] || m[4]).trim();
    if (t) (isNeg ? neg : pos).push(t);
  }
  return {pos, neg};
}
function highlight(text, terms){
  const f = fold(text), rg = [];
  terms.forEach(t => { let i = 0; while ((i = f.indexOf(t, i)) !== -1){ rg.push([i, i + t.length]); i += t.length; } });
  if (!rg.length) return esc(text);
  rg.sort((a, b) => a[0] - b[0]);
  const merged = [rg[0].slice()];
  for (const r of rg.slice(1)){ const l = merged[merged.length-1]; if (r[0] <= l[1]) l[1] = Math.max(l[1], r[1]); else merged.push(r.slice()); }
  let o = "", p = 0;
  merged.forEach(([a, b]) => { o += esc(text.slice(p, a)) + "<mark>" + esc(text.slice(a, b)) + "</mark>"; p = b; });
  return o + esc(text.slice(p));
}
const PAGE = 120;
let results = [], shown = 0, lastTerms = [];
function mode(){ return document.querySelector("input[name=mode]:checked").value; }
function runSearch(){
  const q = $("#q").value.trim();
  $("#clear").hidden = $("#csv").hidden = !q;
  if (!q){ results = []; if (location.hash.length > 1) route(); else { showUnit(""); } $("#count").textContent = ""; return; }
  const {pos, neg} = parseQuery(q);
  if (!pos.length && !neg.length){ return; }
  const dsel = docsel.value, onlyKey = $("#onlykey").checked, md_ = mode();
  results = rows.filter(r =>
    (!dsel || r.d.code === dsel) &&
    (md_ === "all" || PROP.has(r.b.kind)) &&
    (!onlyKey || r.b.kind === "mesure_cle") &&
    pos.every(t => r.f.includes(t)) && !neg.some(t => r.f.includes(t)));
  lastTerms = pos; shown = 0; current = "";
  setActive("");
  main.innerHTML = '<div class="wrap" id="resbox"></div>';
  $("#count").textContent = `${results.length} résultat${results.length > 1 ? "s" : ""}`;
  appendResults();
  window.scrollTo(0, 0);
}
function appendResults(){
  const box = $("#resbox"); if (!box) return;
  const old = box.querySelector(".more"); if (old) old.remove();
  const slice = results.slice(shown, shown + PAGE);
  let h = shown === 0 && !results.length ? '<p class="summary">Aucun résultat. Essayez moins de mots, ou « Tout le texte ».</p>' : "";
  slice.forEach(r => {
    const b = r.b, path = r.s.path.length ? r.s.path[r.s.path.length - 1] : "";
    h += `<article class="res${b.kind === "mesure_cle" ? " key" : ""}">
      <div class="meta"><b>${esc(r.d.short)}</b> › ${esc(r.u.title)}${path && path !== r.u.title ? " › " + esc(path) : ""}
      · ${KIND_NAME[b.kind]}${b.id ? ` <span class="id">${b.id}</span>` : ""}</div>
      <div>${highlight(b.text, lastTerms)}</div>
      <a class="go" href="#${b.id || r.u.code}">Voir dans le contexte →</a></article>`;
  });
  box.insertAdjacentHTML("beforeend", h);
  shown += slice.length;
  if (shown < results.length){
    box.insertAdjacentHTML("beforeend", `<p class="more"><button class="btn primary" id="more">Afficher ${Math.min(PAGE, results.length - shown)} de plus (${results.length - shown} restants)</button></p>`);
    $("#more").onclick = appendResults;
  }
}
function clearSearch(silent){
  if ($("#q").value || !silent){ $("#q").value = ""; }
  $("#clear").hidden = $("#csv").hidden = true; $("#count").textContent = ""; results = [];
}
function exportCSV(){
  const q = s => '"' + String(s).replace(/"/g, '""') + '"';
  const lines = [["id","document","unite","section","type","texte","url"].join(";")];
  results.forEach(r => lines.push([r.b.id || "", r.d.short, r.u.title, r.s.path.join(" > "), r.b.kind, r.b.text, r.u.url].map(q).join(";")));
  const blob = new Blob(["﻿" + lines.join("\n")], {type:"text/csv;charset=utf-8"});
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "resultats.csv"; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

/* ---------- événements ---------- */
let timer;
$("#q").addEventListener("input", () => { clearTimeout(timer); timer = setTimeout(runSearch, 140); });
document.querySelectorAll("input[name=mode],#onlykey,#docsel").forEach(el => el.addEventListener("change", () => { if ($("#q").value.trim()) runSearch(); else if ($("#onlykey").checked || mode() === "all") { /* pas de requête : rien à filtrer */ } }));
$("#clear").onclick = () => { clearSearch(); history.replaceState(null, "", location.pathname + location.search); route(); $("#q").focus(); };
$("#csv").onclick = exportCSV;
$("#toc-toggle").onclick = e => { const o = $("#side").classList.toggle("open"); e.currentTarget.setAttribute("aria-expanded", o); };
window.addEventListener("hashchange", () => { route(); $("#side").classList.remove("open"); });
document.addEventListener("click", e => {
  const a = e.target.closest("a[data-q]");
  if (a){ e.preventDefault(); $("#q").value = a.dataset.q; runSearch(); return; }
  const h = e.target.closest('a[href^="#"]');
  if (h && h.getAttribute("href") === "#"){ e.preventDefault(); history.replaceState(null, "", location.pathname + location.search); route(); }
});
document.addEventListener("keydown", e => { if (e.key === "/" && document.activeElement !== $("#q")){ e.preventDefault(); $("#q").focus(); } if (e.key === "Escape" && $("#q").value){ $("#clear").click(); } });

route();
})();
</script>
